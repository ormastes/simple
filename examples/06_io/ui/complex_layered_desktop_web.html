<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atlas Glass Deck</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 800px;
  height: 600px;
  overflow: hidden;
  background-color: #0b1120;
  color: #f8fafc;
  font-family: sans-serif;
}
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 800px;
  height: 48px;
  padding: 0 16px;
  background-color: rgba(30, 41, 59, 0.88);
  border-bottom: 1px solid #334155;
}
.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
#brand-badge {
  width: 22px;
  height: 22px;
  background-color: #38bdf8;
  border-radius: 6px;
}
#brand-title {
  font-size: 14px;
  font-weight: bold;
  color: #f8fafc;
}
#status-readout {
  width: 118px;
  height: 26px;
  background-color: rgba(14, 165, 233, 0.26);
  color: #7dd3fc;
  border: 1px solid #0284c7;
  border-radius: 12px;
  padding: 0 8px;
  font-size: 11px;
}
#action-meter-wrap {
  width: 100px;
  height: 10px;
  background-color: #1e293b;
  border: 1px solid #334155;
  border-radius: 5px;
  overflow: hidden;
}
#action-meter {
  width: 30px;
  height: 8px;
  background-color: #38bdf8;
}
#action-btn {
  width: 110px;
  height: 30px;
  background-color: #2563eb;
  color: #ffffff;
  border: 1px solid #60a5fa;
  border-radius: 6px;
  font-size: 12px;
  padding: 0;
}
#workspace {
  display: flex;
  width: 800px;
  height: 552px;
}
#sidebar {
  display: flex;
  flex-direction: column;
  width: 192px;
  height: 552px;
  padding: 12px;
  gap: 8px;
  background-color: rgba(15, 23, 42, 0.90);
  border-right: 1px solid #334155;
}
.side-label {
  font-size: 11px;
  font-weight: bold;
  color: #94a3b8;
  height: 16px;
  line-height: 16px;
}
#dropdown-wrap {
  position: relative;
  width: 168px;
  height: 34px;
  z-index: 49;
}
#dropdown-trigger {
  width: 168px;
  height: 34px;
  background-color: rgba(30, 41, 59, 0.92);
  color: #f8fafc;
  border: 1px solid #38bdf8;
  border-radius: 6px;
  padding: 0 10px;
  font-size: 12px;
  text-align: left;
  z-index: 49;
}
#dropdown-menu {
  position: absolute;
  left: 0px;
  top: 38px;
  width: 168px;
  height: 98px;
  z-index: 50;
  display: none;
  background-color: #0f172a;
  border: 1px solid #38bdf8;
  border-radius: 6px;
  padding: 4px;
}
.dropdown-opt {
  display: block;
  width: 158px;
  height: 28px;
  margin-bottom: 3px;
  background-color: #1e293b;
  color: #e2e8f0;
  border: 0;
  border-radius: 4px;
  padding: 0 8px;
  font-size: 11px;
  text-align: left;
  z-index: 51;
}
.side-readout {
  width: 168px;
  height: 28px;
  background-color: rgba(30, 41, 59, 0.72);
  color: #93c5fd;
  border: 1px solid #334155;
  border-radius: 6px;
  padding: 0 8px;
  font-size: 12px;
}
#command-input {
  width: 168px;
  height: 32px;
  background-color: #020617;
  color: #f8fafc;
  border: 1px solid #475569;
  border-radius: 6px;
  padding: 0 8px;
  font-size: 12px;
}
#side-glass-card {
  margin-top: auto;
  width: 168px;
  height: 112px;
  background-color: rgba(56, 189, 248, 0.16);
  border: 1px solid #0284c7;
  border-radius: 8px;
  padding: 10px;
}
.glass-bar-a {
  width: 144px;
  height: 18px;
  background-color: rgba(56, 189, 248, 0.35);
  border-radius: 4px;
  margin-bottom: 8px;
  opacity: 0.90;
}
.glass-bar-b {
  width: 110px;
  height: 18px;
  background-color: rgba(168, 85, 247, 0.42);
  border-radius: 4px;
  opacity: 0.85;
}
#main-pane {
  width: 608px;
  height: 552px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#kpi-grid {
  display: grid;
  grid-template-columns: 186px 186px 186px;
  grid-template-rows: 96px;
  gap: 13px;
  width: 584px;
  height: 96px;
}
.kpi-card {
  background-color: rgba(30, 41, 59, 0.76);
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 10px;
  opacity: 0.95;
}
.kpi-title {
  font-size: 11px;
  color: #94a3b8;
  margin-bottom: 8px;
}
.kpi-chip {
  width: 164px;
  height: 22px;
  border-radius: 5px;
  margin-bottom: 8px;
}
.kpi-line {
  width: 128px;
  height: 12px;
  background-color: rgba(148, 163, 184, 0.30);
  border-radius: 4px;
}
#desktop-stage {
  position: relative;
  width: 584px;
  height: 420px;
  background-color: #0f172a;
  border: 1px solid #334155;
  border-radius: 10px;
  overflow: hidden;
}
#context-zone {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 210px;
  height: 150px;
  z-index: 5;
  background-color: rgba(30, 41, 59, 0.78);
  border: 1px solid #38bdf8;
  border-radius: 8px;
  padding: 10px;
}
#ctx-title {
  font-size: 12px;
  font-weight: bold;
  color: #7dd3fc;
  margin-bottom: 8px;
  z-index: 6;
}
#event-coords {
  width: 186px;
  height: 28px;
  background-color: #020617;
  color: #fcd34d;
  border: 1px solid #475569;
  border-radius: 5px;
  padding: 0 6px;
  font-size: 11px;
  z-index: 6;
}
#backdrop-card {
  position: absolute;
  left: 150px;
  top: 170px;
  width: 220px;
  height: 170px;
  z-index: 25;
  background-color: rgba(124, 58, 237, 0.68);
  border: 1px solid #c4b5fd;
  border-radius: 10px;
  padding: 12px;
}
#backdrop-title {
  font-size: 12px;
  font-weight: bold;
  color: #ede9fe;
  margin-bottom: 10px;
  z-index: 26;
}
#backdrop-tint {
  width: 192px;
  height: 82px;
  background-color: rgba(255, 255, 255, 0.16);
  border-radius: 6px;
  z-index: 26;
}
#internal-win {
  position: absolute;
  left: 260px;
  top: 130px;
  width: 296px;
  height: 230px;
  z-index: 20;
  background-color: rgba(30, 41, 59, 0.90);
  border: 1px solid #60a5fa;
  border-radius: 10px;
  overflow: hidden;
}
#win-titlebar {
  position: relative;
  width: 294px;
  height: 34px;
  z-index: 21;
  background-color: rgba(37, 99, 235, 0.92);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px;
}
#win-title {
  font-size: 12px;
  font-weight: bold;
  color: #ffffff;
  z-index: 21;
}
#win-close {
  width: 22px;
  height: 22px;
  z-index: 22;
  background-color: #ef4444;
  color: #ffffff;
  border: 0;
  border-radius: 4px;
  font-size: 11px;
  padding: 0;
}
#win-body {
  padding: 12px;
  z-index: 21;
}
#win-hint {
  font-size: 11px;
  color: #cbd5e1;
  margin-bottom: 8px;
  z-index: 21;
}
#win-state {
  width: 260px;
  height: 28px;
  z-index: 21;
  background-color: #0f172a;
  color: #93c5fd;
  border: 1px solid #3b82f6;
  border-radius: 5px;
  padding: 0 8px;
  font-size: 11px;
}
#win-preview {
  width: 260px;
  height: 82px;
  margin-top: 10px;
  background-color: rgba(56, 189, 248, 0.24);
  border: 1px solid #38bdf8;
  border-radius: 6px;
  z-index: 21;
}
#drag-widget {
  position: absolute;
  left: 260px;
  top: 16px;
  width: 180px;
  height: 90px;
  z-index: 30;
  background-color: rgba(14, 165, 233, 0.82);
  border: 1px solid #bae6fd;
  border-radius: 8px;
  padding: 10px;
}
#drag-label {
  font-size: 12px;
  font-weight: bold;
  color: #ffffff;
  margin-bottom: 6px;
  z-index: 31;
}
#drag-pos {
  width: 158px;
  height: 26px;
  z-index: 31;
  background-color: rgba(15, 23, 42, 0.82);
  color: #e0f2fe;
  border: 1px solid #7dd3fc;
  border-radius: 5px;
  padding: 0 6px;
  font-size: 11px;
}
#context-menu {
  position: absolute;
  left: 30px;
  top: 30px;
  width: 156px;
  height: 74px;
  z-index: 80;
  display: none;
  background-color: #0f172a;
  border: 1px solid #f59e0b;
  border-radius: 8px;
  padding: 5px;
}
.ctx-item {
  display: block;
  width: 144px;
  height: 28px;
  margin-bottom: 4px;
  z-index: 81;
  background-color: #1e293b;
  color: #fde68a;
  border: 0;
  border-radius: 4px;
  font-size: 11px;
  text-align: left;
  padding: 0 8px;
}
</style>
</head>
<body>
  <div id="topbar">
    <div class="top-left">
      <div id="brand-badge"></div>
      <div id="brand-title">Atlas Glass Deck</div>
      <input id="status-readout" type="text" readonly value="READY">
    </div>
    <div class="top-right">
      <div id="action-meter-wrap"><div id="action-meter"></div></div>
      <button id="action-btn" type="button">Run Action</button>
    </div>
  </div>
  <div id="workspace">
    <div id="sidebar">
      <div class="side-label">WORKSPACE LAYER</div>
      <div id="dropdown-wrap">
        <button id="dropdown-trigger" type="button">Select Layer</button>
        <div id="dropdown-menu">
          <button id="opt-alpha" class="dropdown-opt" type="button">Layer: Alpha</button>
          <button id="opt-beta" class="dropdown-opt" type="button">Layer: Beta</button>
          <button id="opt-gamma" class="dropdown-opt" type="button">Layer: Gamma</button>
        </div>
      </div>
      <input id="dropdown-value" class="side-readout" type="text" readonly value="Alpha">
      <div class="side-label">ACTION COUNTER</div>
      <input id="action-count" class="side-readout" type="text" readonly value="0">
      <div class="side-label">COMMAND FIELD</div>
      <input id="command-input" type="text" value="init">
      <input id="text-mirror" class="side-readout" type="text" readonly value="init">
      <div id="side-glass-card">
        <div class="glass-bar-a"></div>
        <div class="glass-bar-b"></div>
      </div>
    </div>
    <div id="main-pane">
      <div id="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">GPU COMPOSITOR</div>
          <div class="kpi-chip" style="background-color: rgba(56, 189, 248, 0.30);"></div>
          <div class="kpi-line"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">ALPHA STACK</div>
          <div class="kpi-chip" style="background-color: rgba(168, 85, 247, 0.32);"></div>
          <div class="kpi-line"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">INPUT BRIDGE</div>
          <div class="kpi-chip" style="background-color: rgba(34, 197, 94, 0.30);"></div>
          <div class="kpi-line"></div>
        </div>
      </div>
      <div id="desktop-stage">
        <div id="context-zone">
          <div id="ctx-title">Context Pad (Right-Click)</div>
          <input id="event-coords" type="text" readonly value="none">
        </div>
        <div id="backdrop-card">
          <div id="backdrop-title">Overlay Card Z25</div>
          <div id="backdrop-tint"></div>
        </div>
        <div id="internal-win">
          <div id="win-titlebar">
            <span id="win-title">Inspector Window</span>
            <button id="win-close" type="button">x</button>
          </div>
          <div id="win-body">
            <div id="win-hint">Drag titlebar or click to raise z-index</div>
            <input id="win-state" type="text" readonly value="Z20">
            <div id="win-preview"></div>
          </div>
        </div>
        <div id="drag-widget">
          <div id="drag-label">Drag Floating Card</div>
          <input id="drag-pos" type="text" readonly value="260,16">
        </div>
        <div id="context-menu">
          <button id="ctx-pin" class="ctx-item" type="button">Pin Layer</button>
          <button id="ctx-clear" class="ctx-item" type="button" style="margin-bottom: 0;">Close Menu</button>
        </div>
      </div>
    </div>
  </div>
<script>
(function() {
  var actionCount = 0;
  var dropdownOpen = false;
  var dragTarget = '';
  var dragStartX = 0;
  var dragStartY = 0;
  var widgetLeft = 260;
  var widgetTop = 16;
  var winLeft = 260;
  var winTop = 130;
  var origLeft = 0;
  var origTop = 0;

  var statusReadout = document.getElementById('status-readout');
  var actionBtn = document.getElementById('action-btn');
  var actionCountEl = document.getElementById('action-count');
  var actionMeter = document.getElementById('action-meter');

  var dropdownTrigger = document.getElementById('dropdown-trigger');
  var dropdownMenu = document.getElementById('dropdown-menu');
  var dropdownValue = document.getElementById('dropdown-value');
  var optAlpha = document.getElementById('opt-alpha');
  var optBeta = document.getElementById('opt-beta');
  var optGamma = document.getElementById('opt-gamma');

  var commandInput = document.getElementById('command-input');
  var textMirror = document.getElementById('text-mirror');

  var dragWidget = document.getElementById('drag-widget');
  var dragPos = document.getElementById('drag-pos');

  var internalWin = document.getElementById('internal-win');
  var winTitlebar = document.getElementById('win-titlebar');
  var winTitle = document.getElementById('win-title');
  var winBody = document.getElementById('win-body');
  var winHint = document.getElementById('win-hint');
  var winState = document.getElementById('win-state');
  var winPreview = document.getElementById('win-preview');
  var winClose = document.getElementById('win-close');

  var contextZone = document.getElementById('context-zone');
  var eventCoords = document.getElementById('event-coords');
  var contextMenu = document.getElementById('context-menu');
  var ctxPin = document.getElementById('ctx-pin');
  var ctxClear = document.getElementById('ctx-clear');

  function clampNum(v, lo, hi) {
    if (v < lo) { return lo; }
    if (v > hi) { return hi; }
    return v;
  }

  function raiseInternalWindow() {
    internalWin.style.zIndex = '40';
    winTitlebar.style.zIndex = '41';
    winTitle.style.zIndex = '41';
    winClose.style.zIndex = '42';
    winBody.style.zIndex = '41';
    winHint.style.zIndex = '41';
    winState.style.zIndex = '41';
    winPreview.style.zIndex = '41';
    internalWin.style.borderColor = '#38bdf8';
    winState.value = 'Z40:' + winLeft + ',' + winTop;
  }

  actionBtn.addEventListener('click', function(e) {
    actionCount = actionCount + 1;
    actionCountEl.value = String(actionCount);
    statusReadout.value = 'ACTIVE-' + String(actionCount);
    actionBtn.style.backgroundColor = '#16a34a';
    actionBtn.style.borderColor = '#4ade80';
    actionMeter.style.width = String(clampNum(30 + actionCount * 35, 30, 98)) + 'px';
    actionMeter.style.backgroundColor = '#22c55e';
    document.title = 'action:' + String(actionCount);
  });

  dropdownTrigger.addEventListener('click', function(e) {
    dropdownOpen = !dropdownOpen;
    dropdownMenu.style.display = dropdownOpen ? 'block' : 'none';
    document.title = dropdownOpen ? 'dropdown:open' : 'dropdown:closed';
  });

  function selectDropdown(label, borderHex) {
    dropdownValue.value = label;
    dropdownOpen = false;
    dropdownMenu.style.display = 'none';
    dropdownTrigger.style.borderColor = borderHex;
    dropdownTrigger.style.backgroundColor = '#1e3a8a';
    statusReadout.value = 'MODE-' + label;
    document.title = 'dropdown:' + label;
  }

  optAlpha.addEventListener('click', function() { selectDropdown('Alpha', '#38bdf8'); });
  optBeta.addEventListener('click', function() { selectDropdown('Beta', '#a855f7'); });
  optGamma.addEventListener('click', function() { selectDropdown('Gamma', '#22c55e'); });

  commandInput.addEventListener('input', function(e) {
    textMirror.value = commandInput.value;
    statusReadout.value = 'TYPED';
    document.title = 'text:' + commandInput.value;
  });

  dragWidget.addEventListener('mousedown', function(e) {
    dragTarget = 'widget';
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    origLeft = widgetLeft;
    origTop = widgetTop;
    dragWidget.style.borderColor = '#facc15';
  });

  winTitlebar.addEventListener('mousedown', function(e) {
    if (e.target && e.target.id === 'win-close') {
      return;
    }
    raiseInternalWindow();
    dragTarget = 'window';
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    origLeft = winLeft;
    origTop = winTop;
    document.title = 'win:raised';
  });

  winClose.addEventListener('click', function(e) {
    e.stopPropagation();
    dragTarget = '';
    internalWin.style.display = 'none';
    statusReadout.value = 'WIN-CLOSED';
    document.title = 'window:closed';
  });

  document.addEventListener('mousemove', function(e) {
    if (dragTarget === 'widget') {
      widgetLeft = clampNum(origLeft + (e.clientX - dragStartX), 0, 390);
      widgetTop = clampNum(origTop + (e.clientY - dragStartY), 0, 320);
      dragWidget.style.left = String(widgetLeft) + 'px';
      dragWidget.style.top = String(widgetTop) + 'px';
      dragPos.value = String(widgetLeft) + ',' + String(widgetTop);
      document.title = 'drag:' + String(widgetLeft) + ',' + String(widgetTop);
    } else if (dragTarget === 'window') {
      winLeft = clampNum(origLeft + (e.clientX - dragStartX), 0, 280);
      winTop = clampNum(origTop + (e.clientY - dragStartY), 0, 180);
      internalWin.style.left = String(winLeft) + 'px';
      internalWin.style.top = String(winTop) + 'px';
      winState.value = 'Z40:' + String(winLeft) + ',' + String(winTop);
      document.title = 'win:' + String(winLeft) + ',' + String(winTop);
    }
  });

  document.addEventListener('mouseup', function() {
    if (dragTarget === 'widget') {
      dragWidget.style.borderColor = '#bae6fd';
    }
    dragTarget = '';
  });

  contextZone.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var localX = clampNum(e.clientX - 204, 16, 410);
    var localY = clampNum(e.clientY - 168, 16, 330);
    contextMenu.style.left = String(localX) + 'px';
    contextMenu.style.top = String(localY) + 'px';
    contextMenu.style.display = 'block';
    eventCoords.value = String(e.clientX) + ',' + String(e.clientY) + '@' + String(e.offsetX) + ',' + String(e.offsetY);
    document.title = 'ctx:' + String(e.clientX) + ',' + String(e.clientY);
  });

  ctxPin.addEventListener('click', function() {
    contextMenu.style.display = 'none';
    contextZone.style.borderColor = '#f59e0b';
    contextZone.style.backgroundColor = 'rgba(180, 83, 9, 0.55)';
    statusReadout.value = 'CTX-PINNED';
    document.title = 'ctx:pinned';
  });

  ctxClear.addEventListener('click', function() {
    contextMenu.style.display = 'none';
    statusReadout.value = 'CTX-CLOSED';
    document.title = 'ctx:closed';
  });
})();
</script>
</body>
</html>
