<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Simple Web Catalog — overview</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 sans-serif; color: #172033; background: #eef2ff; }
    header { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; color: white; background: linear-gradient(120deg, #173b7a, #6d28d9); }
    .tabs { position: sticky; top: 64px; z-index: 1; display: flex; gap: 8px; padding: 10px 24px; background: #dbeafe; }
    .tabs button { color: #172033; background: white; }
    .tabs button[aria-selected="true"] { color: white; background: #4f46e5; }
    [role="tabpanel"][hidden] { display: none; }
    main { width: min(1100px, 100%); margin: auto; padding: 24px; }
    section { margin: 0 0 24px; padding: 20px; border: 1px solid #c7d2fe; border-radius: 12px; background: white; box-shadow: 0 6px 18px rgba(30, 41, 59, .12); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .flex { display: flex; flex-wrap: wrap; gap: 12px; }
    .card { flex: 1 1 180px; padding: 12px; border-left: 5px solid #4f46e5; background: #eef2ff; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border: 1px solid #cbd5e1; text-align: left; }
    label { display: block; margin: 8px 0; }
    input, select, textarea, button { padding: 8px; border: 1px solid #94a3b8; border-radius: 5px; }
    button { color: white; background: #4f46e5; cursor: pointer; }
    button:hover, button:focus { background: #312e81; outline: 3px solid #fbbf24; }
    .scroll { height: 90px; overflow: auto; padding: 8px; border: 1px dashed #64748b; }
    .positioned { position: relative; min-height: 70px; background: #e0f2fe; }
    .badge { position: absolute; right: 10px; top: 10px; padding: 4px 8px; border-radius: 999px; color: white; background: #047857; }
    .unsupported { border-color: #f59e0b; background: #fffbeb; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body data-catalog-tab="overview">
<main>
<section id="panel-overview" role="tabpanel" aria-labelledby="tab-overview">
    <h1>Common HTML and CSS in one page</h1>
    <h2>Text and semantics</h2>
    <p>Paragraph with <strong>strong</strong>, <em>emphasis</em>, <code>inline code</code>, <mark>mark</mark>, and a <a href="#forms">working anchor</a>.</p>
    <blockquote>Deterministic content makes renderer comparisons useful.</blockquote>
    <div class="flex"><ol><li>Ordered item</li><li>Second item</li></ol><ul><li>Unordered item</li><li>Second item</li></ul></div>
  </section>
</main>
</body>
</html>
