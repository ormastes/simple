<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#0f172a;color:#f1f5f9;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .stage{position:relative;padding:16px;height:340px;}
      .cards{display:flex;gap:16px;}
      .pcard{position:relative;width:236px;height:210px;background:#1e293b;border:1px solid #334155;border-radius:8px;overflow:hidden;padding:10px;}
      .pcard img{width:214px;height:128px;display:block;}
      .pill{position:absolute;top:16px;right:16px;background:#ef4444;color:#ffffff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;z-index:2;}
      .pill-g{position:absolute;top:16px;right:16px;background:#10b981;color:#052e16;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;z-index:2;}
      .capbar{position:absolute;left:10px;right:10px;bottom:52px;background:#020617;color:#f8fafc;padding:4px 8px;font-size:11px;border-top:2px solid #38bdf8;}
      .title{font-size:13px;font-weight:700;margin-top:8px;}
      .price{font-size:12px;color:#38bdf8;margin-top:2px;}
      .float-banner{position:absolute;left:64px;right:64px;bottom:18px;background:#2563eb;color:#ffffff;border:2px solid #93c5fd;border-radius:8px;padding:10px 14px;z-index:5;}
      .float-banner strong{display:block;font-size:13px;margin-bottom:2px;}
      .float-banner span{font-size:11px;color:#dbeafe;}
</style></head><body>
<div class="stage">
        <div class="cards">
          <div class="pcard">
            <span class="pill">-30% OFF</span>
            <img src="../assets/sunset.png" width="214" height="128" />
            <div class="capbar">Horizon Series Print</div>
            <div class="title">Sunset Frame</div>
            <div class="price">$42.00</div>
          </div>
          <div class="pcard">
            <span class="pill-g">NEW</span>
            <img src="../assets/cube.png" width="214" height="128" />
            <div class="capbar">Color Patch Reference</div>
            <div class="title">Spectrum Cube</div>
            <div class="price">$28.00</div>
          </div>
        </div>
        <div class="float-banner">
          <strong>Absolute Overlay (z-index: 5)</strong>
          <span>Anchored above product cards at bottom: 18px without disturbing flex card geometry.</span>
        </div>
      </div>
</body></html>
