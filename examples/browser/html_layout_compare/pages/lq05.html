<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:640px;height:420px;overflow:hidden;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif;color:#ffffff;background:#090d1a;}
*{box-sizing:border-box;}
.stage{position:relative;width:640px;height:420px;overflow:hidden;}
.bg-orb1{position:absolute;left:30px;top:24px;width:240px;height:240px;border-radius:120px;background:radial-gradient(circle, rgba(56,189,248,0.85), rgba(37,99,235,0.10) 70%);}
.bg-orb2{position:absolute;right:40px;bottom:20px;width:260px;height:260px;border-radius:130px;background:radial-gradient(circle, rgba(236,72,153,0.80), rgba(168,85,247,0.10) 70%);}
.bg-img{position:absolute;left:180px;top:90px;width:280px;height:168px;border-radius:12px;border:2px solid rgba(255,255,255,0.35);}
.hud{
  position:absolute;left:36px;top:40px;width:360px;padding:14px 16px;
  background:rgba(15,23,42,0.52);border:1px solid rgba(255,255,255,0.28);border-radius:16px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:2;
}
.toast{
  position:absolute;right:32px;bottom:34px;width:290px;padding:12px 14px;
  background:rgba(30,41,59,0.56);border:1px solid rgba(125,211,252,0.45);border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:3;
}
</style></head><body>
<div class="stage">
  <div class="bg-orb1"></div>
  <div class="bg-orb2"></div>
  <img class="bg-img" src="../assets/sunset.png" width="280" height="168" />
  <div class="hud">
    <div style="font-size:15px;font-weight:700;margin-bottom:5px;">Liquid Glass Frosted HUD</div>
    <div style="font-size:12px;line-height:1.4;color:#e2e8f0;">Translucent panel blurring both the cyan orb and sunset landscape image directly behind it.</div>
  </div>
  <div class="toast">
    <div style="font-size:13px;font-weight:700;color:#7dd3fc;margin-bottom:4px;">backdrop-filter: blur(12px)</div>
    <div style="font-size:11px;color:#cbd5e1;">Testing real backdrop blur + overlay z-index stacking over vivid pink/violet glow.</div>
  </div>
</div>
</body></html>
