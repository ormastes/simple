<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#090d16;color:#e2e8f0;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .shell{display:flex;flex-direction:column;height:340px;}
      .top{height:38px;background:#1e293b;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;}
      .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:#f8fafc;}
      .navlinks{font-size:11px;color:#94a3b8;}
      .mid{display:flex;flex:1;min-height:0;}
      .left{width:106px;background:#111827;border-right:1px solid #1f2937;padding:8px;flex-shrink:0;}
      .ni{font-size:11px;padding:5px 7px;border-radius:4px;margin-bottom:3px;color:#94a3b8;}
      .ni.on{background:#2563eb;color:#ffffff;font-weight:700;}
      .center{flex:1;padding:10px;min-width:0;}
      .center img{width:160px;height:96px;display:block;margin-bottom:8px;}
      .center h2{font-size:14px;margin:0 0 4px 0;color:#f8fafc;}
      .center p{font-size:11px;line-height:1.4;color:#cbd5e1;margin:0;}
      .right{width:124px;background:#111827;border-left:1px solid #1f2937;padding:10px;flex-shrink:0;}
      .right img{width:48px;height:48px;display:block;margin-bottom:6px;}
      .rk{font-size:11px;font-weight:700;color:#38bdf8;margin-bottom:3px;}
      .rv{font-size:11px;color:#94a3b8;line-height:1.35;}
      .bot{height:28px;background:#1e293b;border-top:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#94a3b8;flex-shrink:0;}
</style></head><body>
<div class="shell">
        <div class="top">
          <div class="brand"><img src="../assets/star.png" width="18" height="18" /><span>Simple Studio</span></div>
          <div class="navlinks">File &nbsp; Edit &nbsp; Render &nbsp; Help</div>
        </div>
        <div class="mid">
          <div class="left">
            <div class="ni on">Overview</div>
            <div class="ni">Layers</div>
            <div class="ni">Textures</div>
            <div class="ni">Shaders</div>
            <div class="ni">Metrics</div>
          </div>
          <div class="center">
            <img src="../assets/sunset.png" width="160" height="96" />
            <h2>Viewport Canvas</h2>
            <p>Center fluid column stretches to consume remaining horizontal space between the 106px nav and 124px inspector.</p>
          </div>
          <div class="right">
            <img src="../assets/avatar.png" width="48" height="48" />
            <div class="rk">Inspector</div>
            <div class="rv">Owner: Render<br/>Size: 520x340<br/>Depth: 32bpp</div>
          </div>
        </div>
        <div class="bot"><span>Status: Ready</span><span>Pure-Simple vs Chrome</span></div>
      </div>
</body></html>
