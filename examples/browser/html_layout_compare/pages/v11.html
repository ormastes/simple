<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#111827;color:#e5e7eb;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .card{margin:12px;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:12px;display:flex;gap:14px;height:316px;}
      .side{width:136px;border-right:1px solid #374151;padding-right:12px;flex-shrink:0;}
      .side img{width:48px;height:48px;display:block;margin-bottom:8px;}
      .name{font-size:14px;font-weight:700;color:#f9fafb;margin-bottom:2px;}
      .role{font-size:11px;color:#38bdf8;margin-bottom:8px;}
      .bio{font-size:11px;line-height:1.4;color:#9ca3af;}
      .form{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
      .lbl{font-size:11px;font-weight:700;color:#cbd5e1;margin-bottom:2px;}
      input,select,textarea{width:100%;background:#0f172a;color:#f8fafc;border:1px solid #475569;border-radius:4px;padding:6px 8px;font-family:Helvetica,Arial,sans-serif;font-size:12px;}
      textarea{height:64px;resize:none;}
      .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
      .b1{background:#2563eb;color:#ffffff;border:none;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:700;}
      .b2{background:#374151;color:#e5e7eb;border:1px solid #4b5563;border-radius:4px;padding:6px 12px;font-size:12px;}
</style></head><body>
<div class="card">
        <div class="side">
          <img src="../assets/avatar.png" width="48" height="48" />
          <div class="name">Taylor Morgan</div>
          <div class="role">Graphics Engineer</div>
          <div class="bio">Testing single-line inputs, dropdown selects, multiline textareas, and aligned action buttons.</div>
        </div>
        <div class="form">
          <div><div class="lbl">Display Name</div><input type="text" value="Simple Engine 2D" /></div>
          <div><div class="lbl">Raster Backend</div><select><option>CPU SIMD (Pure Simple)</option><option>Skia Parity</option></select></div>
          <div><div class="lbl">Notes</div><textarea rows="3">Line 1: Form control box sizing&#10;Line 2: Font baseline match</textarea></div>
          <div class="actions"><button type="button" class="b2">Cancel</button><button type="button" class="b1">Save Profile</button></div>
        </div>
      </div>
</body></html>
