<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#111827;color:#f3f4f6;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .grid{display:grid;grid-template-columns:160px 160px 160px;gap:10px;padding:10px;}
      .tile{background:#1f2937;border:1px solid #374151;border-radius:6px;padding:10px;}
      .span2{grid-column:span 2;display:flex;gap:10px;align-items:center;}
      .span2 img{width:140px;height:84px;flex-shrink:0;}
      .k{font-size:11px;color:#9ca3af;text-transform:uppercase;margin-bottom:4px;}
      .v{font-size:20px;font-weight:700;color:#38bdf8;margin-bottom:4px;}
      .d{font-size:11px;color:#d1d5db;line-height:1.35;}
      .thumb{width:138px;height:66px;display:block;margin-bottom:6px;}
</style></head><body>
<div class="grid">
        <div class="tile span2">
          <img src="../assets/sunset.png" width="140" height="84" />
          <div>
            <div class="k">Featured Preview (span 2)</div>
            <div class="v">520 x 340</div>
            <div class="d">Grid track sizing spanning columns 1 and 2 with nested flex layout.</div>
          </div>
        </div>
        <div class="tile">
          <div class="k">Frame Latency</div>
          <div class="v">14.2 ms</div>
          <div class="d">Pure-Simple layout pass within budget.</div>
        </div>
        <div class="tile">
          <img class="thumb" src="../assets/cube.png" width="138" height="66" />
          <div class="d">Color Checker Tile</div>
        </div>
        <div class="tile">
          <div class="k">Glyph Parity</div>
          <div class="v">95.7%</div>
          <div class="d">Exact pixels vs Skia SFNT pipeline.</div>
        </div>
        <div class="tile">
          <div class="k">Active DOM</div>
          <div class="v">24 nodes</div>
          <div class="d">Pruned rules in single cascade pass.</div>
        </div>
      </div>
</body></html>
