<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#0f172a;color:#e2e8f0;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .wrap{padding:12px 14px;}
      .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
      .chip{display:flex;align-items:center;gap:5px;background:#1e293b;border:1px solid #334155;border-radius:999px;padding:4px 9px;font-size:11px;color:#f1f5f9;}
      .chip.hi{background:#1d4ed8;border-color:#60a5fa;}
      .chip img{width:12px;height:12px;}
      .cards{display:flex;flex-wrap:wrap;gap:10px;}
      .mc{width:241px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px;display:flex;gap:8px;align-items:center;}
      .mc img{width:48px;height:48px;flex-shrink:0;}
      .mct{font-size:12px;font-weight:700;color:#f8fafc;margin-bottom:2px;}
      .mcs{font-size:11px;color:#94a3b8;line-height:1.3;}
</style></head><body>
<div class="wrap">
        <div class="chips">
          <span class="chip hi"><img src="../assets/star.png" width="12" height="12" />All Layouts</span>
          <span class="chip">Flexbox Row</span>
          <span class="chip">Flex Wrap</span>
          <span class="chip">CSS Grid</span>
          <span class="chip">Table Colspan</span>
          <span class="chip">Float Left/Right</span>
          <span class="chip">Absolute Badges</span>
          <span class="chip">Inline Pills</span>
          <span class="chip">Object Fit</span>
        </div>
        <div class="cards">
          <div class="mc"><img src="../assets/avatar.png" width="48" height="48" /><div><div class="mct">Card Alpha</div><div class="mcs">Wraps at 2 columns across 492px row.</div></div></div>
          <div class="mc"><img src="../assets/cube.png" width="48" height="48" /><div><div class="mct">Card Beta</div><div class="mcs">Auto gap spacing horizontally.</div></div></div>
          <div class="mc"><img src="../assets/cube.png" width="48" height="48" /><div><div class="mct">Card Gamma</div><div class="mcs">Second row top-aligned neatly.</div></div></div>
          <div class="mc"><img src="../assets/avatar.png" width="48" height="48" /><div><div class="mct">Card Delta</div><div class="mcs">Symmetric height and borders.</div></div></div>
        </div>
      </div>
</body></html>
