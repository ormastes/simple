<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#0f172a;color:#e2e8f0;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .wrap{padding:12px 14px;}
      h1{font-size:15px;margin:0 0 10px 0;color:#f8fafc;}
      .grid{display:grid;grid-template-columns:240px 240px;gap:12px;}
      .box{background:#1e293b;border:1px solid #334155;border-radius:6px;padding:8px;}
      .lbl{font-size:11px;font-weight:700;color:#38bdf8;margin-bottom:6px;}
      .frame{width:220px;height:86px;background:#020617;border:1px dashed #475569;display:flex;align-items:center;justify-content:center;}
      .im-nat{width:120px;height:72px;}
      .im-con{width:84px;height:84px;object-fit:contain;background:#090d16;}
      .im-cov{width:84px;height:84px;object-fit:cover;background:#090d16;}
      .im-fil{width:160px;height:56px;object-fit:fill;background:#090d16;}
      .cap{font-size:11px;color:#94a3b8;margin-top:4px;}
</style></head><body>
<div class="wrap">
        <h1>CSS object-fit Matrix (Source sunset.png = 160x96 = 5:3)</h1>
        <div class="grid">
          <div class="box"><div class="lbl">Proportional 120x72</div><div class="frame"><img class="im-nat" src="../assets/sunset.png" width="120" height="72" /></div><div class="cap">Matches 5:3 aspect ratio</div></div>
          <div class="box"><div class="lbl">object-fit: contain (84x84)</div><div class="frame"><img class="im-con" src="../assets/sunset.png" width="84" height="84" /></div><div class="cap">Letterboxed inside square frame</div></div>
          <div class="box"><div class="lbl">object-fit: cover (84x84)</div><div class="frame"><img class="im-cov" src="../assets/sunset.png" width="84" height="84" /></div><div class="cap">Center-cropped square fill</div></div>
          <div class="box"><div class="lbl">object-fit: fill (160x56)</div><div class="frame"><img class="im-fil" src="../assets/sunset.png" width="160" height="56" /></div><div class="cap">Stretched to exact target rect</div></div>
        </div>
      </div>
</body></html>
