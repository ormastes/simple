<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:520px;height:340px;overflow:hidden;box-sizing:border-box;background:#181825;color:#cdd6f4;font-family:Helvetica,Arial,sans-serif;}
      *{box-sizing:border-box;}
      .wrap{padding:14px;}
      h1{font-size:15px;margin:0 0 10px 0;color:#f8fafc;}
      table{width:100%;border-collapse:collapse;background:#1e1e2e;border:1px solid #313244;font-size:12px;}
      th{background:#313244;color:#89b4fa;text-align:left;padding:8px 10px;border-bottom:2px solid #45475a;}
      td{padding:8px 10px;border-bottom:1px solid #313244;vertical-align:middle;}
      .num{text-align:right;}
      .cell-ic{display:flex;align-items:center;gap:8px;}
      .badge-ok{background:#14532d;color:#86efac;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;}
      .badge-warn{background:#713f12;color:#fde047;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;}
      .total td{background:#11111b;font-weight:700;color:#f8fafc;}
</style></head><body>
<div class="wrap">
        <h1>Subsystem Render Benchmark Table</h1>
        <table>
          <thead><tr><th>Subsystem</th><th>Profile</th><th>Status</th><th class="num">Time (ms)</th></tr></thead>
          <tbody>
            <tr><td><div class="cell-ic"><img src="../assets/star.png" width="18" height="18" /><span>HTML Tokenizer</span></div></td><td>Single Pass</td><td><span class="badge-ok">PASS</span></td><td class="num">1.0</td></tr>
            <tr><td><div class="cell-ic"><img src="../assets/avatar.png" width="18" height="18" /><span>CSS Cascade</span></div></td><td>Rule Pruned</td><td><span class="badge-ok">PASS</span></td><td class="num">9.0</td></tr>
            <tr><td><div class="cell-ic"><img src="../assets/star.png" width="18" height="18" /><span>Flex &amp; Grid</span></div></td><td>Exact Layout</td><td><span class="badge-ok">PASS</span></td><td class="num">0.6</td></tr>
            <tr><td><div class="cell-ic"><img src="../assets/avatar.png" width="18" height="18" /><span>Glyph Raster</span></div></td><td>4-Phase AA</td><td><span class="badge-warn">TUNED</span></td><td class="num">3.4</td></tr>
            <tr class="total"><td colspan="3">Combined Page Budget Total</td><td class="num">14.0</td></tr>
          </tbody>
        </table>
      </div>
</body></html>
