name: Component Builds

# Build only the components (kernels, plugins, providers, SIMD variants) a
# change touches, each with an already-proven compiler. Neither the compiler
# nor the app is rebuilt. Registry: config/ci/components.sdn.
# Guide: doc/07_guide/infra/toolchain/phase_ladder_ci.md
on:
  push:
    branches: [main, 'release/**', release_phase3]
  pull_request:
    branches: [main, 'release/**', release_phase3]
  workflow_dispatch:
    inputs:
      components:
        description: "all, or comma-separated component names"
        type: string
        default: all

permissions:
  contents: read

concurrency:
  group: component-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      ready: ${{ steps.compiler.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select touched components
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.components }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          sh scripts/ci/plan-components.shs --selftest
          case "$EVENT" in
            workflow_dispatch)
              if [ "${REQUESTED:-all}" = all ]; then sh scripts/ci/plan-components.shs --all
              else sh scripts/ci/plan-components.shs --only "$REQUESTED"; fi ;;
            pull_request) sh scripts/ci/plan-components.shs "$PR_BASE" "$HEAD" ;;
            *) sh scripts/ci/plan-components.shs "${PUSH_BASE:-0}" "$HEAD" ;;
          esac
      # Components build only with a compiler resolve-bootstrap-compiler.shs
      # proves (it must build and run a hello world). Before any RC carries
      # one there is nothing to build with: the build jobs are reported
      # SKIPPED with the resolver's reason, never passed.
      - name: Proven compiler available?
        id: compiler
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if picked=$(sh scripts/bootstrap/resolve-bootstrap-compiler.shs --platform linux-x86_64 2>resolve.err); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "proven compiler: $picked"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat resolve.err
            echo "::warning::No proven linux-x86_64 compiler (local phase or RC) qualified; component builds skipped, not passed."
            { echo "Component builds SKIPPED: no proven compiler qualified."; echo '```'; tail -20 resolve.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.ready == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross toolchains
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
      - name: Resolve proven compiler (config/bootstrap.sdn)
        id: compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          picked=$(sh scripts/bootstrap/resolve-bootstrap-compiler.shs --platform "${{ matrix.host }}")
          bin=${picked% *}
          # A release package's launcher sets SIMPLE_ASSET_ROOT for its payload.
          [ -x "$(dirname "$bin")/simple" ] && bin=$(dirname "$bin")/simple
          echo "SIMPLE_BIN=$(cd "$(dirname "$bin")" && pwd)/$(basename "$bin")" >> "$GITHUB_ENV"
          echo "digest=$(sha256sum "$bin" | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "compiler: $bin (phase ${picked##* })"
      # Cache scope follows GitHub's branch rules: main and each release
      # branch write their own entries; PRs read their base branch's entries
      # and never write. The compiler digest keeps entries from mixing
      # compilers.
      - name: Restore incremental state
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache }}
          key: component-${{ matrix.name }}-${{ steps.compiler.outputs.digest }}-${{ github.sha }}
          restore-keys: component-${{ matrix.name }}-${{ steps.compiler.outputs.digest }}-
      - name: Build ${{ matrix.name }}
        env:
          BUILD: ${{ matrix.build }}
        run: |
          mkdir -p "$(dirname "${{ matrix.output }}")"
          sh -c "$BUILD"
          test -s "${{ matrix.output }}"
      - name: Save incremental state
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.cache }}
          key: component-${{ matrix.name }}-${{ steps.compiler.outputs.digest }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.name }}
          path: ${{ matrix.output }}
          retention-days: 7
          if-no-files-found: error
