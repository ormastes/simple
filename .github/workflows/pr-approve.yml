# Approve a pull request as github-actions[bot].
#
# Why this exists: every PR in this repo is authored by `ormastes`, and every
# credential available to an agent session authenticates as `ormastes` too.
# GitHub refuses `addPullRequestReview` when the reviewing account is the PR
# author ("Can not approve your own pull request"), so no token on the machine
# can ever record an approval. `github-actions[bot]` is a distinct actor, so it
# can.
#
# DELIBERATELY `workflow_dispatch` ONLY — it is NOT wired to `pull_request`.
# An auto-approve-on-open workflow would hand a standing approval to every
# branch anyone can push on a ruleset-protected repo. This requires a human to
# name a specific PR number, so the approval stays an explicit act.
#
# Note: approvals do not gate merges here. `spipe-vcs-v3-main` sets
# `approving_reviews: 0`; the two required checks are `Code Idiom & Structural
# Ratchet Gates` and `SPipe Self Review Admission`. This workflow records a
# review state, it does not bypass any gate.

name: Approve PR (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to approve'
        required: true
        type: string
      body:
        description: 'Approval message'
        required: false
        default: 'Approved via manual dispatch.'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        env:
          PR: ${{ inputs.pr_number }}
        run: |
          case "$PR" in
            ''|*[!0-9]*)
              echo "pr_number must be a positive integer, got '$PR'" >&2
              exit 1
              ;;
          esac
          echo "approving PR #$PR"

      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr_number }}
          BODY: ${{ inputs.body }}
        run: |
          set -eu
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state, not OPEN — nothing to approve" >&2
            exit 1
          fi
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "$BODY"

      - name: Verify the approval was recorded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -eu
          decision=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json reviewDecision -q '.reviewDecision // ""')
          if [ "$decision" != "APPROVED" ]; then
            echo "FAIL — reviewDecision is '${decision:-<none>}', not APPROVED" >&2
            exit 1
          fi
          echo "PASS — PR #$PR reviewDecision=APPROVED"
