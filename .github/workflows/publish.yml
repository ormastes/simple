name: Publish admitted npm packages

on:
  release:
    types: [published]

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    strategy:
      fail-fast: true
      matrix:
        include:
          - dir: tools/mcp-registry
            package: '@simple-lang/mcp-server'
          - dir: tools/lsp-mcp-registry
            package: '@simple-lang/lsp-mcp-server'
    steps:
      - name: Validate exact immutable release identity
        id: identity
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          test -n "$RELEASE_ADMIN_TOKEN"
          test "$(GH_TOKEN="$RELEASE_ADMIN_TOKEN" gh api \
            "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq '.enabled')" = true
          gh release verify "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Verify checked-out tag and canonical package projections
        working-directory: ${{ matrix.dir }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.identity.outputs.version }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match)" = "$TAG"
          test "$(node -p 'require("./package.json").name')" = "$PACKAGE"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          test "$(node -p 'require("./server.json").version')" = "$VERSION"
          node -e '
            const pkg = require("./package.json");
            const server = require("./server.json");
            const version = process.env.VERSION;
            if (pkg.runtimeVersion !== undefined && pkg.runtimeVersion !== version) process.exit(1);
            if (server.packages && server.packages.some((entry) => entry.version !== version)) process.exit(1);
          '
          npm ci --ignore-scripts
          npm pack --dry-run

      - name: Verify admitted native release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh scripts/check-mcp-release-assets.shs "${{ matrix.dir }}"

      - name: Publish exact checked-in package with registry provenance
        working-directory: ${{ matrix.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
