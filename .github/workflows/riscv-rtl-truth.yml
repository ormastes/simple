name: RISC-V RTL Source Truth
on:
  pull_request:
  push:
    branches: [main, release/1.0.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtl-source-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install source audit tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep gawk
      - name: Check fail-closed admission and sabotage controls
        run: sh test/01_unit/scripts/riscv_rtl_truth_contract_test.shs
      - name: Audit actual RTL source
        run: sh scripts/check/check-riscv-rtl-truth.shs
