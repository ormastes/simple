name: Required Gates

# The ONE job carrying the ruleset-required context "Code Idiom & Structural
# Ratchet Gates" (job id `fast-gates`, referenced by ci_job= in
# config/check/must_check_gates.sdn). Split out of repo-hygiene.yml on
# 2026-09-27: that workflow launched 7 jobs (2 on macOS) on every PR, even
# docs-only ones, and the required job queued behind its own advisory
# siblings in a starved runner pool. Advisory hygiene jobs now run on push
# to main / dispatch only; the PR pays for this one job.

on:
  pull_request:
    branches: [main, master, develop, release_windows, release_phase3, 'release/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REQUIRED fast lane (2026-09-23). The ruleset spipe-vcs-v3-main requires the
  # status context "Code Idiom & Structural Ratchet Gates"; this job carries
  # that name so a PR can land in about a minute (user order: required checks
  # < 1 min, pre-push < 20 s). It runs the SAME fast, diff-scoped set the
  # pre-push hook runs, against the PR's own base..head range, so enforcement
  # does not depend on local hooks (pushes bypassed the hook that day). The
  # 47-step ratchet lane below keeps running on every PR and on main as the
  # NON-required "(extended)" job; heavy proofs (cargo check, C compile, test
  # sweeps, advisory gates) belong there or post-merge, never here.
  #
  # Checkout is sparse (scripts/check, bootstrap, config/check, and the hosted
  # runtime probe source reach the working tree) and depth 1; the PR endpoints
  # are fetched at PR_COMMITS+1 depth exactly as the extended job does.
  fast-gates:
    name: Code Idiom & Structural Ratchet Gates
    # Hosted (free CI plan, doc/03_plan/infra/bootstrap/free_github_actions_ci_plan_2026-10-22.md
    # 2.1): the self-hosted ARM64 runner left this required check queued and
    # blocked every PR on 2026-10-25. The check name is unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # This repo also has a persistent Linux runner labelled ubuntu-latest.
      # Earlier jobs on it (M5 advisory evidence, bootstrap stage3
      # stage2-runtime-authority/deps, build/phase_snapshots) leave read-only
      # entries in the checkout; checkout cannot remove them (EACCES) until
      # their parent dirs are owner-writable again. Unlinking only needs the
      # parent dir u+wx, so only runner-owned dirs lacking it are touched
      # (pre-order `\;` so a dir without u+x is fixed before find reads it);
      # .git is skipped (its 0444 loose objects are git's own).
      - name: Restore checkout access to read-only leftovers
        shell: sh
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            find "$GITHUB_WORKSPACE" -xdev -name .git -prune -o -type d -user "$(id -u)" ! -perm -u+wx -exec chmod u+wx {} \; || true
          fi

      - uses: actions/checkout@v4
        with:
          # The local tier below runs gate scripts that read tracked files
          # OUTSIDE the original fast-lane set (wired 2026-11-09, PR #7973):
          #   scripts/resource        process-tree-rss-watchdog.pl — local-
          #                           bootstrap-ceiling-headroom/transport,
          #                           local-watchdog-monotonic-budget,
          #                           local-item5-app-runner-preflight
          #   scripts/os              simpleos-native-build.shs —
          #                           local-fast-verify-bootstrap-scripts
          #   .github/workflows       simpleos-build.yml — local-bootstrap-slim-
          #                           verification-cli
          #   cmake                   SimpleClangPolicy.cmake — local-clang-
          #                           policy-native-dependency
          #   examples/09_embedded    riscv arch trees — local-riscv-text-eq-any
          #   release                 version.sdn — local-stage2-candidate-
          #                           requalification (canonical version)
          #   doc/04_architecture/compiler/plugin_arch
          #                           kernel_closure.sdn — local-stage2-
          #                           candidate-requalification (ABI policy)
          #   src/compiler_rust/compiler  hir/lower/type_resolver.rs — local-hir-
          #                               lower-list-generic-not-any
          #   test/05_perf/ctype and test/perf/ctype — canonical and legacy
          #                           owners compared by local-ctype-benchmark-enforcement
          # These rows are honest static/contract checks over tracked content;
          # keep the checkout sparse, but materialize exactly the roots they
          # read so the checks genuinely run here instead of failing on absent
          # inputs. Total added material is ~28 MB / ~1750 files.
          sparse-checkout: |
            bin
            scripts/check
            scripts/vcs
            scripts/bootstrap
            scripts/setup
            scripts/lib
            scripts/resource
            scripts/os
            config
            config/check
            .github/workflows
            cmake
            release
            doc/04_architecture/compiler/plugin_arch
            examples/09_embedded
            src/runtime/startup/common
            src/runtime/test
            src/runtime
            src/compiler
            src/compiler_rust/compiler
            src/compiler_rust/runtime
            src/compiler_rust/native_all
            src/compositions
            src/plugins
            src/lib/nogc_sync_mut/sffi
            src/app/cli
            src/app/hash
            src/os/port/llvm
            test/01_unit/scripts
            test/01_unit/os/port
            test/fixtures/xray
            test/05_perf/ctype
            test/perf/ctype
            tools/counterpart/sdk/c
          sparse-checkout-cone-mode: true

      - name: Provision xxhsum and verify LLVM toolchain
        shell: sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          _fetch_pid=""
          _fetch_rc=0
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            case "$PR_COMMITS" in ''|*[!0-9]*) PR_COMMITS=1 ;; esac
            (
              git fetch --no-tags --no-recurse-submodules --quiet --depth="$(( PR_COMMITS + 41 ))" origin "$BASE_SHA" "$HEAD_SHA"
            ) >"$RUNNER_TEMP/pr-fetch.log" 2>&1 </dev/null &
            _fetch_pid=$!
          fi
          _llvm_dir=""
          _best_ver=0
          for _d in /usr/lib/llvm-*/bin; do
            [ -d "$_d" ] || continue
            _v=${_d#/usr/lib/llvm-}; _v=${_v%/bin}
            case "$_v" in ''|*[!0-9]*) continue ;; esac
            if [ "$_v" -gt "$_best_ver" ] && [ -x "$_d/llvm-nm" ]; then
              _best_ver=$_v
              _llvm_dir=$_d
            fi
          done
          if [ -n "$_llvm_dir" ]; then
            case ":$PATH:" in *":$_llvm_dir:"*) ;; *) PATH="$_llvm_dir:$PATH" ;; esac
            printf '%s\n' "$_llvm_dir" >> "$GITHUB_PATH"
            export PATH
          fi
          pkgs=""
          command -v xxhsum >/dev/null 2>&1 || pkgs="$pkgs xxhash"
          command -v clang >/dev/null 2>&1 || pkgs="$pkgs clang"
          command -v ld.lld >/dev/null 2>&1 || pkgs="$pkgs lld"
          sh scripts/check/check-runtime-link-completeness.shs --resolve-only >/dev/null 2>&1 || pkgs="$pkgs llvm"
          if [ -n "$pkgs" ]; then
            if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
              ( sudo apt-get update -qq -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- &&
                sudo apt-get install -y -qq --no-install-recommends $pkgs ) ||
              ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $pkgs )
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends $pkgs
            fi
          fi
          xxhsum -V
          sh scripts/check/check-runtime-link-completeness.shs --resolve-only
          if [ -n "$_fetch_pid" ]; then
            wait "$_fetch_pid" || _fetch_rc=$?
            if [ "$_fetch_rc" -ne 0 ]; then
              cat "$RUNNER_TEMP/pr-fetch.log" 2>/dev/null || true
              echo "fast-gates: could not fetch the PR endpoints"
              exit 1
            fi
            : > "$RUNNER_TEMP/pr-endpoints-fetched"
          fi

      - name: Fast push-tier and contract gates on the PR range
        shell: sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # `shell: sh` is `sh -e`; without this a red runner exit aborts the
          # step before background subshells are waited and checked below.
          set +e
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            case "$PR_COMMITS" in ''|*[!0-9]*) PR_COMMITS=1 ;; esac
            if [ ! -f "$RUNNER_TEMP/pr-endpoints-fetched" ]; then
              git fetch --no-tags --no-recurse-submodules --quiet --depth="$(( PR_COMMITS + 41 ))" origin "$BASE_SHA" "$HEAD_SHA" ||
                  { echo "fast-gates: could not fetch the PR endpoints"; exit 1; }
            fi
            if [ ! -s scripts/check/private_import_baseline.txt ]; then
              echo "fast-gates: private-import baseline is missing or empty"
              exit 1
            fi
          fi

          _bg_fail=0
          _unified_pid=""

          (
            sh scripts/check/check-llvm-nm-resolve-selftest.shs
          ) >"$RUNNER_TEMP/fg-llvm-nm.log" 2>&1 </dev/null &
          _pid_llvm_nm=$!

          (
            sh scripts/check/check-pure-provider-runtime-capsule.shs --selftest
          ) >"$RUNNER_TEMP/fg-capsule.log" 2>&1 </dev/null &
          _pid_capsule=$!

          (
            sh scripts/check/check-bootstrap-sandbox-copy-closure.shs
          ) >"$RUNNER_TEMP/fg-copy-closure.log" 2>&1 </dev/null &
          _pid_copy_closure=$!

          (
            sh scripts/check/check-land-target-range.shs
          ) >"$RUNNER_TEMP/fg-land-range.log" 2>&1 </dev/null &
          _pid_land_range=$!

          _run_unified=0
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            _run_unified=1
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(bin|config|release|scripts|\.github|doc/04_architecture/compiler/plugin_arch|test/01_unit/scripts)/'; then
            _run_unified=1
          fi
          if [ "$_run_unified" -eq 1 ]; then
            (
              set -e
              sh scripts/check/check-bootstrap-unified-scripts-contract.shs --selftest
              sh scripts/check/check-bootstrap-unified-scripts-contract.shs --require-unit-suites
            ) >"$RUNNER_TEMP/fg-unified.log" 2>&1 </dev/null &
            _unified_pid=$!
          else
            echo "fast-gates: no bootstrap/script/config/workflow paths changed in range; skipping standalone duplicate unified-contract sweep"
          fi

          # One runner, one manifest, for both local and remote (goal item 5,
          # WP3): this used to be 9 hardcoded `run_gate` lines that had
          # drifted from the pre-push `local` tier (rust-dup --rev vs --range,
          # no linux-phase2). --manifest-rev "$BASE_SHA" reads
          # config/check/must_check_gates.sdn from BASE, not from the PR's
          # own head, so a PR cannot rewrite the manifest ROW LIST or its
          # command TEXT (which script to run, with which placeholders) to
          # admit itself. Same trust root check-pr-fast.shs already uses for
          # its own manifest row (its V5 selftest fixture) and the same
          # shape as code-idiom-receipt.yml's pull_request_target-from-BASE
          # receipt-skip decision.
          #
          # RESIDUAL GAP, stated plainly rather than implied away (2026-09-24
          # review finding): pinning the MANIFEST to BASE does not pin the
          # CODE that executes it. actions/checkout above checks out the
          # PR's HEAD (the whole point of testing the PR), so
          # run-gate-tier.shs itself and every `sh scripts/check/<gate>.shs`
          # the manifest's command text names are read from the WORKING TREE
          # at HEAD, not from BASE. A PR can still weaken a gate SCRIPT
          # (make check-no-conflict-tree-push.shs a no-op, or edit
          # run-gate-tier.shs to always report pass) even though it cannot
          # touch which rows run or their command text. This mirrors the
          # same gap in the existing pre-push hook (check-push-must-pass.shs
          # also runs from the working tree) and is not new here -- it is
          # NOT closed by this step, and this comment must not be read as
          # claiming "a PR cannot edit the gate that admits it": it can edit
          # the gate, just not the manifest that selects which gates run.
          # Closing the script-side gap would need materializing
          # scripts/check/*.shs from BASE too (like pr-fast-check.yml does
          # for check-pr-fast.shs itself) -- left as follow-up, not done
          # here.
          #
          # Consequence of the manifest-side pin, stated rather than hidden:
          # a PR that itself edits must_check_gates.sdn (such as the WP3
          # landing PR that introduced this step) is checked against the
          # PRE-CHANGE manifest at its own base and may still show the
          # base's failure mode; that PR lands like any other required-check
          # exception (documented admin-bypass merge path,
          # .claude/rules/vcs.md), not by weakening this trust root. Every
          # ORDINARY PR after that lands sees the fixed manifest already in
          # place at its base and is unaffected.
          #
          # --tier local selects the 6 local rows plus the push tier's 4
          # blocking rows — exactly the "local tier == required remote check"
          # rule (see the runner's header and must_check_gates.sdn's `local`
          # tier comment). --range/--ref/--base are always the live PR
          # endpoints from THIS event, never from the manifest file, so a row
          # runs against the real PR content even though its COMMAND TEXT
          # came from BASE.
          _tier_rc=0
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            PRIVATE_IMPORT_BASE="$BASE_SHA" sh scripts/check/run-gate-tier.shs --tier local \
                --range "$BASE_SHA..$HEAD_SHA" --ref "$HEAD_SHA" --base "$BASE_SHA" \
                --manifest-rev "$BASE_SHA" --jobs 16 --budget 240
            _tier_rc=$?
          else
            echo "fast-gates: not a pull_request event, no PR range; the extended job is the lane for push/main"
          fi

          wait_bg() {
            _wb_pid=$1; _wb_name=$2; _wb_log=$3
            [ -n "$_wb_pid" ] || return 0
            wait "$_wb_pid"
            _wb_rc=$?
            echo "=== $_wb_name (exit $_wb_rc) ==="
            cat "$_wb_log" 2>/dev/null || true
            if [ "$_wb_rc" -ne 0 ]; then
              _bg_fail=1
            fi
          }

          wait_bg "$_pid_llvm_nm" "LLVM nm resolver self-test" "$RUNNER_TEMP/fg-llvm-nm.log"
          wait_bg "$_pid_capsule" "Pure provider runtime capsule admission contract controls" "$RUNNER_TEMP/fg-capsule.log"
          wait_bg "$_pid_copy_closure" "Bootstrap sandbox copy-list closure gate" "$RUNNER_TEMP/fg-copy-closure.log"
          wait_bg "$_pid_land_range" "Landing target range regression" "$RUNNER_TEMP/fg-land-range.log"
          wait_bg "$_unified_pid" "Unified bootstrap build-scripts contract gate" "$RUNNER_TEMP/fg-unified.log"

          if [ "$_tier_rc" -ne 0 ]; then
            echo "fast-gates: one or more fast gates failed or errored (exit $_tier_rc)"
            exit 1
          fi
          if [ "$_bg_fail" -ne 0 ]; then
            echo "fast-gates: one or more background contract gates failed"
            exit 1
          fi
