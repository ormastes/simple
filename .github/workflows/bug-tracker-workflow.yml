name: Bug Tracker Workflow Tests

on:
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'scripts/check/bug-claim.shs'
      - 'scripts/check/reseal-sdn-crc32.shs'
      - 'scripts/check/sdn-seal-lib.shs'
      - '.github/workflows/bug-tracker-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/check/bug-claim.shs
            /scripts/check/reseal-sdn-crc32.shs
            /scripts/check/sdn-seal-lib.shs
            /config/check/sdn_seal_policy.sdn
      - name: Check shell syntax and workflow fixtures
        run: |
          sh -n scripts/check/bug-claim.shs
          sh scripts/check/bug-claim.shs --selftest
