name: Provisional Windows 93f7 children
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-93f7-phase3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  products:
    strategy:
      fail-fast: false
      matrix:
        role: [phase3, early-full-cli]
    name: Windows 93f7 ${{ matrix.role }}
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 93f7b103237cbd065b12b04fb4af7b8b39f0a7de
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Qualified parent intake and canonical Windows Phase3
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_ROLE: ${{ matrix.role }}
        run: python ../control/scripts/check/windows-93f7-phase3/controller.py
      - name: Preserve actual product, Hello, authorities and terminal failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-93f7-${{ matrix.role }}-${{ github.run_id }}
          path: |
            s/build/windows-93f7-${{ matrix.role }}-evidence/*.json
            s/build/windows-93f7-${{ matrix.role }}-evidence/*.env
            s/build/windows-93f7-${{ matrix.role }}-evidence/*.stdout
            s/build/windows-93f7-${{ matrix.role }}-evidence/*.stderr
            s/build/windows-93f7-${{ matrix.role }}-evidence/native-proof/
            s/build/windows-93f7-${{ matrix.role }}-evidence/cache/
            s/build/windows-93f7-${{ matrix.role }}-evidence/tmp/
            s/build/windows-93f7-${{ matrix.role }}-evidence/smoke/
            s/build/windows-93f7-${{ matrix.role }}/
            s/build/scv/
            s/.simple/scv/
            s/test/bootstrap_qualification_93f7/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
