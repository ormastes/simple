name: True 656fa39e Phase4 from verified Phase3
run-name: True Phase4 from Phase3 run ${{ inputs.parent_run }}
on:
  workflow_dispatch:
    inputs:
      parent_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: true-phase4-656fa39e-${{ github.ref }}-${{ inputs.parent_run }}
  cancel-in-progress: false
jobs:
  full-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          path: source
          persist-credentials: false
      - name: Native prerequisites
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev xxhash
      - name: Verify immutable real Phase3 and build true full CLI
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN: ${{ inputs.parent_run }}
        run: python3 control/scripts/check/linux-656fa39e/phase3-parent.py --parent-run "$PARENT_RUN" --source source --intake parent-intake --output child-evidence
      - name: Retain bounded canonical source snapshot metadata
        if: always()
        run: |
          if [ -f source/scripts/bootstrap/capture-ladder-scv-evidence.py ]; then
            mkdir -p child-evidence
            python3 source/scripts/bootstrap/capture-ladder-scv-evidence.py source child-evidence/scv-source-metadata || printf '%s\n' 'SCV capture failed; no authority inferred' > child-evidence/scv-capture-failure.txt
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-656fa39e-true-phase4-${{ github.run_id }}
          path: |
            parent-intake/*.json
            child-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
