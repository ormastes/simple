name: Exact 656fa39e provisional Linux children
run-name: 656fa39e children from manual parent 45326410090
on:
  workflow_dispatch:
    inputs:
      artifact_pins:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: linux-656fa39e-children-${{ github.ref }}
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          path: source
          persist-credentials: false
      - name: Native prerequisites
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev xxhash
      - name: Exact parent intake and fresh bounded native Hello
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PINS: ${{ inputs.artifact_pins }}
        run: python3 control/scripts/check/linux-656fa39e/control.py intake --source source --output qualified-parent --artifact-pins "$ARTIFACT_PINS"
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: qualified-656fa39e-parent-${{ github.run_id }}
          path: qualified-parent/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: failed-656fa39e-intake-${{ github.run_id }}
          path: qualified-parent/
          retention-days: 14
  children:
    needs: intake
    strategy:
      fail-fast: false
      matrix:
        role: [phase3, full-cli]
    name: New 656fa39e ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          path: source
          persist-credentials: false
      - name: Native prerequisites
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev xxhash
      - uses: actions/download-artifact@v7
        with:
          name: qualified-656fa39e-parent-${{ github.run_id }}
          path: qualified-parent
      - name: Independent provisional product owner and qualification
        env:
          CHILD_ROLE: ${{ matrix.role }}
        run: python3 control/scripts/check/linux-656fa39e/control.py child --role "$CHILD_ROLE" --source source --parent qualified-parent --output child-evidence
      - name: Retain bounded canonical source snapshot metadata
        if: always()
        run: |
          if [ -f source/scripts/bootstrap/capture-ladder-scv-evidence.py ]; then
            mkdir -p child-evidence
            python3 source/scripts/bootstrap/capture-ladder-scv-evidence.py source child-evidence/scv-source-metadata || printf '%s\n' 'SCV metadata capture failed; no authority inferred' > child-evidence/scv-capture-failure.txt
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-656fa39e-${{ matrix.role }}-${{ github.run_id }}
          path: child-evidence/
          if-no-files-found: error
          retention-days: 14
