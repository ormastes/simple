name: Windows renamed native-build image proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-image:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 7caac0600ded6dfae8882ce3eaf0a0038288e92f
          fetch-depth: 0
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile actual kernel owner and execute renamed native fixture
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/windows-self-image-proof/controller.py
      - name: Preserve real assertions, identities and first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-self-image-${{ github.run_id }}
          path: |
            s/build/windows-self-image-proof/*.json
            s/build/windows-self-image-proof/*.env
            s/build/windows-self-image-proof/*.stdout
            s/build/windows-self-image-proof/*.stderr
            s/build/windows-self-image-proof/*.imports
            s/build/windows-self-image-proof/run-renamed.py
            s/build/windows-self-image-proof/renamed producer/
            s/build/windows-self-image-proof/cache/
            s/build/native-objects-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
