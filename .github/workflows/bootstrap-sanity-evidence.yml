name: Windows retained full-link baseline comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  retained-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45254122525
          name: windows-stage2-link-inputs-d3422d488768713c1e6153bd2a7766ff22cbbd23
          path: retained-link
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45254122525
          name: native-authority-mingw-x86_64-d3422d488768713c1e6153bd2a7766ff22cbbd23
          path: retained-native
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45254122525
          name: binary-windows-mingw-x86_64-d3422d488768713c1e6153bd2a7766ff22cbbd23
          path: retained-reference
      - name: Pin canonical source and final-link toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin d3422d488768713c1e6153bd2a7766ff22cbbd23
          name=llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64
          gh release download 20260922 --repo mstorsjo/llvm-mingw --pattern "$name.tar.xz" --dir "$RUNNER_TEMP"
          printf 'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  %s\n' "$RUNNER_TEMP/$name.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "PROOF_TOOLCHAIN=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
      - name: Original-object baseline only, no module compilation
        run: |
          mkdir -p build
          perl scripts/resource/process-tree-rss-watchdog.pl --max-rss-kib=4194304 --interval-ms=100 --timeout-seconds=600 --receipt=build/windows-baseline-owner.env -- python scripts/check/replay-windows-cross-import-baseline.py --retained retained-link --native retained-native/libsimple_native_all.a --reference retained-reference/simple_stage2.exe --cc "$PROOF_TOOLCHAIN/bin/x86_64-w64-mingw32-clang" --nm "$PROOF_TOOLCHAIN/bin/llvm-nm" --out build/windows-link-baseline > build/windows-baseline.stdout 2> build/windows-baseline.stderr
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-link-baseline-${{ github.sha }}
          path: |
            build/windows-link-baseline/
            build/windows-baseline-owner.env
            build/windows-baseline.stdout
            build/windows-baseline.stderr
          retention-days: 14
