name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-snapshot-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          run-id: 45199934467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-seed
      - name: Diagnose only unresolved real-repository snapshot
        shell: bash
        run: |
          mkdir -p snapshot-evidence
          chmod +x validation-seed/simple
          git rev-parse HEAD > snapshot-evidence/source.txt
          sha256sum validation-seed/simple src/app/bug/workaround_store.spl src/lib/nogc_sync_mut/database/bug.spl doc/08_tracking/bug/bug_db.sdn scripts/check/workaround-real-snapshot-diagnostic.spl > snapshot-evidence/inputs.sha
          export SIMPLE_LIB="$PWD/src" SIMPLE_PROJECT_ROOT="$PWD"
          set +e
          (ulimit -v 2097152; /usr/bin/time -v timeout --kill-after=5 300 validation-seed/simple run scripts/check/workaround-real-snapshot-diagnostic.spl) > snapshot-evidence/stdout 2> snapshot-evidence/stderr
          rc=$?
          printf 'exit_status=%s\n' "$rc" > snapshot-evidence/result.env
          set -e
          sha256sum --check snapshot-evidence/inputs.sha > snapshot-evidence/inputs-revalidated.txt
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-snapshot-diagnostic-${{ github.sha }}
          path: snapshot-evidence
