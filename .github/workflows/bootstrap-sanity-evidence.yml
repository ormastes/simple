name: Reconstructed single file-worker memory attribution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  unit-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false
          sparse-checkout: scripts/check
      - uses: actions/checkout@v5
        with:
          ref: fd366d2a3068e9fc0d2ba7af0b915432d56b88c9
          path: source
          persist-credentials: false
      - name: Bind retained incident artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostic-intake
          gh api repos/${{ github.repository }}/actions/runs/45255561665 > diagnostic-intake/run.json
          gh api repos/${{ github.repository }}/actions/artifacts/14858477855 > diagnostic-intake/artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('diagnostic-intake/run.json').read_text())
          artifact=json.loads(Path('diagnostic-intake/artifact.json').read_text())
          assert run['head_sha']=='5ddb855487db3538544d6edf4131f98ca1cdda81'
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert artifact['workflow_run']['id']==45255561665 and not artifact['expired']
          assert artifact['digest']=='sha256:939af004a35db7b2d58da0dd9172a08f4e44662ec9144763dfb37a20f1edcfcb'
          PY
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14858477855'
          run-id: '45255561665'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14839362739'
          run-id: '45205044707'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source/build/early-full-cli-fd366/parent
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14833542613'
          run-id: '45205044707'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source/build/early-full-cli-fd366/runtime
      - name: Native observer tools
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y gdb clang lld llvm libunwind-dev xxhash
      - name: One reconstructed unit under finite owner
        run: python control/scripts/check/full-cli-unit-memory-diagnostic.py
      - name: Retain diagnostic evidence regardless of outcome
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reconstructed-full-cli-unit-memory
          path: |
            diagnostic-intake
            source/build/unit-memory-diagnostic
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
