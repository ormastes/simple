name: Small frozen 656 surface attribution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {path: control, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          path: source
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          persist-credentials: false
      - name: Observer prerequisites
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y gdb clang lld llvm
      - name: One bounded small source-project attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/scripts/check/linux-656fa39e/surface-probe.py
      - name: Preserve original failure and boundary evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surface-attribution-${{ github.run_id }}
          path: |
            probe-evidence/*.json
            probe-evidence/*.env
            probe-evidence/*.log
            probe-evidence/*.version
            probe-evidence/cache/
            probe-evidence/parent/parent.json
            probe-evidence/parent/transfer-*.json
            probe-evidence/parent/parent-native-hello/*.json
            probe-evidence/parent/parent-native-hello/*.env
            probe-project/src/
            probe-project/build/scv/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
