name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coff-partial-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coff-link-proof-e57c1ca6116907596f22f2c28dc4f5193bd1ce5a
          run-id: 45239555743
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-preflight
      - name: Install pinned Clang and GNU PE BFD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends binutils-mingw-w64-x86-64
          name=llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64
          gh release download 20260922 --repo mstorsjo/llvm-mingw --pattern "$name.tar.xz" --dir "$RUNNER_TEMP"
          printf 'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  %s\n' "$RUNNER_TEMP/$name.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "COFF_TOOLCHAIN=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Exercise production selector and retained objects
        shell: bash
        run: |
          ulimit -v 2097152
          timeout --kill-after=5 180 python scripts/check/check-coff-projection.py \
            --cc "$COFF_TOOLCHAIN/bin/x86_64-w64-mingw32-clang" \
            --retained retained-preflight --out build/coff-link-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coff-link-proof-${{ github.sha }}
          path: build/coff-link-proof/
  execute-projected-providers:
    needs: coff-partial-link
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coff-link-proof-${{ github.sha }}
          path: evidence
      - name: Execute real fallback and overriding providers
        shell: pwsh
        run: |
          $names = @('projected.exe', 'internal-fallback.exe', 'fixture_root-override.exe', 'dependency-override.exe')
          $results = @()
          foreach ($name in $names) {
            $path = Join-Path $PWD "evidence/$name"
            $proc = Start-Process -FilePath $path -PassThru -WindowStyle Hidden
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "Timed out: $name" }
            $results += @{name=$name; exit=$proc.ExitCode; sha256=(Get-FileHash $path -Algorithm SHA256).Hash}
            if ($proc.ExitCode -ne 0) { throw "Numerical provider assertion failed: $name exit $($proc.ExitCode)" }
          }
          $results | ConvertTo-Json | Set-Content provider-execution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coff-provider-execution-${{ github.sha }}
          path: provider-execution.json
