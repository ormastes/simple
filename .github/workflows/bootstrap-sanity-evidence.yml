name: Linux Phase3 retained-cache single-unit recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      SOURCE: fd366d2a3068e9fc0d2ba7af0b915432d56b88c9
      PARENT: phase2
      PRODUCT: compiler
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fd366d2a3068e9fc0d2ba7af0b915432d56b88c9
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14839362739'
          merge-multiple: true
          run-id: '45205044707'
          github-token: ${{ github.token }}
          path: build/continuation/parent
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14833542613'
          merge-multiple: true
          run-id: '45205044707'
          github-token: ${{ github.token }}
          path: build/continuation/runtime
      - name: Verify retained recovery provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/45236678199 > "$RUNNER_TEMP/prior-run.json"
          gh api repos/${{ github.repository }}/actions/artifacts/14851476052 > "$RUNNER_TEMP/prior-artifact.json"
          python - <<'PY'
          import json,os
          root=os.environ['RUNNER_TEMP']
          run=json.load(open(root+'/prior-run.json')); artifact=json.load(open(root+'/prior-artifact.json'))
          assert run['head_sha']=='3dd1f29ba98a3da77e879c8407e5c606bc8ca597'
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert artifact['workflow_run']['id']==45236678199 and not artifact['expired']
          assert artifact['name']=='evidence-linux-phase3-file-recovery'
          assert artifact['digest']=='sha256:73e0753e9b565af0476804387167419cb794388f96d2a1379e14176c718fa6d3'
          PY
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14851476052'
          merge-multiple: true
          run-id: '45236678199'
          github-token: ${{ github.token }}
          path: .
      - name: Prepare native tools
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev xxhash
      - name: Verify parent and build child
        shell: bash
        run: |
          set -euo pipefail
          dir="$PWD/build/continuation"
          mkdir -p "$dir/evidence-$GITHUB_RUN_ID" "$dir/product" "$dir/cache"
          test "$(git rev-parse HEAD)" = "$SOURCE"
          cp "$RUNNER_TEMP/prior-run.json" "$RUNNER_TEMP/prior-artifact.json" "$dir/evidence-$GITHUB_RUN_ID/"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path.cwd(); prior=root/'build/continuation/evidence'
          assert str(root)=='/home/runner/work/simple/simple', 'retained absolute cache root differs'
          assert (prior/'lineage').read_text().splitlines()==['fd366d2a3068e9fc0d2ba7af0b915432d56b88c9','phase2','compiler']
          fields=dict(line.split('=',1) for line in (prior/'build.env').read_text().splitlines())
          assert fields['status']=='rss-cap-exceeded' and fields['exit_status']=='88' and fields['quiescent']=='1'
          hashes=[line.split()[0] for line in (prior/'inputs.sha').read_text().splitlines()]
          assert hashes==['f130dde9f91955186ae5e9121917e121d99542871f80e5dc7dd6b8a718c447a3','7ceed2e9b0edbf719a6fb4422578d2e322e7ea33f71a9cf700fc8f16df2208ae']
          ledger=root/'build/continuation/cache/hir'; records=[]; empty=0
          for p in (ledger/'mir-queue-2787-0').glob('*.object'):
              lines=p.read_text().splitlines()
              if not lines[0]:
                  assert lines[1:3]==['0','0']; empty+=1; continue
              obj=Path(lines[0]); assert obj.is_relative_to(root/'build/continuation/cache')
              data=obj.read_bytes(); assert data[:5]==b'\x7fELF\x02' and int.from_bytes(data[18:20],'little')==62
              records.append({'path':str(obj),'sha256':hashlib.sha256(data).hexdigest(),'record_sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(records)==96 and empty==16
          evidence=root/('build/continuation/evidence-'+os.environ['GITHUB_RUN_ID'])
          (evidence/'retained-cache.json').write_text(json.dumps({'scope':'cache candidates only; current owner must re-admit','objects':records,'zero_function_records':empty},indent=2))
          (evidence/'prior-ledger-directories.json').write_text(json.dumps([p.name for p in ledger.iterdir() if p.is_dir() and 'queue-' in p.name]))
          PY
          cd "$dir/runtime"
          sha256sum -c runtime-authority.sha256
          cd "$dir/parent"
          if [[ $PARENT == phase2 ]]; then
            exe="$PWD/simple_stage2"
            echo 'f130dde9f91955186ae5e9121917e121d99542871f80e5dc7dd6b8a718c447a3  simple_stage2' | sha256sum -c -
          else
            sha256sum -c SHA256SUMS
            exe="$PWD/simple"
            test -s hello-passed
          fi
          chmod +x "$exe"
          cd "$GITHUB_WORKSPACE"
          export SIMPLE_BINARY="$exe" SIMPLE_RUNTIME_PATH="$dir/runtime" SIMPLE_NO_STUB_FALLBACK=1
          export SIMPLE_SCV_INVENTORY_COLD_INIT=1 SIMPLE_NATIVE_BUILD_THREADS=1
          common=(--backend llvm --target x86_64-unknown-linux-gnu --runtime-path "$dir/runtime" --runtime-bundle core-c-bootstrap --threads 1 --source src/compositions/kernel_llvm_cranelift --source src/compositions/cuda_disabled --source src/compiler --source src/app --source src/lib)
          if [[ $PRODUCT == compiler ]]; then
            export SIMPLE_BOOTSTRAP=1 SIMPLE_BOOTSTRAP_STAGE3=1 SIMPLE_FILE_WORKERS=1 SIMPLE_FILE_WORKER_SINGLE_LOW_MEMORY=1 SIMPLE_FILE_WORKER_BATCH=4 SIMPLE_PARSE_SHARDING=1
            unset SIMPLE_BOOTSTRAP_WHOLE_PROGRAM SIMPLE_HIR_SHARDING SIMPLE_MIR_SHARDING
            export SIMPLE_FRONTEND_CACHE=1 SIMPLE_HIR_CACHE=1 SIMPLE_NATIVE_ARENA_DECLS=1
            export SIMPLE_FRONTEND_CACHE_DIR="$dir/cache/frontend" SIMPLE_HIR_CACHE_DIR="$dir/cache/hir"
            export SIMPLE_PROJECT_ROOT="$PWD" SIMPLE_LIB="$PWD/src" TMPDIR="$dir/tmp"
            export SIMPLE_KEEP_NATIVE_OBJS=1 SIMPLE_COMPILER_PHASE_PROFILE=1
            mkdir -p "$dir/tmp"
            entry=src/app/cli/bootstrap_main.spl
            output="$dir/product/simple"
          else
            export SIMPLE_BOOTSTRAP_STAGE3=0 SIMPLE_BOOTSTRAP_STAGE4=0
            common+=(--source src/os --source src/plugins --source src/package_ownership --source src/compositions --profile=prod --release --strip --managed-build-phase=phase4 --opt-level=standard)
            entry=src/app/mcp/main.spl
            output="$dir/product/simple_mcp_server"
          fi
          args=(native-build "${common[@]}" --entry-closure --entry "$entry" --mode dynload --low-memory --cache-dir "$dir/cache" --output "$output")
          printf '%q ' "$exe" "${args[@]}" > "$dir/evidence-$GITHUB_RUN_ID/argv"
          sha256sum "$exe" "$dir/runtime/libsimple_native_all.a" > "$dir/evidence-$GITHUB_RUN_ID/inputs.sha"
          printf '%s\n' "$SOURCE" "$PARENT" "$PRODUCT" > "$dir/evidence-$GITHUB_RUN_ID/lineage"
          grep -E 'MemTotal|MemAvailable' /proc/meminfo > "$dir/evidence-$GITHUB_RUN_ID/memory"
          available=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
          cap=$((available * 3 / 4))
          test "$cap" -ge 10485760
          export SIMPLE_SHARD_TREE_MEMORY_BUDGET_KIB="$cap" SIMPLE_PROCESS_TREE_RSS_CAP_KIB="$cap"
          export SIMPLE_BUILD_MEMORY_RESERVE_BYTES=1073741824
          printf 'available_kib=%s\ncap_kib=%s\nreserve_bytes=1073741824\nthreads=1\nbatch_modules=4\nroute=explicit-single-unit-per-file\nworker_price=canonical-auto\n' "$available" "$cap" > "$dir/evidence-$GITHUB_RUN_ID/reservation.env"
          perl scripts/resource/process-tree-rss-watchdog.pl --max-rss-kib="$cap" --timeout-seconds=18500 --receipt="$dir/evidence-$GITHUB_RUN_ID/build.env" -- "$exe" "${args[@]}" > "$dir/evidence-$GITHUB_RUN_ID/build.log" 2>&1 || { tail -35 "$dir/evidence-$GITHUB_RUN_ID/build.log"; exit 1; }
          test -s "$output"
          sha256sum -c "$dir/evidence-$GITHUB_RUN_ID/inputs.sha"
          if [[ $PRODUCT == compiler ]]; then
            unset SIMPLE_BOOTSTRAP SIMPLE_BOOTSTRAP_STAGE3 SIMPLE_BOOTSTRAP_WHOLE_PROGRAM SIMPLE_STAGE3_STREAMING_SURFACES SIMPLE_FILE_WORKERS SIMPLE_FILE_WORKER_SINGLE_LOW_MEMORY SIMPLE_FILE_WORKER_BATCH SIMPLE_PARSE_SHARDING
            unset SIMPLE_FRONTEND_CACHE_DIR SIMPLE_HIR_CACHE_DIR SIMPLE_SHARD_TREE_MEMORY_BUDGET_KIB SIMPLE_PROCESS_TREE_RSS_CAP_KIB
            export SIMPLE_BINARY="$output"
            HW_BACKEND=llvm HW_THREADS=1 HW_BUILD_TIMEOUT_SECONDS=300 perl scripts/resource/process-tree-rss-watchdog.pl --max-rss-kib=4194304 --timeout-seconds=360 --receipt="$dir/evidence-$GITHUB_RUN_ID/hello-owner.env" -- sh scripts/check/check-stage2-hello-world-native-build.shs --candidate "$output" > "$dir/evidence-$GITHUB_RUN_ID/hello.log" 2>&1 || { tail -20 "$dir/evidence-$GITHUB_RUN_ID/hello.log"; exit 1; }
            sha256sum "$dir/evidence-$GITHUB_RUN_ID/hello.log" > "$dir/product/hello-passed"
          else
            printf '%s\n' '{"jsonrpc":"2.0","id":17,"method":"ping"}' | timeout 45 "$output" > "$dir/evidence-$GITHUB_RUN_ID/ping.out"
            jq -es 'any(.[]; .id == 17 and .result == {})' "$dir/evidence-$GITHUB_RUN_ID/ping.out"
          fi
          cd "$dir/product"
          sha256sum "$(basename "$output")" > SHA256SUMS
          if [[ $PRODUCT == compiler ]]; then sha256sum hello-passed >> SHA256SUMS; fi
      - name: Record current invocation ledger namespace even on failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,collections
          root=Path('build/continuation'); evidence=root/('evidence-'+os.environ['GITHUB_RUN_ID'])
          before=evidence/'prior-ledger-directories.json'
          if before.exists():
              old=set(json.loads(before.read_text())); rows=[]
              for p in (root/'cache/hir').iterdir():
                  if p.is_dir() and 'queue-' in p.name and p.name not in old:
                      statuses=collections.Counter(q.read_text().splitlines()[0] for q in p.glob('*.terminal'))
                      rows.append({'namespace':p.name,'terminal_counts':dict(statuses)})
              (evidence/'current-ledgers.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'prior_terminals_are_not_current':True,'ledgers':rows},indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-linux-phase3-single-recovery
          path: |
            build/continuation/evidence-*
            build/continuation/cache
            build/continuation/tmp
            build/scv
            .simple/scv
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: linux-phase3-single-recovery
          path: build/continuation/product
          if-no-files-found: error
