name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  float-native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          run-id: 45199934467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-seed
      - uses: actions/download-artifact@v4
        with:
          name: runtime-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          run-id: 45199934467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-runtime
      - name: Install native toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y clang lld llvm libunwind-dev
      - name: Bind source and runtime inputs
        run: |
          mkdir -p validation-evidence
          git rev-parse HEAD > validation-evidence/source.txt
          chmod +x validation-seed/simple
          (cd validation-runtime && sha256sum --check runtime-authority.sha256)
          sha256sum validation-seed/simple validation-runtime/*.a src/compiler/50.mir/_MirLoweringExpr/method_calls_literals.spl > validation-evidence/inputs.sha
      - name: Compile actual patched self-hosted producer
        shell: bash
        run: |
          export SIMPLE_BOOTSTRAP=1 SIMPLE_NATIVE_BUILD_RUST=1 SIMPLE_NO_STUB_FALLBACK=1
          export SIMPLE_SCV_INVENTORY_COLD_INIT=1 SIMPLE_PARSE_SHARDING=0 SIMPLE_KERNEL_K1_POLICY=llvm-cranelift
          export CC=clang
          ulimit -v 6291456
          set +e
          /usr/bin/time -v timeout --kill-after=10 1800 validation-seed/simple native-build \
            --backend cranelift --runtime-bundle core-c-bootstrap --threads 1 --low-memory \
            --source src/compositions/kernel_llvm_cranelift --source src/compositions/cuda_static \
            --source src/compiler --source src/app --source src/lib --source src/plugins \
            --entry-closure --entry src/app/cli/bootstrap_main.spl \
            --runtime-path "$PWD/validation-runtime" --cache-dir "$PWD/validation-cache" \
            -o "$PWD/validation-evidence/simple-patched" \
            > validation-evidence/build.stdout 2> validation-evidence/build.stderr
          result=$?
          printf 'exit_status=%s\n' "$result" > validation-evidence/build.env
          exit "$result"
      - name: Execute production fractional readback with patched producer
        shell: bash
        run: |
          export SIMPLE_BINARY="$PWD/validation-evidence/simple-patched"
          export SIMPLE_RUNTIME_PATH="$PWD/validation-runtime"
          export SIMPLE_BUILD_MEMORY_RESERVE_BYTES=1073741824
          export BUILD_DIR="$PWD/validation-evidence/regression"
          export CC=clang
          ulimit -v 3145728
          sha256sum "$SIMPLE_BINARY" > validation-evidence/producer.sha
          sh scripts/check/check-native-float-field-index-mutation.shs x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-native-validation-${{ github.sha }}
          path: validation-evidence
