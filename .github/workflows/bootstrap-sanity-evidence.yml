name: Bounded native module-surface owner comparison with direct SourceFile imports
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
          sparse-checkout: scripts/check
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ce231b5b898d797c98d44a9b59a4859a7d792a7b
          path: source
          persist-credentials: false
      - name: Bind repaired native producer provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p intake
          gh api repos/${{ github.repository }}/actions/runs/45254614898 > intake/parent-run.json
          gh api repos/${{ github.repository }}/actions/artifacts/14858799081 > intake/parent-artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('intake/parent-run.json').read_text())
          artifact=json.loads(Path('intake/parent-artifact.json').read_text())
          assert run['head_sha']=='ce231b5b898d797c98d44a9b59a4859a7d792a7b'
          assert run['status']=='completed' and run['conclusion']=='success'
          assert artifact['workflow_run']['id']==45254614898 and not artifact['expired']
          assert artifact['digest']=='sha256:9e2fd5aac71751d7871c3d2e7209cdc506c6dffd285447b5bb0fdb0dbd4b43ad'
          PY
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14858799081'
          run-id: '45254614898'
          github-token: ${{ github.token }}
          path: intake/parent
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14833542613'
          run-id: '45205044707'
          github-token: ${{ github.token }}
          path: intake/runtime
      - name: Native fixture tools
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev xxhash
      - name: Retain verified previous partial cache candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14866627876 > intake/prior-artifact.json
          gh api repos/${{ github.repository }}/actions/artifacts/14866627876/zip > intake/prior.zip
          echo 'd11481bc11ff8a3d84386e56892739f3fedfcceb95f36f280bafdbb4b00caf19  intake/prior.zip' | sha256sum --check --strict
          python - <<'PY'
          import json
          from pathlib import Path
          artifact=json.loads(Path('intake/prior-artifact.json').read_text())
          assert artifact['workflow_run']['id']==45271594927 and not artifact['expired']
          assert artifact['workflow_run']['head_sha']=='e07541cc376cd2dde9a1e473a96e98295d4740a5'
          assert artifact['digest']=='sha256:d11481bc11ff8a3d84386e56892739f3fedfcceb95f36f280bafdbb4b00caf19'
          PY
      - name: One paired bounded real-owner fixture cohort
        run: python control/scripts/check/freeze-owner-native-probe.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: freeze-owner-native-${{ github.run_id }}
          path: |
            source/build/freeze-owner-probe
            intake/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
