name: Focused bootstrap source contract proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45199934467
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          path: seed
      - name: Execute the repaired Phase1 source spec once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/source-contract-evidence build/source-contract-tmp
          echo 'bd20b7e1378e1d1f45eb5c5d8139d1044145832644db9a2083ae5b15427de4d3  seed/simple' | sha256sum -c -
          chmod +x seed/simple
          git rev-parse HEAD > build/source-contract-evidence/source-revision.txt
          sha256sum seed/simple test/01_unit/app/cli/bootstrap_main_source_spec.spl > build/source-contract-evidence/inputs.sha256
          # Run only the remaining failed case. The other15 cases already passed
          # unchanged in run45242785924; retain this exact-source projection.
          python - <<'PY'
          from pathlib import Path
          source = Path('test/01_unit/app/cli/bootstrap_main_source_spec.spl').read_text()
          prelude = source[:source.index('describe "bootstrap main source":')]
          start = source.index('    it "resolves closure aliases, terminal symbols, and relative modules":')
          end = source.index('    it "loads an explicitly imported command', start)
          selected = prelude + 'describe "bootstrap main source":\n' + source[start:end]
          Path('build/source-contract-evidence/resolver_only_spec.spl').write_text(selected)
          PY
          sha256sum build/source-contract-evidence/resolver_only_spec.spl >> build/source-contract-evidence/inputs.sha256
          export SIMPLE_LIB="$PWD/src" SIMPLE_PROJECT_ROOT="$PWD" SIMPLE_TEST_RUNNER_RUST=1
          export SIMPLE_CACHE="$PWD/build/source-contract-cache" TMPDIR="$PWD/build/source-contract-tmp"
          export SIMPLE_TEST_KEEP_TEMP=1
          set +e
          perl scripts/resource/process-tree-rss-watchdog.pl --rss-cap-mode=enforce --max-rss-kib=2097152 --timeout-seconds=1200 --receipt=build/source-contract-evidence/owner.env -- seed/simple run build/source-contract-evidence/resolver_only_spec.spl --mode=interpreter > build/source-contract-evidence/stdout.log 2> build/source-contract-evidence/stderr.log
          code=$?
          set -e
          echo "$code" > build/source-contract-evidence/exit-code.txt
          tail -n 35 build/source-contract-evidence/stdout.log
          tail -n 15 build/source-contract-evidence/stderr.log
          test "$code" = 0
          grep -q '^status=complete$' build/source-contract-evidence/owner.env
          grep -q '^quiescent=1$' build/source-contract-evidence/owner.env
          grep -Eq '1 examples?, 0 failures?|1 passed, 0 failed' build/source-contract-evidence/stdout.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bootstrap-main-source-spec-proof
          path: |
            build/source-contract-evidence
            build/source-contract-tmp
          retention-days: 7
