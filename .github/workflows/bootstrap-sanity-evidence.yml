name: Bootstrap Sanity Evidence Archive

on:
  pull_request:
    paths:
      - '.github/workflows/bootstrap-sanity-evidence.yml'
      - 'scripts/bootstrap/bootstrap-from-scratch.sh'
      - 'scripts/check/check-bootstrap-sanity-evidence-archive.shs'
      - 'scripts/check/check-bootstrap-stage2-sanity-environment.shs'
  push:
    branches: [main, 'release/**']
    paths:
      - '.github/workflows/bootstrap-sanity-evidence.yml'
      - 'scripts/bootstrap/bootstrap-from-scratch.sh'
      - 'scripts/check/check-bootstrap-sanity-evidence-archive.shs'
      - 'scripts/check/check-bootstrap-stage2-sanity-environment.shs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity-evidence-archive:
    name: Bootstrap sanity evidence archive regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/bootstrap
            scripts/check
            release
            src/app/cli
      - name: Preserve old evidence and refuse collisions before child execution
        shell: sh
        run: sh scripts/check/check-bootstrap-sanity-evidence-archive.shs
      - name: Preserve admission controls across scrub and fresh shell boundaries
        shell: sh
        run: sh scripts/check/check-bootstrap-stage2-sanity-environment.shs
