name: Exact-source ce231 Linux runtime provisioning
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
          sparse-checkout: scripts/check
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ce231b5b898d797c98d44a9b59a4859a7d792a7b
          path: source
          persist-credentials: false
      - name: Install bounded runtime build prerequisites
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y clang lld llvm libunwind-dev
          rustup toolchain install nightly-2026-09-15 --profile minimal
      - name: Build runtime packages only
        run: python control/scripts/check/ce231-runtime-provision.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ce231-linux-runtime-${{ github.run_id }}
          path: |
            runtime-evidence/*
            !runtime-evidence/cargo-target
            !runtime-evidence/cargo-home
            !runtime-evidence/tmp
          retention-days: 7
          if-no-files-found: error
