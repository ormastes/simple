name: Windows merged original-name full caller proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-image:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 2dbda4438f2e974498edb9f45bcb86dc7d9dd5c7
          fetch-depth: 0
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile linked fixture through actual merged worker and execute PE
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/windows-2db-caller-proof/controller.py
      - name: Preserve real assertions, identities and first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-2db-caller-${{ github.run_id }}
          path: |
            s/build/windows-2db-caller-proof/*.json
            s/build/windows-2db-caller-proof/*.env
            s/build/windows-2db-caller-proof/*.stdout
            s/build/windows-2db-caller-proof/*.stderr
            s/build/windows-2db-caller-proof/*.imports
            s/build/windows-2db-caller-proof/compile.sh
            s/build/windows-2db-caller-proof/linked/
            s/build/windows-2db-caller-proof/cache/
            s/build/native-objects-*/
            s/build/scv/
            s/.simple/scv/
            s/test/fixtures/windows_2db_full_caller/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
