name: Unit tail-if native fixture evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-unit-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fd366d2a3068e9fc0d2ba7af0b915432d56b88c9
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14839362739'
          run-id: '45205044707'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/unit-tail/compiler
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: '14833542613'
          run-id: '45205044707'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: build/unit-tail/runtime
      - name: Prepare LLVM tools
        run: sudo -n apt-get update -qq && sudo -n apt-get install -y clang lld llvm libunwind-dev
      - name: Compile and run original fixture with actual Simple Phase2
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/unit-tail"
          mkdir -p "$root/evidence" "$root/product" "$root/tmp"
          (cd "$root/compiler" && echo 'f130dde9f91955186ae5e9121917e121d99542871f80e5dc7dd6b8a718c447a3  simple_stage2' | sha256sum -c -)
          (cd "$root/runtime" && sha256sum -c runtime-authority.sha256)
          git rev-parse HEAD > "$root/evidence/source"
          test "$(git rev-parse HEAD)" = fd366d2a3068e9fc0d2ba7af0b915432d56b88c9
          sha256sum "$root/compiler/simple_stage2" "$root/runtime"/*.a test/fixtures/native_const_void_join/*.spl > "$root/evidence/inputs.sha"
          chmod +x "$root/compiler/simple_stage2"
          export SIMPLE_BINARY="$root/compiler/simple_stage2" SIMPLE_RUNTIME_PATH="$root/runtime"
          export SIMPLE_NO_STUB_FALLBACK=1 SIMPLE_KEEP_NATIVE_OBJS=1 SIMPLE_KEEP_LLVM_IR=1 SIMPLE_BOOTSTRAP_WHOLE_PROGRAM=1
          export SIMPLE_PROJECT_ROOT="$PWD" SIMPLE_LIB="$PWD/src" TMPDIR="$root/tmp" CC=clang
          unset SIMPLE_NATIVE_BUILD_RUST SIMPLE_TEST_RUNNER_RUST SIMPLE_BOOTSTRAP
          set +e
          perl scripts/resource/process-tree-rss-watchdog.pl --max-rss-kib=2097152 --timeout-seconds=600 --receipt="$root/evidence/compile-owner.env" -- "$SIMPLE_BINARY" native-build --backend llvm --target x86_64-unknown-linux-gnu --runtime-path "$SIMPLE_RUNTIME_PATH" --runtime-bundle core-c-bootstrap --threads 1 --source test/fixtures/native_const_void_join --entry-closure --entry test/fixtures/native_const_void_join/main.spl --cache-dir "$root/cache" --output "$root/product/unit-tail" > "$root/evidence/compile.stdout" 2> "$root/evidence/compile.stderr"
          rc=$?
          printf 'exit_status=%s\n' "$rc" > "$root/evidence/compile.env"
          set -e
          sha256sum -c "$root/evidence/inputs.sha"
          test "$rc" = 0
          test -s "$root/product/unit-tail"
          sha256sum "$root/product/unit-tail" > "$root/evidence/output.sha"
          printf 'a1\n\nreset\nc2\nreset\ne4\nf1\n' > "$root/evidence/expected.stdout"
          set +e
          perl scripts/resource/process-tree-rss-watchdog.pl --max-rss-kib=262144 --timeout-seconds=30 --receipt="$root/evidence/run-owner.env" -- "$root/product/unit-tail" > "$root/evidence/run.stdout" 2> "$root/evidence/run.stderr"
          rc=$?
          printf 'exit_status=%s\n' "$rc" > "$root/evidence/run.env"
          set -e
          test "$rc" = 0
          cmp "$root/evidence/expected.stdout" "$root/evidence/run.stdout"
          sha256sum -c "$root/evidence/inputs.sha"
          printf 'status=PASS\nscope=fd366-native-LLVM-unit-tail-fixture\nadmission=none\n' > "$root/evidence/result.env"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fd366-unit-tail-native-evidence
          path: |
            build/unit-tail/evidence
            build/unit-tail/product
            build/unit-tail/cache
            build/unit-tail/tmp
          if-no-files-found: error
