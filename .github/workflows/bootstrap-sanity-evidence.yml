name: Focused native output contract evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused-output:
    runs-on: windows-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: cefb9bdb94aa94c53aac1c02673d8eaab30e0843
          fetch-depth: 0
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build actual patched dispatcher and verify focused output contracts
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/focused-output-proof/controller.py
      - name: Preserve actual compiler outputs, receipts and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: focused-output-${{ github.run_id }}
          path: |
            s/build/focused-output-proof/*.json
            s/build/focused-output-proof/*.env
            s/build/focused-output-proof/*.stdout
            s/build/focused-output-proof/*.stderr
            s/build/focused-output-proof/*.imports
            s/build/focused-output-proof/*.exe
            s/build/focused-output-proof/cases/
            s/build/focused-output-proof/cache/
            s/build/native-objects-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
