name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coff-partial-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-cross-preflight-013b1b02f0ffe5d1808715d6e610df759dcbbbed
          run-id: 45240198504
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-preflight
      - uses: actions/download-artifact@v4
        with:
          name: native-authority-mingw-x86_64-013b1b02f0ffe5d1808715d6e610df759dcbbbed
          run-id: 45240198504
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-native
      - uses: actions/download-artifact@v4
        with:
          name: coff-link-proof-e57c1ca6116907596f22f2c28dc4f5193bd1ce5a
          run-id: 45239555743
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained-fixture
      - name: Install pinned Clang and GNU PE BFD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends binutils-mingw-w64-x86-64
          name=llvm-mingw-20260922-ucrt-ubuntu-22.04-x86_64
          gh release download 20260922 --repo mstorsjo/llvm-mingw --pattern "$name.tar.xz" --dir "$RUNNER_TEMP"
          printf 'bb7bb7654b33d5aa8712acb837c963b2e0c56352560c76105270a3268c665c21  %s\n' "$RUNNER_TEMP/$name.tar.xz" | sha256sum --check -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "COFF_TOOLCHAIN=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"
      - name: Exercise production selector and retained objects
        shell: bash
        run: |
          archive=$(find retained-preflight -name libsimple_runtime.a -print -quit)
          native=$(find retained-native -name libsimple_native_all.a -print -quit)
          printf 'd0ab7ef3a8352512c9effd82596c78cf7f5396bf33131ce9c55e4aa2f8d59bea  %s\n' "$native" | sha256sum --check -
          export REAL_CC="$COFF_TOOLCHAIN/bin/x86_64-w64-mingw32-clang"
          export REAL_LLVM_NM="$COFF_TOOLCHAIN/bin/llvm-nm"
          export REAL_LLVM_OBJDUMP="$COFF_TOOLCHAIN/bin/llvm-objdump"
          ulimit -v 2097152
          timeout --kill-after=5 400 python scripts/check/coff-runtime-inventory-proof.py "$archive" "$native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coff-runtime-proof-${{ github.sha }}
          path: build/coff-runtime-proof/


  private-provider-execution:
    needs: coff-partial-link
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coff-runtime-proof-${{ github.sha }}
          path: evidence
      - name: Execute preserved private fallback with and without external owner
        shell: pwsh
        run: |
          $results = @()
          foreach ($name in @('private-fallback.exe', 'private-with-external-owner.exe')) {
            $path = Join-Path $PWD "evidence/$name"
            $proc = Start-Process -FilePath $path -PassThru -WindowStyle Hidden
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "Timed out: $name" }
            $results += @{name=$name; exit=$proc.ExitCode; sha256=(Get-FileHash $path -Algorithm SHA256).Hash}
            if ($proc.ExitCode -ne 0) { throw "Private fallback numerical assertion failed: $name exit $($proc.ExitCode)" }
          }
          $results | ConvertTo-Json | Set-Content private-provider-execution.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-provider-execution-${{ github.sha }}
          path: private-provider-execution.json
