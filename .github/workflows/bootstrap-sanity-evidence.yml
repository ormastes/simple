name: Native Windows 656 Stage2 proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify same-run inputs and execute native version and LLVM Hello
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/windows-656-native/proof.py
      - name: Retain actual verdict and first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-656-native-${{ github.run_id }}
          path: |
            s/build/windows-656-proof/**/*.json
            s/build/windows-656-proof/**/*.env
            s/build/windows-656-proof/**/*.stdout
            s/build/windows-656-proof/**/*.stderr
            s/build/windows-656-proof/**/*.log
            s/build/windows-656-proof/**/*.imports
            s/build/windows-656-proof/hello.exe
            s/build/windows-656-proof/cache/
            s/build/native-objects-*/
          if-no-files-found: error
          retention-days: 7
