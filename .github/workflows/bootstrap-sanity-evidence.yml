name: New 656 import-provider retained proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cross-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Fetch immutable source identity
        run: git fetch --no-tags --depth=1 origin 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Execute actual caller and equivalence-gated retained link
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check/windows-656-native/cross.py
      - name: Retain successful changed-object product
        uses: actions/upload-artifact@v6
        with:
          name: provider-replay-${{ github.run_id }}
          path: |
            build/provider-replay/link/simple_stage2_provider.exe
            build/provider-replay/link/provider-result.json
            build/provider-replay/link/comparison.json
            build/provider-replay/link/provider-imports.stdout
            build/provider-replay/caller-proof/authority.json
            build/provider-replay/replay.owner.env
            build/provider-replay/cross-caller.owner.env
          if-no-files-found: error
      - name: Retain first failure and exact link evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: provider-replay-evidence-${{ github.run_id }}
          path: |
            build/provider-replay/**/*.json
            build/provider-replay/**/*.env
            build/provider-replay/**/*.stdout
            build/provider-replay/**/*.stderr
            build/provider-replay/link/_stubs.c
            build/provider-replay/link/_stubs.o
          if-no-files-found: warn
  native-windows:
    needs: cross-replay
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 656fa39e28a7775da0172a4e8eeeea1ac0ea59f0
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify changed-object parent and execute native LLVM Hello
        shell: pwsh
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/windows-656-native/proof.py
      - name: Retain actual native verdict and first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-provider-native-${{ github.run_id }}
          path: |
            s/build/windows-656-proof/**/*.json
            s/build/windows-656-proof/**/*.env
            s/build/windows-656-proof/**/*.stdout
            s/build/windows-656-proof/**/*.stderr
            s/build/windows-656-proof/**/*.log
            s/build/windows-656-proof/**/*.imports
            s/build/windows-656-proof/hello.exe
            s/build/windows-656-proof/cache/
            s/build/native-objects-*/
          if-no-files-found: error
