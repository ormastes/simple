name: Native Windows 93f7 Stage2 proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          path: control
      - uses: actions/checkout@v5
        with:
          ref: 93f7b103237cbd065b12b04fb4af7b8b39f0a7de
          path: s
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify same-run inputs and execute native version and LLVM Hello
        working-directory: s
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ../control/scripts/check/windows-93f7-native/proof.py
      - name: Retain actual verdict and first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-93f7-native-${{ github.run_id }}
          path: |
            s/build/windows-93f7-proof/**/*.json
            s/build/windows-93f7-proof/**/*.env
            s/build/windows-93f7-proof/**/*.stdout
            s/build/windows-93f7-proof/**/*.stderr
            s/build/windows-93f7-proof/**/*.log
            s/build/windows-93f7-proof/**/*.imports
            s/build/windows-93f7-proof/hello.exe
            s/build/windows-93f7-proof/cache/
            s/build/native-objects-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
