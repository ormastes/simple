name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reserve-policy-example:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          run-id: 45199934467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-seed
      - name: Execute only the exact tracked live example with configured host layers
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 70abce766732839f0bf8cd073a6cca25dd6190fd
          chmod +x validation-seed/simple
          ulimit -v 2097152
          timeout --kill-after=5 400 python scripts/check/parallel-reserve-live-proof.py validation-seed/simple
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parallel-reserve-proof-${{ github.sha }}
          path: reserve-evidence/
