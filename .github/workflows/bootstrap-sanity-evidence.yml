name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reset-stage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          run-id: 45199934467
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-seed
      - name: Execute corrected pure-data stage spec
        shell: bash
        run: |
          mkdir -p stage-evidence
          chmod +x validation-seed/simple
          git rev-parse HEAD > stage-evidence/source.txt
          sha256sum validation-seed/simple src/app/buildrunner/remote_container_reset_failure_v3.spl test/01_unit/app/buildrunner/remote_container_reset_failure_stages_v3_spec.spl > stage-evidence/inputs.sha
          export SIMPLE_LIB="$PWD/src" SIMPLE_PROJECT_ROOT="$PWD" SIMPLE_TEST_RUNNER_RUST=1
          set +e
          (ulimit -v 2097152; timeout --kill-after=5 180 validation-seed/simple test test/01_unit/app/buildrunner/remote_container_reset_failure_stages_v3_spec.spl --mode=interpreter) > stage-evidence/stdout 2> stage-evidence/stderr
          rc=$?
          printf '%s\n' "$rc" > stage-evidence/exit
          set -e
          sha256sum --check stage-evidence/inputs.sha > stage-evidence/inputs-revalidated.txt
          python - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('stage-evidence')
          s=re.sub(r'\x1b\[[0-9;]*m','',(p/'stdout').read_text())
          result={'exit':int((p/'exit').read_text())}
          for name in ['Passed','Failed']:
              m=re.search(rf'{name}:\s*(\d+)',s)
              result[name.lower()]=int(m.group(1)) if m else None
          (p/'summary.json').write_text(json.dumps(result,indent=2))
          assert result=={'exit':0,'passed':5,'failed':0},result
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reset-stage-contract-${{ github.sha }}
          path: stage-evidence
