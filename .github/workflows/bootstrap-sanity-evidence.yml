name: Bootstrap Sanity Evidence Archive
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coff-projection-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coff-link-proof-e57c1ca6116907596f22f2c28dc4f5193bd1ce5a
          run-id: 45239555743
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retained
      - name: Isolate projection options on retained objects
        shell: bash
        run: |
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq --no-install-recommends binutils-mingw-w64-x86-64
          ulimit -v 524288
          timeout --kill-after=5 60 python scripts/check/coff-projection-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coff-projection-diagnostic-${{ github.sha }}
          path: projection-evidence/
