name: Phase Ladder

# Climb every bootstrap lane from its newest proven compiler to phase 4, one
# phase per rung, and publish what each lane reached as the next numbered RC so
# the default compiler (config/bootstrap.sdn `compiler: auto`) moves forward.
#
# Lanes: linux-x86_64, linux-riscv64 (cross + qemu-user), darwin-arm64,
# darwin-x86_64, windows-x86_64, freebsd-x86_64 (VM). freebsd-riscv64 has no
# hosted runner and climbs in a local QEMU guest (see the guide).
# Guide: doc/07_guide/infra/toolchain/phase_ladder_ci.md
on:
  push:
    branches: ['release/**', release_phase3]
    paths:
      - 'src/**'
      - 'scripts/bootstrap/**'
      - 'config/bootstrap.sdn'
      - '.github/workflows/phase-ladder*.yml'
  schedule:
    - cron: '17 19 * * *' # 04:17 Asia/Seoul
  workflow_dispatch:
    inputs:
      lanes:
        description: "all, or comma-separated platforms"
        type: string
        default: all
      publish:
        description: "Publish the reached phases as the next RC"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

# One ladder per ref at a time; a newer push waits (only the newest pending
# run is kept) instead of cancelling a climb that is hours in.
concurrency:
  group: phase-ladder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Two chains: each rung waits for its whole previous rung, so the slow Intel
  # macOS lane (2-3x the others per rung) climbs on its own and no longer holds
  # every other lane back. A manual `lanes=` run uses the main chain only.
  rung1:
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 1, lanes: "${{ (!inputs.lanes || inputs.lanes == 'all') && 'linux-x86_64,linux-riscv64,darwin-arm64,windows-x86_64,freebsd-x86_64' || inputs.lanes }}" }
  rung2:
    needs: rung1
    if: always()
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 2, lanes: "${{ (!inputs.lanes || inputs.lanes == 'all') && 'linux-x86_64,linux-riscv64,darwin-arm64,windows-x86_64,freebsd-x86_64' || inputs.lanes }}" }
  rung3:
    needs: rung2
    if: always()
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 3, lanes: "${{ (!inputs.lanes || inputs.lanes == 'all') && 'linux-x86_64,linux-riscv64,darwin-arm64,windows-x86_64,freebsd-x86_64' || inputs.lanes }}" }
  rung4:
    needs: rung3
    if: always()
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 4, lanes: "${{ (!inputs.lanes || inputs.lanes == 'all') && 'linux-x86_64,linux-riscv64,darwin-arm64,windows-x86_64,freebsd-x86_64' || inputs.lanes }}" }

  slow-rung1:
    if: ${{ !inputs.lanes || inputs.lanes == 'all' }}
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 1, lanes: darwin-x86_64 }
  slow-rung2:
    needs: slow-rung1
    if: always() && needs.slow-rung1.result != 'skipped'
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 2, lanes: darwin-x86_64 }
  slow-rung3:
    needs: slow-rung2
    if: always() && needs.slow-rung2.result != 'skipped'
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 3, lanes: darwin-x86_64 }
  slow-rung4:
    needs: slow-rung3
    if: always() && needs.slow-rung3.result != 'skipped'
    uses: ./.github/workflows/phase-ladder-rung.yml
    with: { rung: 4, lanes: darwin-x86_64 }

  publish:
    needs: [rung4, slow-rung4]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: ladder-*
          path: build/ladder/in
          merge-multiple: true
      - name: Package each lane's highest phase
        id: pkg
        run: |
          version=$(cat VERSION)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "| lane | phase | essentials |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for platform in $(ls build/ladder/in | sed 's/-p[0-9]*$//' | sort -u); do
            for p in 4 3 2 1; do
              dir=build/ladder/in/$platform-p$p
              [ -d "$dir" ] && break
            done
            phase=$(cat "$dir/PHASE")
            bin=$(ls "$dir"/simple "$dir"/simple.exe 2>/dev/null | head -1)
            sh scripts/release/package-phase1-spk.shs "$version" "$platform" "$bin" "$phase" "$dir/essentials"
            ess=$(tr '\n' ' ' < "$dir/essentials/STATUS" 2>/dev/null || echo "none recorded")
            echo "| $platform | $phase | $ess |" >> "$GITHUB_STEP_SUMMARY"
          done
          ls simple-bootstrap-*.spk
      - name: Publish next numbered RC
        if: steps.pkg.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          BASE="${VERSION%%-*}"
          LAST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n "s/^rc-${BASE//./\\.}-rc\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -1)
          TAG="rc-${BASE}-rc.$(( ${LAST:-0} + 1 ))"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "$TAG (phase ladder)" \
            --notes "Phase-ladder RC from ${GITHUB_SHA}. Reached phases: see the run summary ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            simple-bootstrap-*.spk simple-bootstrap-*.spk.sha256
