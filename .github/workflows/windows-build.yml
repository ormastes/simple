name: Windows Build (LLVM 23.1.1 clang-cl)

on:
  push:
    paths:
      - 'src/compiler_rust/**'
      - 'src/compiler/70.backend/**'
      - 'src/lib/nogc_sync_mut/ffi/llvm.spl'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LLVM_VERSION: 23.1.1
  LLVM_ARCHIVE_SHA256: c8a12d754b5050c5668b56a5425c806792d46c70f7244b1216046164aa4b6462
  LLVM_ROOT: ${{ github.workspace }}\.toolchains\llvm-23.1.1

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: msvc
            rust-target: x86_64-pc-windows-msvc
            linker-flavor: msvc
            name: Windows MSVC
    runs-on: windows-latest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM 23.1.1
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_ROOT }}
          key: llvm-${{ runner.os }}-${{ runner.arch }}-${{ env.LLVM_VERSION }}-${{ env.LLVM_ARCHIVE_SHA256 }}

      - name: Install LLVM 23.1.1
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'clang+llvm-23.1.1-x86_64-pc-windows-msvc.tar.zst'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $staging = Join-Path $env:RUNNER_TEMP 'simple-llvm-23.1.1-extract'
          $uri = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/clang%2Bllvm-23.1.1-x86_64-pc-windows-msvc.tar.zst'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LLVM_ARCHIVE_SHA256) {
            throw "LLVM archive SHA-256 mismatch: $actualHash"
          }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          & 7z x $archive "-o$staging" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "failed to decompress LLVM archive: exit $LASTEXITCODE"
          }
          $tar = Join-Path $staging 'clang+llvm-23.1.1-x86_64-pc-windows-msvc.tar'
          & 7z x $tar "-o$staging" -y | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "failed to extract LLVM archive: exit $LASTEXITCODE"
          }
          $sourceRoot = Join-Path $staging 'clang+llvm-23.1.1-x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:LLVM_ROOT) | Out-Null
          Move-Item -LiteralPath $sourceRoot -Destination $env:LLVM_ROOT

      - name: Verify LLVM 23.1.1 authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Tool = 'clang.exe'; Pattern = 'clang version 23\.1\.1' },
            @{ Tool = 'clang-cl.exe'; Pattern = 'clang version 23\.1\.1' },
            @{ Tool = 'llvm-ar.exe'; Pattern = 'LLVM version 23\.1\.1' },
            @{ Tool = 'lld-link.exe'; Pattern = 'LLD 23\.1\.1' }
          )
          foreach ($check in $checks) {
            $tool = Join-Path $env:LLVM_ROOT "bin\$($check.Tool)"
            if (!(Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "missing LLVM 23.1.1 tool: $tool"
            }
            $version = (& $tool --version 2>&1 | Select-Object -First 1)
            if ($version -notmatch $check.Pattern) {
              throw "$($check.Tool) is not LLVM 23.1.1: $version"
            }
          }
          (Join-Path $env:LLVM_ROOT 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SIMPLE_LLVM_PATH=$env:LLVM_ROOT\bin\LLVM-C.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # MSVC: set up Visual Studio developer environment
      - name: Setup MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/compiler_rust/target
          key: windows-${{ matrix.toolchain }}-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            windows-${{ matrix.toolchain }}-bootstrap-

      # MSVC: hide Git's /usr/bin/link so it doesn't shadow MSVC's link.exe
      - name: Fix MSVC linker PATH
        if: matrix.toolchain == 'msvc'
        shell: bash
        run: |
          if [ -f /usr/bin/link ]; then
            mv /usr/bin/link /usr/bin/link.bak
          fi

      # The terminal shim rejects ambient cl.exe so CI uses the same Clang C
      # authority admitted by the Windows bootstrap pipeline.
      - name: Bind MSVC Clang compiler
        if: matrix.toolchain == 'msvc'
        shell: pwsh
        run: |
          "CC=$env:LLVM_ROOT\bin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_msvc=$env:LLVM_ROOT\bin\clang-cl.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust seed
        working-directory: src/compiler_rust
        shell: bash
        run: cargo build --profile bootstrap -p simple-driver --target ${{ matrix.rust-target }}

      - name: Build native_all library
        working-directory: src/compiler_rust
        shell: bash
        run: cargo build --profile bootstrap -p simple-native-all --features driver-compat --target ${{ matrix.rust-target }}

      - name: Verify seed binary
        shell: bash
        run: |
          SEED="src/compiler_rust/target/${{ matrix.rust-target }}/bootstrap/simple.exe"
          if [ ! -f "$SEED" ]; then
            echo "::error::Seed binary not found at $SEED"
            exit 1
          fi
          echo "Seed binary size: $(wc -c < "$SEED") bytes"
          "$SEED" --version

      # Stage 2: compile Simple compiler from source using the seed
      - name: Stage 2 compile
        shell: bash
        env:
          SIMPLE_LINKER_FLAVOR: ${{ matrix.linker-flavor }}
          SIMPLE_BOOTSTRAP: "1"
          SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
          # Each matrix job starts from a fresh checkout with no SCV compile-event
          # cursor.  Admit that one-time initialization explicitly; otherwise the
          # seed fails closed before it can produce the Stage 2 compiler.
          SIMPLE_SCV_INVENTORY_COLD_INIT: "1"
        run: |
          SEED="src/compiler_rust/target/${{ matrix.rust-target }}/bootstrap/simple.exe"
          mkdir -p build/bootstrap
          "$SEED" native-build --entry src/app/cli/bootstrap_main.spl \
            --entry-closure \
            -o build/bootstrap/simple_stage2.exe

      # Stage 2 LLVM: compile Simple compiler using stage1 + LLVM lib backend
      - name: Stage 2 with LLVM lib backend
        shell: bash
        env:
          SIMPLE_BOOTSTRAP: "1"
          SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          STAGE1="build/bootstrap/simple_stage2.exe"
          if [ ! -f "$STAGE1" ]; then
            echo "Skipping LLVM stage2 — no stage1 binary"
            exit 0
          fi
          mkdir -p build/bootstrap
          "./$STAGE1" native-build \
            --entry src/app/cli/bootstrap_main.spl \
            --entry-closure \
            --backend=llvm-lib \
            -o build/bootstrap/simple_llvm_stage2.exe \
            2>&1 || true
          if [ -f build/bootstrap/simple_llvm_stage2.exe ]; then
            ./build/bootstrap/simple_llvm_stage2.exe --version
            echo "LLVM lib stage2 verified"
          else
            echo "LLVM lib stage2 not produced (expected during early development)"
          fi

      - name: Upload LLVM stage2 binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-stage2-${{ matrix.toolchain }}-${{ github.sha }}
          path: build/bootstrap/simple_llvm_stage2.exe
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload seed binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-${{ matrix.toolchain }}-${{ github.sha }}
          path: src/compiler_rust/target/${{ matrix.rust-target }}/bootstrap/simple.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload stage2 binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-${{ matrix.toolchain }}-${{ github.sha }}
          path: build/bootstrap/simple_stage2.exe
          if-no-files-found: ignore
          retention-days: 7
