name: Windows Build (MinGW UCRT / MSYS2 CLANG64)

on:
  push:
    branches: [main]
    paths:
      - 'src/compiler_rust/**'
      - 'src/compiler/70.backend/**'
      - 'src/lib/nogc_sync_mut/ffi/llvm.spl'
      - 'scripts/check/lib/bootstrap-stage3/command-snapshot.shs'
      - 'scripts/check/lib/bootstrap-stage3/authority.shs'
      - 'scripts/resource/process-tree-rss-watchdog.pl'
      - 'scripts/bootstrap/bootstrap-session-exec.c'
      - 'test/01_unit/scripts/bootstrap_rss_retry_test.shs'
      - 'test/01_unit/scripts/bootstrap_windows_transcribed_rss_inherit_test.shs'
      - 'scripts/check/check-bootstrap-windows-c-admission.shs'
      - '.github/workflows/windows-build.yml'
      - 'scripts/setup/platform-detect.shs'
      - 'src/runtime/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Rust seed pin (src/compiler_rust/rust-toolchain.toml) on the gnullvm host.
  RUST_HOST: x86_64-pc-windows-gnullvm

# Default Windows build environment: MinGW UCRT via MSYS2 CLANG64 (UCRT +
# clang + LLD + libunwind/libc++, no GCC). The MSVC configuration stays in-tree
# (SIMPLE_WINDOWS_ABI=msvc) but CI builds only this GNU configuration. See
# doc/07_guide/infra/toolchain/windows_mingw_ucrt.md.
jobs:
  windows-build:
    runs-on: windows-latest
    name: Windows MinGW UCRT (CLANG64)
    defaults:
      run:
        shell: msys2 {0}
    env:
      SIMPLE_WINDOWS_ABI: gnu
      SIMPLE_LINKER_FLAVOR: gnu
      CC: clang
      CC_x86_64_pc_windows_gnullvm: clang
      AR_x86_64_pc_windows_gnullvm: llvm-ar
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libunwind

      - name: Verify CLANG64 toolchain
        run: |
          set -eu
          for tool in clang ld.lld llvm-ar; do
            command -v "$tool"
          done
          clang --version | head -2
          clang -dumpmachine | grep -qx 'x86_64-w64-windows-gnu'
          ld.lld --version

      - name: Select gnullvm Rust host
        run: |
          set -eu
          rustup set default-host "$RUST_HOST"
          cd src/compiler_rust
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal -c rustfmt -c clippy
          rustc -vV | tee "$RUNNER_TEMP/rustc-vV.txt"
          grep -qx "host: $RUST_HOST" "$RUNNER_TEMP/rustc-vV.txt"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/compiler_rust/target
          key: windows-gnullvm-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            windows-gnullvm-bootstrap-

      - name: Build Rust seed
        working-directory: src/compiler_rust
        run: cargo build --profile bootstrap -p simple-driver

      - name: Build native_all library
        working-directory: src/compiler_rust
        run: cargo build --profile bootstrap -p simple-native-all --features driver-compat

      - name: Verify seed binary
        run: |
          SEED="src/compiler_rust/target/bootstrap/simple.exe"
          if [ ! -f "$SEED" ]; then
            echo "::error::Seed binary not found at $SEED"
            exit 1
          fi
          echo "Seed binary size: $(wc -c < "$SEED") bytes"
          "$SEED" --version

      # Stage 2: compile the pure-Simple compiler from source using the seed
      # (release.yml calls this binary stage1).
      - name: Stage 2 compile
        env:
          SIMPLE_BOOTSTRAP: "1"
          # Rust-owned native-build driver, as in release.yml's seed step.
          SIMPLE_NATIVE_BUILD_RUST: "1"
          SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
          # Each run starts from a fresh checkout with no SCV compile-event
          # cursor.  Admit that one-time initialization explicitly; otherwise the
          # seed fails closed before it can produce the Stage 2 compiler.
          SIMPLE_SCV_INVENTORY_COLD_INIT: "1"
          SIMPLE_PARSE_SHARDING: "0"
          RUST_LOG: error
        run: |
          SEED="src/compiler_rust/target/bootstrap/simple.exe"
          mkdir -p build/bootstrap
          "$SEED" native-build \
            --source src/compositions/kernel_llvm_cranelift --source src \
            --entry-closure --entry src/app/cli/bootstrap_main.spl \
            --backend cranelift --mode dynload --threads 2 \
            -o build/bootstrap/simple_stage2.exe

      - name: Verify Stage 2 binary (version + hello world)
        env:
          SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -eu
          bin=build/bootstrap/simple_stage2.exe
          "./$bin" --version
          probe=build/windows-gnu-sanity
          rm -rf "$probe" && mkdir -p "$probe"
          printf 'fn main():\n    print "windows-gnu-hello-ok"\n' > "$probe/hello.spl"
          "./$bin" native-build "$probe/hello.spl" -o "$probe/hello.exe"
          "$probe/hello.exe" | tee "$probe/run.log"
          grep -qx 'windows-gnu-hello-ok' "$probe/run.log"

      - name: Verify Windows bootstrap global relocations
        env:
          SIMPLE_BINARY: build/bootstrap/simple_stage2.exe
        run: sh scripts/check/check-bootstrap-windows-global-relocation.shs

      - name: Upload seed binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-gnu-${{ github.sha }}
          path: src/compiler_rust/target/bootstrap/simple.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload stage2 binary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-gnu-${{ github.sha }}
          path: build/bootstrap/simple_stage2.exe
          if-no-files-found: ignore
          retention-days: 7
