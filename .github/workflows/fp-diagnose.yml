name: Diagnose seed fingerprint
on:
  push:
    branches: [work/diagnose-seed-fingerprint-20261010]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work/diagnose-seed-fingerprint-20261010
          fetch-depth: 1
          persist-credentials: false
      - name: Run fingerprint diagnose
        run: sh ci/fp-diagnose.sh
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-diagnose
          path: diag/
