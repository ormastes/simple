name: Clang Host Compiler Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/cross-platform.yml'
      - '.github/workflows/simple-llvm-cross.yml'
      - '.github/workflows/windows-build.yml'
      - 'tools/docker/Dockerfile.cross-language-perf'
      - 'tools/gui_perf_bench/**'
      - 'tools/check/check_clang_host_policy.shs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cross-platform.yml'
      - '.github/workflows/simple-llvm-cross.yml'
      - '.github/workflows/windows-build.yml'
      - 'tools/docker/Dockerfile.cross-language-perf'
      - 'tools/gui_perf_bench/**'
      - 'tools/check/check_clang_host_policy.shs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-host-policy:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject host GCC fallback
        run: sh tools/check/check_clang_host_policy.shs
