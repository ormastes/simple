name: macOS Stage 3 HIR Memory

on:
  pull_request:
    paths:
      - 'src/compiler/80.driver/driver_hir_pipeline_lowering.spl'
      - 'scripts/bootstrap/bootstrap-from-scratch.sh'
      - 'scripts/bootstrap/resume-stage3-from-admitted.sh'
      - '.github/workflows/macos-stage3-hir-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage3-hir-memory:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: macOS arm64 Stage 3 HIR memory
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
      SIMPLE_NO_STUB_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install bootstrap dependencies
        run: |
          brew install coreutils freetype zstd llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          test -x "$llvm_bin/llvm-objcopy"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "LIBRARY_PATH=$(brew --prefix freetype)/lib:$(brew --prefix zstd)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-L native=$(brew --prefix freetype)/lib" >> "$GITHUB_ENV"

      - name: Build admitted Stage 2 and its Stage 3 receipt
        shell: bash
        run: |
          set -euo pipefail
          SIMPLE_COMPILE_FAIL_FAST=${SIMPLE_COMPILE_FAIL_FAST:-1} sh scripts/bootstrap/bootstrap-from-scratch.sh \
            --backend=cranelift --mode=dynload --full-bootstrap \
            --stop-after-stage2 --no-mcp --jobs=2 \
            --output="$GITHUB_WORKSPACE/build/bootstrap-ci" \
            --produce-stage3-receipt=verify-landed-compiler-fix

      - name: Resume Stage 3 from the admitted Stage 2
        shell: bash
        run: |
          set -euo pipefail
          SIMPLE_COMPILE_FAIL_FAST=${SIMPLE_COMPILE_FAIL_FAST:-1} sh scripts/bootstrap/bootstrap-from-scratch.sh \
            --resume-stage3-from-admitted="$GITHUB_WORKSPACE/build/bootstrap-ci" \
            --bootstrap-receipt="$GITHUB_WORKSPACE/build/bootstrap-ci/stage3-planner-admission.receipt" \
            --jobs=1

      - name: Retain Stage 3 memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-stage3-hir-memory-${{ github.run_id }}
          path: |
            build/bootstrap-ci/**/*.events
            build/bootstrap-ci/**/*.log
            build/bootstrap-ci/**/*.receipt
          if-no-files-found: warn
          retention-days: 7
