name: Protected integration convergence admission

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Protected maintenance line (release/X.Y)
        required: true
        type: string
      candidate_commit_sha:
        description: Exact protected integration merge revision to admit
        required: true
        type: string
      integration_pr_number:
        description: Exact merged pull request that produced the candidate revision
        required: true
        type: number

concurrency:
  group: convergence-${{ inputs.release_ref }}-${{ inputs.candidate_commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  id-token: write
  attestations: write

jobs:
  emit-reviewed-convergence-receipt:
    runs-on: ubuntu-latest
    environment: protected-integration
    outputs:
      artifact_id: ${{ steps.receipt_bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.receipt_bundle.outputs.artifact-digest }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    steps:
      - name: Validate exact protected integration identity
        id: identity
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit_sha }}
          INTEGRATION_PR_NUMBER: ${{ inputs.integration_pr_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^release/[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTEGRATION_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "artifact_name=convergence-receipt-${CANDIDATE_COMMIT}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify provider-authenticated merge, review, and checks
        id: provider
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit_sha }}
          INTEGRATION_PR_NUMBER: ${{ inputs.integration_pr_number }}
        run: |
          set -euo pipefail
          mkdir -p convergence-receipt
          git fetch --no-tags --unshallow origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$RELEASE_REF:refs/remotes/origin/$RELEASE_REF"
          main_sha=$(git rev-parse refs/remotes/origin/main)
          release_sha=$(git rev-parse "refs/remotes/origin/$RELEASE_REF")
          test "$CANDIDATE_COMMIT" = "$release_sha"
          if git merge-base --is-ancestor "$release_sha" "$main_sha"; then
            echo "release head must remain independent from main" >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$main_sha" "$release_sha"; then
            echo "release head must not absorb the main development line" >&2
            exit 1
          fi

          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INTEGRATION_PR_NUMBER}")
          jq -e --arg release_ref "$RELEASE_REF" --arg candidate "$CANDIDATE_COMMIT" '
            .state == "closed" and .merged == true and .merged_at != null and
            .base.ref == $release_ref and .merge_commit_sha == $candidate and
            (.base.sha | test("^[0-9a-f]{40}$")) and
            (.head.sha | test("^[0-9a-f]{40}$")) and
            .base.sha != .head.sha and .user.login != .merged_by.login' \
            <<<"$pr_json" >/dev/null
          base_sha=$(jq -r '.base.sha' <<<"$pr_json")
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          author_login=$(jq -r '.user.login' <<<"$pr_json")
          parents=$(git show -s --format='%P' "$CANDIDATE_COMMIT")
          test "$parents" = "$base_sha $head_sha"

          jq -cS --argjson pr "$pr_json" '
            {schema:"simple-release-provider-integration/1",
             pr:{number:$pr.number,state:$pr.state,merged:$pr.merged,
                 merged_at:$pr.merged_at,merge_commit_sha:$pr.merge_commit_sha,
                 base_ref:$pr.base.ref,base_sha:$pr.base.sha,
                 head_ref:$pr.head.ref,head_sha:$pr.head.sha,
                 author:{id:$pr.user.id,login:$pr.user.login},
                 merged_by:{id:$pr.merged_by.id,login:$pr.merged_by.login}}}' \
            > convergence-receipt/integration-evidence.json

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${INTEGRATION_PR_NUMBER}/reviews?per_page=100" \
            > convergence-receipt/review-pages.json
          jq -cS --arg head "$head_sha" --arg author "$author_login" '
            [ .[][] |
              select(.user.type == "User" and .user.login != $author) ] |
            sort_by(.user.id, .submitted_at, .id) |
            group_by(.user.id) | map(last) |
            map(select(.state == "APPROVED" and .commit_id == $head) |
                {review_id:.id,reviewer_id:.user.id,reviewer_login:.user.login,
                 commit_id:.commit_id,state:.state,submitted_at:.submitted_at}) |
            if length > 0 then
              {schema:"simple-release-provider-review/1",head_sha:$head,
               independent_approvals:.}
            else error("no current independent approval of the exact PR head") end' \
            convergence-receipt/review-pages.json \
            > convergence-receipt/review-evidence.json
          rm convergence-receipt/review-pages.json

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100" \
            > convergence-receipt/check-pages.json
          required_checks=$(jq -cS '
            [.rules[] | select(.type == "required_status_checks") |
             .parameters.required_status_checks[] | {context,integration_id}]' \
            .github/rulesets/spipe-vcs-v3-release-lines.json)
          test "$(jq 'length' <<<"$required_checks")" -gt 0
          jq -cS --arg head "$head_sha" --argjson required "$required_checks" '
            [ .[].check_runs[] |
              {id,name,status,conclusion,head_sha,details_url,
               app:{id:.app.id,slug:.app.slug}} ] as $runs |
            if all($required[]; . as $check |
                 ([ $runs[] | select(
                    .name == $check.context and .app.id == $check.integration_id and
                    .head_sha == $head and .status == "completed" and
                    .conclusion == "success") ] | length) == 1) then
              {schema:"simple-release-provider-checks/1",head_sha:$head,
               required_checks:$required,
               successful_check_runs:[
                 $required[] as $check | $runs[] | select(
                   .name == $check.context and .app.id == $check.integration_id and
                   .head_sha == $head and .status == "completed" and
                   .conclusion == "success")]}
            else error("exact PR head lacks one configured successful check identity") end' \
            convergence-receipt/check-pages.json \
            > convergence-receipt/check-evidence.json
          rm convergence-receipt/check-pages.json

          integration_receipt_sha256=$(sha256sum convergence-receipt/integration-evidence.json | awk '{print $1}')
          review_summary_sha256=$(sha256sum convergence-receipt/review-evidence.json | awk '{print $1}')
          evidence_receipt_sha256=$(sha256sum convergence-receipt/check-evidence.json | awk '{print $1}')
          {
            echo "main_sha=$main_sha"
            echo "release_sha=$release_sha"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "integration_receipt_sha256=$integration_receipt_sha256"
            echo "review_summary_sha256=$review_summary_sha256"
            echo "evidence_receipt_sha256=$evidence_receipt_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Build provider-reviewed convergence receipt without mutation
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit_sha }}
          INTEGRATION_PR_NUMBER: ${{ inputs.integration_pr_number }}
          MAIN_SHA: ${{ steps.provider.outputs.main_sha }}
          RELEASE_SHA: ${{ steps.provider.outputs.release_sha }}
          BASE_SHA: ${{ steps.provider.outputs.base_sha }}
          HEAD_SHA: ${{ steps.provider.outputs.head_sha }}
          REVIEW_SUMMARY_SHA256: ${{ steps.provider.outputs.review_summary_sha256 }}
          EVIDENCE_RECEIPT_SHA256: ${{ steps.provider.outputs.evidence_receipt_sha256 }}
          INTEGRATION_RECEIPT_SHA256: ${{ steps.provider.outputs.integration_receipt_sha256 }}
        run: |
          set -euo pipefail
          manifest=.github/release-convergence-manifest.json
          test -f "$manifest"
          jq -e --arg release_ref "$RELEASE_REF" --arg main "$MAIN_SHA" '
            .schema == "simple-release-convergence-manifest/2" and
            .release_ref == $release_ref and
            .main_head_sha == $main and
            (.release_inventory_head_sha | test("^[0-9a-f]{40}$")) and
            (.main_to_release.selected_shas | type == "array") and
            (.main_to_release.backports | type == "array") and
            (.release_to_main.classifications | type == "array") and
            (.release_to_main.forward_ports | type == "array")' \
            "$manifest" >/dev/null
          inventory_head=$(jq -r '.release_inventory_head_sha' "$manifest")
          test "$inventory_head" != "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$inventory_head"
          git merge-base --is-ancestor "$inventory_head" "$HEAD_SHA"
          administrative_paths=$(git log --format= --name-only \
            "$inventory_head..$HEAD_SHA" | sed '/^$/d' | sort -u)
          test "$administrative_paths" = "$manifest" || {
            echo "commits after release_inventory_head_sha must update only the reviewed manifest" >&2
            exit 1
          }
          jq -cS . "$manifest" > convergence-receipt/reviewed-convergence-manifest.json
          manifest_blob_sha=$(git rev-parse "${CANDIDATE_COMMIT}:${manifest}")
          manifest_sha256=$(sha256sum convergence-receipt/reviewed-convergence-manifest.json | awk '{print $1}')

          git rev-list --topo-order "$inventory_head..$MAIN_SHA" > convergence-receipt/main.inventory
          git rev-list --topo-order "$MAIN_SHA..$inventory_head" > convergence-receipt/release.inventory
          file_array() {
            jq -Rsc 'split("\n") | map(select(length > 0))' "$1"
          }
          main_inventory=$(file_array convergence-receipt/main.inventory)
          release_inventory=$(file_array convergence-receipt/release.inventory)

          jq -r '.release_to_main.classifications[].commit_sha' "$manifest" |
            sort > convergence-receipt/release.classified
          sort convergence-receipt/release.inventory > convergence-receipt/release.inventory.sorted
          diff -u convergence-receipt/release.inventory.sorted convergence-receipt/release.classified
          jq -e --arg release_ref "$RELEASE_REF" \
            --argjson main_inventory "$main_inventory" \
            --argjson release_inventory "$release_inventory" '
            (.main_to_release.selected_shas | length) ==
              (.main_to_release.selected_shas | unique | length) and
            all(.main_to_release.selected_shas[];
                test("^[0-9a-f]{40}$") and ($main_inventory | index(.) != null)) and
            (.main_to_release.backports | length) ==
              (.main_to_release.backports | map(.source_commit_sha) | unique | length) and
            ((.main_to_release.selected_shas | sort) ==
             (.main_to_release.backports | map(.source_commit_sha) | sort)) and
            all(.main_to_release.backports[]; . as $backport |
                ($backport.source_commit_sha | test("^[0-9a-f]{40}$")) and
                ($backport.result_commit_sha | test("^[0-9a-f]{40}$")) and
                $backport.target_ref == $release_ref and
                ($main_inventory | index($backport.source_commit_sha) != null) and
                ($release_inventory | index($backport.result_commit_sha) != null)) and
            (.release_to_main.classifications | length) ==
              (.release_to_main.classifications | map(.commit_sha) | unique | length) and
            all(.release_to_main.classifications[];
                (.commit_sha | test("^[0-9a-f]{40}$")) and
                (.kind == "fix" or .kind == "non_fix") and
                (if .kind == "non_fix" then
                   (.reason | type == "string" and test("^[^\\t\\r\\n]{3,256}$")) and
                   (.owner | type == "string" and test("^@[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$")) and
                   (.expires_at | type == "string" and
                    test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and
                    (fromdateiso8601 > now))
                 else
                   ((.reason // "") == "" and (.owner // "") == "" and
                    (.expires_at // "") == "")
                 end))' \
            "$manifest" >/dev/null

          : > convergence-receipt/classification-evidence.jsonl
          while IFS=$'\t' read -r source kind reason owner expires_at; do
            evidence=$(jq -cnS \
              --arg source "$source" --arg kind "$kind" \
              --arg reason "$reason" --arg owner "$owner" --arg expires_at "$expires_at" \
              --arg manifest_blob_sha "$manifest_blob_sha" \
              --arg manifest_sha256 "$manifest_sha256" \
              --arg integration_pr_number "$INTEGRATION_PR_NUMBER" \
              --arg integration_receipt_sha256 "$INTEGRATION_RECEIPT_SHA256" \
              --arg review_summary_sha256 "$REVIEW_SUMMARY_SHA256" \
              --arg evidence_receipt_sha256 "$EVIDENCE_RECEIPT_SHA256" \
              '{commit_sha:$source,kind:$kind,reason:$reason,owner:$owner,
                expires_at:$expires_at,manifest_blob_sha:$manifest_blob_sha,
                manifest_sha256:$manifest_sha256,
                integration_pr_number:($integration_pr_number | tonumber),
                integration_receipt_sha256:$integration_receipt_sha256,
                review_summary_sha256:$review_summary_sha256,
                evidence_receipt_sha256:$evidence_receipt_sha256}')
            printf '%s\n' "$evidence" >> convergence-receipt/classification-evidence.jsonl
          done < <(jq -r '.release_to_main.classifications[] |
                         [.commit_sha,.kind,(.reason // ""),(.owner // ""),
                          (.expires_at // "")] | @tsv' "$manifest")
          jq -csS . convergence-receipt/classification-evidence.jsonl \
            > convergence-receipt/classification-evidence.json
          rm convergence-receipt/classification-evidence.jsonl

          stable_patch_id() {
            commit=$1
            git cat-file -e "${commit}^{commit}"
            git cat-file -e "${commit}^1"
            patch_line=$(git diff --binary --full-index "${commit}^1" "$commit" |
              git patch-id --stable)
            set -- $patch_line
            test "$#" = 2
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$1"
          }
          release_required_checks=$(jq -cS '.required_checks' \
            convergence-receipt/check-evidence.json)
          test "$(jq 'length' <<<"$release_required_checks")" -gt 0
          : > convergence-receipt/backport-evidence.jsonl
          while IFS=$'\t' read -r source result target_ref; do
            test "$target_ref" = "$RELEASE_REF"
            git merge-base --is-ancestor "$result" "$inventory_head"
            grep -Fxq -- "$result" convergence-receipt/release.inventory
            source_patch_id=$(stable_patch_id "$source")
            result_patch_id=$(stable_patch_id "$result")
            test "$source_patch_id" = "$result_patch_id" || {
              echo "backport result is not stable patch-id equivalent to its source" >&2
              exit 1
            }
            evidence=$(jq -cnS --arg source "$source" --arg result "$result" \
              --arg source_patch_id "$source_patch_id" --arg result_patch_id "$result_patch_id" \
              --arg target_ref "$target_ref" --arg integration_head_sha "$HEAD_SHA" \
              --arg integration_pr_number "$INTEGRATION_PR_NUMBER" \
              --arg review_receipt_sha256 "$REVIEW_SUMMARY_SHA256" \
              --arg check_receipt_sha256 "$EVIDENCE_RECEIPT_SHA256" \
              --arg integration_receipt_sha256 "$INTEGRATION_RECEIPT_SHA256" \
              --argjson required_checks "$release_required_checks" \
              '{source_commit_sha:$source,result_commit_sha:$result,target_ref:$target_ref,
                equivalence:"stable_patch_id",source_patch_id:$source_patch_id,
                result_patch_id:$result_patch_id,required_checks:$required_checks,
                integration_pr_number:($integration_pr_number | tonumber),
                integration_head_sha:$integration_head_sha,
                review_receipt_sha256:$review_receipt_sha256,
                check_receipt_sha256:$check_receipt_sha256,
                integration_receipt_sha256:$integration_receipt_sha256}')
            printf '%s\n' "$evidence" >> convergence-receipt/backport-evidence.jsonl
          done < <(jq -r '.main_to_release.backports[] |
                         [.source_commit_sha,.result_commit_sha,.target_ref] | @tsv' "$manifest")
          jq -csS . convergence-receipt/backport-evidence.jsonl \
            > convergence-receipt/backport-evidence.json
          rm convergence-receipt/backport-evidence.jsonl

          required_checks=$(jq -cS '
            [.rules[] | select(.type == "required_status_checks") |
             .parameters.required_status_checks[] | {context,integration_id}]' \
            .github/rulesets/spipe-vcs-v3-main.json)
          test "$(jq 'length' <<<"$required_checks")" -gt 0
          : > convergence-receipt/forward-port-evidence.jsonl
          while IFS=$'\t' read -r source result target_ref; do
            test "$target_ref" = main
            git merge-base --is-ancestor "$result" "$MAIN_SHA"
            source_patch_id=$(stable_patch_id "$source")
            result_patch_id=$(stable_patch_id "$result")
            test "$source_patch_id" = "$result_patch_id" || {
              echo "forward-port result is not stable patch-id equivalent to its source" >&2
              exit 1
            }
            pulls=$(gh api --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${result}/pulls?per_page=100")
            forward_pr=$(jq -ce --arg result "$result" '
              [ .[][] | select(.merged_at != null and .base.ref == "main" and
                               .merge_commit_sha == $result) ] |
              if length == 1 then .[0]
              else error("forward-port result must identify one exact merged main PR") end' \
              <<<"$pulls")
            pr_number=$(jq -r '.number' <<<"$forward_pr")
            pr_head=$(jq -r '.head.sha' <<<"$forward_pr")
            pr_author=$(jq -r '.user.login' <<<"$forward_pr")
            review_pages=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews?per_page=100")
            approvals=$(jq -ce --arg head "$pr_head" --arg author "$pr_author" '
              [ .[][] | select(.user.type == "User" and .user.login != $author) ] |
              sort_by(.user.id, .submitted_at, .id) | group_by(.user.id) | map(last) |
              map(select(.state == "APPROVED" and .commit_id == $head) |
                  {review_id:.id,reviewer_id:.user.id,reviewer_login:.user.login,
                   commit_id:.commit_id,state:.state,submitted_at:.submitted_at}) |
              if length > 0 then .
              else error("forward-port PR lacks exact-head independent approval") end' \
              <<<"$review_pages")
            check_pages=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/commits/${pr_head}/check-runs?per_page=100")
            checks=$(jq -ce --arg head "$pr_head" --argjson required "$required_checks" '
              [ .[].check_runs[] |
                {id,name,status,conclusion,head_sha,details_url,
                 app:{id:.app.id,slug:.app.slug}} ] as $runs |
              if all($required[]; . as $check |
                   ([ $runs[] | select(
                      .name == $check.context and .app.id == $check.integration_id and
                      .head_sha == $head and .status == "completed" and
                      .conclusion == "success") ] | length) == 1) then
                [$required[] as $check | $runs[] | select(
                  .name == $check.context and .app.id == $check.integration_id and
                  .head_sha == $head and .status == "completed" and
                  .conclusion == "success")]
              else error("forward-port PR head lacks one configured successful check identity") end' \
              <<<"$check_pages")
            evidence=$(jq -cnS --arg source "$source" --arg result "$result" \
              --arg source_patch_id "$source_patch_id" --arg result_patch_id "$result_patch_id" \
              --arg target_ref "$target_ref" --argjson pr "$forward_pr" \
              --argjson approvals "$approvals" --argjson checks "$checks" \
              --argjson required_checks "$required_checks" \
              '{source_commit_sha:$source,result_commit_sha:$result,target_ref:$target_ref,
                equivalence:"stable_patch_id",source_patch_id:$source_patch_id,
                result_patch_id:$result_patch_id,required_checks:$required_checks,
                pr:{number:$pr.number,merged_at:$pr.merged_at,
                    merge_commit_sha:$pr.merge_commit_sha,base_ref:$pr.base.ref,
                    base_sha:$pr.base.sha,head_ref:$pr.head.ref,head_sha:$pr.head.sha,
                    author:{id:$pr.user.id,login:$pr.user.login},
                    merged_by:{id:$pr.merged_by.id,login:$pr.merged_by.login}},
                independent_approvals:$approvals,successful_check_runs:$checks}')
            printf '%s\n' "$evidence" >> convergence-receipt/forward-port-evidence.jsonl
          done < <(jq -r '.release_to_main.forward_ports[] |
                         [.source_commit_sha,.result_commit_sha,.target_ref] | @tsv' "$manifest")
          jq -csS . convergence-receipt/forward-port-evidence.jsonl \
            > convergence-receipt/forward-port-evidence.json
          rm convergence-receipt/forward-port-evidence.jsonl

          backports='[]'
          while IFS= read -r evidence; do
            receipt_sha256=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            backports=$(jq -cn --argjson rows "$backports" \
              --argjson evidence "$evidence" --arg receipt "$receipt_sha256" \
              '$rows + [{source_commit_sha:$evidence.source_commit_sha,
                         result_commit_sha:$evidence.result_commit_sha,
                         target_ref:$evidence.target_ref,
                         stable_patch_id:$evidence.source_patch_id,
                         receipt_sha256:$receipt}]')
          done < <(jq -cS '.[]' convergence-receipt/backport-evidence.json)

          classifications='[]'
          while IFS= read -r evidence; do
            classification_receipt_sha256=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            classifications=$(jq -cn --argjson rows "$classifications" \
              --argjson evidence "$evidence" --arg receipt "$classification_receipt_sha256" \
              '$rows + [{commit_sha:$evidence.commit_sha,kind:$evidence.kind,
                         reason:$evidence.reason,owner:$evidence.owner,
                         expires_at:$evidence.expires_at,
                         classification_receipt_sha256:$receipt}]')
          done < <(jq -cS '.[]' convergence-receipt/classification-evidence.json)

          forward_ports='[]'
          while IFS= read -r evidence; do
            receipt_sha256=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            forward_ports=$(jq -cn --argjson rows "$forward_ports" \
              --argjson evidence "$evidence" --arg receipt "$receipt_sha256" \
              '$rows + [{source_commit_sha:$evidence.source_commit_sha,
                         result_commit_sha:$evidence.result_commit_sha,
                         target_ref:$evidence.target_ref,
                         stable_patch_id:$evidence.source_patch_id,
                         receipt_sha256:$receipt}]')
          done < <(jq -cS '.[]' convergence-receipt/forward-port-evidence.json)
          fix_sources=$(jq -c '[.[] | select(.kind == "fix") | .commit_sha]' <<<"$classifications")
          forward_sources=$(jq -c '[.[].source_commit_sha]' <<<"$forward_ports")
          test "$(jq -cS 'sort' <<<"$fix_sources")" = "$(jq -cS 'sort' <<<"$forward_sources")"
          main_selected=$(jq -c '.main_to_release.selected_shas' "$manifest")
          backport_sources=$(jq -c '[.[].source_commit_sha]' <<<"$backports")
          test "$(jq -cS 'sort' <<<"$main_selected")" = "$(jq -cS 'sort' <<<"$backport_sources")"

          jq -n --sort-keys \
            --arg candidate_commit_sha "$CANDIDATE_COMMIT" --arg release_ref "$RELEASE_REF" \
            --arg main_head_sha "$MAIN_SHA" --arg release_head_sha "$RELEASE_SHA" \
            --arg review_summary_sha256 "$REVIEW_SUMMARY_SHA256" \
            --arg evidence_receipt_sha256 "$EVIDENCE_RECEIPT_SHA256" \
            --arg integration_receipt_sha256 "$INTEGRATION_RECEIPT_SHA256" \
            --arg integration_pr_number "$INTEGRATION_PR_NUMBER" \
            --arg integration_base_sha "$BASE_SHA" --arg integration_head_sha "$HEAD_SHA" \
            --arg release_inventory_head_sha "$inventory_head" \
            --arg manifest_blob_sha "$manifest_blob_sha" --arg manifest_sha256 "$manifest_sha256" \
            --argjson main_inventory "$main_inventory" --argjson main_selected "$main_selected" \
            --argjson backports "$backports" --argjson backport_sources "$backport_sources" \
            --argjson release_inventory "$release_inventory" --argjson classifications "$classifications" \
            --argjson forward_ports "$forward_ports" --argjson fix_sources "$fix_sources" \
            --argjson forward_sources "$forward_sources" \
            '{schema:"simple-release-convergence/3",producer:"protected_integration",
              inventory_origin:"protected_integration",candidate_commit_sha:$candidate_commit_sha,
              release_ref:$release_ref,main_head_sha:$main_head_sha,release_head_sha:$release_head_sha,
              review_summary_sha256:$review_summary_sha256,
              evidence_receipt_sha256:$evidence_receipt_sha256,
              integration_receipt_sha256:$integration_receipt_sha256,
              provider:{integration_pr_number:($integration_pr_number | tonumber),
                integration_base_sha:$integration_base_sha,
                integration_head_sha:$integration_head_sha,
                integration_merge_sha:$candidate_commit_sha,
                release_inventory_head_sha:$release_inventory_head_sha,
                reviewed_manifest_blob_sha:$manifest_blob_sha,
                reviewed_manifest_sha256:$manifest_sha256},
              main_to_release:{inventory_shas:$main_inventory,shared_fix_shas:$main_selected,
                selected_shas:$main_selected,backported_shas:$backport_sources,
                backport_receipt_sha256s:[$backports[].receipt_sha256],backports:$backports},
              release_to_main:{inventory_shas:$release_inventory,shared_fix_shas:$fix_sources,
                forward_ported_shas:$forward_sources,
                forward_port_receipt_sha256s:[$forward_ports[].receipt_sha256],
                classifications:$classifications,forward_ports:$forward_ports},
              mutation:"none",main_remains_independent:true}' \
            > convergence-receipt/convergence-receipt.json
          (cd convergence-receipt && sha256sum \
            backport-evidence.json check-evidence.json classification-evidence.json convergence-receipt.json \
            forward-port-evidence.json integration-evidence.json review-evidence.json \
            reviewed-convergence-manifest.json > convergence-receipt.sha256)
          receipt_sha256=$(sha256sum convergence-receipt/convergence-receipt.json | awk '{print $1}')
          echo "receipt_sha256=$receipt_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Protected integration convergence receipt"
            echo "- Artifact: convergence-receipt-${CANDIDATE_COMMIT}"
            echo "- Receipt SHA-256: ${receipt_sha256}"
            echo "- Integration PR: #${INTEGRATION_PR_NUMBER}"
            echo "- Candidate/release head: ${CANDIDATE_COMMIT}"
            echo "- Mutation: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest exact convergence receipt and provider evidence
        id: convergence_attestation
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            convergence-receipt/backport-evidence.json
            convergence-receipt/check-evidence.json
            convergence-receipt/classification-evidence.json
            convergence-receipt/convergence-receipt.json
            convergence-receipt/convergence-receipt.sha256
            convergence-receipt/forward-port-evidence.json
            convergence-receipt/integration-evidence.json
            convergence-receipt/review-evidence.json
            convergence-receipt/reviewed-convergence-manifest.json

      - name: Preserve attestation bundle with receipt
        env:
          BUNDLE_PATH: ${{ steps.convergence_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" convergence-receipt/convergence-receipt.sigstore.json

      - name: Upload immutable convergence receipt
        id: receipt_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: convergence-receipt/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
