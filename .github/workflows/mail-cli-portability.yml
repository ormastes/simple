name: Mail CLI host fixtures

on:
  pull_request:
    paths:
      - 'tools/mail-cli/**'
      - 'test/01_unit/tools/mail_cli/**'
      - 'src/app/mail_credentials/**'
      - 'src/app/devhub/email_config_sdn.spl'
      - 'scripts/ci/prepare_mail_config_helper.py'
      - '.github/workflows/mail-cli-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-fixtures:
    name: Mail host fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required tools
        shell: bash
        run: |
          command -v bash jq curl base64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the real shared SDN configuration helper
        env:
          MAIL_CI_PHASE2_PRODUCERS_JSON: ${{ vars.MAIL_CI_PHASE2_PRODUCERS_JSON }}
        run: python scripts/ci/prepare_mail_config_helper.py
      - name: Validate declared shell dialects
        shell: bash
        run: |
          bash -n tools/mail-cli/bin/mail tools/mail-cli/lib/*.bash
          for file in tools/mail-cli/lib/*.shs; do bash -n "$file"; done
      - name: Run client policy and shared-config scenarios
        shell: bash
        run: bash test/01_unit/tools/mail_cli/fixtures/pop3_credentials_probe.shs all
      - name: Check portable attachment encoding
        shell: bash
        run: bash test/01_unit/tools/mail_cli/fixtures/portable_attachment_probe.shs
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/01_unit/tools/mail_cli/fixtures/windows_launcher_probe.ps1
      - name: Verify actual loopback TLS POP3 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: python3 test/01_unit/tools/mail_cli/fixtures/loopback_pop3_probe.py
      - name: Preserve helper build and provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-config-helper-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/mail-config-helper/helper-build.log
            ${{ runner.temp }}/mail-config-helper/evidence.json
          if-no-files-found: ignore

# These host fixtures do not replace native Simple helper/SSpec acceptance.
# Real crypto and dev-hub execution still require an admitted self-hosted build.
