name: Mail CLI host fixtures

on:
  pull_request:
    paths:
      - 'tools/mail-cli/**'
      - 'test/01_unit/tools/mail_cli/**'
      - '.github/workflows/mail-cli-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-fixtures:
    name: Mail host fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required tools
        shell: bash
        run: |
          command -v bash jq curl base64
      - name: Run client policy and shared-config scenarios
        shell: bash
        run: bash test/01_unit/tools/mail_cli/fixtures/pop3_credentials_probe.shs all
      - name: Check portable attachment encoding
        shell: bash
        run: bash test/01_unit/tools/mail_cli/fixtures/portable_attachment_probe.shs
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/01_unit/tools/mail_cli/fixtures/windows_launcher_probe.ps1
      - name: Verify actual loopback TLS POP3 on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: python3 test/01_unit/tools/mail_cli/fixtures/loopback_pop3_probe.py

# These host fixtures do not replace native Simple helper/SSpec acceptance.
# Real crypto and dev-hub execution still require an admitted self-hosted build.
