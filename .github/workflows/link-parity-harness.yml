name: Link parity harness controls
on:
  pull_request:
    paths:
      - '.github/workflows/link-parity-harness.yml'
      - 'scripts/check/check-link-native-build-parity.shs'
      - 'scripts/check/check-link-parity-*.shs'
      - 'scripts/check/fixtures/link-parity-driver.shs'
      - 'test/fixtures/linker/parity_sanity/main.spl'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject planted failures and preserve matrix continuation
        run: sh scripts/check/check-link-parity-selftest.shs
      - name: Retain shell-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-parity-harness-controls
          path: /tmp/link-parity-controls.*
          if-no-files-found: error
