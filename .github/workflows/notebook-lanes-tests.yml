name: Notebook Lanes Tests

# Notebook-lanes CI (Jupyter kernel + Simple Lab web notebook).
# Plan: doc/03_plan/agent_tasks/notebook_lanes_parallel_plan_2026-08-07.md (Stream E, E2)
# Wiki:  doc/00_llm_process/feature_expert/notebook_lanes/skill.md
#
# `bin/simple run`/`bin/simple test` cold-start compile+lint pass measures
# ~50s+ before real work starts in a fresh CI checkout — every step below
# budgets generously (200s+ per spec subprocess, 30-45min job timeouts)
# rather than trying to "fix" that startup cost.

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/nogc_sync_mut/notebook/**'
      - 'src/app/jupyter_kernel/**'
      - 'src/app/simple_lab/**'
      - 'src/app/repl/**'
      - 'tools/jupyter/**'
      - 'test/01_unit/lib/notebook/**'
      - 'test/01_unit/app/simple_lab/**'
      - 'test/02_integration/app/jupyter_kernel_log_modes_spec.spl'
      - 'test/03_system/tools/jupyter/**'
      - 'test/03_system/tools/simple_lab/**'
      - 'scripts/test/jupyter-docker-test.shs'
      - '.github/workflows/notebook-lanes-tests.yml'
  pull_request:
    paths:
      - 'src/lib/nogc_sync_mut/notebook/**'
      - 'src/app/jupyter_kernel/**'
      - 'src/app/simple_lab/**'
      - 'src/app/repl/**'
      - 'tools/jupyter/**'
      - 'test/01_unit/lib/notebook/**'
      - 'test/01_unit/app/simple_lab/**'
      - 'test/02_integration/app/jupyter_kernel_log_modes_spec.spl'
      - 'test/03_system/tools/jupyter/**'
      - 'test/03_system/tools/simple_lab/**'
      - 'scripts/test/jupyter-docker-test.shs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Pure in-process unit specs, all runners (Linux, macOS, Windows). These
  # four specs (K1/K3/K4/H2/L2) exercise session-manager/magics/lane-lock
  # state and the Lab UI's semantic-command layer directly — no subprocess
  # spawn of a deployed `bin/simple`, so they are genuinely runner-agnostic.
  # F2 (doc/07_guide/infra/testing.md): directory/section runs must be
  # SEQUENTIAL against the shared test DB, so each spec file is its own step
  # run one at a time rather than a parallel directory glob.
  # ============================================================================
  kernel-lab-specs-unit:
    name: Kernel + Lab unit specs (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS aarch64
          - os: windows-latest
            name: Windows x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/compiler_rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: notebook-lanes-${{ matrix.os }}-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            notebook-lanes-${{ matrix.os }}-bootstrap-

      - name: Build Simple bootstrap seed
        working-directory: src/compiler_rust
        run: cargo build --profile bootstrap -p simple-driver

      - name: Resolve SIMPLE_BIN
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="src/compiler_rust/target/bootstrap/simple.exe"
          else
            bin="src/compiler_rust/target/bootstrap/simple"
          fi
          test -x "$bin"
          echo "SIMPLE_BIN=$bin" >> "$GITHUB_ENV"

      - name: Unit — kernel_session_manager_spec (K1)
        shell: bash
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/01_unit/lib/notebook/kernel_session_manager_spec.spl --mode=interpreter

      - name: Unit — lane_locks_spec (H2)
        shell: bash
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/01_unit/lib/notebook/lane_locks_spec.spl --mode=interpreter

      - name: Unit — magics_spec (K3)
        shell: bash
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/01_unit/lib/notebook/magics_spec.spl --mode=interpreter

      - name: Unit — lab_ui_semantic_spec (L2)
        shell: bash
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/01_unit/app/simple_lab/lab_ui_semantic_spec.spl --mode=interpreter

  # ============================================================================
  # Subprocess-spawning specs (Linux + macOS only). These specs shell out to a
  # real deployed `{repo_root}/bin/simple` (via `env`/rt_process_spawn_*) to
  # exercise the kernel/Lab server/`--sdoctest` for real, so `bin/simple` must
  # actually exist at the repo root, and the POSIX process-spawn path they use
  # is not exercised on Windows here — that is a real, currently-untested gap
  # rather than an implicit claim of Windows coverage.
  # ============================================================================
  kernel-lab-specs-system:
    name: Kernel + Lab system specs (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/compiler_rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: notebook-lanes-system-${{ matrix.os }}-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            notebook-lanes-system-${{ matrix.os }}-bootstrap-

      - name: Build Simple bootstrap seed and deploy bin/simple
        run: |
          cd src/compiler_rust
          cargo build --profile bootstrap -p simple-driver
          test -x target/bootstrap/simple
          mkdir -p ../../bin
          ln -sf ../src/compiler_rust/target/bootstrap/simple ../../bin/simple
          echo "SIMPLE_BIN=$(pwd)/target/bootstrap/simple" >> "$GITHUB_ENV"

      # NOTE: as of 2026-08-07 this spec is 8/9, not 9/9 — one example hits a
      # pre-existing, already-filed, unrelated `--sdoctest` subcommand defect
      # (doc/08_tracking/bug/sdoctest_mode_unknown_extern_rt_string_ends_with_2026-08-07.md).
      # Left wired and RED per .claude/rules/testing.md ("a correct spec that
      # fails is a legitimate artifact" / never skip without user approval):
      # this job WILL be red until that pre-existing, unrelated defect is
      # fixed. Exempting it (e.g. continue-on-error) needs explicit user
      # sign-off, not a unilateral CI-wiring call.
      - name: Unit — export_sdoctest_spec (L1)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/01_unit/app/simple_lab/export_sdoctest_spec.spl --mode=interpreter

      - name: Integration — jupyter_kernel_log_modes_spec
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/02_integration/app/jupyter_kernel_log_modes_spec.spl --mode=interpreter

      - name: System — jupyter_kernel_install_system_spec (P0)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/jupyter/jupyter_kernel_install_system_spec.spl --mode=interpreter

      - name: System — jupyter_execution_system_spec (P1)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/jupyter/jupyter_execution_system_spec.spl --mode=interpreter

      - name: System — jupyter_error_system_spec
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/jupyter/jupyter_error_system_spec.spl --mode=interpreter

      - name: System — jupyter_notebook_server_system_spec
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/jupyter/jupyter_notebook_server_system_spec.spl --mode=interpreter

      - name: System — jupyter_state_system_spec
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/jupyter/jupyter_state_system_spec.spl --mode=interpreter

      - name: System — lab_http_api_spec (L3)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/simple_lab/lab_http_api_spec.spl --mode=interpreter

      - name: System — lab_hardening_spec (H1)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/simple_lab/lab_hardening_spec.spl --mode=interpreter

      - name: System — lab_robustness_spec
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/simple_lab/lab_robustness_spec.spl --mode=interpreter

      - name: System — lab_shared_ui_contract_spec (L4)
        run: SIMPLE_LIB=src "$SIMPLE_BIN" test test/03_system/tools/simple_lab/lab_shared_ui_contract_spec.spl --mode=interpreter

  # ============================================================================
  # Docker Jupyter E2E (P3, landed): scripts/test/jupyter-docker-test.shs runs
  # a real kernel subprocess through jupyter nbconvert inside a throwaway
  # python3 container. Exit 3 (HOST-UNAVAILABLE, e.g. no docker daemon) is not
  # a failure on a runner that legitimately lacks docker; exit 1/2 is.
  # ============================================================================
  jupyter-docker-e2e:
    name: Docker Jupyter E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/compiler_rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: notebook-lanes-docker-e2e-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            notebook-lanes-docker-e2e-bootstrap-

      - name: Build Simple bootstrap seed and deploy bin/simple
        run: |
          cd src/compiler_rust
          cargo build --profile bootstrap -p simple-driver
          test -x target/bootstrap/simple
          mkdir -p ../../bin
          ln -sf ../src/compiler_rust/target/bootstrap/simple ../../bin/simple

      - name: Run jupyter-docker-test.shs
        run: sh scripts/test/jupyter-docker-test.shs

  # ============================================================================
  # galata (JupyterLab browser) extension tests — BLOCKED.
  # tools/jupyter/labextension/ has no pyproject.toml/hatch-jupyter-builder
  # federated-extension packaging, so `jupyter labextension develop` cannot
  # load it and galata/Playwright verification cannot run. See:
  # doc/08_tracking/bug/jupyter_labextension_missing_federated_build_packaging_2026-08-07.md
  # This job runs the extension's own Jest/tsc suite (the documented X2-X4
  # fallback level) and stops there — it is a placeholder for the real galata
  # job once the packaging gap is closed, not a stand-in for browser coverage.
  # ============================================================================
  galata-extension-tests:
    name: JupyterLab extension (Jest fallback; galata BLOCKED)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/jupyter/labextension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension dependencies
        run: npm ci

      - name: tsc -b (typecheck)
        run: npx tsc -b

      - name: Jest unit suite
        run: npx jest

      - name: Note — galata browser suite blocked
        run: |
          echo "::warning::galata/Playwright browser verification is blocked on the missing labextension packaging (pyproject.toml / hatch-jupyter-builder). See doc/08_tracking/bug/jupyter_labextension_missing_federated_build_packaging_2026-08-07.md. This job only ran the Jest/tsc fallback."

  # ============================================================================
  # GPU notebook fixtures (K5/K6) — PLACEHOLDER.
  # K5 (cuda executor) and K6 (vulkan executor) have not landed: both are
  # blocked on the GPU plan's D1 (src/lib/common/svmg/ref_vm.spl does not
  # exist yet), see doc/00_llm_process/feature_expert/notebook_lanes/skill.md
  # "Not yet started or still landing". There is no executor to run the
  # cuda-live/vulkan-live fixtures against yet, and no self-hosted
  # cuda-live/vulkan-live labeled runner is provisioned in this repo's GitHub
  # Actions fleet. This job runs on ubuntu-latest and does the same
  # structural-only fixture validation scripts/test/jupyter-docker-test.shs
  # already performs (valid ipynb JSON), then SKIPS the live-execution step
  # instead of failing, so the job is a real placeholder — not invented
  # infra it can't back up. Wire the live-execution step to
  # `runs-on: [self-hosted, cuda-live]` / `[self-hosted, vulkan-live]` once
  # K5/K6 land and those runners exist.
  # ============================================================================
  gpu-notebook-fixtures:
    name: GPU notebook fixtures (${{ matrix.lane }}) — placeholder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: cuda
            fixture: test/03_system/tools/jupyter/fixtures/mode_cuda.ipynb
            executor_task: K5
          - lane: vulkan
            fixture: test/03_system/tools/jupyter/fixtures/mode_vulkan.ipynb
            executor_task: K6
    steps:
      - uses: actions/checkout@v4

      - name: Structural-only fixture validation
        run: |
          python3 -c "import json; json.load(open('${{ matrix.fixture }}')); print('${{ matrix.fixture }}: valid ipynb JSON')"

      - name: Live execution on ${{ matrix.lane }}-live runner — SKIP (no executor, no runner)
        run: |
          echo "::notice::SKIP — ${{ matrix.executor_task }} executor has not landed (blocked on GPU plan D1: src/lib/common/svmg/ref_vm.spl) and no self-hosted ${{ matrix.lane }}-live runner is provisioned. This step is intentionally a documented skip, not a failure. See doc/00_llm_process/feature_expert/notebook_lanes/skill.md."

  # ============================================================================
  # Board fixtures — manual/host-aware only, never on push/PR (real board
  # hardware is not present in hosted CI runners). See
  # .claude/rules/board-runnable.md.
  # ============================================================================
  board-notebook-fixtures:
    name: Board notebook fixtures (manual, host-aware)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Host-aware board probe
        run: |
          echo "Board notebook fixtures require physical hardware attached to the"
          echo "runner (JTAG/QEMU-RV32 remote-exec lane, K4). Hosted GitHub Actions"
          echo "runners have none, so this job only validates presence of the"
          echo "qemu_rv32 fixture and reports host-unavailable rather than faking a"
          echo "pass. Run scripts/test/jupyter-docker-test.shs on a board-attached"
          echo "self-hosted runner for a real board pass/fail."
          test -f test/03_system/tools/jupyter/fixtures/mode_qemu_rv32.ipynb
          echo "verdict: HOST-UNAVAILABLE (documented, not a failure)"
