name: Lean type_inference_compile build (draft diag, never merge)
on:
  pull_request:
    paths:
      - '.github/workflows/lean-tic-diagnostic.yml'
permissions:
  contents: read
jobs:
  lake:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src/verification
      - name: Install elan + toolchain from lean-toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build
        working-directory: src/verification/type_inference_compile
        run: |
          cat lean-toolchain || true
          lake build 2>&1 | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0
      - name: axioms of new model
        working-directory: src/verification/type_inference_compile
        run: |
          printf 'import MonoBoundaryModel\n#print axioms mono_boundary_sound\n#print axioms defineVariant_preserves_type_binding\n#print axioms resolveOwner_stable_under_variant\n' > /tmp/Ax.lean
          lake env lean /tmp/Ax.lean
