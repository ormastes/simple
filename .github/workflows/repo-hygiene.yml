      - name: Modern SSpec lane shape gate
        if: ${{ !cancelled() }}
        run: |
          sh scripts/check/check-sspec-lane-shape.shs

      # SimpleOS WM host-Vulkan pixel evidence.
      #
      # In-guest Vulkan does NOT exist: VulkanCompositorBackend.is_available()
      # is unconditionally false and every rt_vulkan_* is an ABSENT() stub in
      # the freestanding build. What exists is a guest->host ivshmem offload
      # to a real host Vulkan daemon. This gate captures a real framebuffer and
      # labels renderer=host-vulkan ONLY on the guest receipts AND the host
      # receipt together, because gui_entry_desktop.spl passes
      # backend_required: false and the WM silently falls back to CPU -- a
      # screenshot alone proves nothing.
      #
      # ADVISORY because it is honestly RED: the host daemon does not link
      # (53 tree-wide undefined rt_* symbols). The gate ERRORs at that
      # precondition rather than mislabelling a CPU frame, which is why no
      # renderer=host-vulkan claim exists anywhere. Promote to blocking once
      # the daemon builds.
      - name: SimpleOS WM host-Vulkan pixel evidence (advisory, daemon-blocked)
        run: sh scripts/check/check-simpleos-x86-64-wm-host-vulkan-pixel-evidence.shs || true
      # SimpleOS x86_64 hello world in-guest, under real OVMF pflash firmware
      # (GRUB-EFI -> multiboot; never -kernel, never isa-debug-exit -- the gate
      # self-checks the assembled QEMU argv). It also carries a call-path stub
      # guard that fails closed if any function on this lane was stub-fallbacked;
      # that guard caught _text_z_size silently becoming a 0-returning stub and
      # corrupting every ring-3 argv frame.
      #
      # ADVISORY because it is honestly RED at L6/L7: rungs L1-L5 pass (GRUB
      # handoff, kernel _start, NVMe online, the guest reading its own program
      # off its own FAT32 volume, ring-3 entry with the ELF admitted), then the
      # iretq into CPL3 triple-faults. The interpreter row is RED separately --
      # no in-guest Simple interpreter binary exists in this tree. Promote to
      # blocking once the program prints its own output.
      - name: SimpleOS x86_64 hello world in-guest (advisory, L6/L7 red)
        run: sh scripts/check/check-simpleos-hello-world-in-guest-ovmf.shs || true

      # SimpleOS VFS server round-trip: proves a server is genuinely RUNNING
      # via a filesystem round-trip, not by a banner or a path existing. A
      # per-run nonce is minted into generated source, checked across 7
      # nonce-anchored serial rungs AND independently host-side by finding the
      # nonce bytes physically present in the raw NVMe image. Its selftest
      # includes the case that matters: server NOT running but the path exists
      # carrying a stale nonce must FAIL.
      #
      # ADVISORY because it is honestly RED: the kernel does not link (both
      # linker scripts assign 65 syscall-shim aliases through a pre-split
      # prefix that no longer matches the emitted symbols). No VM boots, so the
      # gate reports ERROR rather than inventing a round-trip. Promote once the
      # weak-stub emission gap is closed.
      - name: SimpleOS VFS server round-trip (advisory, link-blocked)
        run: sh scripts/check/check-simpleos-vfs-server-roundtrip-ovmf.shs || true

      # SimpleOS aarch64 in-guest toolchain components (devtool/caret/testrun/mcp)
      # under EDK2/AAVMF real firmware. Each row demands a real FUNCTIONAL
      # round-trip, not a banner -- the selftest includes a banner-only
      # must-FAIL. devtool is genuinely GREEN (the real lint rule discriminates
      # in both directions in-guest); caret and testrun run to completion but
      # return wrong text results, and mcp does not link (rt_closure_new).
      #
      # ADVISORY because 1 of 4 rows passes. Promote as rows go green.
      - name: SimpleOS aarch64 in-guest components (advisory, 1 of 4 green)
        run: sh scripts/check/check-simpleos-aarch64-components-in-guest-efi.shs || true

      # SimpleOS riscv64 interpreter payload invariants.
      #
      # Checks the built guest interpreter is a statically linked RISC-V ELF64
      # carrying DEFINED interpret_hir_module + simpleos_interpret_file with no
      # strong undefined symbols. It is explicitly NOT an in-guest execution
      # claim -- the in-guest interpreter row stays RED until riscv64 has a boot
      # lane that mounts the guest FS and execs a U-mode ELF.
      #
      # ADVISORY: ERRORs when no payload is present, which is the normal state
      # on a fresh checkout (correct fail-closed behaviour, not a pass).
      - name: SimpleOS riscv64 interpreter payload (advisory, needs a built payload)
        run: sh scripts/check/check-simpleos-riscv64-interpreter-payload.shs || true

      # Wired 2026-09-01 to clear check-guard-wiring's NEW-unwired list. Each
      # boots a real guest under real firmware (OVMF / AAVMF / OpenSBI
      # fw_payload) and reads evidence back out, exactly like the sibling
      # advisory steps above; `|| true` keeps them reporting without gating,
      # since none has a CI green on record. Promote individually as each goes
      # green. Opting them out instead was rejected: the optout file is for
      # scripts that are NOT meant to gate, and these are evidence gates whose
      # lane already exists here.
      - name: SimpleOS arm64 WM Vulkan pixel evidence (advisory, first CI run)
        run: sh scripts/check/check-simpleos-arm64-wm-vulkan-pixel-evidence.shs || true

      - name: SimpleOS DBFS server round-trip under OVMF (advisory, first CI run)
        run: sh scripts/check/check-simpleos-dbfs-server-roundtrip-ovmf.shs || true

      - name: SimpleOS NVFS server round-trip under OVMF (advisory, first CI run)
        run: sh scripts/check/check-simpleos-nvfs-server-roundtrip-ovmf.shs || true

      - name: SimpleOS x86_64 in-guest components under OVMF (advisory, first CI run)
        run: sh scripts/check/check-simpleos-x86-64-components-in-guest-ovmf.shs || true

      - name: SimpleOS riscv64 in-guest components under OpenSBI (advisory, first CI run)
        run: sh scripts/check/check-simpleos-riscv64-components-in-guest-opensbi.shs || true

      - name: SimpleOS riscv64 in-guest interpreter under OpenSBI (advisory, first CI run)
        run: sh scripts/check/check-simpleos-riscv64-interpreter-in-guest-opensbi.shs || true

      - name: SimpleOS riscv64 WM render smoke under OpenSBI (advisory, first CI run)
        run: sh scripts/check/check-simpleos-riscv64-wm-render-smoke-opensbi.shs || true

      - name: riscv64 text primitive probe under OpenSBI (advisory diagnostic harness)
        run: sh scripts/check/run-riscv64-text-probe-opensbi.shs || true

      # Phase-3 diagnostics transport reproduce gate. ADVISORY, and honestly so:
      # it drives a real compile to prove the HIR error reaches the operator, so
      # without a deployed seed (SIMPLE_SEED) it exits 2, "ERROR — nothing was
      # checked". By this repo's own convention that is "could not determine",
      # never a pass — so as a blocking gate on a runner that has no seed it
      # fails every build for having nothing to say. Same reasoning that makes
      # push-dual-run-shadow advisory in config/check/must_check_gates.sdn.
      - name: Phase-3 diagnostics reported (needs a deployed seed)
        if: ${{ !cancelled() }}
        run: sh scripts/check/check-phase3-diagnostics-reported.shs

      # riscv64 S-mode trap vector, MOVED HERE 2026-09-06 from code-idiom-gates.
      #
      # The guard itself is UNCHANGED and unweakened -- it is not opted out, it
      # has no `|| true`, and its fail-closed contract stands: it COMPILES
      # boot_entry.c for riscv64 and reads the emitted vector symbol address,
      # and when no riscv64 cross toolchain exists it answers `ERROR — nothing
      # was checked ... absence of a compiler is absence of evidence` (rc=2),
      # exactly as the repo's guard convention requires.
      #
      # What was wrong was its WIRING, not the guard. `code-idiom-gates` is one
      # of the two required checks on `main`, and the hosted runner image ships
      # no riscv64-*-gcc / riscv64-*-nm, so that honest rc=2 turned the required
      # check RED for every PR in the repository (run 33848725129), blocking
      # work that has nothing to do with riscv64. A guard whose precondition the
      # runner cannot meet does not belong on a required job.
      #
      # Its sibling `check-rv64-unwrap-or-trap-unwraps.shs` stays in
      # code-idiom-gates and is untouched: it host-compiles, needs no cross
      # toolchain, and was measured PASS (5 cases executed).
      #
      # The apt line is best-effort, in the same spirit as the ripgrep/lld line
      # in the step above: if the cross toolchain installs, the guard genuinely
      # compiles and enforces here; if it does not, the guard says so honestly
      # inside a non-blocking job instead of blocking everyone. Promote back
      # into code-idiom-gates once the toolchain is a guaranteed part of that
      # job's environment.
      - name: riscv64 boot installs an S-mode trap vector (advisory; needs a riscv64 cross toolchain)
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -qq gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu >/dev/null 2>&1 || true
          sh scripts/check/check-riscv64-boot-installs-trap-vector.shs

  # Stage-3 bootstrap migration guards. ADVISORY, and honestly so: each one
