name: macOS Phase 2 and Phase 3 Evidence

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-phase23-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SIMPLE_WORKTREE_STORAGE_ROOT: ${{ github.workspace }}/.simple/storage

jobs:
  macos-phase23-evidence:
    name: macOS Phase 2/3 Evidence
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify repository Rust toolchain setup
        run: sh test/01_unit/scripts/macos_phase23_rust_toolchain_test.shs

      # Keep the channel and components aligned with compiler_rust/rust-toolchain.toml.
      # The authority fingerprint resolves installed tools before Cargo can install them.
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Produce and verify admitted Stage 2 and Stage 3
        run: sh scripts/check/run-macos-phase23-evidence.shs

      - name: Retain phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-phase23-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .simple/storage/build/bootstrap/**/*.env
            .simple/storage/build/bootstrap/**/*.receipt
            .simple/storage/build/bootstrap/**/*.log
            .simple/storage/build/bootstrap/**/*.txt
            .simple/storage/build/bootstrap/**/*.transcript
            build/verify/macos-stage2
            build/verify/macos-stage3
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
