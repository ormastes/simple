name: Build and qualify immutable candidate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Immutable candidate ref (candidate/vX.Y.Z[-pre.N]/aNNN)
        required: true
        type: string
      convergence_run_id:
        description: Successful protected-integration workflow run containing the reviewed convergence receipt
        required: true
        type: string
      convergence_artifact:
        description: Exact convergence receipt artifact name
        required: true
        type: string
      convergence_receipt_sha256:
        description: Expected SHA-256 of convergence-receipt.json
        required: true
        type: string

concurrency:
  group: candidate-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
  statuses: write
  id-token: write
  attestations: write

jobs:
  qualify-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable candidate ref
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.candidate_ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          candidate_ref="$PUSH_REF"
          if test "$EVENT_NAME" = workflow_dispatch; then
            candidate_ref="$REQUESTED_REF"
          fi
          [[ "$candidate_ref" =~ ^candidate/v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?/a[0-9]{3}$ ]]
          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.identity.outputs.candidate_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify live GitHub release policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          scripts/release/github-policy.shs verify-live "$GITHUB_REPOSITORY"

      - name: Verify release policy projection parity
        run: sh scripts/check/check-release-policy-parity.shs

      - name: Freeze candidate identity
        id: freeze
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          version=$(awk '$1 == "semver:" {print $2; exit}' release/version.sdn)
          test -n "$version"
          test "${{ steps.identity.outputs.candidate_ref }}" != "candidate/v${version}/a000"
          case "${{ steps.identity.outputs.candidate_ref }}" in
            candidate/v"$version"/a[0-9][0-9][0-9]) ;;
            *) echo "candidate ref/version mismatch" >&2; exit 1 ;;
          esac
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          attempt=${{ steps.identity.outputs.candidate_ref }}
          attempt_name=${attempt##*/}
          attempt=${attempt_name#a}
          echo "attempt=$((10#$attempt))" >> "$GITHUB_OUTPUT"
          echo "attempt_name=$attempt_name" >> "$GITHUB_OUTPUT"

      - name: Enforce create-once candidate artifact identity
        id: create_once
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: candidate-${{ steps.freeze.outputs.version }}-${{ steps.freeze.outputs.attempt_name }}-${{ steps.freeze.outputs.commit }}
          COMMIT: ${{ steps.freeze.outputs.commit }}
          STATUS_CONTEXT: simple-release/candidate/${{ steps.freeze.outputs.version }}/${{ steps.freeze.outputs.attempt_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # A rerun must allocate a new candidate attempt/ref; it may not
          # replace the identity reserved by an earlier execution. Commit
          # status history is durable beyond artifact retention and failures;
          # the candidate-ref concurrency group serializes this check/create.
          test "$RUN_ATTEMPT" = 1
          reservations=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT}/statuses?per_page=100" |
            jq -s --arg context "$STATUS_CONTEXT" \
              '[.[][] | select(.context == $context)] | length')
          test "$reservations" = 0 || {
            echo "candidate attempt was already reserved; allocate a new candidate attempt" >&2
            exit 1
          }
          existing=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" |
            jq -s --arg name "$ARTIFACT_NAME" \
              '[.[].artifacts[] | select(.name == $name)] | length')
          test "$existing" = 0 || {
            echo "candidate artifact identity already exists; allocate a new candidate attempt" >&2
            exit 1
          }
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description='Candidate attempt reserved; rebuilds require a new attempt' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          echo "reserved=true" >> "$GITHUB_OUTPUT"

      - name: Validate canonical version and required support policy
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
        run: |
          set -euo pipefail
          runtime=bin/release/x86_64-unknown-linux-gnu/simple
          test -x "$runtime"
          channel=stable
          case "$VERSION" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
          esac
          mkdir -p build/release-contract
          SIMPLE_LIB="$PWD/src" "$runtime" run src/app/release/main.spl \
            version-check --root=. --version="$VERSION" --channel="$channel" --json \
            > build/release-contract/version-check.json
          SIMPLE_LIB="$PWD/src" "$runtime" run src/app/release/main.spl \
            support-check --root=. --channel="$channel" \
            --observed-target=x86_64-unknown-linux-gnu --json \
            > build/release-contract/support-check.json
          jq -e '.status == "ok" and (.required_support | length > 0)' \
            build/release-contract/support-check.json >/dev/null
          jq -e '.support_matrix | length > (.required_support | length) and
            all(.required_support[]; .status == "passed") and
            all(.support_matrix[]; .status == "passed" or
              .status == "not_executed" or .status == "unsupported" or
              .status == "experimental")' \
            build/release-contract/support-check.json >/dev/null

      - name: Resolve exact protected-integration run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_RUN_ID: ${{ inputs.convergence_run_id }}
          RECEIPT_ARTIFACT: ${{ inputs.convergence_artifact }}
          RECEIPT_ARTIFACT_ID: ${{ inputs.convergence_artifact_id }}
          RECEIPT_ARTIFACT_DIGEST: ${{ inputs.convergence_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$RECEIPT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECEIPT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          artifact_digest=${RECEIPT_ARTIFACT_DIGEST#sha256:}
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECEIPT_RUN_ID}" --jq .conclusion)" = success
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECEIPT_RUN_ID}/artifacts")
          jq -e --arg name "$RECEIPT_ARTIFACT" --arg id "$RECEIPT_ARTIFACT_ID" \
            --arg digest "sha256:$artifact_digest" '
            [.artifacts[] | select((.id|tostring) == $id and .name == $name and
              .digest == $digest and .expired == false)] | length == 1' <<<"$artifacts" >/dev/null

      - name: Download exact protected-integration convergence receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.convergence_artifact }}
          path: build/convergence-receipt
          run-id: ${{ inputs.convergence_run_id }}
          github-token: ${{ github.token }}

      - name: Admit reviewed bidirectional convergence receipt
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
          COMMIT: ${{ steps.freeze.outputs.commit }}
          RECEIPT_RUN_ID: ${{ inputs.convergence_run_id }}
          EXPECTED_RECEIPT_SHA256: ${{ inputs.convergence_receipt_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt=build/convergence-receipt/convergence-receipt.json
          test -f "$receipt"
          test "${{ inputs.convergence_artifact }}" = "convergence-receipt-${COMMIT}"
          [[ "$RECEIPT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_RECEIPT_SHA256" "$receipt" | sha256sum --check --strict
          (cd build/convergence-receipt && sha256sum --check --strict convergence-receipt.sha256)
          for subject in \
            build/convergence-receipt/backport-evidence.json \
            build/convergence-receipt/check-evidence.json \
            build/convergence-receipt/classification-evidence.json \
            build/convergence-receipt/convergence-receipt.json \
            build/convergence-receipt/convergence-receipt.sha256 \
            build/convergence-receipt/forward-port-evidence.json \
            build/convergence-receipt/integration-evidence.json \
            build/convergence-receipt/review-admission-receipt.json \
            build/convergence-receipt/review-evidence.json \
            build/convergence-receipt/reviewed-convergence-manifest.json; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" >/dev/null
          done

          test "$(sha256sum build/convergence-receipt/integration-evidence.json | awk '{print $1}')" = \
            "$(jq -r '.integration_receipt_sha256' "$receipt")"
          test "$(sha256sum build/convergence-receipt/review-evidence.json | awk '{print $1}')" = \
            "$(jq -r '.review_summary_sha256' "$receipt")"
          test "$(sha256sum build/convergence-receipt/check-evidence.json | awk '{print $1}')" = \
            "$(jq -r '.evidence_receipt_sha256' "$receipt")"
          jq -cS . .github/release-convergence-manifest.json > build/reviewed-convergence-manifest.actual
          cmp build/reviewed-convergence-manifest.actual \
            build/convergence-receipt/reviewed-convergence-manifest.json
          test "$(git rev-parse "$COMMIT:.github/release-convergence-manifest.json")" = \
            "$(jq -r '.provider.reviewed_manifest_blob_sha' "$receipt")"
          test "$(sha256sum build/convergence-receipt/reviewed-convergence-manifest.json | awk '{print $1}')" = \
            "$(jq -r '.provider.reviewed_manifest_sha256' "$receipt")"

          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RECEIPT_RUN_ID}")
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$COMMIT"
          test "$(jq -r '.event' <<<"$run_json")" = workflow_dispatch
          test "$(jq -r '.path' <<<"$run_json")" = .github/workflows/pr-admission.yml

          release_line=$(printf '%s\n' "$VERSION" | awk -F. '{print $1 "." $2}')
          release_ref="release/$release_line"
          git fetch --no-tags --unshallow origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$release_ref:refs/remotes/origin/$release_ref"
          main_sha=$(git rev-parse refs/remotes/origin/main)
          release_sha=$(git rev-parse "refs/remotes/origin/$release_ref")
          test "$COMMIT" = "$release_sha"
          if git merge-base --is-ancestor "$release_sha" "$main_sha"; then
            echo "release head must remain independent from main" >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$main_sha" "$release_sha"; then
            echo "release head must not absorb the main development line" >&2
            exit 1
          fi

          integration_pr_number=$(jq -r '.provider.integration_pr_number' "$receipt")
          [[ "$integration_pr_number" =~ ^[1-9][0-9]*$ ]]
          provider_pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${integration_pr_number}")
          integration_base_sha=$(jq -r '.provider.integration_base_sha' "$receipt")
          integration_head_sha=$(jq -r '.provider.integration_head_sha' "$receipt")
          inventory_head=$(jq -r '.provider.release_inventory_head_sha' "$receipt")
          jq -e --arg release_ref "$release_ref" --arg commit "$COMMIT" \
            --arg base "$integration_base_sha" --arg head "$integration_head_sha" '
              .state == "closed" and .merged == true and .merged_at != null and
              .base.ref == $release_ref and .base.sha == $base and
              .head.sha == $head and .merge_commit_sha == $commit and
              .user.login != .merged_by.login' <<<"$provider_pr" >/dev/null
          jq -e --arg pr_number "$integration_pr_number" \
            --arg release_ref "$release_ref" --arg commit "$COMMIT" \
            --arg base "$integration_base_sha" --arg head "$integration_head_sha" '
              .schema == "simple-release-provider-integration/1" and
              .pr.number == ($pr_number | tonumber) and .pr.merged == true and
              .pr.base_ref == $release_ref and .pr.base_sha == $base and
              .pr.head_sha == $head and .pr.merge_commit_sha == $commit and
              .pr.author.login != .pr.merged_by.login' \
            build/convergence-receipt/integration-evidence.json >/dev/null
          parents=$(git show -s --format='%P' "$COMMIT")
          test "$parents" = "$integration_base_sha $integration_head_sha"
          [[ "$inventory_head" =~ ^[0-9a-f]{40}$ ]]
          test "$(jq -r '.release_inventory_head_sha' .github/release-convergence-manifest.json)" = \
            "$inventory_head"
          test "$(jq -r '.main_head_sha' .github/release-convergence-manifest.json)" = "$main_sha"
          test "$inventory_head" != "$integration_head_sha"
          git merge-base --is-ancestor "$integration_base_sha" "$inventory_head"
          git merge-base --is-ancestor "$inventory_head" "$integration_head_sha"
          administrative_paths=$(git log --format= --name-only \
            "$inventory_head..$integration_head_sha" | sed '/^$/d' | sort -u)
          test "$administrative_paths" = .github/release-convergence-manifest.json
          jq -e --arg release_ref "$release_ref" '
            .schema == "simple-release-convergence-manifest/2" and
            (.main_to_release.selected_shas | type == "array") and
            (.main_to_release.selected_shas | length) ==
              (.main_to_release.selected_shas | unique | length) and
            (.main_to_release.backports | type == "array") and
            (.main_to_release.backports | length) ==
              (.main_to_release.backports | map(.source_commit_sha) | unique | length) and
            ((.main_to_release.selected_shas | sort) ==
             (.main_to_release.backports | map(.source_commit_sha) | sort)) and
            all(.main_to_release.backports[];
                (.source_commit_sha | test("^[0-9a-f]{40}$")) and
                (.result_commit_sha | test("^[0-9a-f]{40}$")) and
                .target_ref == $release_ref) and
            all(.release_to_main.classifications[];
              (.kind == "fix" or .kind == "non_fix") and
              (if .kind == "non_fix" then
                 (.reason | type == "string" and test("^[^\\t\\r\\n]{3,256}$")) and
                 (.owner | type == "string" and test("^@[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$")) and
                 (.expires_at | type == "string" and
                  test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") and
                  (fromdateiso8601 > now))
               else
                 ((.reason // "") == "" and (.owner // "") == "" and
                  (.expires_at // "") == "")
               end))' .github/release-convergence-manifest.json >/dev/null
          session_id=$(jq -er '.session_id' \
            build/convergence-receipt/review-admission-receipt.json)
          scripts/release/github-policy.shs verify-review \
            build/convergence-receipt/review-admission-receipt.json \
            "$session_id" "$GITHUB_REPOSITORY"
          review_receipt_sha256=$(sha256sum \
            build/convergence-receipt/review-admission-receipt.json | awk '{print $1}')
          proof=build/convergence-receipt/verifier-unavailability-proof.json
          proof_sha256=$(sha256sum "$proof" | awk '{print $1}')
          test "$proof_sha256" = "$(jq -er '.verifier_unavailability_proof_sha256' "$receipt")"
          if test "$authority_class" = external_broker; then
            broker_app=$(jq -er '
              select(.configured == true and .apply_live == true and
                .implementation_status == "implemented_external_signed_broker" and
                .signed_receipt_protocol == "implemented") |
              .github_app_integration_id | select(type == "number" and . > 0)' \
              .github/review-admission-broker.json)
            jq -e --arg head "$integration_head_sha" \
              --arg receipt_sha256 "$review_receipt_sha256" \
              --arg mode "$(jq -r '.mode' build/convergence-receipt/review-admission-receipt.json)" \
              --argjson broker_app "$broker_app" '
                .schema == "simple-release-provider-review/2" and
                .authority_class == "external_broker" and .verification_performed == true and
                .github_pr_approval_claimed == false and
                .head_sha == $head and .mode == $mode and
                .review_receipt_sha256 == $receipt_sha256 and
                .broker_check.name == "SPipe Review Admission" and
                .broker_check.app.id == $broker_app and
                .broker_check.head_sha == $head and
                .broker_check.status == "completed" and
                .broker_check.conclusion == "success" and
                (.audit_artifact.workflow_run_id | type == "number") and
                (.audit_artifact.artifact_id | type == "number") and
                (.audit_artifact.digest | test("^sha256:[0-9a-f]{64}$"))' \
              build/convergence-receipt/review-evidence.json >/dev/null
            jq -e '.schema == "simple-verifier-unavailability/1" and .applicable == false' \
              "$proof" >/dev/null
          else
            test "$authority_class" = owner_attested_actions
            test "$proof_sha256" = "$(jq -er '.verifier_unavailability_proof_sha256' build/convergence-receipt/review-evidence.json)"
            jq -e '.authority_class == "owner_attested_actions" and
              .verification_performed == false and .github_pr_approval_claimed == false' \
              "$receipt" >/dev/null
            jq -e --arg head "$integration_head_sha" --arg receipt "$review_receipt_sha256" \
              --arg run "$RECEIPT_RUN_ID" '
              .schema == "simple-release-provider-review/3" and
              .authority_class == "owner_attested_actions" and
              .mode == "owner_attested_fallback" and .head_sha == $head and
              .review_receipt_sha256 == $receipt and
              .verification_performed == false and .github_pr_approval_claimed == false and
              .owner_attestation == "NO-VERIFY:OWNER-PROOF" and
              (.workflow.run_id|tostring) == $run and
              .workflow.path == ".github/workflows/pr-admission.yml" and
              .workflow.ref == "refs/heads/main" and
              .policy.environment == "owner-convergence-admission"' \
              build/convergence-receipt/review-evidence.json >/dev/null
            jq -e '.schema == "simple-verifier-unavailability/1" and
              .reason == "no eligible independent reviewer" and
              .external_broker_available == false and
              .owner_attestation == "NO-VERIFY:OWNER-PROOF" and
              .attestor == {type:"User",id:2378857} and
              ((.expires_at|fromdateiso8601)-(.issued_at|fromdateiso8601)) <= 28800 and
              (.expires_at|fromdateiso8601) > now' "$proof" >/dev/null
            run_head=$(jq -er '.workflow.run_head_sha' build/convergence-receipt/review-evidence.json)
            for binding in \
              "environment_sha256:.github/owner-convergence-admission-environment.json" \
              "config_sha256:.github/review-admission-broker.json" \
              "main_ruleset_sha256:.github/rulesets/spipe-vcs-v3-main.json" \
              "release_ruleset_sha256:.github/rulesets/spipe-vcs-v3-release-lines.json"; do
              field=${binding%%:*}; path=${binding#*:}
              expected=$(jq -er --arg field "$field" '.policy[$field]' build/convergence-receipt/review-evidence.json)
              actual=$(git show "$run_head:$path" | sha256sum | awk '{print $1}')
              test "$actual" = "$expected"
            done
          fi
          required_checks=$(jq -cS '
            [.rules[] | select(.type == "required_status_checks") |
             .parameters.required_status_checks[] | {context,integration_id}]' \
            .github/rulesets/spipe-vcs-v3-release-lines.json)
          test "$(jq 'length' <<<"$required_checks")" -gt 0
          jq -e --arg head "$integration_head_sha" --argjson required "$required_checks" '
              . as $evidence |
              $evidence.schema == "simple-release-provider-checks/1" and
              $evidence.head_sha == $head and $evidence.required_checks == $required and
              ($evidence.successful_check_runs | length) == ($required | length) and
              all($evidence.successful_check_runs[];
                  .head_sha == $head and .status == "completed" and
                  .conclusion == "success") and
              all($required[]; . as $check |
                  any($evidence.successful_check_runs[];
                      .name == $check.context and
                      .app.id == $check.integration_id))' \
            build/convergence-receipt/check-evidence.json >/dev/null

      # GitHub rejects a workflow before job creation when one `run` template
      # exceeds its service limit. Keep this replay in a second fail-closed
      # step and reconstruct every local from immutable checked-in/receipt data.
      - name: Replay convergence content and run pure admission
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
          COMMIT: ${{ steps.freeze.outputs.commit }}
          CANDIDATE_REF: ${{ steps.identity.outputs.candidate_ref }}
          EXPECTED_RECEIPT_SHA256: ${{ inputs.convergence_receipt_sha256 }}
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          receipt=build/convergence-receipt/convergence-receipt.json
          test -f "$receipt"
          release_ref=$(jq -er '.release_ref' "$receipt")
          main_sha=$(git rev-parse refs/remotes/origin/main)
          release_sha=$(git rev-parse "refs/remotes/origin/$release_ref")
          inventory_head=$(jq -er '.provider.release_inventory_head_sha' "$receipt")
          integration_pr_number=$(jq -er '.provider.integration_pr_number' "$receipt")
          integration_head_sha=$(jq -er '.provider.integration_head_sha' "$receipt")
          required_checks=$(jq -cS '
            [.rules[] | select(.type == "required_status_checks") |
             .parameters.required_status_checks[] | {context,integration_id}]' \
            .github/rulesets/spipe-vcs-v3-release-lines.json)

          # Exact inventories are recomputed from fetched protected refs.  The
          # reviewed receipt must classify every source-only commit, including
          # the legitimate empty case; an invented [] cannot conceal drift.
          git rev-list --topo-order "$inventory_head..$main_sha" > build/main-to-release.actual
          git rev-list --topo-order "$main_sha..$inventory_head" > build/release-to-main.actual
          jq -r '.main_to_release.inventory_shas[]' "$receipt" > build/main-to-release.receipt
          jq -r '.release_to_main.inventory_shas[]' "$receipt" > build/release-to-main.receipt
          diff -u build/main-to-release.actual build/main-to-release.receipt
          diff -u build/release-to-main.actual build/release-to-main.receipt

          jq -e --arg commit "$COMMIT" --arg release_ref "$release_ref" \
            --arg main "$main_sha" --arg release "$release_sha" \
            --arg inventory_head "$inventory_head" \
            '.schema == "simple-release-convergence/3" and
             .producer == "protected_integration" and
             .inventory_origin == "protected_integration" and
             .candidate_commit_sha == $commit and .release_ref == $release_ref and
             .main_head_sha == $main and .release_head_sha == $release and
             .provider.integration_merge_sha == $commit and
             (.provider.integration_pr_number | type == "number") and
             (.provider.integration_base_sha | test("^[0-9a-f]{40}$")) and
             (.provider.integration_head_sha | test("^[0-9a-f]{40}$")) and
             .provider.release_inventory_head_sha == $inventory_head and
             (.review_summary_sha256 | test("^[0-9a-f]{64}$")) and
             (.evidence_receipt_sha256 | test("^[0-9a-f]{64}$")) and
             (.integration_receipt_sha256 | test("^[0-9a-f]{64}$")) and
             (.main_to_release.shared_fix_shas | type == "array") and
             (.main_to_release.selected_shas | type == "array") and
             (.main_to_release.backported_shas | type == "array") and
             (.main_to_release.backport_receipt_sha256s | type == "array") and
             (.main_to_release.backports | type == "array") and
             all(.main_to_release.backports[];
                 (.source_commit_sha | test("^[0-9a-f]{40}$")) and
                 (.result_commit_sha | test("^[0-9a-f]{40}$")) and
                 .target_ref == $release_ref and
                 (.stable_patch_id | test("^[0-9a-f]{40}$")) and
                 (.receipt_sha256 | test("^[0-9a-f]{64}$"))) and
             (.release_to_main.shared_fix_shas | type == "array") and
             (.release_to_main.forward_ported_shas | type == "array") and
             (.release_to_main.forward_port_receipt_sha256s | type == "array") and
             (.release_to_main.classifications | type == "array") and
             all(.release_to_main.classifications[];
                 (.commit_sha | test("^[0-9a-f]{40}$")) and
                 (.kind == "fix" or .kind == "non_fix") and
                 (.reason | type == "string") and (.owner | type == "string") and
                 (.expires_at | type == "string") and
                 (.classification_receipt_sha256 | test("^[0-9a-f]{64}$"))) and
             (.release_to_main.forward_ports | type == "array") and
             all(.release_to_main.forward_ports[];
                 (.source_commit_sha | test("^[0-9a-f]{40}$")) and
                 (.result_commit_sha | test("^[0-9a-f]{40}$")) and
                 .target_ref == "main" and
                 (.stable_patch_id | test("^[0-9a-f]{40}$")) and
                 (.receipt_sha256 | test("^[0-9a-f]{64}$")))' \
            "$receipt" >/dev/null

          stable_patch_id() {
            commit=$1
            git cat-file -e "${commit}^{commit}"
            git cat-file -e "${commit}^1"
            patch_line=$(git diff --binary --full-index "${commit}^1" "$commit" |
              git patch-id --stable)
            set -- $patch_line
            test "$#" = 2
            [[ "$1" =~ ^[0-9a-f]{40}$ ]]
            printf '%s\n' "$1"
          }
          test "$(jq '.main_to_release.backports | length' "$receipt")" = \
            "$(jq 'length' build/convergence-receipt/backport-evidence.json)"
          test "$(jq '.main_to_release.backports | length' \
            .github/release-convergence-manifest.json)" = \
            "$(jq 'length' build/convergence-receipt/backport-evidence.json)"
          jq -e '
            ((.main_to_release.selected_shas | sort) ==
             (.main_to_release.backports | map(.source_commit_sha) | sort)) and
            ((.main_to_release.backported_shas | sort) ==
             (.main_to_release.backports | map(.source_commit_sha) | sort)) and
            ((.main_to_release.backport_receipt_sha256s | sort) ==
             (.main_to_release.backports | map(.receipt_sha256) | sort))' \
            "$receipt" >/dev/null
          while IFS= read -r evidence; do
            source=$(jq -r '.source_commit_sha' <<<"$evidence")
            result=$(jq -r '.result_commit_sha' <<<"$evidence")
            target_ref=$(jq -r '.target_ref' <<<"$evidence")
            patch_id=$(stable_patch_id "$source")
            test "$patch_id" = "$(stable_patch_id "$result")"
            test "$target_ref" = "$release_ref"
            git merge-base --is-ancestor "$result" "$inventory_head"
            grep -Fxq -- "$source" build/main-to-release.actual
            grep -Fxq -- "$result" build/release-to-main.actual
            test "$(jq -r '.equivalence' <<<"$evidence")" = stable_patch_id
            test "$(jq -r '.source_patch_id' <<<"$evidence")" = "$patch_id"
            test "$(jq -r '.result_patch_id' <<<"$evidence")" = "$patch_id"
            test "$(jq -cS '.required_checks' <<<"$evidence")" = \
              "$(jq -cS . <<<"$required_checks")"
            test "$(jq -r '.integration_pr_number' <<<"$evidence")" = "$integration_pr_number"
            test "$(jq -r '.integration_head_sha' <<<"$evidence")" = "$integration_head_sha"
            test "$(jq -r '.review_receipt_sha256' <<<"$evidence")" = \
              "$(jq -r '.review_summary_sha256' "$receipt")"
            test "$(jq -r '.check_receipt_sha256' <<<"$evidence")" = \
              "$(jq -r '.evidence_receipt_sha256' "$receipt")"
            test "$(jq -r '.integration_receipt_sha256' <<<"$evidence")" = \
              "$(jq -r '.integration_receipt_sha256' "$receipt")"
            jq -e --arg source "$source" --arg result "$result" \
              --arg target_ref "$target_ref" '
              any(.main_to_release.backports[];
                  .source_commit_sha == $source and .result_commit_sha == $result and
                  .target_ref == $target_ref)' \
              .github/release-convergence-manifest.json >/dev/null
            digest=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            jq -e --arg source "$source" --arg result "$result" \
              --arg target_ref "$target_ref" --arg patch_id "$patch_id" \
              --arg digest "$digest" '
              any(.main_to_release.backports[];
                  .source_commit_sha == $source and .result_commit_sha == $result and
                  .target_ref == $target_ref and .stable_patch_id == $patch_id and
                  .receipt_sha256 == $digest)' "$receipt" >/dev/null
          done < <(jq -cS '.[]' build/convergence-receipt/backport-evidence.json)

          test "$(jq '.release_to_main.classifications | length' "$receipt")" = \
            "$(jq 'length' build/convergence-receipt/classification-evidence.json)"
          while IFS= read -r evidence; do
            source=$(jq -r '.commit_sha' <<<"$evidence")
            kind=$(jq -r '.kind' <<<"$evidence")
            reason=$(jq -r '.reason' <<<"$evidence")
            owner=$(jq -r '.owner' <<<"$evidence")
            expires_at=$(jq -r '.expires_at' <<<"$evidence")
            digest=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            jq -e --arg source "$source" --arg kind "$kind" --arg reason "$reason" \
              --arg owner "$owner" --arg expires_at "$expires_at" --arg digest "$digest" '
              any(.release_to_main.classifications[];
                  .commit_sha == $source and .kind == $kind and
                  .reason == $reason and .owner == $owner and
                  .expires_at == $expires_at and
                  .classification_receipt_sha256 == $digest)' \
              "$receipt" >/dev/null
          done < <(jq -cS '.[]' build/convergence-receipt/classification-evidence.json)

          test "$(jq '.release_to_main.forward_ports | length' "$receipt")" = \
            "$(jq 'length' build/convergence-receipt/forward-port-evidence.json)"
          main_required_checks=$(jq -cS '
            [.rules[] | select(.type == "required_status_checks") |
             .parameters.required_status_checks[] | {context,integration_id}]' \
            .github/rulesets/spipe-vcs-v3-main.json)
          test "$(jq 'length' <<<"$main_required_checks")" -gt 0
          authority_class=$(jq -er '.authority_class' "$receipt")
          scripts/release/verify-forward-port-authority.shs \
            "$authority_class" .github/review-admission-broker.json \
            "$main_required_checks" \
            build/convergence-receipt/forward-port-evidence.json
          while IFS= read -r evidence; do
            source=$(jq -r '.source_commit_sha' <<<"$evidence")
            result=$(jq -r '.result_commit_sha' <<<"$evidence")
            target_ref=$(jq -r '.target_ref' <<<"$evidence")
            patch_id=$(stable_patch_id "$source")
            test "$patch_id" = "$(stable_patch_id "$result")"
            test "$(jq -r '.equivalence' <<<"$evidence")" = stable_patch_id
            test "$(jq -r '.source_patch_id' <<<"$evidence")" = "$patch_id"
            test "$(jq -r '.result_patch_id' <<<"$evidence")" = "$patch_id"
            test "$(jq -cS '.required_checks' <<<"$evidence")" = \
              "$(jq -cS . <<<"$main_required_checks")"
            digest=$(printf '%s\n' "$evidence" | sha256sum | awk '{print $1}')
            git merge-base --is-ancestor "$result" "$main_sha"
            jq -e --arg source "$source" --arg result "$result" \
              --arg target_ref "$target_ref" --arg patch_id "$patch_id" \
              --arg digest "$digest" '
              any(.release_to_main.forward_ports[];
                  .source_commit_sha == $source and .result_commit_sha == $result and
                  .target_ref == $target_ref and .stable_patch_id == $patch_id and
                  .receipt_sha256 == $digest)' \
              "$receipt" >/dev/null
          done < <(jq -cS '.[]' build/convergence-receipt/forward-port-evidence.json)

          csv() { jq -r "$1 | join(\",\")" "$receipt"; }
          runtime=bin/release/x86_64-unknown-linux-gnu/simple
          SIMPLE_LIB="$PWD/src" "$runtime" run src/app/release/main.spl \
            convergence-admission --json --graph-independent \
            --candidate-commit-sha="$COMMIT" \
            --receipt-candidate-commit-sha="$(jq -r '.candidate_commit_sha' "$receipt")" \
            --release-ref="$release_ref" --main-head-sha="$main_sha" \
            --release-head-sha="$release_sha" --receipt-sha256="$EXPECTED_RECEIPT_SHA256" \
            --review-summary-sha256="$(jq -r '.review_summary_sha256' "$receipt")" \
            --evidence-receipt-sha256="$(jq -r '.evidence_receipt_sha256' "$receipt")" \
            --integration-receipt-sha256="$(jq -r '.integration_receipt_sha256' "$receipt")" \
            --inventory-origin="$(jq -r '.inventory_origin' "$receipt")" \
            --main-inventory="$(csv '.main_to_release.inventory_shas')" \
            --main-shared="$(csv '.main_to_release.shared_fix_shas')" \
            --main-selected="$(csv '.main_to_release.selected_shas')" \
            --main-backported="$(csv '.main_to_release.backported_shas')" \
            --main-backport-results="$(csv '.main_to_release.backports | map(.result_commit_sha)')" \
            --main-backport-targets="$(csv '.main_to_release.backports | map(.target_ref)')" \
            --backport-receipts="$(csv '.main_to_release.backport_receipt_sha256s')" \
            --release-inventory="$(csv '.release_to_main.inventory_shas')" \
            --release-classified="$(csv '.release_to_main.classifications | map(.commit_sha)')" \
            --release-classification-kinds="$(csv '.release_to_main.classifications | map(.kind)')" \
            --release-classification-receipts="$(csv '.release_to_main.classifications | map(.classification_receipt_sha256)')" \
            --release-forward-ported="$(csv '.release_to_main.forward_ported_shas')" \
            --release-forward-port-results="$(csv '.release_to_main.forward_ports | map(.result_commit_sha)')" \
            --release-forward-port-targets="$(csv '.release_to_main.forward_ports | map(.target_ref)')" \
            --forward-port-receipts="$(csv '.release_to_main.forward_port_receipt_sha256s')" \
            > build/release-contract/convergence-admission.json
          jq -e '.status == "ok" and .mutation == "none" and
            .main_remains_independent == true' build/release-contract/convergence-admission.json >/dev/null
          mkdir -p candidate
          cp "$receipt" candidate/convergence-receipt.json

      - name: Assemble admitted candidate without fallback
        env:
          VERSION: ${{ steps.freeze.outputs.version }}
          COMMIT: ${{ steps.freeze.outputs.commit }}
          ATTEMPT: ${{ steps.freeze.outputs.attempt }}
          CANDIDATE_REF: ${{ steps.identity.outputs.candidate_ref }}
          CREATOR_IDENTITY: github:${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          binary=bin/release/x86_64-unknown-linux-gnu/simple
          test -x "$binary"
          test -f release/support.sdn
          mkdir -p candidate
          cp "$binary" candidate/simple-x86_64-unknown-linux-gnu
          cp release/support.sdn candidate/support.sdn
          cp build/release-contract/support-check.json candidate/support-receipt.json
          cp CHANGELOG.md candidate/release-notes.md
          PKG_DIR="simple-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "candidate/${PKG_DIR}/bin"
          mkdir -p "candidate/${PKG_DIR}/share/simple/assets"
          cp "$binary" "candidate/${PKG_DIR}/bin/simple-runtime"
          printf '%s\n' '#!/bin/sh' 'SCRIPT_DIR=$(dirname -- "$0")' \
            'export SIMPLE_ASSET_ROOT="$SCRIPT_DIR/../share/simple"' \
            'exec "$SCRIPT_DIR/simple-runtime" "$@"' \
            > "candidate/${PKG_DIR}/bin/simple"
          chmod +x "candidate/${PKG_DIR}/bin/simple"
          cp -r assets/fonts "candidate/${PKG_DIR}/share/simple/assets/"
          cp LICENSE THIRD_PARTY_NOTICES.md "candidate/${PKG_DIR}/share/simple/"
          sh scripts/check_release_payload.shs --dir "candidate/${PKG_DIR}"
          tar -C candidate -czf "candidate/${PKG_DIR}.tar.gz" "$PKG_DIR"
          sh scripts/check_release_payload.shs --tar "candidate/${PKG_DIR}.tar.gz"
          rm -rf "candidate/${PKG_DIR}"
          "$binary" sbom . --out=candidate/simple.spdx.json \
            --name=ormastes.simple --version="$VERSION"
          test -s candidate/simple.spdx.json

          # Package the already-qualified native MCP binaries now. Publication
          # consumes these exact tarballs and is never allowed to rebuild them.
          for package_spec in \
            "tools/mcp-registry:simple_mcp_server:simple-lang-mcp-server-${VERSION}.tgz" \
            "tools/lsp-mcp-registry:simple_lsp_mcp_server:simple-lang-lsp-mcp-server-${VERSION}.tgz"; do
            package_dir=${package_spec%%:*}
            package_tail=${package_spec#*:}
            native_name=${package_tail%%:*}
            output_name=${package_tail#*:}
            native_binary="bin/release/x86_64-unknown-linux-gnu/${native_name}"
            test -x "$native_binary"
            staging=$(mktemp -d "$RUNNER_TEMP/simple-npm.XXXXXX")
            cp "$package_dir/package.json" "$package_dir/server.json" \
              "$package_dir/README.md" "$staging/"
            mkdir "$staging/native"
            install -m 0755 "$native_binary" "$staging/native/$native_name"
            test "$(PACKAGE_JSON="$staging/package.json" node -p \
              'require(process.env.PACKAGE_JSON).version')" = "$VERSION"
            packed=$(npm pack "$staging" --pack-destination candidate --json |
              jq -r 'if length == 1 then .[0].filename else error("unexpected npm pack result") end')
            test -f "candidate/$packed"
            if test "$packed" != "$output_name"; then
              mv "candidate/$packed" "candidate/$output_name"
            fi
            rm -rf "$staging"
          done

          (cd candidate && sha256sum \
            simple-x86_64-unknown-linux-gnu \
            "${PKG_DIR}.tar.gz" \
            "simple-lang-mcp-server-${VERSION}.tgz" \
            "simple-lang-lsp-mcp-server-${VERSION}.tgz" \
            simple.spdx.json support.sdn support-receipt.json release-notes.md \
            convergence-receipt.json > artifacts.sha256)
          source_tree_sha256=$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')
          artifact_manifest_sha256=$(sha256sum candidate/artifacts.sha256 | awk '{print $1}')
          policy_sha256=$(sha256sum .spipe/policy/vcs.sdn | awk '{print $1}')
          version_manifest_sha256=$(sha256sum release/version.sdn | awk '{print $1}')
          support_manifest_sha256=$(sha256sum release/support.sdn | awk '{print $1}')
          toolchain_manifest_sha256=$(sha256sum src/compiler_rust/Cargo.lock | awk '{print $1}')
          convergence_receipt_sha256=$(sha256sum candidate/convergence-receipt.json | awk '{print $1}')
          deploy_receipt="bin/release/x86_64-unknown-linux-gnu/bootstrap-deploy-receipt.env"
          test -s "$deploy_receipt"
          deploy_receipt_sha256=$(sha256sum "$deploy_receipt" | awk '{print $1}')
          jq -n \
            --arg candidate_commit_sha "$COMMIT" \
            --arg deploy_receipt_sha256 "$deploy_receipt_sha256" \
            '{schema:"simple-release-build-graph/1",
              candidate_commit_sha:$candidate_commit_sha,
              bootstrap_deploy_receipt_sha256:$deploy_receipt_sha256,
              strategy:"full",release_mode:true}' > candidate/build-graph.json
          build_graph_sha256=$(sha256sum candidate/build-graph.json | awk '{print $1}')
          required_support=$(jq -c '.required_support' build/release-contract/support-check.json)
          required_support_sha256=$(printf '%s' "$required_support" | sha256sum | awk '{print $1}')
          support_matrix=$(jq -c '.support_matrix' build/release-contract/support-check.json)
          support_receipt_sha256=$(sha256sum candidate/support-receipt.json | awk '{print $1}')
          jq -n \
            --arg artifact_manifest_sha256 "$artifact_manifest_sha256" \
            --arg build_graph_sha256 "$build_graph_sha256" \
            --arg convergence_receipt_sha256 "$convergence_receipt_sha256" \
            --arg required_support_sha256 "$required_support_sha256" \
            --arg support_receipt_sha256 "$support_receipt_sha256" \
            --argjson required_support "$required_support" \
            --argjson support_matrix "$support_matrix" \
            '{schema:"simple-release-evidence/1",
              artifact_manifest_sha256:$artifact_manifest_sha256,
              build_graph_sha256:$build_graph_sha256,
              convergence_receipt_sha256:$convergence_receipt_sha256,
              required_support_sha256:$required_support_sha256,
              support_receipt_sha256:$support_receipt_sha256,
              required_support:$required_support,
              support_matrix:$support_matrix,
              bootstrap:"passed",whole_tests:"passed"}' \
            > candidate/evidence-manifest.json
          evidence_manifest_sha256=$(sha256sum candidate/evidence-manifest.json | awk '{print $1}')
          jq -n \
            --arg version "$VERSION" \
            --argjson attempt "$ATTEMPT" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg commit_sha "$COMMIT" \
            --arg source_tree_sha256 "$source_tree_sha256" \
            --arg policy_sha256 "$policy_sha256" \
            --arg version_manifest_sha256 "$version_manifest_sha256" \
            --arg toolchain_manifest_sha256 "$toolchain_manifest_sha256" \
            --arg support_manifest_sha256 "$support_manifest_sha256" \
            --arg build_graph_sha256 "$build_graph_sha256" \
            --arg creator_identity "$CREATOR_IDENTITY" \
            --arg evidence_manifest_sha256 "$evidence_manifest_sha256" \
            '{schema:"simple-release-candidate/1",version:$version,attempt:$attempt,
              candidate_ref:$candidate_ref,commit_sha:$commit_sha,
              source_tree_sha256:$source_tree_sha256,policy_sha256:$policy_sha256,
              version_manifest_sha256:$version_manifest_sha256,
              toolchain_manifest_sha256:$toolchain_manifest_sha256,
              support_manifest_sha256:$support_manifest_sha256,
              build_graph_sha256:$build_graph_sha256,creator_identity:$creator_identity,
              evidence_manifest_sha256:$evidence_manifest_sha256}' \
            > candidate/candidate-manifest.json
          SIMPLE_LIB="$PWD/src" "$binary" run src/app/release/main.spl candidate-check --json \
            --version="$VERSION" --attempt="$ATTEMPT" --candidate-ref="$CANDIDATE_REF" \
            --commit-sha="$COMMIT" --source-sha256="$source_tree_sha256" \
            --policy-sha256="$policy_sha256" --version-sha256="$version_manifest_sha256" \
            --toolchain-sha256="$toolchain_manifest_sha256" --support-sha256="$support_manifest_sha256" \
            --build-graph-sha256="$build_graph_sha256" --creator-identity="$CREATOR_IDENTITY" \
            --evidence-sha256="$evidence_manifest_sha256" > candidate/candidate-check.json
          candidate_identity=$(jq -er '.candidate_identity' candidate/candidate-check.json)
          jq --arg candidate_identity "$candidate_identity" \
            '. + {candidate_identity:$candidate_identity}' candidate/candidate-manifest.json \
            > candidate/candidate-manifest.json.new
          mv candidate/candidate-manifest.json.new candidate/candidate-manifest.json
          jq -n \
            --arg candidate_identity "$candidate_identity" \
            --arg candidate_commit_sha "$COMMIT" \
            --arg build_graph_sha256 "$build_graph_sha256" \
            --arg artifact_manifest_sha256 "$artifact_manifest_sha256" \
            --arg evidence_manifest_sha256 "$evidence_manifest_sha256" \
            --arg convergence_receipt_sha256 "$convergence_receipt_sha256" \
            --arg required_support_sha256 "$required_support_sha256" \
            --arg support_receipt_sha256 "$support_receipt_sha256" \
            --argjson required_support "$required_support" \
            --argjson support_matrix "$support_matrix" \
            '{schema:"simple-release-qualification/1",
              candidate_identity:$candidate_identity,
              candidate_commit_sha:$candidate_commit_sha,
              build_graph_sha256:$build_graph_sha256,
              artifact_manifest_sha256:$artifact_manifest_sha256,
              evidence_manifest_sha256:$evidence_manifest_sha256,
              convergence_receipt_sha256:$convergence_receipt_sha256,
              required_support_sha256:$required_support_sha256,
              support_receipt_sha256:$support_receipt_sha256,
              required_support:$required_support,
              support_matrix:$support_matrix,
              required_support_passed:true}' \
            > candidate/qualification.json
          qualification_receipt_sha256=$(sha256sum candidate/qualification.json | awk '{print $1}')
          jq -n \
            --arg version "$VERSION" \
            --argjson candidate_attempt "$ATTEMPT" \
            --arg candidate_ref "$CANDIDATE_REF" \
            --arg candidate_identity "$candidate_identity" \
            --arg candidate_commit_sha "$COMMIT" \
            --arg source_tree_sha256 "$source_tree_sha256" \
            --arg artifact_manifest_sha256 "$artifact_manifest_sha256" \
            --arg policy_sha256 "$policy_sha256" \
            --arg version_manifest_sha256 "$version_manifest_sha256" \
            --arg support_manifest_sha256 "$support_manifest_sha256" \
            --arg toolchain_manifest_sha256 "$toolchain_manifest_sha256" \
            --arg build_graph_sha256 "$build_graph_sha256" \
            --arg creator_identity "$CREATOR_IDENTITY" \
            --arg evidence_manifest_sha256 "$evidence_manifest_sha256" \
            --arg qualification_receipt_sha256 "$qualification_receipt_sha256" \
            --arg convergence_receipt_sha256 "$convergence_receipt_sha256" \
            --arg required_support_sha256 "$required_support_sha256" \
            --arg support_receipt_sha256 "$support_receipt_sha256" \
            --argjson required_support "$required_support" \
            --argjson support_matrix "$support_matrix" \
            '{schema:"simple-release-admission/1", version:$version,
              candidate_attempt:$candidate_attempt,candidate_ref:$candidate_ref,
              candidate_identity:$candidate_identity,candidate_commit_sha:$candidate_commit_sha,
              source_tree_sha256:$source_tree_sha256,
              artifact_manifest_sha256:$artifact_manifest_sha256,
              policy_sha256:$policy_sha256,
              version_manifest_sha256:$version_manifest_sha256,
              support_manifest_sha256:$support_manifest_sha256,
              toolchain_manifest_sha256:$toolchain_manifest_sha256,
              build_graph_sha256:$build_graph_sha256,creator_identity:$creator_identity,
              evidence_manifest_sha256:$evidence_manifest_sha256,
              qualification_receipt_sha256:$qualification_receipt_sha256,
              convergence_receipt_sha256:$convergence_receipt_sha256,
              required_support_sha256:$required_support_sha256,
              support_receipt_sha256:$support_receipt_sha256,
              required_support:$required_support,required_support_passed:true,
              support_matrix:$support_matrix,
              admitted:true,rebuild_allowed:false,fallback_used:false}' \
            > candidate/release-admission.json
          sha256sum candidate/release-admission.json > candidate/release-admission.sha256

      - name: Attest admitted compiler provenance
        id: attest
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            candidate/simple-x86_64-unknown-linux-gnu
            candidate/simple-${{ steps.freeze.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz
            candidate/simple-lang-mcp-server-${{ steps.freeze.outputs.version }}.tgz
            candidate/simple-lang-lsp-mcp-server-${{ steps.freeze.outputs.version }}.tgz

      - name: Bind provenance to admission
        env:
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -n "$ATTESTATION_ID"
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" candidate/provenance.sigstore.json
          jq --arg id "$ATTESTATION_ID" --arg url "$ATTESTATION_URL" \
            '. + {provenance_attestation_id:$id,provenance_attestation_url:$url}' \
            candidate/release-admission.json > candidate/release-admission.json.new
          mv candidate/release-admission.json.new candidate/release-admission.json
          sha256sum candidate/release-admission.json > candidate/release-admission.sha256

      - name: Upload immutable candidate bundle
        id: candidate_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ steps.freeze.outputs.version }}-${{ steps.freeze.outputs.attempt_name }}-${{ steps.freeze.outputs.commit }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Emit immutable candidate artifact identity
        env:
          ARTIFACT_ID: ${{ steps.candidate_bundle.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate_bundle.outputs.artifact-digest }}
          ARTIFACT_NAME: candidate-${{ steps.freeze.outputs.version }}-${{ steps.freeze.outputs.attempt_name }}-${{ steps.freeze.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          {
            echo '## Immutable candidate artifact identity'
            echo
            echo "- artifact-id: $ARTIFACT_ID"
            echo "- artifact-digest: $ARTIFACT_DIGEST"
            echo "- artifact-name: $ARTIFACT_NAME"
            echo "- workflow-run-id: $GITHUB_RUN_ID"
            echo "- workflow-run-attempt: $GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record durable candidate qualification result
        if: ${{ always() && steps.create_once.outputs.reserved == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.freeze.outputs.commit }}
          STATUS_CONTEXT: simple-release/candidate/${{ steps.freeze.outputs.version }}/${{ steps.freeze.outputs.attempt_name }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='Candidate qualification failed; rebuilds require a new attempt'
          case "$JOB_STATUS" in
            success)
              state=success
              description='Candidate qualified once; rebuilds require a new attempt'
              ;;
            cancelled)
              state=error
              description='Candidate qualification cancelled; rebuilds require a new attempt'
              ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" \
            -f state="$state" \
            -f context="$STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
