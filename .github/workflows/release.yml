name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_PERF_REGRESSION_PERCENT: 10
  RELEASE_PERF_BASELINE_EPOCH: beta2-v1

jobs:
  check-version:
    name: Check version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate immutable beta2 identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test -s VERSION
          VERSION=$(tr -d '[:space:]' < VERSION)
          printf '%s\n' "$VERSION" |
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' ||
            { echo "invalid VERSION: $VERSION" >&2; exit 1; }
          EXPECTED_TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$EXPECTED_TAG" || {
              echo "tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
              exit 1
            }
          fi
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          SPEC_DOC_SPL_COUNT=$(find doc/06_spec -name '*_spec.spl' | wc -l | tr -d ' ')
          test "$SPEC_DOC_SPL_COUNT" = 0 || {
            echo "executable specs under doc/06_spec: $SPEC_DOC_SPL_COUNT" >&2
            exit 1
          }
          sh scripts/check/check-release-version-consistency.shs
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-bootstrap:
    name: Full bootstrap — ${{ matrix.platform }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            full_cli: true
          - os: macos-latest
            platform: darwin-arm64
            full_cli: true
          - os: macos-15-intel
            platform: darwin-x86_64
            full_cli: true
          - os: windows-latest
            platform: windows-x86_64
            full_cli: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld libfreetype6-dev libunwind-dev time

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install coreutils freetype gnu-time zstd

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install freetype:x64-windows
          "RUSTFLAGS=-L native=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH

      - uses: actions/cache@v4
        with:
          path: build/release-baseline/${{ matrix.platform }}
          key: release-perf-${{ env.RELEASE_PERF_BASELINE_EPOCH }}-${{ matrix.platform }}

      - name: Prove full self-hosted bootstrap
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence/${{ matrix.platform }}
          TIME_BIN=/usr/bin/time
          if [[ "$RUNNER_OS" == macOS ]]; then
            TIME_BIN="$(brew --prefix gnu-time)/libexec/gnubin/time"
          fi
          test -x "$TIME_BIN"
          set -- --full-bootstrap --backend=cranelift --jobs=2 --no-mcp
          if [ "${{ matrix.full_cli }}" = true ]; then
            set -- "$@" --full-cli
          fi
          "$TIME_BIN" -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
            -o build/release-evidence/${{ matrix.platform }}/metrics.env \
            sh scripts/bootstrap/bootstrap-from-scratch.sh "$@"

          RUNTIME=
          if [ -d build/bootstrap/full ]; then
            RUNTIME=$(find build/bootstrap/full -type f \( -name simple -o -name simple.exe \) -print -quit)
          fi
          if [ -z "$RUNTIME" ]; then
            RUNTIME=$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)
          fi
          test -n "$RUNTIME" && test -s "$RUNTIME"
          chmod +x "$RUNTIME"
          VERSION_OUT=$("$RUNTIME" --version 2>&1)
          case "$VERSION_OUT" in
            *Rust-built*|*Rust\ bootstrap\ seed*|*bootstrap\ seed\ only*|*debug\ build*)
              echo "Rust bootstrap seed is not a release runtime" >&2
              exit 1
              ;;
          esac
          test "$("$RUNTIME" -c 'print(1+1)' 2>/dev/null)" = 2
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"

      - name: Package verified bootstrap
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          RUNTIME="${{ steps.bootstrap.outputs.runtime }}"
          PKG="simple-bootstrap-${VERSION}-${PLATFORM}"
          mkdir -p "$PKG/bin" "$PKG/runtime" "$PKG/assets"
          cp -R "$(dirname "$RUNTIME")/." "$PKG/runtime/"
          case "$RUNTIME" in
            *.exe) install -m755 "$RUNTIME" "$PKG/bin/simple.exe" ;;
            *) install -m755 "$RUNTIME" "$PKG/bin/simple" ;;
          esac
          cp -R assets/fonts "$PKG/assets/fonts"
          cp LICENSE THIRD_PARTY_NOTICES.md "$PKG/"
          PACKAGE_RUNTIME=$(find "$PKG/bin" -type f -print -quit)
          sh scripts/check-executable-size-budgets.shs "$PACKAGE_RUNTIME"
          sh scripts/check_release_payload.shs --dir "$PKG"
          tar -czf "${PKG}.spk" "$PKG"
          sh scripts/check_release_payload.shs --tar "${PKG}.spk"
          sha256sum "${PKG}.spk" > "${PKG}.spk.sha256"

          METRICS=build/release-evidence/${PLATFORM}/metrics.env
          grep -Eq '^elapsed_seconds=[0-9]' "$METRICS"
          grep -Eq '^max_rss_kb=[1-9][0-9]*$' "$METRICS"
          sh scripts/check/check-release-perf-baseline.shs \
            "$METRICS" "build/release-baseline/${PLATFORM}/metrics.env" \
            "$RELEASE_PERF_REGRESSION_PERCENT" |
            tee build/release-evidence/${PLATFORM}/baseline-status.env
          {
            echo release_gate_schema=1
            echo release_gate_status=pass
            echo release_gate_platform="$PLATFORM"
            echo release_gate_arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
            echo release_gate_producer=scripts/bootstrap/bootstrap-from-scratch.sh
            echo release_gate_commit="$GITHUB_SHA"
            echo release_gate_version="$VERSION"
            echo release_gate_reason=verified
            cat "$METRICS"
            cat build/release-evidence/${PLATFORM}/baseline-status.env
            echo release_gate_artifact="${PKG}.spk"
            echo release_gate_sha256="$(sha256sum "${PKG}.spk" | awk '{print $1}')"
          } > "release-gate-${PLATFORM}.env"

      - name: Upload bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.platform }}
          path: |
            simple-bootstrap-*.spk
            simple-bootstrap-*.spk.sha256
            release-gate-*.env
          if-no-files-found: error
          retention-days: 14

      - name: Upload bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.platform }}-logs-${{ github.run_id }}
          path: |
            build/bootstrap/logs/**
            build/release-evidence/**
          if-no-files-found: warn
          retention-days: 14

  build-freebsd-bootstrap:
    name: Full bootstrap — freebsd-x86_64
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install FreeBSD QEMU prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq genisoimage openssh-client qemu-system-x86 qemu-utils rsync time xz-utils
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"

      - uses: actions/cache@v4
        with:
          path: build/release-baseline/freebsd-x86_64
          key: release-perf-${{ env.RELEASE_PERF_BASELINE_EPOCH }}-freebsd-x86_64

      - name: Prove full self-hosted bootstrap
        run: |
          mkdir -p build/release-evidence/freebsd-x86_64
          /usr/bin/time -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
            -o build/release-evidence/freebsd-x86_64/metrics.env \
            sh scripts/check/check-freebsd-bootstrap-qemu.shs --full --download

      - name: Package verified FreeBSD bootstrap
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          PLATFORM=freebsd-x86_64
          RUNTIME=bin/release/freebsd-x86_64/simple
          test -s "$RUNTIME"
          PKG="simple-bootstrap-${VERSION}-${PLATFORM}"
          mkdir -p "$PKG/bin" "$PKG/assets"
          install -m755 "$RUNTIME" "$PKG/bin/simple"
          cp -R assets/fonts "$PKG/assets/fonts"
          cp LICENSE THIRD_PARTY_NOTICES.md "$PKG/"
          sh scripts/check-executable-size-budgets.shs "$PKG/bin/simple"
          sh scripts/check_release_payload.shs --dir "$PKG"
          tar -czf "${PKG}.spk" "$PKG"
          sh scripts/check_release_payload.shs --tar "${PKG}.spk"
          sha256sum "${PKG}.spk" > "${PKG}.spk.sha256"
          METRICS=build/release-evidence/${PLATFORM}/metrics.env
          grep -Eq '^elapsed_seconds=[0-9]' "$METRICS"
          grep -Eq '^max_rss_kb=[1-9][0-9]*$' "$METRICS"
          sh scripts/check/check-release-perf-baseline.shs \
            "$METRICS" "build/release-baseline/${PLATFORM}/metrics.env" \
            "$RELEASE_PERF_REGRESSION_PERCENT" |
            tee build/release-evidence/${PLATFORM}/baseline-status.env
          {
            echo release_gate_schema=1
            echo release_gate_status=pass
            echo release_gate_platform="$PLATFORM"
            echo release_gate_arch=x86_64
            echo release_gate_producer=scripts/check/check-freebsd-bootstrap-qemu.shs
            echo release_gate_commit="$GITHUB_SHA"
            echo release_gate_version="$VERSION"
            echo release_gate_reason=verified
            cat "$METRICS"
            cat build/release-evidence/${PLATFORM}/baseline-status.env
            echo release_gate_artifact="${PKG}.spk"
            echo release_gate_sha256="$(sha256sum "${PKG}.spk" | awk '{print $1}')"
          } > "release-gate-${PLATFORM}.env"

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-freebsd-x86_64
          path: |
            simple-bootstrap-*.spk
            simple-bootstrap-*.spk.sha256
            release-gate-*.env
          if-no-files-found: error
          retention-days: 14

      - name: Upload FreeBSD logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-freebsd-x86_64-logs-${{ github.run_id }}
          path: |
            build/freebsd/bootstrap-logs/**
            build/release-evidence/**
          if-no-files-found: warn
          retention-days: 14

  bootstrap-memory:
    name: Stage 4 memory and performance gates
    needs: [check-version, build-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-linux-x86_64
          path: build/release-bootstrap

      - name: Install verified Linux runtime
        run: |
          set -euo pipefail
          PKG=$(find build/release-bootstrap -name 'simple-bootstrap-*-linux-x86_64.spk' -print -quit)
          test -n "$PKG"
          mkdir -p build/release-bootstrap/unpacked
          tar -xzf "$PKG" -C build/release-bootstrap/unpacked
          RUNTIME=$(find build/release-bootstrap/unpacked -path '*/runtime/simple' -type f -print -quit)
          test -n "$RUNTIME"
          chmod +x "$RUNTIME"
          mkdir -p bin/release/x86_64-unknown-linux-gnu
          install -m755 "$RUNTIME" bin/release/x86_64-unknown-linux-gnu/simple
          sh scripts/setup/setup.shs

      - name: Check resource regression receipts
        run: |
          sh scripts/check/check-stage4-memory-gate.shs
          STAGE4_PARSE_MEM_BINARY=bin/release/x86_64-unknown-linux-gnu/simple \
            sh scripts/check/check-stage4-selfhost-parse-memory.shs
          STAGE4_PARSE_MEM_BINARY=bin/release/x86_64-unknown-linux-gnu/simple \
            sh scripts/check/check-stage4-selfhost-parse-memory-multifile.shs

      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-memory-evidence
          path: |
            build/stage4-memory-gate/**
            build/check-stage4-parse-memory/**
            build/check-stage4-parse-memory-multifile/**
          if-no-files-found: error
          retention-days: 14

  whole-tests:
    name: Run Whole Test Suite
    needs: [check-version, build-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-linux-x86_64
          path: build/release-bootstrap

      - name: Run specs, long tests, source doctests, and Markdown embeds
        run: |
          set -euo pipefail
          PKG=$(find build/release-bootstrap -name 'simple-bootstrap-*-linux-x86_64.spk' -print -quit)
          test -n "$PKG"
          mkdir -p build/release-bootstrap/unpacked
          tar -xzf "$PKG" -C build/release-bootstrap/unpacked
          SIMPLE_WHOLE_TEST_BIN=$(find build/release-bootstrap/unpacked -path '*/runtime/simple' -type f -print -quit)
          test -n "$SIMPLE_WHOLE_TEST_BIN"
          chmod +x "$SIMPLE_WHOLE_TEST_BIN"
          "$SIMPLE_WHOLE_TEST_BIN" test test --whole --mode=interpreter

  simpleos-build:
    name: SimpleOS — ${{ matrix.arch }}
    needs: [check-version, build-bootstrap]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            scenario: x64-full-stack
            kernel: build/os/simpleos_x86_64.elf
            image: build/os/fat32-x86_64.img
          - arch: aarch64
            scenario: arm64-virtio-fat32-smf
            kernel: build/os/simpleos_aarch64.elf
            image: build/os/fat32-arm64.img
          - arch: riscv64
            scenario: riscv64-virtio-fat32-smf
            kernel: build/os/simpleos_riscv64.elf
            image: build/os/fat32-riscv64.img
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-linux-x86_64
          path: build/release-bootstrap

      - name: Install QEMU and target toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm libfreetype6-dev libunwind-dev time \
            qemu-system-x86 qemu-system-arm qemu-system-misc \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu \
            mtools dosfstools ovmf grub-efi-amd64-bin

      - name: Install verified Linux runtime
        run: |
          set -euo pipefail
          PKG=$(find build/release-bootstrap -name 'simple-bootstrap-*-linux-x86_64.spk' -print -quit)
          test -n "$PKG"
          mkdir -p build/release-bootstrap/unpacked
          tar -xzf "$PKG" -C build/release-bootstrap/unpacked
          RUNTIME=$(find build/release-bootstrap/unpacked -path '*/runtime/simple' -type f -print -quit)
          test -n "$RUNTIME"
          chmod +x "$RUNTIME"
          mkdir -p bin/release/x86_64-unknown-linux-gnu
          install -m755 "$RUNTIME" bin/release/x86_64-unknown-linux-gnu/simple
          sh scripts/setup/setup.shs
          bin/simple --version

      - uses: actions/cache@v4
        with:
          path: build/release-baseline/simpleos-${{ matrix.arch }}
          key: release-perf-${{ env.RELEASE_PERF_BASELINE_EPOCH }}-simpleos-${{ matrix.arch }}

      - name: Build target-native Simple compiler
        run: |
          cargo build --manifest-path src/compiler_rust/Cargo.toml --profile bootstrap -p simple-driver
          SEED=src/compiler_rust/target/bootstrap/simple \
            sh scripts/ci/build-simpleos-toolchain.shs --only "${{ matrix.arch }}" --require-all

      - name: Build and boot SimpleOS release targets
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence/simpleos-${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            /usr/bin/time -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
              -o build/release-evidence/simpleos-${{ matrix.arch }}/metrics.env \
              env SIMPLEOS_BOOTSTRAP_SIMPLE_BIN="$PWD/bin/simple" \
              sh scripts/check-simpleos-bootstrap-qemu.shs --full \
              2>&1 | tee build/release-evidence/simpleos-${{ matrix.arch }}/qemu.log
          else
            /usr/bin/time -f 'elapsed_seconds=%e\nmax_rss_kb=%M' \
              -o build/release-evidence/simpleos-${{ matrix.arch }}/metrics.env \
              bin/simple os test "--scenario=${{ matrix.scenario }}" \
              2>&1 | tee build/release-evidence/simpleos-${{ matrix.arch }}/qemu.log
          fi
          test -s "${{ matrix.kernel }}"
          test -s "${{ matrix.image }}"

      - name: Require in-guest compiler evidence
        run: |
          set -euo pipefail
          grep -R -E '(/usr/bin/simple|/bin/simple|/sys/apps/simple)' build/os build/release-evidence
          grep -R -E 'simple.*--version|Simple Language|simple-bootstrap' build/os build/release-evidence
          grep -R -E 'hello world|hello_world' build/os build/release-evidence

      - name: Package SimpleOS target
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKG="simpleos-${VERSION}-${ARCH}"
          mkdir -p "$PKG"
          cp "${{ matrix.kernel }}" "$PKG/"
          cp "${{ matrix.image }}" "$PKG/"
          cp -R build/release-evidence/simpleos-${ARCH} "$PKG/evidence"
          find bin/release -path "*${ARCH}*simpleos*/simple*" -type f -exec cp {} "$PKG/" \;
          test -n "$(find "$PKG" -maxdepth 1 -name 'simple*' -type f -print -quit)"
          cp LICENSE THIRD_PARTY_NOTICES.md "$PKG/"
          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          METRICS=build/release-evidence/simpleos-${ARCH}/metrics.env
          grep -Eq '^elapsed_seconds=[0-9]' "$METRICS"
          grep -Eq '^max_rss_kb=[1-9][0-9]*$' "$METRICS"
          sh scripts/check/check-release-perf-baseline.shs \
            "$METRICS" "build/release-baseline/simpleos-${ARCH}/metrics.env" \
            "$RELEASE_PERF_REGRESSION_PERCENT" |
            tee build/release-evidence/simpleos-${ARCH}/baseline-status.env
          {
            echo release_gate_schema=1
            echo release_gate_status=pass
            echo release_gate_platform=simpleos
            echo release_gate_arch="$ARCH"
            echo release_gate_producer="bin/simple os test --scenario=${{ matrix.scenario }}"
            echo release_gate_commit="$GITHUB_SHA"
            echo release_gate_version="$VERSION"
            echo release_gate_reason=verified
            cat "$METRICS"
            cat build/release-evidence/simpleos-${ARCH}/baseline-status.env
            echo release_gate_artifact="${PKG}.tar.gz"
            echo release_gate_sha256="$(sha256sum "${PKG}.tar.gz" | awk '{print $1}')"
          } > "release-gate-simpleos-${ARCH}.env"

      - uses: actions/upload-artifact@v4
        with:
          name: simpleos-${{ matrix.arch }}-package
          path: |
            simpleos-*.tar.gz
            simpleos-*.tar.gz.sha256
            release-gate-simpleos-*.env
          if-no-files-found: error
          retention-days: 14

      - name: Upload SimpleOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpleos-${{ matrix.arch }}-logs-${{ github.run_id }}
          path: |
            build/release-evidence/**
            build/os/*.log
            build/os/*.env
          if-no-files-found: warn
          retention-days: 14

  simpleos-mission-critical:
    name: SimpleOS mission-critical release gate
    needs: [simpleos-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: simpleos-*-package
          path: build/simpleos-release
          merge-multiple: true

      - name: Require mission-critical completion
        run: |
          sh scripts/check/check-simpleos-mission-critical-release.shs | tee build/simpleos-mission-critical-release.log
          grep -q 'release_blockers=none' build/simpleos-mission-critical-release.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simpleos-mission-critical-evidence
          path: build/simpleos-mission-critical-release.log
          if-no-files-found: error
          retention-days: 14

  release-preflight:
    name: Exact release artifact preflight
    needs:
      - check-version
      - build-bootstrap
      - build-freebsd-bootstrap
      - bootstrap-memory
      - whole-tests
      - simpleos-build
      - simpleos-mission-critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          path: build/release-input
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: simpleos-*-package
          path: build/release-input
          merge-multiple: true

      - name: Validate expected asset inventory
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          cd build/release-input
          for asset in \
            "simple-bootstrap-${VERSION}-linux-x86_64.spk" \
            "simple-bootstrap-${VERSION}-darwin-arm64.spk" \
            "simple-bootstrap-${VERSION}-darwin-x86_64.spk" \
            "simple-bootstrap-${VERSION}-windows-x86_64.spk" \
            "simple-bootstrap-${VERSION}-freebsd-x86_64.spk" \
            "simpleos-${VERSION}-x86_64.tar.gz" \
            "simpleos-${VERSION}-aarch64.tar.gz" \
            "simpleos-${VERSION}-riscv64.tar.gz"; do
            test -s "$asset" || { echo "missing expected asset: $asset" >&2; exit 1; }
            test -s "${asset}.sha256" || { echo "missing expected asset checksum: $asset" >&2; exit 1; }
            sha256sum -c "${asset}.sha256"
          done
          test "$(find . -maxdepth 1 \( -name '*.spk' -o -name '*.tar.gz' \) | wc -l)" = 8
          test "$(find . -maxdepth 1 -name 'release-gate-*.env' | wc -l)" = 8
          for receipt in release-gate-*.env; do
            grep -qx 'release_gate_schema=1' "$receipt"
            grep -qx 'release_gate_status=pass' "$receipt"
            grep -qx "release_gate_commit=${GITHUB_SHA}" "$receipt"
            grep -qx "release_gate_version=${VERSION}" "$receipt"
            grep -Eq '^elapsed_seconds=[0-9]' "$receipt"
            grep -Eq '^max_rss_kb=[1-9][0-9]*$' "$receipt"
          done
          mkdir -p ../release-assets
          cp ./*.spk ./*.tar.gz ./*.sha256 ../release-assets/
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" ../release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 14

  create-release:
    name: Create GitHub prerelease
    needs: [check-version, release-preflight, whole-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Publish and inspect the GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          PRERELEASE_FLAG=()
          if [ "${{ needs.check-version.outputs.prerelease }}" = true ]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Simple Language v${VERSION}" \
            --generate-notes \
            "${PRERELEASE_FLAG[@]}" \
            release/*

  verify-release:
    name: Verify published GitHub prerelease
    needs: [check-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Query the actual GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v${VERSION}"
          mkdir downloaded
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,targetCommitish,assets > release.json
          test "$(jq -r .tagName release.json)" = "$TAG"
          test "$(jq -r .isPrerelease release.json)" = "${{ needs.check-version.outputs.prerelease }}"
          test "$(jq -r '.assets | length' release.json)" = 18
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded
          cd downloaded
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          {
            echo "## Verified release"
            echo
            echo "- Tag: $TAG"
            echo "- Prerelease: ${{ needs.check-version.outputs.prerelease }}"
            echo "- Assets: 18"
          } >> "$GITHUB_STEP_SUMMARY"
