name: Promote admitted release candidate

on:
  workflow_dispatch:
    inputs:
      version: {description: "Canonical version without v", required: true, type: string}
      candidate_commit: {description: "Exact admitted commit SHA", required: true, type: string}
      candidate_ref: {description: "Immutable candidate ref", required: true, type: string}
      candidate_run_id: {description: "Candidate workflow run id", required: true, type: string}
      candidate_artifact: {description: "Immutable candidate artifact name", required: true, type: string}
      admission_sha256: {description: "SHA-256 of release-admission.json", required: true, type: string}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Validate immutable input syntax
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact }}
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_REF" =~ ^candidate/v${VERSION}/a[0-9]{3}$ ]]
          test "$CANDIDATE_ARTIFACT" = "candidate-${VERSION}-${COMMIT}"
          [[ "$ADMISSION_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Download candidate without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify admission and every artifact digest
        id: verify
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f candidate/release-admission.json
          test -f candidate/artifacts.sha256
          printf '%s  %s\n' "$ADMISSION_SHA256" candidate/release-admission.json | sha256sum --check --strict
          test "$(jq -r '.version' candidate/release-admission.json)" = "$VERSION"
          test "$(jq -r '.candidate_commit_sha' candidate/release-admission.json)" = "$COMMIT"
          test "$(jq -r '.candidate_ref' candidate/release-admission.json)" = "$CANDIDATE_REF"
          run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$COMMIT"
          case "$(jq -r '.path' <<<"$run_json")" in
            .github/workflows/candidate.yml|*/.github/workflows/candidate.yml) ;;
            *) echo "artifact did not originate from candidate workflow" >&2; exit 1 ;;
          esac
          test "$(jq -r '.admitted' candidate/release-admission.json)" = true
          test "$(jq -r '.rebuild_allowed' candidate/release-admission.json)" = false
          test "$(jq -r '.fallback_used' candidate/release-admission.json)" = false
          test -n "$(jq -r '.provenance_attestation_id' candidate/release-admission.json)"
          qualification_sha256=$(jq -r '.qualification_receipt_sha256' candidate/release-admission.json)
          [[ "$qualification_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$qualification_sha256" candidate/qualification.json | sha256sum --check --strict
          jq -e '.required_support | length > 0 and all(.[]; .status == "passed")' \
            candidate/release-admission.json >/dev/null
          (cd candidate && sha256sum --check --strict artifacts.sha256)
          gh attestation verify candidate/simple-x86_64-unknown-linux-gnu \
            --repo "$GITHUB_REPOSITORY"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  promote:
    needs: verify-candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Require repository immutable-release enforcement
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" | jq -e '.enabled == true' >/dev/null

      - name: Reverify at promotion boundary
        env:
          ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
          COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          gh auth setup-git
          remote_candidate=$(git ls-remote origin "refs/heads/$CANDIDATE_REF" | awk '{print $1}')
          test "$remote_candidate" = "$COMMIT"
          printf '%s  %s\n' "$ADMISSION_SHA256" candidate/release-admission.json | sha256sum --check --strict
          qualification_sha256=$(jq -r '.qualification_receipt_sha256' candidate/release-admission.json)
          printf '%s  %s\n' "$qualification_sha256" candidate/qualification.json | sha256sum --check --strict
          (cd candidate && sha256sum --check --strict artifacts.sha256)

      - name: Configure SSH tag signing
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
          RELEASE_SIGNING_IDENTITY: ${{ vars.RELEASE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          test -n "$RELEASE_SIGNING_PUBLIC_KEY"
          test -n "$RELEASE_SIGNING_IDENTITY"
          install -m 0700 -d "$RUNNER_TEMP/release-signing"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing/key"
          chmod 0600 "$RUNNER_TEMP/release-signing/key"
          git config user.name "$RELEASE_SIGNING_IDENTITY"
          git config user.email "release@simple-lang.invalid"
          git config gpg.format ssh
          git config user.signingkey "$RUNNER_TEMP/release-signing/key"
          printf '%s %s\n' "$RELEASE_SIGNING_IDENTITY" "$RELEASE_SIGNING_PUBLIC_KEY" \
            > "$RUNNER_TEMP/release-signing/allowed_signers"
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/release-signing/allowed_signers"

      - name: Push exactly one signed annotated tag
        env:
          TAG: ${{ needs.verify-candidate.outputs.tag }}
          COMMIT: ${{ inputs.candidate_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "release identity already exists: $TAG" >&2
            exit 1
          else
            test "$?" = 2
          fi
          git tag -s "$TAG" "$COMMIT" -m "Release $TAG" \
            -m "Candidate-Commit: $COMMIT" \
            -m "Admission-SHA256: ${{ inputs.admission_sha256 }}"
          git tag --verify "$TAG"
          gh auth setup-git
          git push origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Draft, attach exact assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          test -f candidate/release-notes.md
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file candidate/release-notes.md
          mapfile -t assets < <(find candidate -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 2
          gh release upload "$TAG" "${assets[@]}"
          gh release edit "$TAG" --draft=false
