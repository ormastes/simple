name: Core + MCP Dev Pipeline

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/compiler/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'src/compiler_rust/compiler/src/codegen/**'
      - 'src/compiler_rust/parser/src/expressions/postfix.rs'
      - 'src/compiler_rust/compiler/src/interpreter_call/core/class_instantiation.rs'
      - 'src/compiler_rust/driver/**'
      - 'src/compiler_rust/runtime/**'
      - 'scripts/check/check-cranelift-aot-aggregates.shs'
      - 'scripts/check/check-cranelift-aot-aggregate-cross.shs'
      - 'scripts/check/check-runnable-probes.shs'
      - 'scripts/check/check-scalar-accumulator-not-array-merge.shs'
      - 'scripts/check/check-engine-receipt-discriminates.shs'
      - 'scripts/check/check-codegen-unlowered-mir-fails-build.shs'
      - 'scripts/check/check-build-defaults-collect-all-and-incremental.shs'
      - 'scripts/check/check-render-perf-v-lane-suite.shs'
      - 'test/**/*_jit_probe.spl'
      - 'test/fixtures/compiler/stage4_struct_enum_array_probe.spl'
      - 'test/fixtures/compiler/cranelift_array_oob.spl'
      - 'test/fixtures/compiler/native_runtime_local_name_collision.spl'
      - 'test/fixtures/compiler/native_runtime_local_name_collision_non_generic.spl'
      - 'test/fixtures/compiler/native_runtime_generic_call_origin_collision_repro.spl'
      - 'test/01_unit/lib/nogc_sync_mut/io/process_governor_standalone_crash_spec.spl'
      - 'test/01_unit/lib/gpu/engine2d/engine2d_color_simd_blend_parity_spec.spl'
      - 'test/01_unit/compiler/hir/statement_payload_types_source_spec.spl'
      - 'test/01_unit/compiler/frontend/interp_fragment_sticky_error_spec.spl'
      - 'test/01_unit/lib/core/list_constructor_hardening_spec.spl'
      - 'src/app/mcp/**'
      - 'src/app/simple_lsp_mcp/**'
      - 'tools/mcp-registry/**'
      - 'tools/lsp-mcp-registry/**'
      - '.github/workflows/core-mcp-dev-pipeline.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'src/compiler/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'src/compiler_rust/compiler/src/codegen/**'
      - 'src/compiler_rust/parser/src/expressions/postfix.rs'
      - 'src/compiler_rust/compiler/src/interpreter_call/core/class_instantiation.rs'
      - 'src/compiler_rust/driver/**'
      - 'src/compiler_rust/runtime/**'
      - 'scripts/check/check-cranelift-aot-aggregates.shs'
      - 'scripts/check/check-cranelift-aot-aggregate-cross.shs'
      - 'scripts/check/check-runnable-probes.shs'
      - 'scripts/check/check-scalar-accumulator-not-array-merge.shs'
      - 'scripts/check/check-engine-receipt-discriminates.shs'
      - 'scripts/check/check-codegen-unlowered-mir-fails-build.shs'
      - 'scripts/check/check-build-defaults-collect-all-and-incremental.shs'
      - 'scripts/check/check-render-perf-v-lane-suite.shs'
      - 'test/**/*_jit_probe.spl'
      - 'test/fixtures/compiler/stage4_struct_enum_array_probe.spl'
      - 'test/fixtures/compiler/cranelift_array_oob.spl'
      - 'test/fixtures/compiler/native_runtime_local_name_collision.spl'
      - 'test/fixtures/compiler/native_runtime_local_name_collision_non_generic.spl'
      - 'test/fixtures/compiler/native_runtime_generic_call_origin_collision_repro.spl'
      - 'test/01_unit/lib/nogc_sync_mut/io/process_governor_standalone_crash_spec.spl'
      - 'test/01_unit/lib/gpu/engine2d/engine2d_color_simd_blend_parity_spec.spl'
      - 'test/01_unit/compiler/hir/statement_payload_types_source_spec.spl'
      - 'test/01_unit/compiler/frontend/interp_fragment_sticky_error_spec.spl'
      - 'test/01_unit/lib/core/list_constructor_hardening_spec.spl'
      - 'src/app/mcp/**'
      - 'src/app/simple_lsp_mcp/**'
      - 'tools/mcp-registry/**'
      - 'tools/lsp-mcp-registry/**'
      - '.github/workflows/core-mcp-dev-pipeline.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-mcp-guard:
    name: Core + MCP Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/compiler_rust/target
          key: core-mcp-guard-${{ runner.os }}-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            core-mcp-guard-${{ runner.os }}-

      - name: Build bootstrap runtime + native_all
        working-directory: src/compiler_rust
        run: |
          cargo build --profile bootstrap -p simple-driver
          cargo build --profile bootstrap -p simple-native-all --features driver-compat

      - name: Verify runtime exists
        run: |
          test -x src/compiler_rust/target/bootstrap/simple
          src/compiler_rust/target/bootstrap/simple --version

      - name: Core runtime smoke
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          "$SIMPLE_BINARY" check src/compiler
          "$SIMPLE_BINARY" check src/lib

      - name: Focused library regressions
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          mkdir -p build/tmp
          ln -sfn "$SIMPLE_BINARY" bin/simple
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/lib/nogc_sync_mut/io/process_governor_standalone_crash_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/lib/gpu/engine2d/engine2d_color_simd_blend_parity_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/compiler/hir/statement_payload_types_source_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/compiler/frontend/interp_fragment_sticky_error_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/lib/core/list_constructor_hardening_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" run src/compiler/10.frontend/core/interpreter/test_interp.spl >build/tmp/core-interpreter.actual
          grep -Fx 'Fail: 0' build/tmp/core-interpreter.actual
          grep -Fx 'ALL TESTS PASSED' build/tmp/core-interpreter.actual

      - name: Native MCP/LSP smoke
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          "$SIMPLE_BINARY" check src/app/mcp
          "$SIMPLE_BINARY" check src/app/simple_lsp_mcp
          sh scripts/check/check-mcp-wrapper-contract.shs
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/01_unit/compiler/driver/interpret_lazy_project_sources_spec.spl --mode=interpreter
          SIMPLE_LIB=src "$SIMPLE_BINARY" test test/02_integration/app/mcp_stdio_integration_spec.spl --mode=interpreter

      - name: Cranelift aggregate ABI
        env:
          SIMPLE_BIN: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          sh scripts/check/check-cranelift-aot-aggregates.shs
          sh scripts/check/check-cranelift-aot-aggregate-cross.shs

      # Runnable-probe gate, FULL RUN. This is the job that has a built binary,
      # and the probes exist to reach an engine a spec cannot: describe/it/expect
      # are Rust interpreter intrinsics, and a module with no `fn main` de-JITs
      # regardless, so a *_spec.spl is green by construction against a JIT-only
      # defect. Every probe runs under BOTH interpret and jit -- two engines
      # agreeing is the evidence, one engine passing is not.
      #
      # Fails CLOSED: a missing binary, zero probes discovered, a probe count
      # below the floor, or an unrecognised engine name is an ERROR (exit 2), not
      # a pass. There is deliberately NO suppression baseline: a failing probe is
      # a live defect that specs cannot see, so it is reported and left red.
      #
      # SIMPLE_LIB=src matters. Without it the probes resolve std.* against a
      # different source root; on 2026-08-02 running them against a stale lib
      # produced 17 false failures that were entirely fixes already landed.
      - name: Runnable regression probes (interpret + jit)
        if: ${{ !cancelled() }}
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
          SIMPLE_LIB: src
        run: |
          sh scripts/check/check-runnable-probes.shs

      # Fences the two DEFAULT `native-build` behaviours: collect-all (do not
      # stop at the first error) and incremental-cache reuse. Runs against the
      # bootstrap seed built above via SIMPLE_BINARY; the seed already supports
      # `native-build`, so no self-hosted deploy is required here.
      - name: Build defaults (collect-all + incremental cache)
        if: ${{ !cancelled() }}
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          sh scripts/check/check-build-defaults-collect-all-and-incremental.shs

      # V-lane correctness/promotion suite for the render-perf redesign
      # campaign -- runs every spec landed by lanes F0-F4, W0, C4, O0-O2, P0,
      # G0, U0b together via `bin/simple test`. Uses the `bin/simple` symlink
      # to the bootstrap seed created above.
      - name: Render-perf V-lane suite
        if: ${{ !cancelled() }}
        run: |
          sh scripts/check/check-render-perf-v-lane-suite.shs

      # GPU-runnable transitive scanner, DEFAULT (non-strict) mode. Reports
      # blocked names / blocked roots for the GPU-offload allowlist but
      # ALWAYS exits 0 -- it is visibility only, not a gate. Deliberately
      # does NOT pass --strict / GPU_RUNNABLE_STRICT=1: verified standalone
      # 2026-08-09 that strict mode currently reports 14 real BLOCKED roots
      # (draw_rect_filled, draw_line, draw_ellipse and friends), so wiring
      # --strict anywhere would fail every run. Needs a built bin/simple,
      # hence placed here rather than in the hygiene workflow (which has
      # none) -- uses the same bootstrap seed symlink as the steps above.
      - name: GPU-runnable transitive scan (report-only, not yet enforcing)
        if: ${{ !cancelled() }}
        env:
          SIMPLE_BINARY: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          sh scripts/check/check-gpu-runnable.shs

      # ---------------------------------------------------------------------
      # Guard-wiring debt paydown, batch 4 (2026-08-23). Both guards below need
      # a built Simple compiler and so cannot live in the Repo Hygiene workflow
      # (which has none); they use the same bootstrap seed as the steps above.
      #
      # Both are wired ADVISORY (continue-on-error) because both are honestly
      # RED or unproven on the current tree. The guards themselves are
      # UNCHANGED and unweakened, and neither is opted out -- an advisory wiring
      # makes the number visible on every run, which a guard reachable from
      # nothing never did. Promote each to enforcing the day it goes green.
      # ---------------------------------------------------------------------

      # Engine-receipt discrimination, FULL gate.
      #
      # A single unsupported operation silently demotes a whole program to the
      # tree-walk interpreter and no engine receipt is printed anywhere, so
      # every claim of the form "this behaves the same on both engines" is
      # currently unfalsifiable (SIMPLE_NO_JIT=1 is a decoy with no reader in
      # src/compiler_rust at all). This guard is the falsifier: a receipt that
      # says the SAME thing for both halves of the pair is a FAIL, not a pass.
      #
      # ADVISORY: verified 2026-08-23 against a real seed binary, it reports
      #   FAIL — 2 assertion(s) checked ... no [engine-receipt] line ...
      #   (pre-fix state: no receipt is emitted anywhere)
      # which is the documented pre-fix state, not a regression. Its scorer
      # self-test is separately wired as a BLOCKING gate in repo-hygiene.yml.
      - name: Engine-receipt discrimination (advisory, currently RED)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SIMPLE_BIN: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          sh scripts/check/check-engine-receipt-discriminates.shs \
            --binary "$SIMPLE_BIN"

      # Unlowered-MIR fail-open gate.
      #
      # An ordinary Result<i64,text> + `?` program built rc=0, linked, reported
      # step 6/6 and then died at RUN time with
      #   PANIC: E-BACKEND-LLVM-INST-ResultMatchSemantic
      # because MirToLlvm.emit_unsupported_panic emitted an @rt_panic call into
      # the generated IR instead of raising a compile error. 33 MirInstKind
      # variants reach that helper, so an unknown number of defects can ship
      # silently. See doc/08_tracking/bug/
      # llvm_backend_unlowered_mir_kind_fails_open_2026-08-23.md.
      #
      # MEASURED GREEN, wired ADVISORY on RUNTIME grounds only -- stated
      # plainly so nobody reads the tier as a verdict on the invariant. Run
      # 2026-08-23 against a real seed it reports
      #   PASS -- 1 fixture(s) built, 0 fail-open
      # so the fail-closed path it pins is currently intact. It is advisory
      # because it BUILDS a native fixture end to end and took ~25 minutes on a
      # contended host; making that blocking would gate every push in this lane
      # on a 25-minute native build. Promote to enforcing (drop
      # continue-on-error) once it is either fast enough or moved to a lane
      # where a 25-minute step is acceptable -- the guard itself needs no
      # change, and it must NOT be weakened to make it fast.
      - name: Unlowered-MIR fail-open gate (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SIMPLE_BIN: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          sh scripts/check/check-codegen-unlowered-mir-fails-build.shs

      # Scalar-accumulator vs array-merge desugar gate (batch 4 continued,
      # landed by a parallel lane 2026-08-23 while this wiring was in flight).
      #
      # collection_desugar.spl Pattern B rewrites `x = x + other` into
      # `x.merge(other)` at the AST level, BEFORE type-checking. Its scalar gate
      # can only suppress addend shapes that are provably scalar, so
      # `var s = 0; s = s + x` with `x` an identifier was rewritten and lowered
      # to rt_array_extend_i64 -- the build reported rc=0 / step 6/6 / linked,
      # and the program printed 0. Native only: the interpreter is right, so
      # this is caught by comparing the two ENGINES, never by rc. See
      # doc/08_tracking/bug/scalar_accumulator_desugared_to_array_merge_2026-08-23.md.
      #
      # Invoked with `bash`, not `sh`: its shebang is #!/bin/bash and it uses
      # bash-only syntax (verified -- under dash it dies at line 71 with
      # `Syntax error: "(" unexpected`, which would ERROR rather than gate).
      #
      # ADVISORY: needs a built compiler, and the sibling `text` receiver case
      # is documented in the guard as still broken and deliberately not
      # asserted. Promote to enforcing once the desugar is fixed.
      - name: Scalar-accumulator desugar gate (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SIMPLE_BIN: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: |
          bash scripts/check/check-scalar-accumulator-not-array-merge.shs
