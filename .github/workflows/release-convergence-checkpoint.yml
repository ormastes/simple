name: Observe release/main convergence checkpoint

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact release/X.Y ref (empty derives it from release/version.sdn)
        required: false
        type: string
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: release-convergence-checkpoint
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Convergence inventories must include commits behind the checkout
          # boundary; a depth-1 graph can silently omit source-only fixes.
          fetch-depth: 0
          persist-credentials: false

      - name: Observe exact protected heads without selecting or applying fixes
        env:
          RELEASE_REF: ${{ inputs.release_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if test "$EVENT_NAME" = workflow_dispatch; then
            sh scripts/release/convergence-checkpoint.shs \
              --release-ref="$RELEASE_REF" --require-release-line
          else
            sh scripts/release/convergence-checkpoint.shs \
              --release-ref="$RELEASE_REF"
          fi

      - name: Upload read-only checkpoint evidence
        if: ${{ hashFiles('build/release-convergence-checkpoint/*.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-convergence-checkpoint-${{ github.run_id }}
          path: build/release-convergence-checkpoint/*.json
          if-no-files-found: error
          retention-days: 14
