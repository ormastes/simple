name: Phase Ladder Rung

# One rung of .github/workflows/phase-ladder.yml: every lane builds its next
# bootstrap phase from the previous rung's handoff (or, on rung 1, from the
# newest RC per config/bootstrap.sdn) and hands the result on.
on:
  workflow_call:
    inputs:
      rung:
        type: number
        required: true
      lanes:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native:
    name: rung ${{ inputs.rung }} ${{ matrix.platform }}
    if: inputs.lanes != 'freebsd-x86_64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04, threads: 4 }
          - { platform: linux-riscv64, os: ubuntu-24.04, threads: 4 }
          - { platform: darwin-arm64, os: macos-15, threads: 3 }
          - { platform: darwin-x86_64, os: macos-15-intel, threads: 4 }
          - { platform: windows-x86_64, os: windows-2025, threads: 4 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Lane selected?
        id: sel
        run: |
          case ",${{ inputs.lanes }}," in
            ,all,|*",${{ matrix.platform }},"*) echo "on=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "on=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.sel.outputs.on == 'true'
        with:
          persist-credentials: false
      - name: Previous rungs' handoffs
        if: steps.sel.outputs.on == 'true' && inputs.rung > 1
        uses: actions/download-artifact@v4
        with:
          pattern: ladder-*
          path: build/ladder/in
          merge-multiple: true
      - name: Rust toolchain (riscv64 cross runtime)
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'linux-riscv64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libunwind-dev gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user-static
          . /etc/os-release
          sudo dpkg --add-architecture riscv64
          for f in /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$f" ] && sudo sed -i '/^Types: deb$/a Architectures: amd64' "$f"
          done
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates\nComponents: main universe\nArchitectures: riscv64\n' \
            "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/riscv64-ports.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev:riscv64 zlib1g-dev:riscv64 libzstd-dev:riscv64 libncurses-dev:riscv64
      # Windows lane = MinGW UCRT via MSYS2 CLANG64 (clang + LLD, no GCC),
      # Rust host gnullvm. See doc/07_guide/infra/toolchain/windows_mingw_ucrt.md.
      - name: Setup MSYS2 CLANG64 (windows-x86_64)
        id: msys2
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'windows-x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libunwind
      - name: Bind CLANG64 toolchain and gnullvm Rust host (windows-x86_64)
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'windows-x86_64'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          clang64=$(cygpath -u "$MSYS2_LOCATION")/clang64/bin
          "$clang64/clang.exe" --version
          cygpath -w "$clang64" >> "$GITHUB_PATH"
          {
            echo "CC=clang"
            echo "CC_x86_64_pc_windows_gnullvm=clang"
            echo "AR_x86_64_pc_windows_gnullvm=llvm-ar"
            echo "SIMPLE_WINDOWS_ABI=gnu"
            echo "SIMPLE_LINKER_FLAVOR=gnu"
          } >> "$GITHUB_ENV"
          rustup set default-host x86_64-pc-windows-gnullvm
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' src/compiler_rust/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
      - name: Climb one phase
        if: steps.sel.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/ladder/in build/ladder/out
          sh scripts/bootstrap/phase-ladder-step.shs "${{ matrix.platform }}" build/ladder/in build/ladder/out "${{ matrix.threads }}"
      - uses: actions/upload-artifact@v4
        if: steps.sel.outputs.on == 'true'
        with:
          name: ladder-${{ matrix.platform }}-r${{ inputs.rung }}
          path: build/ladder/out
          retention-days: 14
          if-no-files-found: error

  freebsd:
    name: rung ${{ inputs.rung }} freebsd-x86_64
    if: inputs.lanes == 'all' || contains(inputs.lanes, 'freebsd-x86_64')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.rung > 1
        with:
          pattern: ladder-freebsd-*
          path: build/ladder/in
          merge-multiple: true
      - name: Climb one phase in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          usesh: true
          mem: 12288
          envs: GH_TOKEN
          prepare: pkg install -y bash git gmake pkgconf zstd llvm gh
          run: |
            set -eu
            mkdir -p build/ladder/in build/ladder/out
            sh scripts/bootstrap/phase-ladder-step.shs freebsd-x86_64 build/ladder/in build/ladder/out 2
      - uses: actions/upload-artifact@v4
        with:
          name: ladder-freebsd-x86_64-r${{ inputs.rung }}
          path: build/ladder/out
          retention-days: 14
          if-no-files-found: error
