name: Phase Ladder Rung

# One rung of .github/workflows/phase-ladder.yml: every lane builds its next
# bootstrap phase from the previous rung's handoff (or, on rung 1, from the
# newest RC per config/bootstrap.sdn) and hands the result on.
on:
  workflow_call:
    inputs:
      rung:
        type: number
        required: true
      lanes:
        type: string
        required: true
      build_jobs:
        description: "Build job override; 0 retains the automatic lane default"
        type: number
        default: 0

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: rung ${{ inputs.rung }} ${{ matrix.platform }}
    if: inputs.lanes != 'freebsd-x86_64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04, threads: 4, selfhost_threads: 1 }
          - { platform: linux-riscv64, os: ubuntu-24.04, threads: 4, selfhost_threads: 1 }
          - { platform: darwin-arm64, os: macos-15, threads: 3, selfhost_threads: 1 }
          - { platform: darwin-x86_64, os: macos-15-intel, threads: 4, selfhost_threads: 2 }
          - { platform: windows-x86_64, os: windows-2025, threads: 4, selfhost_threads: 2 }
    defaults:
      run:
        shell: bash
    steps:
      - name: Lane selected?
        id: sel
        run: |
          case ",${{ inputs.lanes }}," in
            ,all,|*",${{ matrix.platform }},"*) echo "on=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "on=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.sel.outputs.on == 'true'
        with:
          persist-credentials: false
      - name: Select build jobs
        if: steps.sel.outputs.on == 'true'
        id: build_jobs
        env:
          REQUESTED_BUILD_JOBS: ${{ inputs.build_jobs }}
          DEFAULT_BUILD_JOBS: ${{ matrix.threads }}
          DEFAULT_SELFHOST_JOBS: ${{ matrix.selfhost_threads }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jobs=$REQUESTED_BUILD_JOBS
          selfhost_jobs=$jobs
          if [ "$jobs" = 0 ] && [ "$EVENT_NAME" != workflow_dispatch ]; then jobs=$DEFAULT_BUILD_JOBS; selfhost_jobs=$DEFAULT_SELFHOST_JOBS; fi
          case "$jobs" in ''|0*|*[!0-9]*) echo "build_jobs must be an integer from 1 through 256" >&2; exit 2 ;; esac
          [ "${#jobs}" -le 3 ] && [ "$jobs" -le 256 ] || { echo "build_jobs must be an integer from 1 through 256" >&2; exit 2; }
          echo "count=$jobs" >> "$GITHUB_OUTPUT"
          echo "selfhost_count=$selfhost_jobs" >> "$GITHUB_OUTPUT"
          echo "Selected build jobs: seed=$jobs selfhost=$selfhost_jobs"
      - name: Previous rungs' handoffs
        if: steps.sel.outputs.on == 'true' && inputs.rung > 1
        uses: actions/download-artifact@v4
        with:
          pattern: ladder-*
          path: build/ladder/in
          merge-multiple: true
      # Every rung resumes from the highest phase any ladder run on this branch
      # (this one included) already proved, so phases are never rebuilt.
      - name: Proven handoffs (any run)
        if: steps.sel.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lanes="${{ matrix.platform }}"
          [ "$lanes" = linux-riscv64 ] && lanes="linux-riscv64 linux-x86_64"
          sh scripts/bootstrap/phase-ladder-resume.shs build/ladder/in $lanes
      - name: Earlier diagnostic receipts (not admitted handoffs)
        if: steps.sel.outputs.on == 'true' && inputs.rung > 1
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-ladder-receipts-${{ matrix.platform }}-r*
          path: build/ladder/diagnostics
      - name: Rust toolchain (riscv64 cross runtime)
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'linux-riscv64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libunwind-dev gcc-riscv64-linux-gnu g++-riscv64-linux-gnu qemu-user-static
          . /etc/os-release
          sudo dpkg --add-architecture riscv64
          for f in /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$f" ] && sudo sed -i '/^Types: deb$/a Architectures: amd64' "$f"
          done
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: %s %s-updates\nComponents: main universe\nArchitectures: riscv64\n' \
            "$VERSION_CODENAME" "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/riscv64-ports.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev:riscv64 zlib1g-dev:riscv64 libzstd-dev:riscv64 libncurses-dev:riscv64
      # A first rung with no qualified RC builds phase 1 with the Rust seed,
      # which needs the same tools as release.yml's seed steps.
      # A pure-Simple compiler building the compiler peaks above the 16 GB
      # runner after HIR (runs 40091812567, 40098331925: runner shutdown);
      # darwin-arm64 (7 GB) got through on macOS swap. Give Linux swap too.
      # 24 GB was not enough (run 40136579984: shutdown at MIR start); the
      # measured peak before the first MIR module is 36-40 GB at 1471 modules
      # (doc/08_tracking/bug/native_build_per_worker_baseline_rss_2026_10_24.md),
      # so use the /mnt temp disk, keeping 8 GB free, capped at 64 GB.
      - name: Swap for pure-Simple builds (linux)
        if: steps.sel.outputs.on == 'true' && startsWith(matrix.platform, 'linux-')
        run: |
          sudo swapoff -a || :
          sudo rm -f /mnt/swapfile
          df -h / /mnt
          avail=$(df -BG --output=avail /mnt | tail -1 | tr -dc 0-9)
          size=$((avail - 8)); [ "$size" -gt 64 ] && size=64
          [ "$size" -ge 24 ] || size=24
          sudo fallocate -l "${size}G" /mnt/ladder.swap
          sudo chmod 600 /mnt/ladder.swap
          sudo mkswap /mnt/ladder.swap
          sudo swapon /mnt/ladder.swap
          free -g
      - name: Build tools (linux-x86_64)
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm libunwind-dev
      - name: Install LLVM (macOS)
        if: steps.sel.outputs.on == 'true' && startsWith(matrix.platform, 'darwin-')
        run: |
          brew install llvm
          prefix=$(brew --prefix llvm)
          echo "DYLD_LIBRARY_PATH=$prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      # Windows default lane: MinGW UCRT (pinned llvm-mingw: clang + lld, no
      # GCC, no Visual Studio), Rust host x86_64-pc-windows-gnullvm. MSVC stays
      # available through SIMPLE_WINDOWS_ABI=msvc but CI builds gnu only.
      - name: MinGW UCRT toolchain (windows-x86_64)
        if: steps.sel.outputs.on == 'true' && matrix.platform == 'windows-x86_64'
        run: |
          sh scripts/setup/bootstrap-prereqs.shs install-llvm-mingw
          echo "SIMPLE_WINDOWS_ABI=gnu" >> "$GITHUB_ENV"
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' src/compiler_rust/rust-toolchain.toml)
          rustup set default-host x86_64-pc-windows-gnullvm
          rustup toolchain install "$channel" --profile minimal
      - name: Climb one phase
        if: steps.sel.outputs.on == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Automatic runs retain the lane's memory-sized self-host count;
          # an explicit manual selection applies to both compiler generations.
          PHASE_LADDER_SELFHOST_THREADS: ${{ steps.build_jobs.outputs.selfhost_count }}
          CARGO_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_HOST_MAX_THREADS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_HOST_MAX_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_BOOTSTRAP_MAX_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_NATIVE_FILE_TIMING: 1
        run: |
          if [ "${{ matrix.platform }}" = windows-x86_64 ]; then
            . scripts/setup/windows-gitbash-bootstrap-env.shs
            clang --version | head -1
            ld.lld --version
          fi
          mkdir -p build/ladder/in build/ladder/out build/ladder/evidence
          rc=0
          sh scripts/bootstrap/phase-ladder-step.shs "${{ matrix.platform }}" build/ladder/in build/ladder/out "${{ steps.build_jobs.outputs.count }}" 2>&1 | tee build/ladder/evidence/step.log || rc=$?
          exit "$rc"
      - name: Retain tiny attempt receipts (no compiler or cache)
        if: always() && steps.sel.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ladder-receipts-${{ matrix.platform }}-r${{ inputs.rung }}
          path: |
            build/ladder/evidence/attempt.sdn
            build/ladder/evidence/seed-native-failure.sdn
          retention-days: 14
          if-no-files-found: warn
      - name: Retain diagnostic logs, exact producer and native cache
        if: always() && steps.sel.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ladder-diagnostics-${{ matrix.platform }}-r${{ inputs.rung }}
          path: |
            build/ladder/evidence
            build/ladder/producer
            build/ladder/cache
            build/ladder/in/.resume-evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      # PHASE is written only by the existing successful Hello owner. This
      # retention gate is shape-only; it cannot qualify a compiler itself.
      - name: Detect retained proven handoffs
        id: handoffs
        if: always() && steps.sel.outputs.on == 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          available=false
          exe=
          case "$PLATFORM" in windows-*) exe=.exe ;; esac
          for phase in 1 2 3 4; do
            dir="build/ladder/out/$PLATFORM-p$phase"
            if [ -f "$dir/PHASE" ] && [ "$(cat "$dir/PHASE")" = "$phase" ] && [ -s "$dir/simple$exe" ]; then
              available=true
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
      # Upload only output that contains an actual PHASE handoff; rejected
      # candidates remain exclusively in the diagnostic artifact above.
      - uses: actions/upload-artifact@v4
        if: always() && steps.sel.outputs.on == 'true' && steps.handoffs.outputs.available == 'true'
        with:
          name: ladder-${{ matrix.platform }}-r${{ inputs.rung }}
          path: build/ladder/out
          retention-days: 14
          if-no-files-found: error

  freebsd:
    name: rung ${{ inputs.rung }} freebsd-x86_64
    if: inputs.lanes == 'all' || contains(inputs.lanes, 'freebsd-x86_64')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select build jobs
        id: build_jobs
        env:
          REQUESTED_BUILD_JOBS: ${{ inputs.build_jobs }}
          DEFAULT_BUILD_JOBS: 2
          DEFAULT_SELFHOST_JOBS: 1
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jobs=$REQUESTED_BUILD_JOBS
          selfhost_jobs=$jobs
          if [ "$jobs" = 0 ] && [ "$EVENT_NAME" != workflow_dispatch ]; then jobs=$DEFAULT_BUILD_JOBS; selfhost_jobs=$DEFAULT_SELFHOST_JOBS; fi
          case "$jobs" in ''|0*|*[!0-9]*) echo "build_jobs must be an integer from 1 through 256" >&2; exit 2 ;; esac
          [ "${#jobs}" -le 3 ] && [ "$jobs" -le 256 ] || { echo "build_jobs must be an integer from 1 through 256" >&2; exit 2; }
          echo "count=$jobs" >> "$GITHUB_OUTPUT"
          echo "selfhost_count=$selfhost_jobs" >> "$GITHUB_OUTPUT"
          echo "Selected build jobs: seed=$jobs selfhost=$selfhost_jobs"
      - uses: actions/download-artifact@v4
        if: inputs.rung > 1
        with:
          pattern: ladder-freebsd-*
          path: build/ladder/in
          merge-multiple: true
      - name: Proven handoffs (any run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/bootstrap/phase-ladder-resume.shs build/ladder/in freebsd-x86_64
      - name: Earlier diagnostic receipts (not admitted handoffs)
        if: inputs.rung > 1
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-ladder-receipts-freebsd-x86_64-r*
          path: build/ladder/diagnostics
      - name: Climb one phase in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          PHASE_LADDER_SELFHOST_THREADS: ${{ steps.build_jobs.outputs.selfhost_count }}
          CARGO_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_HOST_MAX_THREADS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_HOST_MAX_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_BOOTSTRAP_MAX_BUILD_JOBS: ${{ steps.build_jobs.outputs.count }}
          SIMPLE_NATIVE_FILE_TIMING: 1
        with:
          usesh: true
          mem: 12288
          envs: GH_TOKEN BUILD_JOBS PHASE_LADDER_SELFHOST_THREADS CARGO_BUILD_JOBS SIMPLE_HOST_MAX_THREADS SIMPLE_HOST_MAX_BUILD_JOBS SIMPLE_BOOTSTRAP_MAX_BUILD_JOBS SIMPLE_NATIVE_FILE_TIMING
          prepare: |
            pkg install -y bash curl git gmake pkgconf zstd llvm gh
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          run: |
            set -eu
            . "$HOME/.cargo/env"
            # The automatic 12 GB VM default remains one self-host thread;
            # explicit manual build_jobs overrides arrive through the VM env.
            # The synced checkout is owned by another uid; without this git refuses it
            # ("dubious ownership") and SCV fails with git-event-source-unavailable.
            git config --global --add safe.directory "$(pwd -P)"
            # 12 GB VM: add swap for the pure-Simple build's post-HIR peak (best
            # effort; a small VM disk only skips it).
            if dd if=/dev/zero of=/usr/ladder.swap bs=1m count=12288 2>/dev/null; then
              chmod 0600 /usr/ladder.swap
              md=$(mdconfig -a -t vnode -f /usr/ladder.swap) && swapon "/dev/$md" || echo "ladder: swap unavailable"
            else
              rm -f /usr/ladder.swap; echo "ladder: no disk for swap"
            fi
            swapinfo -h || :
            mkdir -p build/ladder/in build/ladder/out build/ladder/evidence
            # Record the verdict instead of failing the VM run: the action copies
            # build/ files back to the host only when the run succeeds.
            rc=0
            sh scripts/bootstrap/phase-ladder-step.shs freebsd-x86_64 build/ladder/in build/ladder/out "$BUILD_JOBS" > build/ladder/evidence/step.log 2>&1 || rc=$?
            cat build/ladder/evidence/step.log
            echo "$rc" > build/ladder/rc
      - name: Retain tiny attempt receipts (no compiler or cache)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ladder-receipts-freebsd-x86_64-r${{ inputs.rung }}
          path: |
            build/ladder/evidence/attempt.sdn
            build/ladder/evidence/seed-native-failure.sdn
          retention-days: 14
          if-no-files-found: warn
      - name: Retain diagnostic logs, exact producer and native cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ladder-diagnostics-freebsd-x86_64-r${{ inputs.rung }}
          path: |
            build/ladder/evidence
            build/ladder/producer
            build/ladder/cache
            build/ladder/in/.resume-evidence
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      # PHASE is written only by the existing successful Hello owner. This
      # retention gate is shape-only; it cannot qualify a compiler itself.
      - name: Detect retained proven handoffs
        id: handoffs
        if: always()
        env:
          PLATFORM: freebsd-x86_64
        run: |
          available=false
          exe=
          case "$PLATFORM" in windows-*) exe=.exe ;; esac
          for phase in 1 2 3 4; do
            dir="build/ladder/out/$PLATFORM-p$phase"
            if [ -f "$dir/PHASE" ] && [ "$(cat "$dir/PHASE")" = "$phase" ] && [ -s "$dir/simple$exe" ]; then
              available=true
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always() && steps.handoffs.outputs.available == 'true'
        with:
          name: ladder-freebsd-x86_64-r${{ inputs.rung }}
          path: build/ladder/out
          retention-days: 14
          if-no-files-found: error
      - name: Climb verdict
        run: |
          rc=$(cat build/ladder/rc 2>/dev/null || echo 1)
          echo "phase-ladder-step exit $rc"
          exit "$rc"
