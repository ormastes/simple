name: Slang paged KV provider

on:
  pull_request:
    paths:
      - "src/runtime/slang_ggml_shim.c"
      - "src/runtime/slang_paged_kv_provider.h"
      - "test/fixtures/slang_paged_kv_provider/**"
      - "scripts/check/check-slang-ggml-real-paged-provider.shs"
      - ".github/workflows/slang-paged-kv-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ormastes/llama.cpp
          ref: ed1bb5cff60be3b9045d4465420c344833492054
          path: build/llama-paged

      - name: Build compatible llama provider
        run: |
          cmake -S build/llama-paged -B build/llama-paged/build \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build/llama-paged/build --config Release --parallel 2

      - name: Acquire pinned tiny model fixture
        run: |
          python -m pip install --disable-pip-version-check "huggingface_hub[cli]==0.34.4"
          hf download ggml-org/tiny-llamas stories15M-q4_0.gguf \
            --local-dir build/model-fixture
          printf '%s  %s\n' \
            '6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04' \
            'build/model-fixture/stories15M-q4_0.gguf' | sha256sum --check

      - name: Run real paged-provider gate
        env:
          LLAMA_ROOT: build/llama-paged
          LLAMA_BUILD_DIR: build/llama-paged/build
          SLANG_TEST_MODEL: build/model-fixture/stories15M-q4_0.gguf
        run: sh scripts/check/check-slang-ggml-real-paged-provider.shs
