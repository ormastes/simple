name: Windows Materializer

on:
  pull_request:
    paths:
      - 'scripts/setup/materialize-symlinks-windows.shs'
      - 'scripts/setup/windows-materialized-pending-policy.tsv'
      - 'scripts/setup/host-env.shs'
      - 'test/01_unit/scripts/materialize_symlinks_windows_receipt_publication_test.shs'
      - '.github/workflows/windows-materializer.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/setup/materialize-symlinks-windows.shs'
      - 'scripts/setup/windows-materialized-pending-policy.tsv'
      - 'scripts/setup/host-env.shs'
      - 'test/01_unit/scripts/materialize_symlinks_windows_receipt_publication_test.shs'
      - '.github/workflows/windows-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-publication:
    name: Windows receipt publication
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify native receipt publication and no-replace behavior
        shell: bash
        run: sh test/01_unit/scripts/materialize_symlinks_windows_receipt_publication_test.shs
