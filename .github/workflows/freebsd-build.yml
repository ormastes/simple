name: FreeBSD QEMU Contract

on:
  push:
    branches: [main, master]
    paths:
      - 'src/compiler/**'
      - 'src/compiler_rust/**'
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'scripts/bootstrap/**'
      - 'scripts/check/check-freebsd-bootstrap-qemu.shs'
      - 'scripts/qemu/simple-freebsd-media.shs'
      - 'scripts/check/check-bootstrap-portability.shs'
      - 'scripts/check/cert/redeploy_gate/candidate_frontend_admission.shs'
      - 'scripts/check/check-stage4-hosted-dynload-provider-archive.shs'
      - 'scripts/check/validate_stage4_hosted_dynload_provider_archive.spl'
      - 'scripts/check/native-smoke-matrix.shs'
      - 'scripts/check/check-native-seed-parity.shs'
      - 'test/fixtures/compiler/native_option_try_*_loud.spl'
      - 'test/fixtures/native_exists_struct_payload_field/**'
      - 'test/fixtures/compiler/native_module_global_initializer.spl'
      - 'test/03_system/native/c9_string_parse_f64_to_upper.spl'
      - 'test/03_system/native/enum_f64_payload_precision.spl'
      - 'scripts/check/check-native-crossmodule-result-u8.shs'
      - 'test/fixtures/native_crossmodule_result_u8/**'
      - 'scripts/check/check-freebsd-wm-seam-refusal.shs'
      - 'src/lib/nogc_async_mut/wm/host.spl'
      - '.github/workflows/freebsd-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/compiler/**'
      - 'src/compiler_rust/**'
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'scripts/bootstrap/**'
      - 'scripts/check/check-freebsd-bootstrap-qemu.shs'
      - 'scripts/qemu/simple-freebsd-media.shs'
      - 'scripts/check/check-bootstrap-portability.shs'
      - 'scripts/check/cert/redeploy_gate/candidate_frontend_admission.shs'
      - 'scripts/check/check-stage4-hosted-dynload-provider-archive.shs'
      - 'scripts/check/validate_stage4_hosted_dynload_provider_archive.spl'
      - 'scripts/check/native-smoke-matrix.shs'
      - 'scripts/check/check-native-seed-parity.shs'
      - 'test/fixtures/compiler/native_option_try_*_loud.spl'
      - 'test/fixtures/native_exists_struct_payload_field/**'
      - 'test/fixtures/compiler/native_module_global_initializer.spl'
      - 'test/03_system/native/c9_string_parse_f64_to_upper.spl'
      - 'test/03_system/native/enum_f64_payload_precision.spl'
      - 'scripts/check/check-native-crossmodule-result-u8.shs'
      - 'test/fixtures/native_crossmodule_result_u8/**'
      - 'scripts/check/check-freebsd-wm-seam-refusal.shs'
      - 'src/lib/nogc_async_mut/wm/host.spl'
      - '.github/workflows/freebsd-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  freebsd-media-contract:
    name: FreeBSD offline media admission contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hosted runners do not hold the reviewed FreeBSD qcow2 and digest. A
      # full VM claim is therefore intentionally not made in GitHub Actions.
      - name: Verify offline media refusal contract
        run: |
          sh -n scripts/qemu/simple-freebsd-media.shs
          sh -n scripts/check/check-freebsd-bootstrap-qemu.shs
          sh -n scripts/check/check-freebsd-wm-seam-refusal.shs
          if sh scripts/qemu/simple-freebsd-media.shs --check; then
            echo "unprovisioned runner unexpectedly admitted FreeBSD media" >&2
            exit 1
          fi
