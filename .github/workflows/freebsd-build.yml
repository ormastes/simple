name: FreeBSD Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - 'src/compiler/**'
      - 'src/compiler_rust/**'
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'scripts/bootstrap/**'
      - 'scripts/check/check-freebsd-bootstrap-qemu.shs'
      - 'scripts/check/check-bootstrap-portability.shs'
      - 'scripts/check/cert/redeploy_gate/candidate_frontend_admission.shs'
      - 'scripts/check/check-stage4-hosted-dynload-provider-archive.shs'
      - 'scripts/check/validate_stage4_hosted_dynload_provider_archive.spl'
      - 'scripts/check/native-smoke-matrix.shs'
      - 'scripts/check/check-native-seed-parity.shs'
      - 'test/fixtures/compiler/native_option_try_*_loud.spl'
      - 'test/fixtures/native_exists_struct_payload_field/**'
      - 'test/fixtures/compiler/native_module_global_initializer.spl'
      - 'test/03_system/native/c9_string_parse_f64_to_upper.spl'
      - 'test/03_system/native/enum_f64_payload_precision.spl'
      - 'scripts/check/check-native-crossmodule-result-u8.shs'
      - 'test/fixtures/native_crossmodule_result_u8/**'
      - 'scripts/check/check-freebsd-wm-seam-refusal.shs'
      - 'src/lib/nogc_async_mut/wm/host.spl'
      - '.github/workflows/freebsd-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/compiler/**'
      - 'src/compiler_rust/**'
      - 'src/app/**'
      - 'src/lib/**'
      - 'src/runtime/**'
      - 'scripts/bootstrap/**'
      - 'scripts/check/check-freebsd-bootstrap-qemu.shs'
      - 'scripts/check/check-bootstrap-portability.shs'
      - 'scripts/check/cert/redeploy_gate/candidate_frontend_admission.shs'
      - 'scripts/check/check-stage4-hosted-dynload-provider-archive.shs'
      - 'scripts/check/validate_stage4_hosted_dynload_provider_archive.spl'
      - 'scripts/check/native-smoke-matrix.shs'
      - 'scripts/check/check-native-seed-parity.shs'
      - 'test/fixtures/compiler/native_option_try_*_loud.spl'
      - 'test/fixtures/native_exists_struct_payload_field/**'
      - 'test/fixtures/compiler/native_module_global_initializer.spl'
      - 'test/03_system/native/c9_string_parse_f64_to_upper.spl'
      - 'test/03_system/native/enum_f64_payload_precision.spl'
      - 'scripts/check/check-native-crossmodule-result-u8.shs'
      - 'test/fixtures/native_crossmodule_result_u8/**'
      - 'scripts/check/check-freebsd-wm-seam-refusal.shs'
      - 'src/lib/nogc_async_mut/wm/host.spl'
      - '.github/workflows/freebsd-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  native-freebsd-bootstrap:
    name: Native FreeBSD pure-Simple bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            genisoimage openssh-client qemu-system-x86 qemu-utils rsync xz-utils
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          mkdir -p "$HOME/.ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"

      - name: Bootstrap and verify inside native FreeBSD
        timeout-minutes: 90
        run: sh scripts/check/check-freebsd-bootstrap-qemu.shs --full --download

      - name: Upload bootstrap failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-bootstrap-failure-${{ github.run_id }}
          path: build/freebsd/bootstrap-logs/
          if-no-files-found: warn

      # Task #60 Lane B: proves the WM/host seam correctly REFUSES a 2D
      # surface on a real FreeBSD guest. Reuses the base image + cloud-init
      # ISO the bootstrap step above already downloaded (same VM_DIR, same
      # QEMU_BASE_VM_PATH/QEMU_CLOUDINIT_ISO defaults), so it must run after
      # that step, not standalone.
      - name: FreeBSD WM seam refusal (in-VM)
        if: ${{ !cancelled() }}
        timeout-minutes: 70
        run: sh scripts/check/check-freebsd-wm-seam-refusal.shs

      - name: Upload FreeBSD WM seam failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-wm-seam-failure-${{ github.run_id }}
          path: build/freebsd/vm/wm-seam-qemu-serial.log
          if-no-files-found: warn
