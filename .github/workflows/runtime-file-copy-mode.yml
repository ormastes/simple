name: Runtime File Copy Mode

on:
  pull_request:
    branches: [main, master, develop, 'release/**']
    paths:
      - '.github/workflows/runtime-file-copy-mode.yml'
      - 'scripts/check/check-runtime-file-copy-mode.shs'
      - 'scripts/check/check-baremetal-runtime-bool.shs'
      - 'examples/09_embedded/simple_os/arch/**'
      - 'test/01_unit/os/libc/simpleos_baremetal_runtime_bool_test.c'
      - 'src/runtime/**'
  push:
    branches: [main, master, develop, 'release/**']
    paths:
      - '.github/workflows/runtime-file-copy-mode.yml'
      - 'scripts/check/check-runtime-file-copy-mode.shs'
      - 'scripts/check/check-baremetal-runtime-bool.shs'
      - 'examples/09_embedded/simple_os/arch/**'
      - 'test/01_unit/os/libc/simpleos_baremetal_runtime_bool_test.c'
      - 'src/runtime/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-file-copy-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check
            src/runtime
          sparse-checkout-cone-mode: true
      - name: Copy, publish, and execute through both C runtime providers
        shell: sh
        run: sh scripts/check/check-runtime-file-copy-mode.shs
  baremetal-runtime-bool:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check
            examples/09_embedded/simple_os/arch
            test/01_unit/os/libc
          sparse-checkout-cone-mode: true
      - name: Verify tagged boolean helpers from the baremetal owners
        shell: sh
        env:
          CC: clang
        run: sh scripts/check/check-baremetal-runtime-bool.shs
