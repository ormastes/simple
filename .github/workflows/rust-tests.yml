name: Rust Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/compiler_rust/**'
      - '.github/workflows/rust-tests.yml'
  pull_request:
    types: [labeled]  # PR runs only when the ci:full label is added (2026-09-27)
    branches: [ main, master, develop ]
    paths:
      - 'src/compiler_rust/**'
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: 'Run slow tests (ignored tests)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-rust:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    name: Check Rust Source
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.check.outputs.has_rust }}
    steps:
    - uses: actions/checkout@v5
    - name: Check for Rust workspace
      id: check
      run: |
        if [ -d "src/compiler_rust" ]; then
          echo "has_rust=true" >> $GITHUB_OUTPUT
          echo "Rust workspace found - will run tests"
        else
          echo "has_rust=false" >> $GITHUB_OUTPUT
          echo "No src/compiler_rust/ workspace found"
          echo "Skipping all Rust tests"
        fi

  test:
    name: Test Suite
    needs: check-rust
    if: needs.check-rust.outputs.has_rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    defaults:
      run:
        working-directory: src/compiler_rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # PRs use their merge SHA; dispatches use the SHA resolved at creation.
        ref: ${{ github.sha }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry
      uses: actions/cache@v5
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v5
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v5
      with:
        path: src/compiler_rust/target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('src/compiler_rust/Cargo.lock') }}

    - name: Install SPIR-V Tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y spirv-tools libfreetype6-dev
      working-directory: .

    - name: Install SPIR-V Tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install spirv-tools freetype
        echo "LIBRARY_PATH=$(brew --prefix freetype)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
        echo "CPATH=$(brew --prefix freetype)/include:$CPATH" >> "$GITHUB_ENV"
      working-directory: .

    - name: Verify spirv-val installation
      run: spirv-val --version
      working-directory: .

    - name: Run tests
      run: cargo test --workspace --verbose --no-fail-fast --exclude simple-driver --exclude simple-compiler --exclude simple-runtime --exclude simple-native-all

    - name: Check compiler library
      run: cargo check -p simple-compiler --verbose

    - name: Compile compiler lib tests
      id: compiler_lib_tests
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      run: cargo test -p simple-compiler --verbose --lib --no-run

    - name: Execute exact LLVM pipeline strict HIR regression
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.compiler_lib_tests.outcome == 'success' }}
      timeout-minutes: 3
      run: bash ../../scripts/ci/check-llvm-pipeline-strict-hir.shs "$GITHUB_WORKSPACE/build/ci/strict-hir-unit"

    - name: Record blocked strict HIR prerequisite
      if: ${{ !cancelled() && runner.os == 'Linux' && steps.compiler_lib_tests.outcome != 'success' }}
      env:
        PREREQUISITE_OUTCOME: ${{ steps.compiler_lib_tests.outcome }}
      run: bash ../../scripts/ci/record-strict-hir-blocked.shs "$GITHUB_WORKSPACE/build/ci/strict-hir-unit" "$PREREQUISITE_OUTCOME"

    - name: Retain strict HIR unit source and execution evidence
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      uses: actions/upload-artifact@v6
      with:
        name: strict-hir-unit-${{ github.sha }}
        path: build/ci/strict-hir-unit/
        if-no-files-found: error

    - name: Compile runtime lib tests
      run: cargo test -p simple-runtime --verbose --lib --no-run

    - name: Run driver unit tests
      run: cargo test -p simple-driver --verbose --lib

    - name: Run driver integration tests (excluding stdlib)
      run: cargo test -p simple-driver --verbose --test runner_tests --test jj_state_tests --test rustyline_backspace_expected_failure_test --test rustyline_repl_backspace_bug_test

    - name: Run Simple stdlib tests
      continue-on-error: true
      run: cargo test -p simple-driver --verbose --test simple_stdlib_tests --test simple_tests

    - name: Run doc tests
      run: cargo test --workspace --doc --verbose --exclude simple-native-all

  clippy:
    name: Clippy
    needs: check-rust
    if: needs.check-rust.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/compiler_rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Run clippy
      run: cargo clippy --workspace --all-targets --exclude simple-native-all -- -D warnings -A clippy::all -A unused_assignments -A function_casts_as_integer -A clashing-extern-declarations

  fmt:
    name: Rustfmt
    needs: check-rust
    if: needs.check-rust.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/compiler_rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt --all -- --check

  coverage:
    name: Code Coverage
    needs: check-rust
    if: needs.check-rust.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/compiler_rust

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install SPIR-V Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y spirv-tools libfreetype6-dev
      working-directory: .

    - name: Generate coverage
      run: cargo llvm-cov --workspace --exclude simple-driver --exclude simple-compiler --exclude simple-runtime --exclude simple-native-all --lcov --output-path lcov.info

    - name: Generate driver coverage (excluding stdlib tests)
      continue-on-error: true
      run: cargo llvm-cov -p simple-driver --lib --test runner_tests --test jj_state_tests --lcov --output-path lcov-driver.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: src/compiler_rust/lcov.info
        fail_ci_if_error: false

  skip-notice:
    name: Rust tests skipped
    needs: check-rust
    if: needs.check-rust.outputs.has_rust == 'false'
    runs-on: ubuntu-latest
    steps:
    - name: Notice
      run: |
        echo "No Rust source was detected in this checkout."
        echo "Rust tests skipped; use 'bin/simple test' for Simple/SPipe tests instead."
