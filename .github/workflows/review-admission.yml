name: SPipe self-review admission broker

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number; all provider state is resolved server-side
        required: true
        type: number
      session_id:
        description: Exact audited SPipe development session identifier
        required: true
        type: string
      reviewer_model:
        description: Self-reviewing high-capability model identifier
        required: true
        type: string
      reviewer_effort:
        description: Self-review effort
        required: true
        type: choice
        options: [high, xhigh, max, ultra]
      self_attestation:
        description: Enter PASS:0:0 to self-attest PASS with zero P0/P1; this is not independent authentication
        required: true
        type: string
  schedule:
    - cron: '*/5 * * * *'
  pull_request_target:
    types: [synchronize, edited, closed, reopened]
  repository_dispatch:
    types: [self_review_policy_changed, self_review_ruleset_changed]
  push:
    branches: [main, integration/main, 'release/**']

# Scheduled runs previously accumulated without bound. The only concurrency
# control was job-level, keyed on `inputs.pull_request_number` -- which is EMPTY
# for `schedule` events, so every scheduled run collided in one group with
# `cancel-in-progress: false` and queued behind its predecessors. At */5 that is
# 288 runs/day against a hosted-runner cap with zero self-hosted runners
# registered, and this broker produces a REQUIRED check, so the workflow that
# must run for any PR to merge was starving itself. Measured 2026-09-02: 19 of
# the ~89 queued runs repo-wide were this one workflow.
#
# Collapse scheduled runs (only the newest is useful -- it re-evaluates current
# state anyway) while leaving dispatch/PR runs strictly alone: those are
# per-PR-keyed and must not cancel each other.
concurrency:
  group: review-admission-${{ github.event_name }}-${{ github.event.inputs.pull_request_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

# Repository Actions defaults remain read-only. Only the protected environment
# jobs below request checks:write. The generic Actions App is explicitly a
# user-authorized trust boundary, not an independent security identity.
permissions:
  contents: read

jobs:
  invalidate-pr-event:
    if: github.event_name == 'pull_request_target'
    name: Invalidate changed PR self-review state
    runs-on: ubuntu-latest
    environment: self-review-admission
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Reset same-head admission immediately
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -Eeuo pipefail
          # pull_request_target always executes this trusted default-branch
          # definition and never checks out or executes pull-request content.
          gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=SPipe%20Self%20Review%20Admission&per_page=100" \
            --jq '.check_runs[] | select(.conclusion == "success") | .id' |
          while read -r check_id; do
            jq -cn --arg action "$EVENT_ACTION" '{status:"completed",conclusion:"action_required",output:{title:"Exact-state self-review invalidated",summary:("Pull request event " + $action + " changed merge-relevant state. Dispatch a new exact-state evaluation.")}}' >"$RUNNER_TEMP/check-event-invalidated.json"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input "$RUNNER_TEMP/check-event-invalidated.json" >/dev/null
          done

  invalidate-expired:
    if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event_name == 'push'
    name: Revalidate SPipe Self Review Admission
    runs-on: ubuntu-latest
    environment: self-review-admission
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Reset expired successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          now=$(date -u +%s)
          invalidate_all=false
          if [[ "$GITHUB_EVENT_NAME" == repository_dispatch || "$GITHUB_EVENT_NAME" == push ]]; then
            invalidate_all=true
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | [.number,.head.sha,("refs/heads/" + .base.ref),.base.sha] | @tsv' |
          while IFS=$'\t' read -r pr_number head_sha current_base_ref current_base_sha; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=SPipe%20Self%20Review%20Admission&per_page=100" \
              --jq '.check_runs[] | select(.conclusion == "success") | [.id, .external_id] | @tsv' |
            while IFS=$'\t' read -r check_id external_id; do
              case "$external_id" in spipe-self-review/1\|*) ;; *) continue ;; esac
              IFS='|' read -r schema bound_pr bound_base_ref bound_base_sha bound_merge_base bound_diff bound_ruleset bound_ruleset_version bound_ruleset_sha256 expires_at <<<"$external_id"
              [[ "$expires_at" =~ ^[1-9][0-9]*$ ]] || expires_at=0
              ruleset_id=${bound_ruleset#github:ruleset:}
              invalid=false
              if [[ "$invalidate_all" == true || "$bound_pr" != "$pr_number" || "$bound_base_ref" != "$current_base_ref" ||
                    "$bound_base_sha" != "$current_base_sha" ]] || (( now >= expires_at )); then
                invalid=true
              elif ! current_ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id" 2>/dev/null); then
                invalid=true
              elif [[ "$(jq -er '.name' <<<"$current_ruleset")" != "$bound_ruleset_version" ]]; then
                invalid=true
              elif ! jq -e '(.enforcement == "active") and any(.rules[]; .type == "required_status_checks" and .parameters.strict_required_status_checks_policy == true and any(.parameters.required_status_checks[]; .context == "SPipe Self Review Admission"))' <<<"$current_ruleset" >/dev/null; then
                invalid=true
              elif [[ "$(jq -Sc '{id,name,target,enforcement,conditions,rules}' <<<"$current_ruleset" | sha256sum | awk '{print $1}')" != "$bound_ruleset_sha256" ]]; then
                invalid=true
              elif ! gh api "repos/$GITHUB_REPOSITORY/rules/branches/${current_base_ref#refs/heads/}" |
                jq -e --argjson id "$ruleset_id" 'any(.[]; .ruleset_id == $id)' >/dev/null; then
                invalid=true
              fi
              if [[ "$invalid" == true ]]; then
                jq -cn '{status:"completed",conclusion:"action_required",output:{title:"Scoped self-review is no longer current",summary:"Expiry or protected policy, ruleset, base, or PR state changed. Dispatch a new exact-state evaluation."}}' >"$RUNNER_TEMP/check-expired.json"
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input "$RUNNER_TEMP/check-expired.json" >/dev/null
              fi
            done
          done

  self-review-admission:
    if: github.event_name == 'workflow_dispatch'
    name: SPipe Self Review Admission
    runs-on: ubuntu-latest
    environment: self-review-admission
    concurrency:
      group: self-review-admission-${{ inputs.pull_request_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve, evaluate, revalidate, and publish one short-lived check
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          SESSION_ID: ${{ inputs.session_id }}
          REVIEWER_MODEL: ${{ inputs.reviewer_model }}
          REVIEWER_EFFORT: ${{ inputs.reviewer_effort }}
          SELF_ATTESTATION: ${{ inputs.self_attestation }}
          POLICY_DB_JSONL: ${{ secrets.SPIPE_SELF_REVIEW_POLICY_DB }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          check_id=
          check_head=
          audit_dir="$RUNNER_TEMP/self-review-audit"
          mkdir -p "$audit_dir"
          finish_check() {
            result=$?
            if [[ -n "$check_id" && -n "$check_head" ]]; then
              if [[ $result -eq 0 ]]; then
                conclusion=success
                title='Scoped self-review admitted temporarily'
                summary='Exact provider state and explicit self-attestation passed. This is neither independent review nor provider Approve.'
              else
                conclusion=failure
                title='Scoped self-review rejected'
                summary='Exact policy, identity, protected target, base, merge-base, diff, or self-attestation failed closed.'
              fi
              jq -cn --arg conclusion "$conclusion" --arg title "$title" --arg summary "$summary" '{status:"completed",conclusion:$conclusion,output:{title:$title,summary:$summary}}' >"$RUNNER_TEMP/check-finish.json"
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input "$RUNNER_TEMP/check-finish.json" >/dev/null || true
            fi
            exit "$result"
          }
          trap finish_check EXIT

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SESSION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]]
          [[ "$REVIEWER_MODEL" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]
          [[ "$REVIEWER_EFFORT" =~ ^(high|xhigh|max|ultra)$ ]]
          test "$SELF_ATTESTATION" = 'PASS:0:0'

          config=.github/review-admission-broker.json
          default_branch=$(jq -er '.privileged_self_review.trusted_default_branch' "$config")
          expected_workflow="$GITHUB_REPOSITORY/.github/workflows/review-admission.yml@refs/heads/$default_branch"
          test "$WORKFLOW_REF" = "$expected_workflow"
          test "$(jq -r '.privileged_self_review.environment' "$config")" = 'self-review-admission'
          test "$(jq -r '.privileged_self_review.review_evidence_mode' "$config")" = 'self_attested'
          test "$(jq -r '.privileged_self_review.generic_actions_app_trust_accepted' "$config")" = true

          expected_actor=$(jq -er '.authorized_dispatcher.id | select(type == "number" and . > 0)' "$config")
          actor_id=$(gh api "users/$ACTOR" --jq '.id')
          test "$actor_id" = "$expected_actor"
          provider_repo=$(gh api "repos/$GITHUB_REPOSITORY")
          repository_id=$(jq -er '.id' <<<"$provider_repo")
          repository_node_id=$(jq -er '.node_id' <<<"$provider_repo")
          repository_name=$(jq -er '.full_name' <<<"$provider_repo")
          test "$repository_name" = "$GITHUB_REPOSITORY"
          test "$(jq -er '.default_branch' <<<"$provider_repo")" = "$default_branch"

          resolve_pr() { gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"; }
          provider_pr=$(resolve_pr)
          head_sha=$(jq -er '.head.sha' <<<"$provider_pr")
          base_sha=$(jq -er '.base.sha' <<<"$provider_pr")
          base_ref_name=$(jq -er '.base.ref' <<<"$provider_pr")
          base_ref="refs/heads/$base_ref_name"
          base_repository_id=$(jq -er '.base.repo.id' <<<"$provider_pr")
          base_repository_node_id=$(jq -er '.base.repo.node_id' <<<"$provider_pr")
          base_repository=$(jq -er '.base.repo.full_name' <<<"$provider_pr")
          author_id=$(jq -er '.user.id' <<<"$provider_pr")
          test "$author_id" = "$actor_id"
          test "$base_repository_id" = "$repository_id"
          case "$base_ref_name" in
            main|integration/main) expected_ruleset='spipe-vcs-v3-main' ;;
            release/*) expected_ruleset='spipe-vcs-v3-release-lines' ;;
            *) echo 'self-review admission: unsupported protected base' >&2; exit 1 ;;
          esac
          resolve_ruleset() {
            gh api "repos/$GITHUB_REPOSITORY/rulesets" | jq -er --arg name "$expected_ruleset" '[.[] | select(.name == $name and .enforcement == "active")] | if length == 1 then .[0].id else error("exact active ruleset not found") end'
          }
          target_ruleset_id=$(resolve_ruleset)
          ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$target_ruleset_id")
          jq -e 'any(.rules[]; .type == "required_status_checks" and .parameters.strict_required_status_checks_policy == true and any(.parameters.required_status_checks[]; .context == "SPipe Self Review Admission"))' <<<"$ruleset" >/dev/null
          target_ruleset_sha256=$(jq -Sc '{id,name,target,enforcement,conditions,rules}' <<<"$ruleset" | sha256sum | awk '{print $1}')
          [[ "$target_ruleset_sha256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/$base_ref_name" |
            jq -e --argjson id "$target_ruleset_id" 'any(.[]; .ruleset_id == $id)' >/dev/null
          check_head=$head_sha

          jq -cn --arg name 'SPipe Self Review Admission' --arg head "$head_sha" --arg details "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{name:$name,head_sha:$head,status:"in_progress",details_url:$details,output:{title:"Scoped self-review evaluation",summary:"Resolving exact protected target, base, merge-base, and diff."}}' >"$RUNNER_TEMP/check-start.json"
          check_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input "$RUNNER_TEMP/check-start.json" --jq '.id')

          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/self-review/$PR_NUMBER/head" "+refs/heads/$base_ref_name:refs/remotes/origin/self-review/$PR_NUMBER/base"
          test "$(git rev-parse refs/remotes/origin/self-review/$PR_NUMBER/head)" = "$head_sha"
          fetched_base_sha=$(git rev-parse refs/remotes/origin/self-review/$PR_NUMBER/base)
          if [[ "$fetched_base_sha" != "$base_sha" ]]; then
            failure_stage='protected base advanced after provider resolution; sync the PR branch, review its new exact head, and dispatch again'
            echo "self-review admission: protected base advanced from $base_sha to $fetched_base_sha; sync the PR branch, review its new exact head, and dispatch again" >&2
            exit 1
          fi
          merge_base_sha=$(git merge-base "$base_sha" "$head_sha")
          scripts/release/self-review-changed-manifest.shs github "$repository_id" "$repository_node_id" "$repository_name" "$PR_NUMBER" "$base_repository_id" "$base_repository_node_id" "$base_repository" "$base_ref" "$base_sha" "$head_sha" "$merge_base_sha" "$audit_dir/changed-paths.sdn"
          diff_sha256=$(awk '$1 == "diff_sha256:" { print $2 }' "$audit_dir/changed-paths.sdn")
          [[ "$diff_sha256" =~ ^[0-9a-f]{64}$ ]]

          self_attestation_json=$(jq -cn --arg repo "$repository_name" --argjson pr "$PR_NUMBER" --arg head "$head_sha" --arg base "$base_sha" --arg merge "$merge_base_sha" --arg diff "$diff_sha256" --arg session "$SESSION_ID" --arg actor "$actor_id" --arg model "$REVIEWER_MODEL" --arg effort "$REVIEWER_EFFORT" '{schema:"spipe-self-review-self-attestation/1",mode:"self_attested",repository:$repo,pull_request_number:$pr,head_sha:$head,base_sha:$base,merge_base_sha:$merge,diff_sha256:$diff,session_id:$session,reviewer:{provider:"github",identity:$actor,model:$model,tier:"high_capability",effort:$effort},verdict:"PASS",p0_count:0,p1_count:0}')
          review_evidence_sha256=$(printf '%s' "$self_attestation_json" | sha256sum | awk '{print $1}')
          printf '%s\n' "$self_attestation_json" >"$audit_dir/self-attestation.json"

          test -n "$POLICY_DB_JSONL"
          policy_path="$RUNNER_TEMP/operator-self-review-policy.jsonl"
          printf '%s' "$POLICY_DB_JSONL" >"$policy_path"
          chmod 600 "$policy_path"
          policy_sha256=$(sha256sum "$policy_path" | awk '{print $1}')
          now_unix=$(date -u +%s)
          expires_at_unix=$((now_unix + 600))
          write_evaluation_request() {
            request_now=$1
            request_ruleset_sha256=$2
            request_output=$3
            jq -cn \
              --arg repository_provider github --argjson repository_id "$repository_id" \
              --arg repository_node_id "$repository_node_id" --arg repository "$repository_name" \
              --argjson pull_request_number "$PR_NUMBER" --arg head_sha "$head_sha" \
              --arg session_id "$SESSION_ID" --arg author_provider github --arg author_identity "$author_id" \
              --arg reviewer_provider github --arg reviewer_identity "$actor_id" \
              --arg reviewer_model "$REVIEWER_MODEL" --arg reviewer_effort "$REVIEWER_EFFORT" \
              --argjson now_unix "$request_now" --argjson expires_at_unix "$expires_at_unix" \
              --arg review_evidence_sha256 "$review_evidence_sha256" --arg policy_sha256 "$policy_sha256" \
              --argjson target_repository_id "$base_repository_id" --arg target_ref "$base_ref" \
              --arg target_ruleset_id "github:ruleset:$target_ruleset_id" \
              --arg target_ruleset_version "$expected_ruleset" --arg target_ruleset_sha256 "$request_ruleset_sha256" \
              --arg base_sha "$base_sha" --arg merge_base_sha "$merge_base_sha" --arg diff_sha256 "$diff_sha256" \
              '{schema:"spipe-self-review-request/1",repository_provider:$repository_provider,
                repository_id:$repository_id,repository_node_id:$repository_node_id,repository:$repository,
                pull_request_number:$pull_request_number,head_sha:$head_sha,session_id:$session_id,
                author_provider:$author_provider,author_identity:$author_identity,
                reviewer_provider:$reviewer_provider,reviewer_identity:$reviewer_identity,
                reviewer_model:$reviewer_model,reviewer_tier:"high_capability",reviewer_effort:$reviewer_effort,
                review_evidence_mode:"self_attested",now_unix:$now_unix,
                decision_expires_at_unix:$expires_at_unix,higher_model_verdict:"PASS",
                higher_model_p0_count:0,higher_model_p1_count:0,
                review_evidence_sha256:$review_evidence_sha256,expected_policy_db_sha256:$policy_sha256,
                policy_db_authenticated:true,changed_manifest_authenticated:true,
                review_evidence_broker_authenticated:false,self_attestation_authorized:true,
                target_repository_id:$target_repository_id,target_ref:$target_ref,
                target_ruleset_id:$target_ruleset_id,target_ruleset_version:$target_ruleset_version,
                target_ruleset_sha256:$target_ruleset_sha256,base_sha:$base_sha,
                merge_base_sha:$merge_base_sha,diff_sha256:$diff_sha256,strict_up_to_date:true,
                protected_target:true,provider_resolution_authenticated:true}' >"$request_output"
          }
          failure_stage='external policy or exact-head self-review evaluation failed'
          write_evaluation_request "$now_unix" "$target_ruleset_sha256" "$audit_dir/evaluation-request.json"
          SPIPE_SELF_REVIEW_POLICY_DB="$policy_path" node scripts/release/self-review-policy-evaluator.mjs \
            --policy-db="$policy_path" --changed-manifest="$audit_dir/changed-paths.sdn" \
            --request="$audit_dir/evaluation-request.json" >"$audit_dir/decision.json"

          # Re-resolve every mutable provider fact immediately before emission.
          current_pr=$(resolve_pr)
          test "$(jq -er '.head.sha' <<<"$current_pr")" = "$head_sha"
          test "$(jq -er '.base.sha' <<<"$current_pr")" = "$base_sha"
          test "refs/heads/$(jq -er '.base.ref' <<<"$current_pr")" = "$base_ref"
          test "$(resolve_ruleset)" = "$target_ruleset_id"
          current_ruleset=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$target_ruleset_id")
          test "$(jq -er '.enforcement' <<<"$current_ruleset")" = active
          current_ruleset_sha256=$(jq -Sc '{id,name,target,enforcement,conditions,rules}' <<<"$current_ruleset" | sha256sum | awk '{print $1}')
          test "$current_ruleset_sha256" = "$target_ruleset_sha256"
          jq -e 'any(.rules[]; .type == "required_status_checks" and .parameters.strict_required_status_checks_policy == true and any(.parameters.required_status_checks[]; .context == "SPipe Self Review Admission"))' <<<"$current_ruleset" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/$base_ref_name" |
            jq -e --argjson id "$target_ruleset_id" 'any(.[]; .ruleset_id == $id)' >/dev/null
          git fetch --no-tags --no-recurse-submodules origin "+refs/heads/$base_ref_name:refs/remotes/origin/self-review/$PR_NUMBER/base"
          fetched_base_sha=$(git rev-parse refs/remotes/origin/self-review/$PR_NUMBER/base)
          if [[ "$fetched_base_sha" != "$base_sha" ]]; then
            failure_stage='protected base advanced during evaluation; sync the PR branch, review its new exact head, and dispatch again'
            echo "self-review admission: protected base advanced from $base_sha to $fetched_base_sha during evaluation; sync the PR branch, review its new exact head, and dispatch again" >&2
            exit 1
          fi
          test "$(git merge-base "$base_sha" "$head_sha")" = "$merge_base_sha"
          scripts/release/self-review-changed-manifest.shs github "$repository_id" "$repository_node_id" "$repository_name" "$PR_NUMBER" "$base_repository_id" "$base_repository_node_id" "$base_repository" "$base_ref" "$base_sha" "$head_sha" "$merge_base_sha" "$audit_dir/revalidated-changed-paths.sdn"
          cmp "$audit_dir/changed-paths.sdn" "$audit_dir/revalidated-changed-paths.sdn"
          current_now_unix=$(date -u +%s)
          test "$current_now_unix" -lt "$expires_at_unix"
          # Re-read external policy and re-run the tracked v1 decision adapter
          # after all provider facts are re-resolved, immediately before emission.
          failure_stage='current external policy decision or final exact-state assertion failed'
          write_evaluation_request "$current_now_unix" "$current_ruleset_sha256" "$audit_dir/current-evaluation-request.json"
          SPIPE_SELF_REVIEW_POLICY_DB="$policy_path" node scripts/release/self-review-policy-evaluator.mjs \
            --policy-db="$policy_path" --changed-manifest="$audit_dir/revalidated-changed-paths.sdn" \
            --request="$audit_dir/current-evaluation-request.json" >"$audit_dir/current-decision.json"
          jq -e --arg head "$head_sha" --arg base "$base_sha" --arg merge "$merge_base_sha" --arg diff "$diff_sha256" --arg ruleset "github:ruleset:$target_ruleset_id" --arg ruleset_version "$expected_ruleset" --arg ruleset_sha "$target_ruleset_sha256" '.decision_schema == "spipe-self-review-decision/1" and .status == "ok" and .allowed == true and .head_sha == $head and .base_sha == $base and .merge_base_sha == $merge and .diff_sha256 == $diff and .target_ruleset_id == $ruleset and .target_ruleset_version == $ruleset_version and .target_ruleset_sha256 == $ruleset_sha and .strict_up_to_date == true and .protected_target == true and .review_evidence_mode == "self_attested" and .provider_approval_claimed == false' "$audit_dir/current-decision.json" >/dev/null

          external_id="spipe-self-review/1|$PR_NUMBER|$base_ref|$base_sha|$merge_base_sha|$diff_sha256|github:ruleset:$target_ruleset_id|$expected_ruleset|$target_ruleset_sha256|$expires_at_unix"
          jq -cn --arg external_id "$external_id" '{external_id:$external_id}' >"$RUNNER_TEMP/check-bind.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_id" --input "$RUNNER_TEMP/check-bind.json" >/dev/null
          audit_sha256=$(find "$audit_dir" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          printf '%s\n' "$audit_sha256" >"$audit_dir/audit.sha256"
          echo "audit_dir=$audit_dir" >>"$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"

      - name: Preserve exact-state self-review audit
        if: always() && steps.admission.outputs.audit_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-review-admission-${{ inputs.pull_request_number }}-${{ steps.admission.outputs.head_sha }}-${{ github.run_id }}
          path: ${{ steps.admission.outputs.audit_dir }}
          if-no-files-found: error
          retention-days: 90
