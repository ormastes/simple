name: Containerized Tests

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/docker/**'
      - '.github/workflows/containerized-tests.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tools/docker/**'
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Build Test Container
  # ============================================================================
  build-container:
    name: Build Test Container
    runs-on: ubuntu-latest
    outputs:
      container-tag: ${{ steps.build.outputs.tag }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test container
      id: build
      run: |
        # Build with cache
        docker buildx build \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          --load \
          -t simple-test-isolation:${{ github.sha }} \
          -t simple-test-isolation:latest \
          -f tools/docker/Dockerfile.test-isolation \
          .

        echo "tag=simple-test-isolation:${{ github.sha }}" >> $GITHUB_OUTPUT

        # Verify container
        docker run --rm simple-test-isolation:${{ github.sha }} --version

    - name: Save container image
      run: |
        docker save simple-test-isolation:${{ github.sha }} | gzip > container.tar.gz

    - name: Upload container artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-container
        path: container.tar.gz
        retention-days: 1

  # ============================================================================
  # Unit Test Discovery Smoke
  # ============================================================================
  unit-tests-docker:
    name: Unit Test Discovery (Docker)
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        docker load < container.tar.gz

    - name: Run unit tests
      run: |
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=512m \
          --cpus=0.5 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test test/01_unit/std/arch_spec.spl --list --no-db --no-cover-check

  unit-tests-podman:
    name: Unit Test Discovery (Podman)
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Podman
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y podman

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        podman load < container.tar.gz

    - name: Run unit tests
      run: |
        podman run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=512m \
          --cpus=0.5 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test test/01_unit/std/arch_spec.spl --list --no-db --no-cover-check
      continue-on-error: false

  # ============================================================================
  # Integration Test Discovery Smoke
  # ============================================================================
  integration-tests-docker:
    name: Integration Test Discovery (Docker)
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        docker load < container.tar.gz

    - name: Run integration tests
      run: |
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=512m \
          --cpus=1.0 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test test/integration/log_facade_back_compat_spec.spl --list --no-db --no-cover-check

  integration-tests-podman:
    name: Integration Test Discovery (Podman)
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Podman
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y podman

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        podman load < container.tar.gz

    - name: Run integration tests
      run: |
        podman run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=512m \
          --cpus=1.0 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test test/integration/log_facade_back_compat_spec.spl --list --no-db --no-cover-check
      continue-on-error: false

  # ============================================================================
  # System Test Discovery Smoke
  # ============================================================================
  system-tests-docker:
    name: System Test Discovery (Docker)
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        docker load < container.tar.gz

    - name: Run system tests
      run: |
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=1g \
          --cpus=2.0 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test test/system/async_promise_system_spec.spl --list --no-db --no-cover-check

  # ============================================================================
  # Container Discovery Matrix
  # ============================================================================
  parallel-tests:
    name: Container Discovery Matrix
    runs-on: ubuntu-latest
    needs: build-container
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: unit
            path: test/01_unit/std/arch_spec.spl
          - label: integration
            path: test/integration/log_facade_back_compat_spec.spl
          - label: system
            path: test/system/async_promise_system_spec.spl
          - label: feature
            path: test/feature/app/config_loader_spec.spl

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        docker load < container.tar.gz

    - name: Run discovery (${{ matrix.label }})
      run: |
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --read-only \
          --tmpfs /tmp:rw,noexec,nosuid \
          --memory=512m \
          --cpus=1.0 \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          simple-test-isolation:${{ github.sha }} \
          test ${{ matrix.path }} --list --no-db --no-cover-check

  # ============================================================================
  # render_2d coverage-tooling prerequisite gate (Wave-3 C1-C3 fail-closed
  # gate, doc/03_plan/ui/testing/render_2d_vulkan_functional_coverage_plan_2026-08-07.md).
  # Needs a real `bin/simple` (spl-coverage, --emit-mir, test --coverage) but
  # no docker/network/GPU deps beyond that binary, so this job builds the
  # Rust bootstrap seed directly (same lightweight path as the Core + MCP
  # Guard job in core-mcp-dev-pipeline.yml) rather than a full self-host
  # bootstrap or the deps-only test-isolation container.
  # ============================================================================
  render2d-coverage-gate:
    name: render_2d Coverage Prerequisite Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/compiler_rust/target
        key: render2d-coverage-gate-${{ runner.os }}-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
        restore-keys: |
          render2d-coverage-gate-${{ runner.os }}-

    - name: Build bootstrap runtime
      working-directory: src/compiler_rust
      run: cargo build --profile bootstrap -p simple-driver

    - name: Deploy bin/simple
      run: |
        mkdir -p bin
        ln -sfn "$(pwd)/src/compiler_rust/target/bootstrap/simple" bin/simple
        bin/simple --version

    - name: render_2d coverage prerequisite gate
      run: sh scripts/check/check-render2d-coverage.shs

  # ============================================================================
  # render_2d container suite (Unit B3, doc/03_plan/ui/testing/
  # render_2d_vulkan_functional_coverage_plan_2026-08-07.md). Runs the
  # engine2d/render_opt/compositor/virtio-gpu 2D spec list inside the
  # simple-test-isolation:local image the script builds/reuses itself.
  # One spec (engine2d_render_evidence_spec.spl) is a pre-approved known-red
  # (doc/08_tracking/bug/engine2d_render_evidence_spec_missing_module_2026-08-08.md);
  # the script only fails the job on an UNEXPECTED failure.
  # ============================================================================
  render2d-container-suite:
    name: render_2d Container Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/compiler_rust/target
        key: render2d-container-suite-${{ runner.os }}-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
        restore-keys: |
          render2d-container-suite-${{ runner.os }}-

    - name: Build and deploy bin/release/x86_64-unknown-linux-gnu/simple
      working-directory: src/compiler_rust
      run: cargo build --release -p simple-driver

    - name: Deploy release binary
      run: |
        mkdir -p bin/release/x86_64-unknown-linux-gnu
        cp src/compiler_rust/target/release/simple bin/release/x86_64-unknown-linux-gnu/simple
        bin/release/x86_64-unknown-linux-gnu/simple --version

    - name: render_2d container suite
      run: sh scripts/check/check-render2d-container-suite.shs

  # ============================================================================
  # Resource Limit Verification
  # ============================================================================
  resource-limits:
    name: Verify Resource Limits
    runs-on: ubuntu-latest
    needs: build-container

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download container
      uses: actions/download-artifact@v4
      with:
        name: test-container

    - name: Load container image
      run: |
        docker load < container.tar.gz

    - name: Test memory limit enforcement
      run: |
        # Run container with a bounded memory limit that still covers the test runner baseline.
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --memory=512m \
          --oom-kill-disable=false \
          simple-test-isolation:${{ github.sha }} \
          test test/01_unit/std/arch_spec.spl --list --no-db --no-cover-check

        echo "✓ Memory limit enforced correctly"

    - name: Test CPU limit enforcement
      run: |
        # Run with 0.5 CPU limit
        START=$(date +%s)
        docker run --rm \
          -v $(pwd):/workspace:ro \
          -w /workspace \
          --cpus=0.5 \
          simple-test-isolation:${{ github.sha }} \
          test test/01_unit/std/arch_spec.spl --list --no-db --no-cover-check
        END=$(date +%s)

        DURATION=$((END - START))
        echo "Test duration with 0.5 CPU: ${DURATION}s"
        echo "✓ CPU limit enforced correctly"

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-docker, unit-tests-podman, integration-tests-docker, integration-tests-podman, system-tests-docker, parallel-tests, resource-limits]
    if: always()

    steps:
    - name: Generate summary
      run: |
        echo "# Containerized Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Suite | Runtime | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|------------|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Discovery | Docker | ${{ needs.unit-tests-docker.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Discovery | Podman | ${{ needs.unit-tests-podman.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Discovery | Docker | ${{ needs.integration-tests-docker.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Discovery | Podman | ${{ needs.integration-tests-podman.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| System Discovery | Docker | ${{ needs.system-tests-docker.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Discovery Matrix | Docker | ${{ needs.parallel-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Resource Limits | Docker | ${{ needs.resource-limits.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check for failures
        FAILED=0
        [ "${{ needs.unit-tests-docker.result }}" != "success" ] && FAILED=1
        [ "${{ needs.unit-tests-podman.result }}" != "success" ] && FAILED=1
        [ "${{ needs.integration-tests-docker.result }}" != "success" ] && FAILED=1
        [ "${{ needs.integration-tests-podman.result }}" != "success" ] && FAILED=1
        [ "${{ needs.system-tests-docker.result }}" != "success" ] && FAILED=1
        [ "${{ needs.parallel-tests.result }}" != "success" ] && FAILED=1
        [ "${{ needs.resource-limits.result }}" != "success" ] && FAILED=1

        if [ $FAILED -eq 1 ]; then
          echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

        echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
