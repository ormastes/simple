name: RISC-V Hardware Gates

# Runs the RISC-V hardware gates so regressions cannot land silently:
# all JTAG debug testbenches under GHDL (JTAG STAGE1..5 PASS) plus the
# soc/core `simple run` probes (each must print ALL PASS), via the single
# entrypoint scripts/check/check-riscv-hardware-gates.shs.

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/hardware/**'
      - 'examples/09_embedded/**'
      - 'test/01_unit/lib/hardware/**'
      - 'scripts/fpga/**'
      - 'scripts/check/check-riscv-hardware-gates.shs'
      - 'scripts/check/check-seed-not-stale.shs'
      - 'scripts/check/check-simpleos-riscv64-*.shs'
      - 'scripts/check/fixtures/riscv64_boot_contract_probe.c'
      - '.github/workflows/riscv-hardware-gates.yml'
  pull_request:
    paths:
      - 'src/lib/hardware/**'
      - 'examples/09_embedded/**'
      - 'test/01_unit/lib/hardware/**'
      - 'scripts/fpga/**'
      - 'scripts/check/check-riscv-hardware-gates.shs'
      - 'scripts/check/check-seed-not-stale.shs'
      - 'scripts/check/check-simpleos-riscv64-*.shs'
      - 'scripts/check/fixtures/riscv64_boot_contract_probe.c'
      - '.github/workflows/riscv-hardware-gates.yml'
  workflow_dispatch:

concurrency:
  group: riscv-hw-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  riscv-hw-gates:
    name: JTAG testbenches + soc/core probes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            src/compiler_rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: riscv-hw-gates-rust-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            riscv-hw-gates-rust-bootstrap-

      - name: Install GHDL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ghdl
          ghdl --version | head -n 2

      - name: Build Simple bootstrap binary
        run: |
          cd src/compiler_rust
          cargo build --profile bootstrap -p simple-driver
          test -x target/bootstrap/simple
          ./target/bootstrap/simple --version || true

      # Stale-seed gate. This job restores src/compiler_rust/target from
      # actions/cache and then builds into it, so a cache hit can leave a seed
      # binary OLDER than the seed sources in this checkout -- exactly the trap
      # that manufactured 34 phantom PARSE failures across src/os and src/lib on
      # 2026-08-31 (an entire failure class that vanished on rebuild with no
      # source change). A stale seed does not announce itself: it reports
      # ordinary-looking "Unexpected token" errors that read as stale source.
      # Placed AFTER the build, and pointed at the binary this job actually
      # builds (target/bootstrap, not the default target/release) -- with no
      # seed present the guard is ERROR exit 2, never a pass.
      # See doc/08_tracking/bug/simpleos_b1_merge_clobber_e274cd33719_2026-08-31.md.
      - name: Seed-not-stale gate
        env:
          SEED: src/compiler_rust/target/bootstrap/simple
        run: sh scripts/check/check-seed-not-stale.shs

      - name: Run RISC-V hardware gates
        env:
          SIMPLE_BIN: ${{ github.workspace }}/src/compiler_rust/target/bootstrap/simple
        run: sh scripts/check/check-riscv-hardware-gates.shs

  # ==========================================================================
  # SimpleOS riscv64 boot-contract gates (.claude/rules/board-runnable.md)
  #
  # Separate job from the JTAG/soc lane above: these need a riscv64 cross
  # toolchain + qemu-system-riscv64, not GHDL or a Simple binary, and they run
  # in minutes. All three are fail-closed with fatal --selftests and treat a
  # missing dependency as ERROR (exit 2), never a pass — so an incomplete
  # runner turns the lane red rather than silently green.
  # ==========================================================================
  simpleos-riscv64-boot-contract:
    name: SimpleOS riscv64 boot contract (OpenSBI real firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install riscv64 cross toolchain + QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            qemu-system-misc opensbi build-essential
          riscv64-linux-gnu-gcc --version | head -n 1
          qemu-system-riscv64 --version | head -n 1

      # Firmware-only proxy: proves OpenSBI itself boots on this runner.
      - name: OpenSBI real-firmware boot gate
        run: sh scripts/check/check-simpleos-riscv64-opensbi-real-firmware-boot.shs

      # Kernel-side half: the flat Image built from the REAL riscv64 crt0.S +
      # linker.ld must carry a valid RISC-V Linux boot-image header v0.2.
      - name: riscv64 Image header contract gate
        run: sh scripts/check/check-simpleos-riscv64-image-header-contract.shs

      # Guest half: a crt0.S+linker.ld kernel must boot UNDER that firmware via
      # `-bios` fw_payload only — no `-kernel` pass semantics, no
      # isa-debug-exit. Clones the pinned OpenSBI v1.4 itself.
      - name: riscv64 guest boot under OpenSBI gate
        run: sh scripts/check/check-simpleos-riscv64-opensbi-guest-boot.shs

      # In-guest execution: a Simple hello world runs INSIDE SimpleOS riscv64
      # under real OpenSBI fw_payload and prints its own output. The gate
      # self-checks the assembled QEMU argv for -kernel / isa-debug-exit.
      - name: SimpleOS riscv64 hello world in-guest (OpenSBI real firmware)
        run: sh scripts/check/check-simpleos-riscv64-hello-world-in-guest-opensbi.shs
