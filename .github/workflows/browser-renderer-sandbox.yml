name: Browser Renderer Sandbox

on:
  push:
    branches: [main]
    paths:
      - 'src/runtime/runtime_process.c'
      - 'test/01_unit/runtime/process_piped_write_test.c'
      - 'test/01_unit/runtime/run_process_piped_write_test.shs'
      - '.github/workflows/browser-renderer-sandbox.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/runtime/runtime_process.c'
      - 'test/01_unit/runtime/process_piped_write_test.c'
      - 'test/01_unit/runtime/run_process_piped_write_test.shs'
      - '.github/workflows/browser-renderer-sandbox.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh test/01_unit/runtime/run_process_piped_write_test.shs
