name: Browser Renderer Sandbox

on:
  push:
    branches: [main]
    paths:
      - 'src/runtime/runtime_process.c'
      - 'test/01_unit/runtime/process_piped_write_test.c'
      - 'test/01_unit/runtime/run_process_piped_write_test.shs'
      - '.github/workflows/browser-renderer-sandbox.yml'
  pull_request:
    types: [labeled]  # PR runs only when the ci:full label is added (2026-09-27)
    branches: [main]
    paths:
      - 'src/runtime/runtime_process.c'
      - 'test/01_unit/runtime/process_piped_write_test.c'
      - 'test/01_unit/runtime/run_process_piped_write_test.shs'
      - '.github/workflows/browser-renderer-sandbox.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh test/01_unit/runtime/run_process_piped_write_test.shs
