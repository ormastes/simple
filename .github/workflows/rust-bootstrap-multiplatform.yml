          supervisor_files={'scripts/bootstrap/bootstrap-logged-process.shs': '#!/bin/sh\n# Native Windows Cargo launch/status ownership. Other host commands retain the\n# existing run_logged route; this adapter is bootstrap host tooling only.\nbootstrap_logged_windows_cargo() (\n    [ "$#" -ge 5 ] || return 126\n    blwc_root=$1\n    blwc_log=$2\n    shift 2\n    blwc_timeout=${BOOTSTRAP_LOGGED_PROCESS_TIMEOUT_SECONDS:-7200}\n    blwc_max_bytes=${BOOTSTRAP_LOGGED_PROCESS_MAX_BYTES:-67108864}\n    case "$blwc_timeout:$blwc_max_bytes" in *[!0-9:]*|:*|*:) return 126 ;; esac\n    # Zero disables only the work deadline; Job cleanup and log bounds remain.\n    [ "$blwc_timeout" -ge 0 ] && [ "$blwc_timeout" -le 7200 ] &&\n        [ "$blwc_max_bytes" -gt 0 ] && [ "$blwc_max_bytes" -le 67108864 ] || return 126\n    [ "$1" = env ] && [ "$2" = -i ] || return 126\n    blwc_python=$(command -v python3 || command -v python) || {\n        printf \'bootstrap-native-cargo-error: python3 (or python) not found on PATH; required to run %s/scripts/bootstrap/run-process-group-bounded-log-windows.py, the native Windows Cargo launch supervisor. Declared in scripts/setup/bootstrap-prereqs.shs (windows platform_tools) -- run `sh scripts/setup/bootstrap-prereqs.shs check` to see the full prerequisite table.\\n\' "$blwc_root" >&2\n        return 126\n    }\n    blwc_helper=$blwc_root/scripts/bootstrap/run-process-group-bounded-log-windows.py\n    blwc_helper_sha=$(sha256sum <"$blwc_helper" | awk \'{print $1}\') || return 126\n    blwc_parent=$(CDPATH= cd -- "${blwc_log%/*}" && pwd -P) || return 126\n    # MSYS process IDs can recur across independent sessions. A fresh capture\n    # directory retains previous receipts without making a retry collide.\n    blwc_parent=$(mktemp -d "$blwc_parent/${blwc_log##*/}.process.XXXXXX") || return 126\n    blwc_leaf=command\n    blwc_status=0\n    "$blwc_python" "$blwc_helper" --command-environment=clean-prefix \\\n        --root-exit-policy=terminate-job \\\n        --helper-sha256="$blwc_helper_sha" --output-parent="$blwc_parent" \\\n        --log-leaf="$blwc_leaf.log" --receipt-leaf="$blwc_leaf.env" \\\n        --max-bytes="$blwc_max_bytes" --timeout-seconds="$blwc_timeout" --term-grace-seconds=0 \\\n        -- "$@" || blwc_status=$?\n    # Retain both the capture and the original human-readable build log.\n    [ ! -f "$blwc_parent/$blwc_leaf.log" ] || cat "$blwc_parent/$blwc_leaf.log" >>"$blwc_log"\n    # A killed/crashed supervisor cannot publish its receipt. Preserve the\n    # shell-observed status before the admission error replaces it with 126;\n    # this is not the native child status (that requires a complete receipt).\n    printf \'supervisor_shell_status=%s\\n\' "$blwc_status" >>"$blwc_log"\n    printf \'process_receipt=%s\\n\' "$blwc_parent/$blwc_leaf.env" >>"$blwc_log"\n    if [ ! -f "$blwc_parent/$blwc_leaf.env" ]; then\n        printf \'bootstrap-native-cargo-error: missing native process receipt (supervisor_shell_status=%s)\\n\' "$blwc_status" >&2\n        return 126\n    fi\n    blwc_recorded_status=$(sed -n \'s/^raw_status=//p\' "$blwc_parent/$blwc_leaf.env")\n    blwc_native_status=$(sed -n \'s/^native_exit_status=//p\' "$blwc_parent/$blwc_leaf.env")\n    blwc_recorded_sha=$(sed -n \'s/^helper_sha256=//p\' "$blwc_parent/$blwc_leaf.env")\n    [ "$blwc_recorded_status" = "$blwc_status" ] &&\n        [ "$blwc_recorded_sha" = "$blwc_helper_sha" ] &&\n        [ "$(sed -n \'s/^schema=//p\' "$blwc_parent/$blwc_leaf.env")" = simple-bounded-process-log-v1 ] &&\n        [ "$(sed -n \'s/^status=//p\' "$blwc_parent/$blwc_leaf.env")" = complete ] &&\n        [ "$(sed -n \'s/^process_group=//p\' "$blwc_parent/$blwc_leaf.env")" = windows-job ] &&\n        [ "$(sed -n \'s/^root_exit_policy=//p\' "$blwc_parent/$blwc_leaf.env")" = terminate-job ] &&\n        [ "$(sed -n \'s/^command_environment=//p\' "$blwc_parent/$blwc_leaf.env")" = clean-prefix ] &&\n        [ "$(sed -n \'s/^log_sha256=//p\' "$blwc_parent/$blwc_leaf.env")" = \\\n            "$(sha256sum <"$blwc_parent/$blwc_leaf.log" | awk \'{print $1}\')" ] || {\n        echo \'bootstrap-native-cargo-error: native process receipt mismatch\' >&2\n        return 126\n    }\n    if [ "$blwc_status" -eq 0 ]; then\n        [ "$blwc_native_status" = 0 ] &&\n            [ "$(sed -n \'s/^reason=//p\' "$blwc_parent/$blwc_leaf.env")" = child-exit ] || return 126\n    fi\n    printf \'native_process_status=%s shell_status=%s\\n\' "$blwc_native_status" "$blwc_status" >>"$blwc_log"\n    return "$blwc_status"\n)\n', 'scripts/bootstrap/run-process-group-bounded-log-windows.py': '#!/usr/bin/env python3\n"""Windows host-only adapter for the bootstrap bounded process collector.\n\nThe compiler and runtime do not import this helper. A suspended child joins a\nkill-on-close Job Object before it executes; native descendants stay in that\njob even after the root exits. Logs use locked real directories, never /proc.\n"""\n\nimport argparse\nimport ctypes as ct\nfrom ctypes import wintypes as wt\nimport hashlib\nimport os\nfrom pathlib import Path\nimport re\nimport subprocess\nimport sys\nimport time\n\n\ndef digest(path):\n    with open(path, "rb") as stream:\n        return hashlib.file_digest(stream, "sha256").hexdigest()\n\n\ndef reap_root_until(wait, process, deadline, clock=time.monotonic, last_error=None):\n    """Reap within the shared cleanup budget; never retry a failed Win32 API."""\n    code = 258  # WAIT_TIMEOUT, including an already exhausted deadline.\n    while True:\n        remaining = deadline - clock()\n        if remaining <= 0:\n            return "deadline", code, 0\n        code = wait(process, max(1, min(1000, int(remaining * 1000))))\n        if code == 0:  # WAIT_OBJECT_0\n            return "reaped", code, 0\n        if code == 0xFFFFFFFF:  # WAIT_FAILED\n            return "wait-failed", code, last_error() if last_error else ct.get_last_error()\n        if code != 258:\n            return "unexpected-wait-result", 