  workflow_dispatch:
    inputs:
      diagnose_windows_collector:
        description: Diagnostic-only native Windows collector launch; no seed build
        type: boolean
        default: false
      native_lane:
        description: Native bootstrap lane (all preserves the full platform matrix)
        type: choice
        default: all
        options:
          - all
          - linux-llvm
          - linux-cranelift
          - windows-cranelift
      defer_portability_verdict:
        description: Diagnostic Linux LLVM collection; failed portability remains an unadmitted final failure
        type: boolean
        default: false

# main must reach a verdict: before 2026-09-28 every main run was cancelled by
# the next main push (874/1000 runs cancelled, 0 completed on main). With
# cancel-in-progress false GitHub keeps at most one running + one pending run
# per group, and a newer queued run replaces the older PENDING one, so main's
# queue stays bounded. Manual dispatches are run-isolated and never cancelled;
# PR runs still cancel their own stale in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Pin x86_64 build hosts: local ARM64 runners advertise ubuntu-latest.
jobs:
  # ARM64 self-hosted runners also advertise ubuntu-latest. Pin hosted Linux
  # jobs so x86_64, cross, and VM builds cannot land on those runners.
  # Native builds — compile and test on each platform
  native:
    if: (!inputs.diagnose_windows_collector) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full'))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.native_lane == 'linux-llvm' && '[{"os":"ubuntu-24.04","name":"Linux x86_64","backend":"llvm"}]' || github.event_name == 'workflow_dispatch' && inputs.native_lane == 'linux-cranelift' && '[{"os":"ubuntu-24.04","name":"Linux x86_64","backend":"cranelift"}]' || github.event_name == 'workflow_dispatch' && inputs.native_lane == 'windows-cranelift' && '[{"os":"windows-latest","name":"Windows x86_64","backend":"cranelift"}]' || '[{"os":"ubuntu-24.04","name":"Linux x86_64","backend":"llvm"},{"os":"ubuntu-24.04","name":"Linux x86_64","backend":"cranelift"},{"os":"macos-latest","name":"macOS aarch64","backend":"llvm"},{"os":"macos-latest","name":"macOS aarch64","backend":"cranelift"},{"os":"macos-15-intel","name":"macOS x86_64","backend":"llvm"},{"os":"macos-15-intel","name":"macOS x86_64","backend":"cranelift"},{"os":"windows-latest","name":"Windows x86_64","backend":"cranelift"}]') }}
    runs-on: ${{ matrix.os }}
    name: Native — ${{ matrix.name }} (${{ matrix.backend }})
    steps:
      - name: Select Windows materializer placeholder checkout
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.symlinks false
      - uses: actions/checkout@v4

      # Runs before the bootstrap: the seed cannot parse leading-operator
      # continuations that the self-hosted frontend accepts, so this fails in
      # seconds instead of surfacing as an unattributable stage-2 parse error.
      - name: Reject seed-incompatible line continuations on the bootstrap path
        if: runner.os != 'Windows'
        run: sh scripts/check/check-seed-parse-superset.shs

      - name: Validate bootstrap portability contracts
        id: portability_contract
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.native_lane == 'linux-llvm' && inputs.defer_portability_verdict }}
        run: sh scripts/check/check-bootstrap-portability.shs

      - name: Record unadmitted diagnostic collection
        if: ${{ steps.portability_contract.outcome == 'failure' && github.event_name == 'workflow_dispatch' && inputs.native_lane == 'linux-llvm' && inputs.defer_portability_verdict }}
        env:
          DIAGNOSTIC_SOURCE_REVISION: ${{ github.sha }}
        run: |
          mkdir -p build/bootstrap
          printf '%s\n' 'schema=simple-bootstrap-portability-diagnostic-v1' \
            'tag=WORKAROUND_DEFER_PORTABILITY_VERDICT' 'qualification=UNADMITTED' \
            'portability_result=FAIL' "source_revision=${DIAGNOSTIC_SOURCE_REVISION}" \
            > build/bootstrap/portability-diagnostic.env

      - name: Validate bootstrap capacity and Windows authority contracts
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-bootstrap-host-capacity.shs
          sh scripts/check/check-bootstrap-windows-authority-paths.shs

      - name: Validate Linux Phase 2 test-runner contracts
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-linux-phase2-test-runner-contract.shs
          sh test/01_unit/scripts/linux_phase2_false_pass_contract_test.shs
          sh test/01_unit/scripts/run_capped_fail_closed_contract_test.shs

      - name: Validate bootstrap capacity and Windows authority contracts
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-bootstrap-host-capacity.shs
          sh scripts/check/check-bootstrap-keep-going-policy.shs
          sh scripts/check/check-bootstrap-windows-authority-paths.shs

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Select Clang C driver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang-cl --version
          if ($LASTEXITCODE -ne 0) { throw 'clang-cl is required for the Windows bootstrap' }
          "CC=clang-cl" >> $env:GITHUB_ENV
          "CC_x86_64_pc_windows_msvc=clang-cl" >> $env:GITHUB_ENV
      - name: Fix MSVC linker PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -f /usr/bin/link ]; then
            mv /usr/bin/link /usr/bin/link.bak
          fi

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install FreeType (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18-dev libfreetype6-dev libunwind-dev

      - name: Install Polly (Linux LLVM)
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        run: sudo apt-get install -y libpolly-18-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install coreutils freetype zstd llvm ${{ matrix.backend == 'llvm' && 'llvm@18' || '' }}
          llvm_objcopy="$(brew --prefix llvm)/bin/llvm-objcopy"
          test -x "$llvm_objcopy"
          "$llvm_objcopy" --version
          echo "RUSTFLAGS=-L native=$(brew --prefix freetype)/lib" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix freetype)/lib:$(brew --prefix zstd)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix freetype)/include:${CPATH:-}" >> "$GITHUB_ENV"
          if [ "${{ matrix.backend }}" = "llvm" ]; then
            llvm_prefix=$(brew --prefix llvm@18)
            echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
            echo "LLVM_SYS_180_PREFIX=$llvm_prefix" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install freetype:x64-windows
          "RUSTFLAGS=-L native=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/compiler_rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-bootstrap-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bootstrap-

      - name: Build seed and native_all library
        id: diagnostic_seed
        shell: bash
        working-directory: src/compiler_rust
        run: |
          if [ "${{ matrix.backend }}" = "llvm" ]; then
            cargo build --profile bootstrap -p simple-driver --features llvm
            cargo build --profile bootstrap -p simple-native-all --features driver-compat,llvm
            cargo build --profile bootstrap -p simple-compiler-backfill
          else
            cargo build --profile bootstrap -p simple-driver
            cargo build --profile bootstrap -p simple-native-all --features driver-compat
          fi

      - name: Check generated codec aggregate keys and sanity diagnostics
        if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.backend == 'llvm'
        shell: bash
        run: |
          sh scripts/bootstrap/check-stage2-sanity-log-retention.shs
          export LLVM_OBJDUMP="$(command -v llvm-objdump || command -v llvm-objdump-18)"
          sh scripts/check/check-codec-key-array-type.shs --bootstrap-producer \
            "$GITHUB_WORKSPACE/src/compiler_rust/target/bootstrap/simple"

      - name: Build and sanity-check pure-Simple stages
        id: pure_simple_bootstrap
        shell: bash
        env:
          SIMPLE_PROJECT_ROOT: ${{ github.workspace }}
          SIMPLE_NO_STUB_FALLBACK: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export SIMPLE_LINKER_FLAVOR=msvc SIMPLE_WINDOWS_ABI=msvc
          fi
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ matrix.backend }}" = "llvm" ]; then
            mcp_flag=--full-cli
          else
            mcp_flag=--no-mcp
          fi
          # Establish the narrow receipt-free Stage 2 trust root first.
          SIMPLE_COMPILE_FAIL_FAST=${SIMPLE_COMPILE_FAIL_FAST:-1} sh scripts/bootstrap/bootstrap-from-scratch.sh \
            --backend=${{ matrix.backend }} \
            --mode=dynload \
            --full-bootstrap \
            --stop-after-stage2 \
            --no-mcp \
            --output=build/bootstrap \
            --jobs=2
          stage2="$(find build/bootstrap/stage2 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage2"
          stage3_receipt="$PWD/build/bootstrap/multiplatform-stage3-planner-admission-v2.env"
          sh scripts/bootstrap/produce-bootstrap-planner-admission-v2.shs \
            --target=//bootstrap:stage3 \
            --reason=verify-landed-compiler-fix \
            --parent-compiler="$stage2" \
            --bootstrap-output=build/bootstrap \
            --out="$stage3_receipt"
          if [ "$mcp_flag" = --full-cli ]; then
            # Keep the Stage 4 planner parent isolated from the coordinated
            # build so its admitted digest cannot be replaced by later stages.
            planner_output=build/bootstrap/ci-planner-parent
            sh scripts/bootstrap/bootstrap-from-scratch.sh \
              --backend=${{ matrix.backend }} \
              --mode=dynload --full-bootstrap --stop-after-stage2 \
              --output="$planner_output" --jobs=2
            planner_parent=
            for candidate in "$planner_output"/stage2/*/simple "$planner_output"/stage2/*/simple.exe; do
              [ -f "$candidate" ] || continue
              if [ -n "$planner_parent" ]; then
                echo "error: multiple planner parents found" >&2
                exit 1
              fi
              planner_parent=$candidate
            done
            test -n "$planner_parent"
            stage4_receipt="$PWD/$planner_output/multiplatform-stage4-planner-admission-v2.env"
            sh scripts/bootstrap/produce-bootstrap-planner-admission-v2.shs \
              --target=//bootstrap:stage4 \
              --reason=self-host-convergence-check \
              --parent-compiler="$planner_parent" \
              --bootstrap-output="$planner_output" \
              --out="$stage4_receipt"
            sh scripts/bootstrap/bootstrap-strategy.shs \
              --strategy=full \
              --output=build/bootstrap \
              --stage4-bootstrap-receipt="$stage4_receipt" \
              -- \
              --bootstrap-receipt="$stage3_receipt" \
              --resume-stage3-from-admitted=build/bootstrap \
              --backend=${{ matrix.backend }} \
              "$mcp_flag" \
              --mode=dynload
          else
            SIMPLE_COMPILE_FAIL_FAST=${SIMPLE_COMPILE_FAIL_FAST:-1} sh scripts/bootstrap/bootstrap-from-scratch.sh \
              --bootstrap-receipt="$stage3_receipt" \
              --resume-stage3-from-admitted=build/bootstrap \
              --output=build/bootstrap
          fi

      - name: Preserve diagnostic continuation inputs
        if: always() && steps.diagnostic_seed.outcome != '' && steps.diagnostic_seed.outcome != 'skipped'
        shell: bash
        run: |
          python3 scripts/bootstrap/collect-diagnostic-continuation.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bootstrap-diagnostic-continuation" 1073741824

      - name: Upload unadmitted diagnostic continuation inputs
        if: always() && steps.diagnostic_seed.outcome != '' && steps.diagnostic_seed.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-diagnostic-UNADMITTED-${{ matrix.name }}-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap-diagnostic-continuation
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload pure-Simple bootstrap failure logs
        if: failure() && steps.pure_simple_bootstrap.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-failure-logs-${{ matrix.name }}-${{ matrix.backend }}-${{ github.sha }}
          # The engine also writes logs under its worktree storage root;
          # upload-artifact skips that hidden path unless enabled below.
          path: |
            build/bootstrap/logs/**
            build/bootstrap/ci-planner-parent/logs/**
            build/bootstrap/admission/**
            build/bootstrap/scheduler/**
            .simple/storage/build/bootstrap/logs/**
            .simple/storage/build/bootstrap/stage3/**/*.log*
            .simple/storage/build/bootstrap/stage3/**/*.transcript
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Stage hosted full-CLI providers
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        shell: bash
        run: |
          full_cli="$(find build/bootstrap/full -type f -name simple -print -quit)"
          test -n "$full_cli"
          cargo build --manifest-path src/compiler_rust/Cargo.toml --profile bootstrap -p simple-runtime
          cargo build --manifest-path src/compiler_rust/Cargo.toml --profile bootstrap -p spl_fonts
          cargo build --manifest-path src/runtime/spl_winit/Cargo.toml --release
          mkdir -p build/bootstrap/lib src/compiler_rust/target/bootstrap/deps
          install -m755 src/compiler_rust/target/bootstrap/libsimple_runtime.so \
            src/compiler_rust/target/bootstrap/deps/libsimple_runtime.so
          install -m755 src/compiler_rust/target/bootstrap/libspl_fonts.so \
            build/bootstrap/lib/libspl_fonts.so

      - name: Run pure-Simple SMF production consumer
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        shell: bash
        run: |
          full_cli="$(find build/bootstrap/full -type f -name simple -print -quit)"
          test -n "$full_cli"
          install -m755 "$full_cli" bin/simple
          SIMPLE_LIB=src SIMPLE_BINARY="$full_cli" \
            "$full_cli" test test/02_integration/app/simple/smf_cache_reuse_spec.spl --mode=interpreter

      - name: Upload hosted full CLI
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-hosted-full-${{ github.sha }}
          path: |
            build/bootstrap/full/**/simple
            build/bootstrap/lib/libspl_fonts.so
            src/compiler_rust/target/bootstrap/deps/libsimple_runtime.so
            src/runtime/spl_winit/target/release/libspl_winit.so
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # Self-consistency, NOT parity. This step runs ONE compiler (the Rust
      # seed) on every side of the case: its llvm codegen against its own
      # cranelift codegen against a fixed expected literal. It cannot detect a
      # seed-vs-native divergence and no longer claims to — it prints
      # native_self_consistency=<bool>, never native_seed_parity=<bool>.
      # Until 2026-07-28 this step was named "...parity" and pointed a
      # two-compiler harness at a single binary, so it was green by
      # construction. The real parity oracle is the step below.
      - name: Run Rust-seed custom enum identity self-consistency (not parity)
        if: matrix.backend == 'llvm'
        shell: bash
        run: |
          seed="src/compiler_rust/target/bootstrap/simple"
          test -x "$seed"
          PARITY_MODE=self-consistency \
            SIMPLE_BINARY="$seed" \
            NATIVE_PARITY_CASES=crossmodule_result_u8 \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/rust-seed-enum-identity" \
            sh scripts/check/check-native-seed-parity.shs

      # The REAL seed-vs-native parity oracle: an independent Rust seed on one
      # side, the self-hosted compiler on the other. Auto-activating by binary
      # IDENTITY, never by a flag — while no self-hosted binary is deployed it
      # prints a loud, annotated SKIP and exits 0 (a permanently red job gets
      # muted, which is the same fail-open it is meant to remove). The first
      # run after the bootstrap campaign deposits a self-hosted binary, this
      # gates automatically. There is no re-enable step to forget.
      - name: Run seed-vs-native parity (auto-activates when self-hosted exists)
        if: matrix.backend == 'llvm'
        shell: bash
        run: |
          SEED_BINARY="src/compiler_rust/target/bootstrap/simple" \
            NATIVE_PARITY_CASES=crossmodule_result_u8 \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/seed-vs-native-parity" \
            sh scripts/check/check-native-parity-if-selfhosted.shs

      - name: Test
        working-directory: src/compiler_rust
        run: cargo test --workspace --lib

      # Slim-UI import-closure gate (NFR-UI-SLIM-002,
      # doc/02_requirements/nfr/ui_slim_kernel_plugin.md; plan Wave 0 / A01).
      # Runs `deps fast` on the ordinary-mode TUI entry through the seed just
      # built above and fails if any file in its closure lives under one of the
      # five forbidden prefixes the NFR names. Needs a built seed, which is why
      # it runs here and not in repo-hygiene.yml (which only runs --selftest).
      # Skipped on Windows: the guard is POSIX sh and the seed there is
      # simple.exe, untested under Git Bash.
      - name: Slim-UI closure gate
        if: runner.os != 'Windows' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-ui-slim-closure.shs \
            --seed src/compiler_rust/target/bootstrap/simple \
            src/app/ui.tui/async_app.spl \
            src/os/compositor src/os/drivers src/os/kernel \
            src/lib/skia src/lib/gc_async_mut/gpu

      # Pure-Simple lint runnable pin: the lint program (src/app/cli/lint_entry.spl)
      # must EXECUTE through the seed just built and its findings must
      # discriminate (clean fixture -> "Lint passed", dirty fixture ->
      # RAW-RT-001). Its --selftest also needs the binary, so it cannot run in
      # repo-hygiene.yml; it was baselined as unwired debt until wired here.
      - name: Pure-Simple lint runnable gate
        if: runner.os != 'Windows' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-pure-simple-lint-runnable.shs \
            --binary src/compiler_rust/target/bootstrap/simple

      # Shared UI layout-engine gate (landed with 0f7492dfb32; the guard header
      # cites no plan/NFR doc, the commit is its authority). Two blocking halves:
      # ui.tui/backend.spl and ui.tui_web/backend.spl must still import the same
      # common.ui.layout.{compute_layout}, and running test/unit/app/ui/layout_spec.spl
      # under SIMPLE_COVERAGE=1 must leave >= 90% of the decisions in
      # src/lib/common/ui/layout.spl covered on BOTH outcomes (0 recorded
      # decisions is ERROR, never a pass). Unlike the two gates above there is
      # no repo-hygiene --selftest half: its selftest itself runs the
      # interpreter, so without a binary it exits 2. Not parameterized; it
      # probes bin/simple (untracked, absent here) and falls back to the seed
      # built above at src/compiler_rust/target/bootstrap/simple.
      - name: Shared UI layout-engine coverage gate
        if: runner.os != 'Windows' && matrix.backend == 'llvm'
        run: |
          sh scripts/check/check-ui-layout-branch-coverage.shs

      - name: Validate hosted Stage4 dynload provider archive
        if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.backend == 'llvm'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_NO_STUB_FALLBACK=1 SIMPLE_BINARY="$stage3" sh scripts/check/check-stage4-hosted-dynload-provider-archive.shs

      - name: Run standalone browser mutation control
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        shell: bash
        run: |
          full_cli="$(find build/bootstrap/full -type f -name simple -print -quit)"
          test -n "$full_cli"
          chmod +x "$full_cli"
          full_cli="$(readlink -f "$full_cli")"
          SIMPLE_LIB=src SIMPLE_BOOTSTRAP_DRIVER="$full_cli" \
            "$full_cli" run test/fixtures/browser/event_loop_set_timeout_standalone.spl --mode=interpreter \
            >build/browser-mutation.actual 2>build/browser-mutation.stderr
          printf 'tid=1 pending=1\n' >build/browser-mutation.expected
          cmp build/browser-mutation.expected build/browser-mutation.actual
          test ! -s build/browser-mutation.stderr

      - name: Run macOS Metal web Draw IR provenance
        if: runner.os == 'macOS' && matrix.backend == 'llvm'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f -name simple -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_RUNTIME_PATH="$PWD/src/compiler_rust/target/bootstrap" "$stage3" native-build \
            --backend=llvm --source src/lib --source test/fixtures --entry-closure \
            --entry test/fixtures/native_web_draw_ir_provenance/main.spl \
            --output build/native-web-draw-ir-provenance
          build/native-web-draw-ir-provenance \
            >build/native-web-draw-ir-provenance.actual \
            2>build/native-web-draw-ir-provenance.stderr
          printf '%s\n' \
            'producer=4 rects=4 embedding=0,0,320,240,1000 rendered=4 skipped=0 source=device_readback' \
            >build/native-web-draw-ir-provenance.expected
          cmp build/native-web-draw-ir-provenance.expected build/native-web-draw-ir-provenance.actual
          test ! -s build/native-web-draw-ir-provenance.stderr

      - name: Run strict staged native smoke matrix
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_RUNTIME_PATH="$PWD/src/compiler_rust/target/bootstrap" \
            SIMPLE_BINARY="$stage3" \
            NATIVE_SMOKE_BACKEND=${{ matrix.backend }} \
            NATIVE_SMOKE_WORK_DIR="build/check/native-smoke-${{ matrix.backend }}" \
            sh scripts/check/native-smoke-matrix.shs

      - name: Run strict Option and Cranelift Result parity
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          cases="option_try_annotated_loud option_try_direct_loud option_try_unresolved_method_loud exists_struct_payload_field"
          if [ "${{ matrix.backend }}" = cranelift ]; then
            cases="$cases crossmodule_result_u8"
          fi
          SIMPLE_BINARY="$stage3" \
            NATIVE_PARITY_BACKEND=${{ matrix.backend }} \
            NATIVE_PARITY_CASES="$cases" \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/native-option-${{ matrix.backend }}" \
            sh scripts/check/check-native-seed-parity.shs

      - name: Run full native seed parity gate
        if: runner.os == 'Linux' && matrix.backend == 'llvm'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f -name simple -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_BINARY="$stage3" \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/native-parity-full" \
            sh scripts/check/check-native-seed-parity.shs

      - name: Run non-Linux strict dynload parity
        if: runner.os == 'macOS' && matrix.backend == 'llvm'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_BINARY="$stage3" \
            NATIVE_PARITY_CASES=dynload_tagged_text \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/native-parity-${{ matrix.backend }}" \
            sh scripts/check/check-native-seed-parity.shs

      - name: Run strict selected native parity
        if: runner.os == 'macOS' && matrix.backend == 'llvm'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f \( -name simple -o -name simple.exe \) -print -quit)"
          test -n "$stage3"
          chmod +x "$stage3"
          SIMPLE_BINARY="$stage3" \
            NATIVE_PARITY_CASES="bare_main class_array_field_mutation class_array_param_field_mutation nested_struct_value_copy exists_struct_payload_field result_unwrap text_ordering text_bracket_index text_for_iteration raw_string_interpolation_contract new_keyword_identifier bool_array_element_interp mixed_numeric_comparison mixed_unsigned_float_comparison mixed_signed_unsigned_ordering unsigned_div_rem_shift method_owner_dispatch option_is_none_map array_map_text crossmodule_result_u8" \
            NATIVE_PARITY_FAIL_ON_XFAIL=1 \
            PARITY_WORK_DIR="build/check/native-selected-parity" \
            sh scripts/check/check-native-seed-parity.shs

      - name: Run Windows ARM64 Cranelift COFF object gate
        if: runner.os == 'Windows' && matrix.backend == 'cranelift'
        shell: bash
        run: |
          stage3="$(find build/bootstrap/stage3 -type f -name simple.exe -print -quit)"
          test -n "$stage3"
          command -v llvm-readobj >/dev/null
          mkdir -p build/check/windows-arm64
          arm64_obj=build/check/windows-arm64/p2_add-cranelift.obj
          rm -rf build/check/windows-arm64/cache-cranelift "$arm64_obj"
          SIMPLE_RUNTIME_PATH="$PWD/src/compiler_rust/target/bootstrap" \
            SIMPLE_NO_STUB_FALLBACK=1 "$stage3" native-build \
            --backend cranelift \
            --target aarch64-pc-windows-msvc --emit-object --entry-closure \
            --entry scripts/check/cert/redeploy_gate/fixtures/p2_add.spl \
            --cache-dir build/check/windows-arm64/cache-cranelift \
            --output "$arm64_obj"
          test -s "$arm64_obj"
          header="$(llvm-readobj --file-headers "$arm64_obj")"
          [[ "$header" == *"Format: COFF-ARM64"* ]]
          [[ "$header" == *"Machine: IMAGE_FILE_MACHINE_ARM64 (0xAA64)"* ]]
          chr_obj=build/check/windows-arm64/crossmodule-result-u8-cranelift.obj
          rm -rf build/check/windows-arm64/crossmodule-result-u8-cranelift-cache "$chr_obj"
          SIMPLE_RUNTIME_PATH="$PWD/src/compiler_rust/target/bootstrap" \
            SIMPLE_NO_STUB_FALLBACK=1 "$stage3" native-build \
            --backend cranelift \
            --target aarch64-pc-windows-msvc --emit-object --entry-closure \
            --source test/fixtures --source src/lib \
            --entry test/fixtures/native_crossmodule_result_u8/main.spl \
            --cache-dir build/check/windows-arm64/crossmodule-result-u8-cranelift-cache \
            --output "$chr_obj"
          test -s "$chr_obj"
          chr_relocations="$(llvm-readobj --relocations "$chr_obj")"
          [[ "$chr_relocations" == *"rt_char_from_code"* ]]
          SIMPLE_BIN="$stage3" BUILD_DIR=build/check/windows-arm64/option-try-cranelift \
            sh scripts/check/check-native-option-try-target-fail.shs \
            aarch64-pc-windows-msvc cranelift
          for obj in build/check/windows-arm64/option-try-cranelift/*.o; do
            test -s "$obj"
            option_header="$(llvm-readobj --file-headers "$obj")"
            [[ "$option_header" == *"Format: COFF-ARM64"* ]]
            [[ "$option_header" == *"Machine: IMAGE_FILE_MACHINE_ARM64 (0xAA64)"* ]]
          done

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portability_contract.outcome == 'failure' && 'unadmitted-' || '' }}bootstrap-${{ matrix.name }}-${{ matrix.backend }}-${{ github.sha }}
          path: |
            build/bootstrap/stage2/**/simple*
            build/bootstrap/stage3/**/simple*
            build/bootstrap/portability-diagnostic.env
          retention-days: 7

      - name: Enforce portability verdict after diagnostic collection
        if: ${{ always() && steps.portability_contract.outcome == 'failure' }}
        run: |
          echo '::error::Portability contracts failed; collected bootstrap artifacts are UNADMITTED.'
          exit 1

  native-architectures:
    if: (!inputs.diagnose_windows_collector) && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (github.event_name != 'workflow_dispatch' || inputs.native_lane == 'all' || inputs.native_lane == ''))
    name: Pure Simple — ARM32/RV32 LLVM objects + x86_64/AArch64/RISC-V64 dual backend
    runs-on: ubuntu-24.04
    needs: native
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux pure-Simple stages
        uses: actions/download-artifact@v4
        with:
          name: bootstrap-Linux x86_64-llvm-${{ github.sha }}
          path: build/bootstrap-linux

      - name: Install LLVM cross-execution toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18-dev libfreetype6-dev \
            binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu \
            gcc-mingw-w64-x86-64 qemu-user

      - name: Validate MinGW Stage4 dynload provider archive
        run: |
          compiler="$PWD/build/bootstrap-linux/stage3/x86_64-unknown-linux-gnu/simple"
          chmod +x "$compiler"
          test -x "$compiler"
          command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1
          command -v x86_64-w64-mingw32-ar >/dev/null 2>&1
          command -v llvm-nm-18 >/dev/null 2>&1
          command -v llvm-objdump-18 >/dev/null 2>&1
          compiler_target=$(x86_64-w64-mingw32-gcc -dumpmachine)
          test "$compiler_target" = "x86_64-w64-mingw32"
          SIMPLE_STAGE4_DYNLOAD_ARCHIVE_CROSS_TARGET=x86_64-w64-mingw32 \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            SIMPLE_NM=llvm-nm-18 \
            SIMPLE_OBJDUMP=llvm-objdump-18 \
            SIMPLE_NO_STUB_FALLBACK=1 \
            SIMPLE_BINARY="$compiler" \
            BUILD_DIR=build/check/stage4-mingw-dynload-provider \
            sh scripts/check/check-stage4-hosted-dynload-provider-archive.shs

      - name: Run strict pure-Simple architecture gate
        run: |
          compiler="$PWD/build/bootstrap-linux/stage3/x86_64-unknown-linux-gnu/simple"
          chmod +x "$compiler"
          test -x "$compiler"
          SIMPLE_NO_STUB_FALLBACK=1 SIMPLE_BIN="$compiler" \
            BUILD_DIR=build/check/llvm-simd-row-native-arch \
            sh scripts/check/check-llvm-simd-row-native-arch.shs

      - name: Run strict pure-Simple Cranelift cross-execution gate
        run: |
          compiler="$PWD/build/bootstrap-linux/stage3/x86_64-unknown-linux-gnu/simple"
          chmod +x "$compiler"
          CRANELIFT_CROSS_EXECUTE=1 SIMPLE_NO_STUB_FALLBACK=1 SIMPLE_BIN="$compiler" \
            BUILD_DIR=build/check/cranelift-aot-aggregate-cross \
            sh scripts/check/check-cranelift-aot-aggregate-cross.shs

  # Cross-compilation builds from Linux x86_64
  cross:
    if: (!inputs.diagnose_windows_collector) && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (github.event_name != 'workflow_dispatch' || inputs.native_lane == 'all' || inputs.native_lane == ''))
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            name: Linux aarch64
            pkg: gcc-aarch64-linux-gnu
          - target: riscv64gc-unknown-linux-gnu
            name: Linux riscv64
            pkg: gcc-riscv64-linux-gnu
          - target: x86_64-pc-windows-gnu
            name: Windows x86_64 (MinGW)
            pkg: gcc-mingw-w64-x86-64
    name: Cross — ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}

      - name: Select Clang for Windows GNU bootstrap
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get install -y clang
          echo 'CC_x86_64_pc_windows_gnu=clang' >> "$GITHUB_ENV"
          clang --version | head -1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/compiler_rust/target
          key: cross-${{ matrix.target }}-${{ hashFiles('src/compiler_rust/Cargo.lock') }}
          restore-keys: |
            cross-${{ matrix.target }}-

      - name: Build
        working-directory: src/compiler_rust
        run: cargo build --profile bootstrap -p simple-driver --target ${{ matrix.target }}

  # FreeBSD build (VM-based)
  freebsd:
    if: (!inputs.diagnose_windows_collector) && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (github.event_name != 'workflow_dispatch' || inputs.native_lane == 'all' || inputs.native_lane == ''))
    runs-on: ubuntu-24.04
    name: Native — FreeBSD x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl bash
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          run: |
            set -eu
            . "$HOME/.cargo/env"
            cd src/compiler_rust
            echo 'FreeBSD guest resource diagnostics (bounded)'
            {
              echo 'sysctl:'
              sysctl -n hw.ncpu hw.physmem vm.swap_total 2>&1 || true
              echo 'swapinfo:'
              swapinfo -h 2>&1 || true
            } | head -n 40

            CARGO_BUILD_JOBS=1 cargo build --profile bootstrap -p simple-driver || {
              cargo_status=$?
              echo "FreeBSD cargo build failed (status=$cargo_status)" >&2
              echo 'FreeBSD dmesg tail (last 80 lines)' >&2
              dmesg 2>&1 | tail -n 80 || true
              exit "$cargo_status"
            }
            CARGO_BUILD_JOBS=1 CARGO_PROFILE_TEST_DEBUG=0 cargo test --workspace --lib -j 1 -- --test-threads=1 || {
              cargo_status=$?
              echo "FreeBSD cargo test failed (status=$cargo_status)" >&2
              echo 'FreeBSD dmesg tail (last 80 lines)' >&2
              dmesg 2>&1 | tail -n 80 || true
              exit "$cargo_status"
            }

  # Native FreeBSD self-hosted Stage 3 proof. This is intentionally separate
  # from the Rust seed build above: it exercises the canonical receipt-free
  # Stage 2 trust root and the tracked Stage 3 resume interface in the guest.
  freebsd-selfhost:
    if: (!inputs.diagnose_windows_collector) && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && (github.event_name != 'workflow_dispatch' || inputs.native_lane == 'all' || inputs.native_lane == ''))
    runs-on: ubuntu-24.04
    name: Self-host — FreeBSD Stage 3
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Run native FreeBSD self-host checker
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            sed 's|/quarterly|/latest|' /etc/pkg/FreeBSD.conf > /usr/local/etc/pkg/repos/FreeBSD.conf
            grep -q '/latest' /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            pkg install -y bash coreutils curl git gmake llvm23 pkgconf libffi zstd perl5 rsync python3
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
          run: |
            set -eu
            . "$HOME/.cargo/env"
            export PATH=/usr/local/libexec/gnubin:/usr/local/bin:$PATH
            # The synced checkout is owned by a different uid than the VM's
            # SSH user; without this, git refuses it and bootstrap preflight
            # cannot bind HEAD ("detected dubious ownership").
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$(pwd -P)"
            git rev-parse --verify HEAD >/dev/null
            sh scripts/check/check-freebsd-selfhost-ci.shs

      - name: Upload FreeBSD self-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-selfhost-${{ github.sha }}
          path: build/bootstrap-freebsd-ci
          if-no-files-found: warn
          retention-days: 14

  windows-retained-stage2-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_windows_collector
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate strict-link diagnostic selector
        shell: bash
        run: test '${{ inputs.native_lane }}' = windows-cranelift
      - name: Configure placeholder checkout
        shell: bash
        run: git config --global core.symlinks false
      - uses: actions/checkout@v4
        with:
          ref: 82bba68602c2cff2b87f42b0f5ae8a54f1d14b8b
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/download-artifact@v4
        with:
