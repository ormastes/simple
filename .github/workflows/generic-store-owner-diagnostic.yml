name: Generic method semantic lowering proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lowering:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 45199934467
          name: seed-linux-x86_64-d89f975af3cb46782e0c1dd68a795bb5833da846
          path: seed
      - name: Execute actual baseline and patched lowering in isolated sources
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          proof="$RUNNER_TEMP/generic-method-proof"
          mkdir -p "$proof"
          echo 'bd20b7e1378e1d1f45eb5c5d8139d1044145832644db9a2083ae5b15427de4d3  seed/simple' | sha256sum -c -
          chmod +x seed/simple
          spec=test/01_unit/compiler/hir/generic_method_semantic_return_spec.spl
          git worktree add --detach "$RUNNER_TEMP/baseline" 54d47e3ab38dbb2daccb987cd62e78763375ff21
          cp "$spec" "$RUNNER_TEMP/baseline/$spec"
          for variant in baseline fixed; do
            source="$root"
            if test "$variant" = baseline; then source="$RUNNER_TEMP/baseline"; fi
            lane="$proof/$variant"
            mkdir -p "$lane/tmp" "$lane/cache"
            cd "$source"
            git rev-parse HEAD > "$lane/source-revision.txt"
            sha256sum "$root/seed/simple" "$spec" src/compiler/20.hir/hir_lowering/_Items/declaration_lowering.spl > "$lane/inputs.sha256"
            export SIMPLE_LIB="$source/src" SIMPLE_PROJECT_ROOT="$source" SIMPLE_BOOTSTRAP=1 SIMPLE_TEST_RUNNER_RUST=1
            export SIMPLE_CACHE="$lane/cache" SIMPLE_FRONTEND_CACHE_DIR="$lane/frontend" SIMPLE_HIR_CACHE_DIR="$lane/hir" TMPDIR="$lane/tmp"
            set +e
            perl scripts/resource/process-tree-rss-watchdog.pl --rss-cap-mode=enforce --max-rss-kib=6291456 --timeout-seconds=600 --receipt="$lane/owner.env" -- "$root/seed/simple" run "$spec" --mode=interpreter > "$lane/stdout.log" 2> "$lane/stderr.log"
            code=$?
            set -e
            echo "$code" > "$lane/exit-code.txt"
            tail -n 25 "$lane/stdout.log"
            tail -n 15 "$lane/stderr.log"
          done
          cd "$root"
          test "$(cat "$proof/fixed/exit-code.txt")" = 0
          grep -q '^status=complete$' "$proof/fixed/owner.env"
          grep -q '^quiescent=1$' "$proof/fixed/owner.env"
          grep -Eq '1 examples?, 0 failures?|1 passed, 0 failed' "$proof/fixed/stdout.log"
          grep -Eq '1 examples?, 1 failures?|0 passed, 1 failed' "$proof/baseline/stdout.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: generic-method-lowering-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/generic-method-proof
          retention-days: 7
