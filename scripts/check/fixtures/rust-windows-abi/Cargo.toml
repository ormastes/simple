[package]
name = "simple-windows-abi-regression"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[[bin]]
name = "windows-abi-regression"
path = "main.rs"
[[bin]]
name = "windows-runtime-abi-regression"
path = "runtime.rs"
[dependencies]
lazy_static = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

windows = { version = "0.58", features = ["Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

