# Tigard (FTDI FT2232H) JTAG interface for OpenOCD.
#
# Local copy of the stock /usr/share/openocd/scripts/interface/ftdi/tigard.cfg
# with ONE change. The stock file matches `ftdi device_desc "Tigard V1.1"`;
# real units enumerate their USB product string as
#     port A:Serial  port B:JTAG          (two spaces before "port B")
# so the stock file fails with "unable to open ftdi device". Every other line
# (channel 1 = port B, layout_init, nTRST 0x0010, nSRST 0x0020) is the stock
# file's and is correct (verified on a StarFive JH7110 board, 2026-09-27).
#
# Use:
#   openocd -f scripts/os/openocd-tigard-jtag.cfg \
#           -f scripts/os/openocd-starfive-jh7110-target.cfg -c init ...
# The scripts/os/starfive-jtag-*.shs and stage-*.shs gates get the same effect
# with `-f interface/ftdi/tigard.cfg -c 'ftdi device_desc {port A:Serial  port B:JTAG}'`.
# Port A stays a plain USB serial (ftdi_sio, /dev/ttyUSB0); only port B is
# claimed by OpenOCD, and only after ftdi_sio releases that interface.

adapter driver ftdi
ftdi device_desc "port A:Serial  port B:JTAG"
ftdi vid_pid 0x0403 0x6010
ftdi channel 1
ftdi layout_init 0x0038 0x003b
ftdi layout_signal nTRST -data 0x0010
ftdi layout_signal nSRST -data 0x0020
reset_config srst_push_pull trst_push_pull
