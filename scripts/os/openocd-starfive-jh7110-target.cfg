transport select jtag
adapter speed 100

set _CHIPNAME jh7110
jtag newtap $_CHIPNAME e24 -irlen 5 -expected-id 0x07110cfd
jtag newtap $_CHIPNAME u74 -irlen 5 -expected-id 0x07110cfd

# The U74 debug module exposes five harts.  Declare the complete topology so
# OpenOCD performs the JH7110 multi-hart examination used by the vendor flow.
# Keep the targets independent: boot hart 1 can be running firmware that does
# not accept halt requests, and an SMP halt group would unnecessarily block
# safe RAM access through the parked secondary harts.
target create $_CHIPNAME.u74_hart0 riscv -chain-position $_CHIPNAME.u74 -coreid 0 -rtos hwthread
target create $_CHIPNAME.u74_hart1 riscv -chain-position $_CHIPNAME.u74 -coreid 1
target create $_CHIPNAME.u74_hart2 riscv -chain-position $_CHIPNAME.u74 -coreid 2
target create $_CHIPNAME.u74_hart3 riscv -chain-position $_CHIPNAME.u74 -coreid 3
target create $_CHIPNAME.u74_hart4 riscv -chain-position $_CHIPNAME.u74 -coreid 4
