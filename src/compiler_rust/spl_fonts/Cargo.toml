[package]
name = "spl_fonts"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# FreeType is an OPTIONAL rasterization backend, not a requirement. This crate
# is "backed by fontdue" (see src/lib.rs:1) and every FreeType path already
# returns `Option`, falling back to the pure-Rust fontdue rasterizer on `None`.
# The `#[link(name = "freetype")]` block was unconditional, so linking the crate
# (cdylib, and its `--lib` test harness) hard-required a system freetype on
# EVERY host -- LNK1181 `cannot open input file 'freetype.lib'` on Windows MSVC,
# and `ld: library 'freetype' not found` on macOS until CI added a brew step
# (.github/workflows/rust-bootstrap-multiplatform.yml:143-155, which names this
# exact defect). Default-off keeps the crate buildable with no external
# dependency, in line with CLAUDE.md's pure-first policy; lanes that already
# install libfreetype6-dev / brew freetype can opt back in with
# `--features spl_fonts/freetype` to regain hinted + LCD-filtered rasterization.
default = []
freetype = []

[dependencies]
fontdue = "0.9.3"
sha2 = "0.10"
