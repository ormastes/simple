# ---------------------------------------------------------------------------
# Offline / vendored-sources configuration
# ---------------------------------------------------------------------------
# SimpleOS does NOT provide fork/exec, so cargo cannot spawn git/curl at
# build time. All dependencies must be resolved from ./vendor/. Populate
# it on the host with `cargo vendor --respect-source-config` BEFORE any
# cross-build targeting x86_64-unknown-simpleos (or any other SimpleOS
# triple). Commit the contents of vendor/ to the repo so CI and SimpleOS
# self-builds stay hermetic.
# ---------------------------------------------------------------------------

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[build]
# Build configuration for Simple language
# Note: Test thread limits are managed dynamically by scripts/cpu-aware-test.sh
# based on CPU_THROTTLE_THRESHOLD (default 70%) in simple.test.toml

# Limit parallel jobs to prevent resource exhaustion on high-core-count systems
# Without this, cargo test --workspace on 32+ core systems can hang at 100% CPU
jobs = 8

# Default to single-threaded Rust tests for deterministic behavior
# Use RUST_TEST_THREADS=N or cargo test -- --test-threads=N to override
[env]
RUST_TEST_THREADS = "1"

[target.x86_64-unknown-linux-gnu]
# Startup optimization linker flags (#1992, #1995)
rustflags = [
    # #1995: Section GC - remove unused sections
    "-C", "link-arg=-Wl,--gc-sections",
    # #1992: RELR relocations - packed relative relocations (requires ld 2.27+)
    "-C", "link-arg=-Wl,-z,pack-relative-relocs",
    # Export runtime symbols so the SMF loader can resolve them from the main binary.
    "-C", "link-arg=-Wl,--export-dynamic",
]

[target.x86_64-pc-windows-msvc]
# clang-only policy (.claude/rules/code-style.md, 2026-09-24): never `cl`,
# never MSVC `link.exe`. `lld-link` is LLD's COFF linker driver -- it accepts
# the same /OPT:REF, /OPT:ICF and other MSVC-flavour flags `link.exe` does
# (it is a drop-in linker.exe-CLI-compatible replacement), so it is NOT the
# same risk the old comment warned about for clang-cl-as-linker: clang-cl is a
# C COMPILER DRIVER that reinterprets argv before invoking a linker, which is
# what could mis-pass Rust's raw `-C link-arg=...` flags; `lld-link` IS the
# linker itself, with no driver translation step in front of it, so Cargo's
# linker-argv contract holds. scripts/setup/windows-msvc-bootstrap-env.shs
# puts the LLVM 23 `bin/` directory (which ships `lld-link.exe`) on PATH and
# no longer puts the MSVC `VC/Tools/.../bin/Hostx64/x64` directory on PATH, so
# a bare `link.exe`/`cl.exe` cannot shadow this even by accident.
linker = "lld-link"
# Size optimization linker flags (Windows MSVC equivalent of --gc-sections)
rustflags = [
    # Remove unreferenced functions/data
    "-C", "link-arg=/OPT:REF",
    # Fold identical COMDATs (identical function folding)
    "-C", "link-arg=/OPT:ICF",
]

# Cross-compilation linker configs for non-Windows targets. clang-only policy:
# these used to invoke a GCC cross toolchain (`*-gcc`) by name, in violation
# of "never gcc" (.claude/rules/code-style.md). clang is a native cross
# compiler/linker driver -- one binary handles every target via `--target=`,
# so no per-arch GCC cross-toolchain package is required at all. Not
# verified on this Windows host: it has no aarch64/riscv64 Linux cross
# sysroot installed, so `cargo check --target aarch64-unknown-linux-gnu`
# cannot be exercised here. Verify on a Linux host with those cross sysroots
# before relying on this for an actual cross-build.
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--target=aarch64-linux-gnu"]

[target.riscv64gc-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--target=riscv64-linux-gnu"]
