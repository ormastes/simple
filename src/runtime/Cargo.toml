[package]
name = "spl_memtrack_rust"
version = "0.1.0"
edition = "2021"
description = "Rust global allocator bridge for Simple memory tracking"
license = "Apache-2.0"

# This allocator bridge is also built as a standalone C-runtime dependency.
# Keep rustc's default lint policy independently of the seed workspace.
[lints]

[lib]
name = "spl_memtrack_rust"
path = "runtime_memtrack_rust.rs"
crate-type = ["staticlib"]
