<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=640,initial-scale=1"><title>17-filter-order</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:640px;height:480px;background:white}#scene{position:relative;width:640px;height:480px;overflow:hidden;background:white;color:#172033;font:20px/1.4 sans-serif} .tile{position:absolute;width:140px;height:100px;background:#247bde}
