<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=640,initial-scale=1"><title>47-custom-controls</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:640px;height:480px;background:white}#scene{position:relative;width:640px;height:480px;overflow:hidden;background:white;color:#172033;font:20px/1.4 sans-serif} .tile{position:absolute;width:140px;height:100px;background:#247bde}
.field{position:absolute;left:50px;top:45px;width:400px;height:70px;appearance:none;border:3px solid #2489cd;border-radius:14px;background:#f0f7fb;box-shadow:0 0 0 5px #247bde30}.button{top:160px;width:180px;background:linear-gradient(#3499ee,#2163ba);border-color:#13558f}.toggle{position:absolute;left:300px;top:180px;width:90px;height:46px;border-radius:23px;background:#277;box-shadow:inset 0 2px 5px #0005}.toggle::after{content:"";position:absolute;right:4px;top:4px;width:38px;height:38px;border-radius:50%;background:white}</style><body><div id="scene"><div class="field"></div><div class="field button"></div><div class="toggle"></div></div></body></html>
