<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="">
<meta name="component-observe" content="">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#wrap { width: 300px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#floater { float: left; width: 80px; height: 60px; margin: 0 8px 4px 0;
  border: 1px solid #666666; background: #eeeeee; }
#para { margin: 0; font-family: Arial; font-size: 14px; line-height: 20px; }
#after { clear: both; height: 24px; padding: 2px; border: 1px solid #999999; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrap">
<div id="floater"></div>
<p id="para">the quick brown fox jumps over the lazy dog and keeps on running past the fence line until the wrapped text flows below the float</p>
<div id="after">after</div>
</div>
</body>
</html>
