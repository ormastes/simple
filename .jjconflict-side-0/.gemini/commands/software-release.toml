description = "Apply general protected software-release rules."
prompt = """
Use doc/07_guide/infra/software_release.md. Require one isolated session branch/worktree, one canonical version authority, exact reviewed beta bug fixes, immutable build-once candidates, and signed annotated exact-tag promotion without rebuild. Compare exact main/release snapshots read-only before each candidate attempt, after a bootstrap failure, and before admission. Main remains the independent development trunk. Exact backport/forward-port work requires stable patch equivalence; adapted patches fail closed. Only a non_fix release-specific exception with reason, owner, and expiry may remain release-only. Rollback redeploys; withdrawal preserves identity. GitHub forbids a PR author APPROVED review, so protected integration uses the required SPipe Self Review Admission status and never claims provider/independent approval. Ordinary code/text is default allow absent operator deny/constrain; scopes are code, text, exact file, immediate directory_files, and recursive directory_recursive. Resolve/re-resolve protected target/ruleset, head, base, merge-base, and diff. On rejection/invalidation, follow the reason: drift/expiry needs fresh exact-head review and dispatch; deny needs external policy-owner action or an independent route; uncovered scope needs a smaller diff/new constraint; unsafe/secret material must be removed and credentials rotated. Never reuse a stale check or weaken candidate/release/publication authority. Generic Actions App trust risk is accepted, not independent security. Keep candidate and environment admission separate. Ask before external push/publication.
"""
