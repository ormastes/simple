[package]
name = "simple-native-all"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

# NOTE: `spl_hosted_runtime` lives outside the usual `src/compiler_rust/*`
# tree (in `src/runtime/hosted/`) so that the hosted-compositor SFFI
# bindings ship alongside the C runtime. It's pulled in here so that its
# `rt_cocoa_*` / `rt_win32_*` / `rt_hosted_select_surface` no_mangle
# symbols are rolled into `libsimple_native_all.a` and resolved at the
# Simple link step. The crate's default feature set is "stubs only" —
# real Cocoa / Win32 backends are opt-in via `cocoa-real` / `win32-real`.

[lints]
workspace = true

[features]
default = []  # Cranelift is sufficient; enable "llvm" explicitly when needed
llvm = ["simple-compiler/llvm"]
gui = ["simple-compiler/gui"]
vulkan = ["simple-compiler/vulkan", "simple-runtime/vulkan"]
cuda = ["simple-compiler/cuda", "simple-runtime/cuda"]
driver-compat = ["dep:simple-driver", "simple-runtime/driver-hooks"]
cocoa-real = ["spl_hosted_runtime/cocoa-real"]
win32-real = ["spl_hosted_runtime/win32-real"]

[dependencies]
simple-common = { path = "../common" }
simple-compiler = { path = "../compiler" }
simple-runtime = { path = "../runtime", features = ["runtime-symbol-table", "native-all-provider", "runtime-tls"] }
simple-driver = { path = "../driver", optional = true }
# Row 3 hosted-compositor SFFI bindings. Path is relative to this crate,
# so it points into `src/runtime/hosted/`. Default features keep this as
# a "stubs only" no-op on every host.
spl_hosted_runtime = { path = "../../runtime/hosted" }
libc = "0.2"

# On Windows `simple-compiler` already pulls this crate WITH `win32-real`
# (compiler/Cargo.toml:134-136, a cfg(windows) section). This crate pulled it
# without, so the seed build and the native-all build -- two separate cargo
# invocations sharing one target dir -- resolved different feature sets and each
# left its own `libspl_hosted_runtime-<hash>.rlib` in deps/. The bootstrap's
# authority step requires EXACTLY ONE such rlib and refused with a bare
# `return 1`, surfacing only as "could not prepare immutable Rust authority
# generation".
#
# Requesting the same feature here makes the two invocations agree. It is not a
# behaviour change: within any Windows build that links simple-compiler, cargo
# feature unification already selected the win32-real variant.
#
# Linux/macOS are untouched -- `win32-real` never activates there, which is why
# both invocations already agreed and only one rlib was ever produced.
[target.'cfg(windows)'.dependencies]
spl_hosted_runtime = { path = "../../runtime/hosted", features = ["win32-real"] }

[dev-dependencies]
tempfile = "3"
