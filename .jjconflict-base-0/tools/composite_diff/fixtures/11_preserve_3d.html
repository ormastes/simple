<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>11_preserve_3d</title>
<style>
html, body { margin: 0; padding: 0; }
.scene { transform-style: preserve-3d; width: 120px; height: 120px; }
.card { width: 100px; height: 100px; background: #6633aa; transform: rotateY(30deg) translateZ(20px); }
</style>
</head>
<body>
<div class="scene"><div class="card"></div></div>
</body>
</html>
