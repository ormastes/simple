<style>
html,body{margin:0;background:#fff}
#grid{display:grid;width:18px;grid-template-columns:6px 10px;
  grid-template-rows:5px 7px;column-gap:2px;row-gap:2px;background:#dbeafe}
#a{height:5px;background:#ef4444}
#b{height:5px;background:#22c55e}
#c{height:7px;background:#2563eb;grid-column:1 / span 2;grid-row:2}
#d{height:4px;background:#d946ef;grid-column:2;grid-row:3}
</style>
<main id="grid">
  <div id="a"></div><div id="b"></div>
  <div id="c"></div><div id="d"></div>
</main>
