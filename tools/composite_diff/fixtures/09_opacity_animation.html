<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>09_opacity_animation</title>
<style>
html, body { margin: 0; padding: 0; }
@keyframes fade { from { opacity: 1; } to { opacity: 0.2; } }
.box { width: 100px; height: 100px; background: #227788; animation: fade 9s infinite; }
</style>
</head>
<body>
<div class="box"></div>
</body>
</html>
