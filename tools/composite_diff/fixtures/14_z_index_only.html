<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>14_z_index_only</title>
<style>
html, body { margin: 0; padding: 0; }
.a { position: relative; z-index: 5; width: 80px; height: 80px; background: #cc3333; }
.b { position: relative; z-index: 1; width: 80px; height: 80px; background: #3333cc; margin-top: -40px; }
</style>
</head>
<body>
<div class="a"></div><div class="b"></div>
</body>
</html>
