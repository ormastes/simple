<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>07_position_sticky</title>
<style>
html, body { margin: 0; padding: 0; }
.scroller { height: 300px; overflow: scroll; }
.sticky { position: sticky; top: 0; height: 40px; background: #dd8822; }
.tall { height: 1200px; background: #f4f4f4; }
</style>
</head>
<body>
<div class="scroller"><div class="sticky"></div><div class="tall"></div></div>
</body>
</html>
