<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>10_transform_animation</title>
<style>
html, body { margin: 0; padding: 0; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(200px); } }
.box { width: 100px; height: 100px; background: #882277; animation: slide 9s infinite; }
</style>
</head>
<body>
<div class="box"></div>
</body>
</html>
