<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="click:#inc,click:#dec">
<meta name="component-observe" content="display">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#counter { width: 300px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#display { height: 24px; padding: 2px; border: 1px solid #999999; margin-bottom: 6px; }
#inc, #dec { display: block; box-sizing: border-box; width: 120px; height: 28px;
  margin: 4px 0 4px 0; padding: 2px; border: 1px solid #666666;
  font-family: Arial; font-size: 14px; line-height: 20px; background: #eeeeee; }
</style>
<script>
function setCount(n) {
  var d = document.getElementById('display');
  var s = 'count ' + n;
  for (var i = 0; i < n; i++) { s += ' #'; }
  d.textContent = s;
  d.setAttribute('data-count', String(n));
}
function bump(delta) {
  var d = document.getElementById('display');
  setCount(parseInt(d.getAttribute('data-count'), 10) + delta);
}
</script>
</head>
<body>
<div id="counter">
<div id="display" data-count="0">count 0</div>
<button id="inc" type="button" onclick="bump(1)">inc</button>
<button id="dec" type="button" onclick="bump(-1)">dec</button>
</div>
</body>
</html>
