<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="click:#add,click:#rm">
<meta name="component-observe" content="">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#panel { width: 260px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#add, #rm { display: block; box-sizing: border-box; width: 120px; height: 28px;
  margin: 4px 0 4px 0; padding: 2px; border: 1px solid #666666;
  font-family: Arial; font-size: 14px; line-height: 20px; background: #eeeeee; }
#list { margin: 6px 0 6px 0; padding: 0; list-style: none; }
#list li { display: block; height: 20px; padding: 2px; border: 1px solid #999999; margin-bottom: 2px; }
#list li.hidden { display: none; }
#footer { height: 24px; padding: 2px; border: 1px solid #999999; }
</style>
<script>
function show(on) {
  var e = document.getElementById('extra');
  if (on) { e.classList.remove('hidden'); } else { e.classList.add('hidden'); }
}
</script>
</head>
<body>
<div id="panel">
<button id="add" type="button" onclick="show(true)">add</button>
<button id="rm" type="button" onclick="show(false)">remove</button>
<ul id="list">
<li id="item1">alpha</li>
<li id="item2">beta</li>
<li id="extra" class="hidden">gamma</li>
</ul>
<div id="footer">end</div>
</div>
</body>
</html>
