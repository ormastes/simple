<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="click:#cb,click:#cb">
<meta name="component-observe" content="state">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#panel { width: 240px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#cb { display: block; box-sizing: border-box; width: 16px; height: 16px; margin: 4px 0 4px 0; }
#state { height: 24px; padding: 2px; border: 1px solid #999999; margin-top: 6px; }
</style>
<script>
function flip() {
  var c = document.getElementById('cb');
  var s = document.getElementById('state');
  s.textContent = c.checked ? 'on' : 'off';
}
</script>
</head>
<body>
<div id="panel">
<input id="cb" type="checkbox" onclick="flip()">
<div id="state">off</div>
</div>
</body>
</html>
