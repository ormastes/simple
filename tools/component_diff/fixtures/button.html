<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="click:#btn">
<meta name="component-observe" content="label">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#panel { width: 260px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#btn { display: block; box-sizing: border-box; width: 120px; height: 28px;
  margin: 4px 0 4px 0; padding: 2px; border: 1px solid #666666;
  font-family: Arial; font-size: 14px; line-height: 20px; background: #eeeeee; }
#label { height: 24px; padding: 2px; border: 1px solid #999999; margin-top: 6px; }
</style>
<script>
function press() {
  var l = document.getElementById('label');
  l.textContent = 'clicked';
  l.setAttribute('data-state', 'clicked');
}
</script>
</head>
<body>
<div id="panel">
<button id="btn" type="button" onclick="press()">press</button>
<div id="label" data-state="default">default</div>
</div>
</body>
</html>
