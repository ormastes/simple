<!DOCTYPE html>
<html>
<head>
<meta name="component-actions" content="fill:#field:hello">
<meta name="component-observe" content="echo">
<style>
body { margin: 0; font-family: Arial; font-size: 16px; line-height: 20px; }
#form { width: 280px; padding: 8px; border: 2px solid #333333; margin: 10px; background: #ffffff; }
#field { display: block; box-sizing: border-box; width: 200px; height: 28px;
  margin: 0 0 6px 0; padding: 2px; border: 1px solid #666666;
  font-family: Arial; font-size: 14px; line-height: 20px; }
#caret { width: 4px; height: 18px; background: #333333; margin-bottom: 6px; }
#caret.active { width: 60px; }
#echo { height: 24px; padding: 2px; border: 1px solid #999999; }
</style>
<script>
function echoIt(v) {
  var e = document.getElementById('echo');
  e.textContent = v === '' ? 'empty' : v;
  var c = document.getElementById('caret');
  if (v === '') { c.classList.remove('active'); } else { c.classList.add('active'); }
}
</script>
</head>
<body>
<div id="form">
<input id="field" type="text" value="" oninput="echoIt(this.value)">
<div id="caret"></div>
<div id="echo">empty</div>
</div>
</body>
</html>
