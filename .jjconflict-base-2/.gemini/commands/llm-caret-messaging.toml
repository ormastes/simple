description = "Use canonical LLM Caret rooms, bounded context, deterministic agent routing, task updates, and messaging MCP tools."
prompt = '''
Operate through the LLM Caret messaging MCP.

1. Inspect profiles and membership with chat_who; read relevant messages with chat_read.
2. Obtain authorized bounded context using chat_get_context instead of appending full history.
3. Assign stateful work with chat_assign and publish only significant state transitions with chat_task_update.
4. Publish durable outputs with chat_publish_artifact and answers with chat_send, preserving correlation and idempotency IDs.
5. Mark consumption with chat_mark_read without claiming native evidence when only a local cursor exists.

Use deterministic routing: mention, reply, explicit assignment, unique capability, room owner, optional selector, main fallback. Do not let agent_update messages trigger agents implicitly. Keep private-room contents isolated. Follow capability levels (native, emulated, primitive_sidecar, unsupported), never platform-name conditionals.

Lifecycle hooks enqueue locally and return promptly; the messaging bridge owns retries and external delivery. Credentials never belong in Gemini settings fragments.
'''
