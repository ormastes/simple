# Python packaging metadata for the JupyterLab federated extension.
#
# Sanctioned Python-ecosystem exception (see doc/03_plan/agent_tasks/
# notebook_lanes_parallel_plan_2026-08-07.md, Stream P / P0): this repo bans
# Python code, but JupyterLab 4.x can only load a federated extension through a
# pip-installable Python package built with hatch-jupyter-builder — the same
# exception that covers tools/jupyter/kernel_wrapper.py. This file is packaging
# metadata only; all extension logic stays in TypeScript under src/.
#
# Layout mirrors the official JupyterLab 4.x extension-template (frontend-only
# variant), stripped to the minimum: no cookiecutter extras, no CI, no binder.

[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-jupyter-builder>=0.5"]
build-backend = "hatchling.build"

[project]
name = "simple_labextension"
version = "0.1.0"
description = "JupyterLab extension for the Simple language: CodeMirror 6 syntax highlighting, LSP wiring, lane picker, math outputs."
license = { text = "Apache-2.0" }
authors = [{ name = "simple-lang" }]
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
]

[tool.hatch.build.targets.sdist]
artifacts = ["simple_labextension/labextension"]
exclude = ["node_modules", "tests"]

[tool.hatch.build.targets.wheel.shared-data]
"simple_labextension/labextension" = "share/jupyter/labextensions/@simple-lang/jupyterlab-simple"
"install.json" = "share/jupyter/labextensions/@simple-lang/jupyterlab-simple/install.json"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "simple_labextension/labextension/static/style.js",
    "simple_labextension/labextension/package.json",
]
skip-if-exists = ["simple_labextension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["npm"]
