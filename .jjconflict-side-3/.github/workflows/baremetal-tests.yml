name: Cortex-M33 Bare-Metal Smoke

on:
  push:
    branches: [main]
    paths:
      - 'src/compiler/70.backend/baremetal/cortex_m33/**'
      - 'src/os/kernel/arch/cortex_m33/**'
      - 'scripts/os/run_simpleos_cortex_m33_qemu.shs'
      - '.github/workflows/baremetal-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/compiler/70.backend/baremetal/cortex_m33/**'
      - 'src/os/kernel/arch/cortex_m33/**'
      - 'scripts/os/run_simpleos_cortex_m33_qemu.shs'
      - '.github/workflows/baremetal-tests.yml'
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cortex-m33-smoke:
    name: Cortex-M33 C-shim QEMU Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm
      - name: Run strict smoke
        run: timeout 30s sh scripts/os/run_simpleos_cortex_m33_qemu.shs --smoke
