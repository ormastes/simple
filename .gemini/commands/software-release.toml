description = "Apply general protected software-release rules."
prompt = """
Use doc/07_guide/infra/software_release.md. Require one isolated session branch and worktree, one canonical version authority, exact reviewed beta bug-fix backports, immutable build-once candidates, and signed annotated exact-tag promotion without rebuild. Run a bounded read-only comparison of exact main/release snapshots before every candidate attempt, after a bootstrap failure repair, and before release admission; discovery never selects, applies, or pushes a fix. Every shared fix needs stable patch-ID equivalence, renewed evidence, and protected integration in both required directions. Adapted patches fail closed; only a release-specific non_fix classification with reason, owner, and expiry may remain release-only. Main remains the independent development trunk. Protected PR integration uses SPipe Self Review Admission instead of provider Approve: explicit self-attested PASS is user-authorized, not independent authentication; resolve/re-resolve protected target/ruleset, head, base, merge-base, and diff; apply default allow plus operator deny/constraints; reject aliases, secrets, symlinks, submodules, non-UTF-8, and traversal; expire checks after ten minutes. Generic Actions App trust risk is accepted, not independent security. Keep candidate and environment admission separate. Rollback redeploys and withdrawal preserves identity. Ask before external push/publication.
"""
