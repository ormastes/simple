description = "Prepare a protected stable or prerelease release from an immutable admitted candidate."
prompt = """
Follow doc/07_guide/infra/software_release.md.

Use release/version.sdn as the canonical and only editable product-version authority. Require verify STATUS: PASS and the release-bound whole test result. Start one isolated release session with one work/release or work/backport branch and worktree; never author in the main worktree.

Beta maintenance targets release/X.Y and accepts only a caller-selected reviewed bug-fix commit with exact source SHA, change/work IDs, provider review/check receipts, result SHA, stable patch-ID equivalence, and renewed evidence. Adapted patches fail closed until a separately reviewed equivalence protocol exists. Never discover or apply fixes automatically.

Before each candidate attempt, after a bootstrap failure fix, and before release admission, fetch once and compare exact main and release/X.Y snapshots read-only. Discovery proposes reviewed fixes only. Backport a selected main fix or forward-port a selected release-first fix through an isolated work branch, renewed evidence, stable patch-id equivalence, divergence receipt, and the appropriate protected CAS integration authority. Bug fixes have no waiver; only a non_fix release-specific compatibility classification with reason, owner, and expiry may remain release-only. Main remains development trunk; never reset/repoint it to, track, absorb, or replace it with the release line.

Create an immutable candidate, build and qualify it once, and perform promotion of the exact admitted artifacts without rebuilding or fallback. The release tag must be signed, annotated, SemVer-valid, and pushed as one exact ref. Ask before external push/publication.

Rollback redeploys a prior admitted release. Withdrawal preserves published identity; corrections use a new beta, RC, or patch number.

Use simple release version-check, beta-prepare, backport-check, candidate-check, promote-check, and withdraw-check for validation.

For protected PR integration, explicitly self-attest high-capability/high-effort PASS with zero P0/P1, then dispatch SPipe Self Review Admission. GitHub forbids PR authors from submitting an APPROVED review on their own PR; this is a required status check, not provider or independent approval. Ordinary code/text is default allow absent an operator deny/constrain through code, text, exact file, immediate directory_files, and recursive directory_recursive scopes. The trusted workflow resolves/re-resolves protected target/ruleset, head, base, merge-base, and diff for ten minutes. On rejection/invalidation, follow the reason: drift/expiry needs fresh exact-head review+dispatch; deny needs external policy-owner action or an independent route; uncovered scope needs a smaller diff/new constraint; unsafe/secret material must be removed and credentials rotated. Never reuse a stale check or weaken candidate/release/publication authority. Generic Actions App trust risk is user-accepted, not independent security. Keep release-environment approval and candidate admission separate.
"""
