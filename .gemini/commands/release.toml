description = "Prepare a protected stable or prerelease release from an immutable admitted candidate."
prompt = """
Follow doc/07_guide/infra/software_release.md.

Use release/version.sdn as the only editable product-version authority. Require verify STATUS: PASS and the release-bound whole test result. Start one isolated work/release or work/backport branch and worktree; never author in the main worktree.

Beta maintenance targets release/X.Y and accepts only a caller-selected reviewed bug-fix commit with exact source SHA, change/work IDs, review receipt, adaptation reason, result SHA, and renewed evidence. Never discover or apply fixes automatically.

At bounded beta/bootstrap checkpoints, fetch once and compare exact main and release/X.Y snapshots read-only. Discovery proposes reviewed fixes only. Backport a selected main fix or forward-port a selected release-first fix through an isolated work branch, renewed evidence, divergence receipt, and the appropriate protected CAS integration authority. Main remains development trunk; never reset/repoint it to, track, or replace it with the release line.

Create an immutable candidate, build and qualify it once, and promote the exact admitted artifacts without rebuilding or fallback. The release tag must be signed, annotated, SemVer-valid, and pushed as one exact ref. Ask before external push/publication.

Rollback redeploys a prior admitted release. Withdrawal preserves published identity; corrections use a new beta, RC, or patch number.

Use simple release version-check, beta-prepare, backport-check, candidate-check, promote-check, and withdraw-check for validation.
"""
