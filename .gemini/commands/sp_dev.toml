description = "SPipe-prefixed full feature development entrypoint."
prompt = """
Run the full SPipe feature-development pipeline for the given request.

This is the SPipe feature-development command name. `/dev` is no longer a
separate active development entrypoint.

Follow `.claude/skills/spipe.md` as the canonical procedure.
For bugs, claim the bug record before edits, reproduce before fixing, inspect
and fix pure-Simple owners before Rust/runtime, and require both the exact
reproducer and a similar/adjacent regression. Rust/runtime edits require a
recorded boundary proof that the pure layer delegates correctly.
Before final verify, also run the generated spec layout guard and
`sh scripts/audit/direct-env-runtime-guard.shs --working` plus `--staged` for
env/process facade use.
Broad lanes must record lower-model sidecars or N/A and require
normal/highest-capability review before done marks or release-blocking PASS.
Before lower-model sidecars fan out, the normal/highest-capability pass defines
shared interface names, manual step("...") flow helper names, setup/checker
helper names, and fail-fast placeholders using assert(false) or fail(...).
Workflow/tooling, evidence-wrapper, generated-spec-shape, or verification-contract
changes must refresh matching doc/07_guide, doc/06_spec, .codex/skills/,
.agents/skills/, .claude/skills/, .claude/agents/spipe/, and .gemini/commands/
instructions before final verify.
For standalone target products such as Office, keep target construction separate
from compiler bootstrap: consume an explicitly admitted Phase 3 compiler, use
non-bootstrap cache/output paths, retain strict no-stub guards, and fail closed
when admission is absent. Never start Stage 1/2/3 implicitly or use the Rust
seed as fallback.
If a user requests a coding-phase close while required native or external
evidence remains unavailable, create or retain Todo DB rows with the blocked
acceptance criteria and exact resume evidence. Call this an implementation
handoff only; do not mark verify, release, or the umbrella goal complete.
For compiler/bootstrap diagnosis, keep normal verification default-off; select
`--diagnostics=test` for progress/coarse timing without parser trace or `--diagnostics=debug` for
trace, retained LLVM IR, and memory snapshots. Keep AOP logs separately scoped
and opt-in because they can materially affect compilation.
For changed SSpec/manual pairs, run one `simple sspec-maintain scan`: review all
seven scores, stable findings, blocker cap, mirror/failure policy, and REQ-test
traceability. `improve` is preview-only until exact confirmation with rollback;
`scaffold` preserves source hash/REQ IDs and unresolved oracles fail fast;
`documentize` reuses SPipe. `--suppressions` accepts reviewed
`RULE_ID|owner|reason|optional-fingerprint` records and never suppresses blockers;
`--baseline` accepts the reviewed fingerprint ledger.
Full external standards use the shared lossless `spec-to-spipe` architecture
(`spec-to-sspec` must delegate to the same implementation); Phase 0 contracts
exist, but neither name is a production CLI yet. The Markdown scaffold is not a
byte-coverage importer and must not invent prose or a passing oracle.
Modern typed evidence fails closed for bind-only/all-ignore vacuity,
non-numeric tolerance, tolerance overflow, malformed manifest digests, missing
or ambiguous selectors, and undeclared closed-mode fields. An in-memory
comparison is not retained provider provenance. For parent-authoritative
actor/process work, use the frozen closed schemas and commands in
doc/03_plan/sys_test/actor_channel_authority.md and
doc/03_plan/sys_test/parent_authoritative_actor_process.md; authored mirrors,
Stage-2 direct compilation, and the Rust seed are not Stage-4 generated/manual
evidence.
For SimpleOS compiler-in-filesystem lanes, final verify requires the
target-native Simple payload in the SimpleOS install image under the canonical
/usr/bin, /bin, /sys/apps simple/compiler/interpreter/loader role paths plus
/SYS/SIMPLETOOL.SDN, then in-guest /usr/bin/simple --version and compile/run
hello-world evidence from the mounted SimpleOS filesystem. Host bin/simple,
placeholder markers, host-side compile/run, or QEMU fixed-command responses are
not PASS evidence; physical-board claims need board identity and serial/SSH
transcript.
When requirement options are selected, write final feature/NFR requirement docs,
delete unchosen *_options.md files, and refresh the matching doc/07_guide page
before final verify.
For compiled feature work, follow
doc/07_guide/compiler/minimal_bootstrap_configuration_composition.md: choose the
smallest named target/provider/SCI projection, retain the compatibility receipt,
and require a typed reason or explicit release/trust target for full bootstrap.
"""
