description = "Write or extend a capability trait pair/group (debug/profile worked example): value-semantics hazards, CapLevel honesty, critical mode, falsifiable specs."
prompt = '''
Work on capability libraries in the Simple repo (worked example: src/lib/common/debug/).
Full guide: doc/07_guide/language/capability_library_authoring.md

THE ONE HAZARD — classes are value types (`val b = a` copies) and nothing warns. Assume any handle you hold is a copy until proven otherwise.
1. Pairing diverges copies: a group built from `session.debug()` + `session.profile()` holds two diverging copies (measured 8/70 RED, `expected 6, got 0`).
2. `fn` discards mutation: a `fn` trait method receives a copy. Every mutating method must be `me`. (Does not bite for class-typed fields, but `me` stays the default.)
3. Acquisition position decides aliasing: a handle stops aliasing unless acquired as a function's TAIL expression. Symptom is `step`/`resume` working while `set_breakpoint`/`profile_begin` are silently discarded — it reads as "this backend can't profile".
Safe shapes: hold a class-typed session field directly; drive `launch()` without binding a handle; return the acquisition as the tail expression.

SHAPE: core trait carries the accessors (`kind`, `debug_level`, `profile_level` — plain `fn`, non-mutating). Enhanced trait carries optional capability — never a sentinel return on the core trait, that is what CapLevel is for. A group is ONE trait over ONE value, union of members, zero new methods, ONE accessor named `<backend>_debug_profiler(session)` so the dynamic_capability_acquire lint recognises it. Write the group LONGHAND: the `trait G with A, B:` sugar parses but is INERT — `desugar_traits` has no compile-path caller (only the standalone app.desugar tool) and the deployed seed predates the parser change.

HONESTY: CapLevel Native = real device mechanism, Emulated = software model, Unavailable = nothing measured; `cap_level_name` is lowercase. PROFILE_ABSENT = -1 is the only honest "not measured" — reporting 0 is a contract violation. Arm profiling at attach (`AttachOpts.profile`); GPU PROF-1 cannot be enabled after upload. Contract details specs assert: `set_breakpoint` returns false if already present, `breakpoints()` is ascending, `read_mem` returns empty on overrun.

CRITICAL MODE: config/critical_mode.sdn; acquire once under `@init_phase` (DCA001); pin the GPU backend, `auto` is DCA002; on pin/probe mismatch print REFUSING TO START and stop. Note `if val` is AOT-broken (real nil reads SOME under native-build), so a generated capability check would fail OPEN natively — do not add one yet.

TESTING: assert on execution, not text or structure (a generator spec passed 21/21 while emitting code that could not compile). No disjunctive specs — "skips cleanly OR matches ref_vm" is unfalsifiable; emit which branch ran (`DEVICE-RAN:` / `SKIPPED: … the DEVICE-RAN branch did NOT run`) and support SIMPLE_REQUIRE_GPU=1; `step()` text is swallowed on passing runs, so use `print` or assert messages. Prove oracles by sabotage — a real launch-count floor sabotages to `expected 20 to be greater than 100000`. Avoid gate tautologies: asserting only `test_env_require(...) == "blocked:..."` is green because the gate is shut, and the fix is NOT flipping the expectation to `ready` — assert on behaviour behind the gate and drop false @cover claims. A green spec says nothing about reachability: grep for callers (`desugar_traits`, `svmg_lowering`, `action_key`/`interface_digest` are all landed, specced, and callerless).

REPORTING HONESTY: all evidence to date is from the Rust seed, none self-hosted. CUDA and Vulkan genuinely run on device (20 launches each, field diffs clean). Metal's device path is entirely unverified — svmg_metal_kernel.metal has never been compiled by any Metal compiler — never imply Metal works. DAP GPU attach is routing-only: there is no .spl to SVM-G path.
'''
